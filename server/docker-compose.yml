# =============================================================================
# Bauplattform – PRODUKTIV (Docker 2)
#
# Bekommt NUR freigegebene Versionen: Wird auf GitHub ein Tag v… gesetzt (z. B. v2026.11.2),
# baut GitHub Actions die Images und trägt die Version hier ein. Portainer bemerkt die
# Änderung (Polling) und spielt sie ein. Zwischenstände von main landen in server/test.yml.
#
# Einstellungen kommen aus den Umgebungsvariablen des Stacks in Portainer
# (mindestens DB_PASSWORD, siehe README → „Server mit Portainer“).
# Für die Installation per Skript (update.sh) gilt die docker-compose.yml im Hauptordner.
# =============================================================================
name: bauplattform

x-env: &env
  TZ: ${TZ:-Europe/Berlin}
  DATABASE_URL: "postgresql://bautagebuch@bautagebuch_db:5432/bautagebuch"
  PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt – in Portainer unter Environment variables eintragen}
  # Docker 2 läuft hinter dem Nginx Proxy Manager (HTTPS, je App eine eigene Adresse).
  # Werte in Portainer (Environment variables) haben Vorrang vor diesen Vorgaben.
  TRUST_PROXY: ${TRUST_PROXY:-1}
  COOKIE_SECURE: ${COOKIE_SECURE:-1}
  SSO_COOKIE_DOMAIN: ${SSO_COOKIE_DOMAIN:-gk3-architektur.de}
  BAUTAGEBUCH_PORT: ${BAUTAGEBUCH_PORT:-8080}
  GANTT_PORT: ${GANTT_PORT:-8082}
  PORTAL_PORT: ${PORTAL_PORT:-8090}
  ADMIN_PORT: ${ADMIN_PORT:-8091}
  BAUTAGEBUCH_URL: ${BAUTAGEBUCH_URL:-https://bautagebuch.gk3-architektur.de}
  GANTT_URL: ${GANTT_URL:-https://gantt.gk3-architektur.de}
  PORTAL_URL: ${PORTAL_URL:-https://bauportal.gk3-architektur.de}
  ADMIN_URL: ${ADMIN_URL:-https://admin.gk3-architektur.de}
  BAUTAGEBUCH_INTERNAL: http://bautagebuch:8000
  GANTT_INTERNAL: http://gantt:8082
  PORTAL_INTERNAL: http://portal:8090

services:
  bautagebuch_db:
    image: postgres:15
    container_name: Bautagebuch_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bautagebuch
      POSTGRES_DB: bautagebuch
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - bautagebuch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bautagebuch -d bautagebuch"]
      interval: 5s
      timeout: 3s
      retries: 30

  bautagebuch:
    image: ghcr.io/matthiasknauff/bauplattform/bautagebuch:92c0341
    container_name: bautagebuch
    restart: unless-stopped
    depends_on:
      bautagebuch_db: { condition: service_healthy }
    ports:
      - "${BAUTAGEBUCH_PUBLISH:-8080}:8000"
    environment:
      <<: *env
      SECRET_KEY: ${SECRET_KEY:-}
    volumes:
      - bautagebuch_data:/data

  gantt:
    image: ghcr.io/matthiasknauff/bauplattform/gantt:92c0341
    container_name: bauzeitenplan
    restart: unless-stopped
    depends_on:
      bautagebuch: { condition: service_healthy }
    ports:
      - "${GANTT_PUBLISH:-8082}:8082"
    environment:
      <<: *env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - gantt_legacy:/legacy:ro

  portal:
    image: ghcr.io/matthiasknauff/bauplattform/plattform:92c0341
    container_name: bauplattform_portal
    restart: unless-stopped
    depends_on:
      bautagebuch: { condition: service_healthy }
    ports:
      - "${PORTAL_PUBLISH:-8090}:8090"
    environment:
      <<: *env
      APP_MODULE: portal
      APP_PORT: "8090"

  admin:
    image: ghcr.io/matthiasknauff/bauplattform/plattform:92c0341
    container_name: bauplattform_admin
    restart: unless-stopped
    depends_on:
      portal: { condition: service_started }
      bautagebuch: { condition: service_healthy }
    ports:
      - "${ADMIN_PUBLISH:-8091}:8091"
    environment:
      <<: *env
      APP_MODULE: admin
      APP_PORT: "8091"

volumes:
  bautagebuch_data:
    name: bautagebuch_data
    external: true
  bautagebuch_pgdata:
    name: bautagebuch_pgdata
    external: true
  gantt_legacy:
    name: ${GANTT_LEGACY_VOLUME:-gantt-app_gantt-data}
    external: true
