<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#84827c">
<title>Mängel & Erinnerungen</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="static/bp.css">
<style>
.wrap{max-width:1180px}
.top{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:0 0 1rem}
.top .fill{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--card)}
.seg button{border-radius:999px;padding:.4rem .95rem;color:var(--mute);font-size:.92rem;white-space:nowrap}
.seg button.on{background:var(--y);color:var(--on);font-weight:600}
.tabs{margin:0 -.2rem 1rem;border-radius:10px 10px 0 0}
.tab small{margin-left:.35rem;font-size:.75rem;border-radius:999px;padding:.05rem .45rem;background:var(--hov);color:var(--mute)}
.tab small.bad{background:var(--red);color:#fff}
.kpi{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem}
.kpi button{border:1px solid var(--line);border-radius:999px;padding:.35rem .85rem;color:var(--mute);font-size:.9rem;background:var(--card)}
.kpi button b{color:var(--ink);margin-left:.3rem}
.kpi button.on{border-color:var(--y);color:var(--y)}
.kpi button.on b{color:var(--y)}
.flt{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.flt input[type=search]{flex:1 1 220px}
.flt select{flex:0 1 220px}
.grp{margin:1.1rem 0 .5rem;display:flex;align-items:baseline;gap:.6rem;font-weight:600}
.grp small{color:var(--mute);font-weight:400}
.grp a{font-weight:400;font-size:.85rem;margin-left:auto}
.ml{display:flex;flex-direction:column;gap:.45rem}
.mr{display:grid;grid-template-columns:auto 64px 1fr auto;gap:.4rem .9rem;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem}
.mr.done{opacity:.6}
.mr.ueberfaellig{border-left:4px solid var(--red)}
.mr .ck{width:26px;height:26px;margin-top:.15rem;accent-color:var(--ok);cursor:pointer}
.mr .th{width:64px;height:64px;border-radius:8px;background:var(--hov) center/cover no-repeat;display:grid;place-items:center;color:var(--mute);font-size:.75rem}
.mr .tx{min-width:0}
.mr .tx p{margin:0;white-space:pre-wrap;line-height:1.35}
.mr .tx small{display:block;color:var(--mute);font-size:.8rem;margin-top:.3rem}
.mr .tx small a{color:inherit}
.mr .ed{display:flex;flex-direction:column;gap:.35rem;align-items:stretch;min-width:220px}
.mr .ed label{display:flex;gap:.4rem;align-items:center;font-size:.8rem;color:var(--mute)}
.mr .ed label span{width:42px}
.mr .ed input{flex:1;padding:.3rem .45rem;font-size:.9rem;min-width:0}
.st{font-size:.75rem;border-radius:999px;padding:.05rem .5rem;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.st.ueberfaellig,.st.abgelaufen{border-color:var(--red);color:var(--red)}
.st.erledigt{border-color:var(--ok);color:var(--ok)}
.st.heute{border-color:var(--y);color:var(--y)}
.er{display:grid;grid-template-columns:36px 1fr auto;gap:.3rem .9rem;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem}
.er.ueberfaellig,.er.abgelaufen{border-left:4px solid var(--red)}
.er.erledigt{opacity:.6}
.er .ic{font-size:1.35rem;text-align:center;line-height:1.3}
.er .tx b{display:block}
.er .tx p{margin:.15rem 0 0;color:var(--mute);font-size:.86rem;white-space:pre-wrap}
.er .tx small{display:block;color:var(--mute);font-size:.8rem;margin-top:.3rem}
.er .ac{display:flex;flex-direction:column;align-items:flex-end;gap:.35rem}
.er .ac .dt{font-weight:600;white-space:nowrap}
.er .ac .bt{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}
.resch{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;margin-top:.5rem;padding:.5rem;border:1px dashed var(--y);border-radius:8px;grid-column:2/-1}
.resch input{padding:.3rem .45rem}
details.done-l>summary{cursor:pointer;color:var(--mute);margin:1rem 0 .5rem}
.empty{color:var(--mute);padding:1.2rem;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:12px}
.note{background:var(--hov);border:1px solid var(--line);border-radius:10px;padding:.7rem 1rem;color:var(--mute);font-size:.9rem;margin-bottom:1rem}
#undoBar{position:fixed;left:16px;bottom:16px;z-index:44;display:flex;gap:.35rem;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:.3rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#undoBar[hidden]{display:none}
#undoBar .btn{border-radius:999px;max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgrp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;margin-bottom:.7rem}
.trow{display:grid;grid-template-columns:110px 1fr auto auto;gap:.4rem .8rem;align-items:center;padding:.45rem 0;border-top:1px solid var(--line);margin-top:.45rem}
.trow .tdat{font-weight:600;white-space:nowrap}.trow .tl{color:var(--mute);font-size:.86rem;min-width:0}
.trow .tact{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:760px){.trow{grid-template-columns:1fr auto}.trow .tl{grid-column:1/-1;grid-row:2}.trow .tact{grid-column:1/-1}}
.fm{display:grid;grid-template-columns:150px 1fr;gap:.55rem .8rem;align-items:center}
.fm label{color:var(--mute);font-size:.88rem}
.fm .w{grid-column:1/-1}
.fm textarea{min-height:70px}
.uchk{display:flex;flex-wrap:wrap;gap:.3rem .9rem;max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:.5rem .7rem}
.uchk label{display:flex;gap:.35rem;align-items:center;color:var(--ink)}
@media (max-width:760px){.mr{grid-template-columns:auto 1fr}.mr .th{display:none}.mr .ed{grid-column:1/-1;min-width:0}.er{grid-template-columns:30px 1fr}.er .ac{grid-column:1/-1;align-items:flex-start}.er .ac .bt{justify-content:flex-start}.fm{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div class="seg" id="scope" role="group" aria-label="Welche Projekte"><button data-scope="mine">Meine Projekte</button><button data-scope="all">Alle Projekte</button></div>
    <span class="fill"></span>
    <button class="btn sm" id="neuBtn">+ Erinnerung</button>
    <button class="btn sm" id="setBtn" title="Vorlauf, E-Mail und mehr">⚙ Einstellungen</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div id="view"><p class="mute">Lade …</p></div>
</main>
<div id="undoBar" hidden><button class="btn" id="undoBtn">↶ Rückgängig</button></div>
<script src="static/bp.js"></script>
<script>
const LS = { get(k, d) { try { const v = localStorage.getItem('auf.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('auf.' + k, JSON.stringify(v)); } catch { /* egal */ } } };
let tab = (location.hash || '').slice(1) || LS.get('tab', 'maengel'), scope = LS.get('scope', 'mine');
let M = null, E = null, T = null, CONF = null, ME = null, F = LS.get('filter', { q: '', projekt: '', firma: '', art: 'maengel', status: 'offen' }), OPEN = null;
const de = (d) => (d && d.length >= 10 ? `${d.slice(8, 10)}.${d.slice(5, 7)}.${d.slice(0, 4)}` : '');
const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const deW = (d) => (d ? WD[new Date(d + 'T12:00').getDay()] + ' ' + de(d) : '');
const iso = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
const plus = (n, from) => { const d = from ? new Date(from + 'T12:00') : new Date(); d.setDate(d.getDate() + n); return iso(d); };
const nextMon = () => { const d = new Date(); d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7)); return iso(d); };
const appLink = (k, frag) => { const a = (CONF.apps || []).find((x) => x.key === k && x.allowed); return a ? appUrl(a) + '/' + frag : ''; };

/* ---------- Rückgängig (letzte Änderung: Erledigt, Frist, Termin, Löschen) ---------- */
let UNDO = null, undoT = 0;
function undoable(label, fn) {
  UNDO = { label, fn }; const b = $('#undoBar'); b.hidden = false; $('#undoBtn').textContent = '↶ ' + label + ' rückgängig';
  clearTimeout(undoT); undoT = setTimeout(() => { b.hidden = true; UNDO = null; }, 20000);
}
$('#undoBtn').onclick = async () => { const u = UNDO; if (!u) return; UNDO = null; $('#undoBar').hidden = true; try { await u.fn(); toast('Rückgängig gemacht.'); await reload(); } catch (e) { toast(e.message, true); } };

/* ---------- Laden ---------- */
async function reload(first) {
  try {
    if (tab === 'maengel') M = await api('api/maengel?scope=' + scope);
    else if (tab === 'termine') T = await api('api/termine?scope=' + scope);
    else E = await api('api/erinnerungen?scope=' + scope + (first ? '&abgleich=1' : ''));
  } catch (e) { $('#view').innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  render();
}
function renderTabs() {
  const nM = M ? M.filter((m) => m.status === 'ueberfaellig').length : 0, nE = E ? E.items.filter((x) => ['ueberfaellig', 'abgelaufen', 'heute'].includes(x.lage)).length : 0;
  const nT = T ? T.filter((x) => x.status === 'offen').length : 0;
  $('#tabs').innerHTML = [['maengel', 'Mängel', nM], ['termine', 'Termine', nT], ['erinnerungen', 'Erinnerungen', nE]].map(([k, l, n]) => `<button class="tab ${k === tab ? 'on' : ''}" data-tab="${k}">${l}${n ? `<small class="bad" title="überfällig / fällig">${n}</small>` : ''}</button>`).join('');
  $('#scope').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.scope === scope));
}
function render() { renderTabs(); if (tab === 'maengel') renderM(); else if (tab === 'termine') renderT(); else renderE(); }

/* ---------- Termine: Firmen laut Bauzeitenplan nicht anwesend ---------- */
function renderT() {
  if (!T) { $('#view').innerHTML = '<p class="mute">Lade …</p>'; return; }
  const groups = {}; T.forEach((x) => { (groups[x.pid + '|' + x.key] ||= []).push(x); });
  const nO = T.filter((x) => x.status === 'offen').length, nF = T.length - nO;
  let h = `<div class="kpi"><button type="button" class="on" tabindex="-1">Nicht bestätigt<b>${nO}</b></button><button type="button" tabindex="-1">„Nicht da“ bestätigt<b>${nF}</b></button></div>
    <p class="note">Berichtstage der letzten 120 Tage, an denen eine Firma laut Bauzeitenplan auf der Baustelle sein sollte, im Bautagebuch aber nicht als anwesend eingetragen ist.
    „Nicht bestätigt“ heißt: Der Bauleiter hat den Vorschlag im Bericht weder als anwesend noch als „nicht da“ markiert. Daraus lässt sich je Firma eine Terminrüge (VOB/B § 5) erzeugen.</p>`;
  if (!T.length) h += '<div class="empty">Keine Abweichungen – alle laut Plan erwarteten Firmen waren da oder wurden bestätigt.</div>';
  for (const [k, rows] of Object.entries(groups)) {
    const x0 = rows[0];
    h += `<section class="tgrp"><div style="display:flex;align-items:flex-start;gap:.6rem;flex-wrap:wrap"><div style="flex:1;min-width:220px"><b>${esc(x0.firma)}</b>${x0.gw ? ` <span class="mute">· ${esc(x0.gw)}</span>` : ''}<div class="mute" style="font-size:.85rem">${esc(x0.projekt)} · Plan „${esc(x0.plan)}“</div></div>
      <button class="btn sm" data-truege="${esc(k)}" title="Aufforderung zur Abhilfe nach VOB/B § 5 Abs. 3 als ausfüllbares PDF">✉ Terminrüge</button></div>
      ${rows.map((x) => `<div class="trow" data-tid="${esc(x.id)}"><span class="tdat">${esc(deW(x.datum))}</span><span class="tl">${esc(x.leistungen.join(', '))}</span>
        <span class="st ${x.status === 'fehlt' ? 'ueberfaellig' : 'heute'}">${x.status === 'fehlt' ? 'nicht da' + (x.von ? ' · ' + esc(x.von) : '') : 'nicht bestätigt'}</span>
        <span class="tact">${x.status === 'offen' ? `<button class="btn sm" data-tset="fehlt">nicht da</button>` : ''}<button class="btn sm" data-tset="da" title="Firma war doch da">war da</button><button class="btn sm" data-tset="nein" title="Laut Plan erwartet, aber nicht nötig (z. B. Termin verschoben)">nicht nötig</button>
        ${appLink('bautagebuch', `#projekt=${x.pid}&bericht=${x.rid}`) ? `<a class="btn sm" href="${appLink('bautagebuch', `#projekt=${x.pid}&bericht=${x.rid}`)}" target="_blank">Bericht ↗</a>` : ''}</span></div>`).join('')}</section>`;
  }
  $('#view').innerHTML = h;
}
async function tSet(id, status) {
  const x = T.find((y) => y.id === id); if (!x) return;
  try {
    const r = await api('api/termine/' + x.rid, 'PUT', { firma: x.key, status });
    undoable({ fehlt: 'Nicht da', da: 'War da', nein: 'Nicht nötig' }[status], () => api('api/termine/' + x.rid, 'PUT', { firma: x.key, status: r.vorher }));
    await reload();
  } catch (e) { toast(e.message, true); }
}
async function truegeDialog(k) {
  const [pid, firma] = [+k.split('|')[0], k.split('|').slice(1).join('|')];
  let V; try { V = await api(`api/terminruege/vorlage?pid=${pid}&firma=${encodeURIComponent(firma)}`); } catch (e) { toast(e.message, true); return; }
  const E0 = V.empfaenger;
  const bg = modalBox(`<h3>Terminrüge</h3><div class="fm">
    <label>An</label><input id="tN" value="${esc(E0.name)}"><label>z. Hd.</label><input id="tP" value="${esc(E0.person)}" placeholder="optional">
    <label>Straße</label><input id="tS" value="${esc(E0.strasse)}"><label>PLZ Ort</label><input id="tO" value="${esc(E0.ort)}">
    <label>Auftrag</label><input id="tA" placeholder="z. B. Nr. 12/2026 vom 03.03.2026 (optional)">
    <label>Frist bis</label><div style="display:flex;gap:.4rem;flex-wrap:wrap"><input type="date" id="tF" value="${plus(3)}">${[[2, '2 Tage'], [3, '3 Tage'], [7, '1 Woche']].map(([d, l]) => `<button class="btn sm" data-m="f${d}">${l}</button>`).join('')}</div>
    <label class="w">Tage (laut Bauzeitenplan erwartet, nicht anwesend)</label><div class="w" style="display:flex;flex-direction:column;gap:.35rem;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:.5rem .7rem">
      ${V.tage.map((x) => `<label class="chk" style="color:var(--ink);align-items:flex-start"><input type="checkbox" data-td="${esc(x.id)}" checked><span>${esc(deW(x.datum))}<small class="mute" style="display:block">${esc(x.leistungen.join(', '))} · ${x.status === 'fehlt' ? 'als „nicht da“ bestätigt' : 'nicht bestätigt'}</small></span></label>`).join('')}</div>
    <label></label><label class="chk" style="color:var(--ink)"><input type="checkbox" id="tK" checked> Auftragsentziehung nach § 8 Abs. 3 androhen (nötig, um nach Fristablauf kündigen zu können)</label>
    <label></label><label class="chk" style="color:var(--ink)"><input type="checkbox" id="tB" checked> nicht bestätigte Tage als „nicht da“ übernehmen</label>
    <p class="w mute" style="font-size:.82rem;margin:0">Setzt voraus, dass der Bauzeitenplan bzw. die Ausführungsfristen vertraglich vereinbart sind (VOB/B § 5). Das PDF hat ausfüllbare Felder; der Mustertext ersetzt keine Rechtsberatung.</p></div>
    <div class="acts"><button class="btn" data-m="x">Abbrechen</button><button class="btn pri" data-m="ok">PDF erzeugen</button></div>`, async (m, bg, close) => {
    if (m === 'x') { close(); return; }
    if (m.startsWith('f')) { bg.querySelector('#tF').value = plus(+m.slice(1)); return; }
    if (m !== 'ok') return;
    const ids = [...bg.querySelectorAll('[data-td]:checked')].map((x) => x.dataset.td); if (!ids.length) { toast('Bitte mindestens einen Tag wählen.', true); return; }
    const body = { pid, firma, ids, frist: bg.querySelector('#tF').value, auftrag: bg.querySelector('#tA').value.trim(), kuendigung: bg.querySelector('#tK').checked, fehlt_bestaetigen: bg.querySelector('#tB').checked,
      empfaenger: { name: bg.querySelector('#tN').value.trim(), person: bg.querySelector('#tP').value.trim(), strasse: bg.querySelector('#tS').value.trim(), ort: bg.querySelector('#tO').value.trim() } };
    const w = window.open('', '_blank'); if (w) w.document.write('<!doctype html><meta charset="utf-8"><title>Terminrüge wird erstellt …</title><body style="font:16px system-ui;display:grid;place-items:center;height:90vh;color:#555">Terminrüge wird erstellt …</body>');
    try {
      const r = await fetch('api/terminruege', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || 'Fehler ' + r.status); }
      const href = URL.createObjectURL(await r.blob());
      if (w && !w.closed) w.location.href = href; else { const a = document.createElement('a'); a.href = href; a.download = 'Terminrüge.pdf'; document.body.appendChild(a); a.click(); a.remove(); }
      close(); toast('Terminrüge erstellt.'); reload();
    } catch (e) { if (w && !w.closed) w.close(); toast(e.message, true); }
  });
  bg.querySelector('.modal').style.width = 'min(720px,100%)';
}

/* ---------- Mängel ---------- */
function mFiltered() {
  const q = F.q.trim().toLowerCase();
  return M.filter((m) => (!F.art || m.art === F.art) && (!F.projekt || String(m.pid) === F.projekt) && (!F.firma || m.firma === F.firma)
    && (F.status === 'alle' || (F.status === 'offen' ? !m.done : F.status === 'ueberfaellig' ? m.status === 'ueberfaellig' : m.done))
    && (!q || [m.text, m.firma, m.projekt].join(' ').toLowerCase().includes(q)));
}
function renderM() {
  if (!M) { $('#view').innerHTML = '<p class="mute">Lade …</p>'; return; }
  const base = M.filter((m) => !F.art || m.art === F.art), list = mFiltered();
  const n = { offen: base.filter((m) => !m.done).length, ueberfaellig: base.filter((m) => m.status === 'ueberfaellig').length, erledigt: base.filter((m) => m.done).length, alle: base.length };
  const projs = [...new Map(M.map((m) => [m.pid, m.projekt])).entries()].sort((a, b) => a[1].localeCompare(b[1], 'de'));
  const firms = [...new Set(M.map((m) => m.firma).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'de'));
  const by = new Map(); list.forEach((m) => { if (!by.has(m.pid)) by.set(m.pid, []); by.get(m.pid).push(m); });
  const thumb = (m) => m.bild ? `<a class="th" href="api/bild/0/${encodeURIComponent(m.bild)}" target="_blank" rel="noopener" style="background-image:url('api/bild/240/${encodeURIComponent(m.bild)}')" title="Foto öffnen${m.fotos > 1 ? ` (${m.fotos} Fotos)` : ''}" aria-label="Foto"></a>` : '<span class="th">kein Foto</span>';
  const row = (m) => `<div class="mr ${m.done ? 'done' : m.status}" data-m="${m.id}">
      <input type="checkbox" class="ck" data-done ${m.done ? 'checked' : ''} title="${m.done ? 'wieder öffnen' : 'als erledigt abhaken'}" aria-label="erledigt">
      ${thumb(m)}
      <div class="tx"><p>${esc(m.text)}</p><small><span class="st ${m.status}">${m.done ? 'erledigt' : m.status === 'ueberfaellig' ? 'überfällig' : 'offen'}</span> · ${esc(m.art_n)} festgestellt ${de(m.datum)}${m.fotos ? ` · ${m.fotos} Foto${m.fotos > 1 ? 's' : ''}` : ''} · ${appLink('bautagebuch', '') ? `<a href="${esc(appLink('bautagebuch', `#projekt=${m.pid}&bericht=${m.rid}`))}" target="_blank" rel="noopener">Bericht öffnen ↗</a>` : ''}</small></div>
      <div class="ed"><label><span>Firma</span><input data-f="firma" value="${esc(m.firma)}" list="firmList" placeholder="wer behebt?"></label>
        <label><span>Frist</span><input type="date" data-f="frist" value="${esc(m.frist)}"></label>
        <div style="display:flex;gap:.3rem;justify-content:flex-end;flex-wrap:wrap">${[[7, '+1 Woche'], [14, '+2 Wo.']].map(([d, l]) => `<button class="btn sm" data-plus="${d}">${l}</button>`).join('')}${m.done || m.art !== 'maengel' ? '' : '<button class="btn sm" data-ruege title="Mängelrüge an die Firma als ausfüllbares PDF">✉ Mängelrüge</button>'}</div></div></div>`;
  $('#view').innerHTML = `<div class="kpi">${[['offen', 'Offen'], ['ueberfaellig', 'Überfällig'], ['erledigt', 'Erledigt'], ['alle', 'Alle']].map(([k, l]) => `<button class="${F.status === k ? 'on' : ''}" data-st="${k}">${l}<b>${n[k]}</b></button>`).join('')}</div>
    <div class="flt"><input type="search" id="mq" placeholder="Suchen: Text, Firma, Projekt …" value="${esc(F.q)}">
      <select id="mart"><option value="maengel"${F.art === 'maengel' ? ' selected' : ''}>Mängel</option><option value="zu_erledigen"${F.art === 'zu_erledigen' ? ' selected' : ''}>Zu erledigen</option><option value="weisungen"${F.art === 'weisungen' ? ' selected' : ''}>Weisungen</option><option value=""${!F.art ? ' selected' : ''}>alles</option></select>
      <select id="mproj"><option value="">Alle Projekte (${projs.length})</option>${projs.map(([k, v]) => `<option value="${k}"${String(k) === F.projekt ? ' selected' : ''}>${esc(v)}</option>`).join('')}</select>

async function mSave(id, body, undoBody, label) {

const SRC = { bautagebuch: ['📒', 'Bautagebuch'], plan: ['📅', 'Bauzeitenplan'], eigen: ['✎', 'eigene Erinnerung'] };
function renderE() {
  if (!E) { $('#view').innerHTML = '<p class="mute">Lade …</p>'; return; }
  const G = [['ueberfaellig', 'Überfällig – noch nicht verschickt'], ['abgelaufen', 'Abgelaufen – neu terminieren oder erledigen'], ['heute', 'Heute'], ['bald', 'Nächste 7 Tage'], ['spaeter', 'Später']];
  const row = (x) => {
    const [ic, sn] = SRC[x.quelle] || ['•', ''], link = x.quelle === 'plan' && x.gantt_id ? appLink('gantt', '#plan=' + encodeURIComponent(x.gantt_id)) : x.quelle === 'bautagebuch' && x.rid ? appLink('bautagebuch', `#projekt=${x.pid}&bericht=${x.rid}`) : '';
    const sent = x.gesendet ? (x.quelle === 'bautagebuch' ? `Mail am ${de(x.gesendet)} verschickt` : `Mail am ${de(x.gesendet)} verschickt`) : '';
    return `<div class="er ${x.lage}" data-e="${x.id}"><span class="ic" title="${sn}">${ic}</span>
      <div class="tx"><b>${esc(x.titel)}</b>${x.text && x.quelle !== 'bautagebuch' ? `<p>${esc(x.text)}</p>` : x.quelle === 'bautagebuch' && x.text.split('\n').length > 1 ? `<p>${esc(x.text)}</p>` : ''}
        <small>${esc([sn, x.projekt, x.an.length ? 'an ' + x.an.join(', ') : '', sent, x.manuell ? 'von Hand verschoben' : ''].filter(Boolean).join(' · '))}${link ? ` · <a href="${esc(link)}" target="_blank" rel="noopener">öffnen ↗</a>` : ''}</small></div>
      <div class="ac"><span class="dt">${deW(x.termin)}${x.uhrzeit ? ' · ' + esc(x.uhrzeit) : ''}</span><span class="st ${x.lage}">${{ ueberfaellig: 'überfällig', abgelaufen: 'abgelaufen', heute: 'heute', bald: 'bald', spaeter: 'geplant', erledigt: 'erledigt' }[x.lage]}</span>
        <div class="bt">${x.status === 'erledigt' ? '<button class="btn sm" data-ea="reopen">wieder öffnen</button>' : '<button class="btn sm" data-ea="resch">Neu terminieren</button><button class="btn sm" data-ea="done">✓ Erledigt</button>'}${x.quelle === 'eigen' ? '<button class="btn sm danger" data-ea="del" aria-label="löschen">✕</button>' : ''}</div></div>
      ${OPEN === x.id ? `<div class="resch">Neuer Termin: ${[[1, 'morgen'], [3, '+3 Tage'], [7, '+1 Woche'], [0, 'nächster Montag']].map(([d, l]) => `<button class="btn sm" data-rq="${d}">${l}</button>`).join('')}
        <input type="date" id="rDate" value="${esc(x.termin < iso(new Date()) ? plus(1) : x.termin)}"><input type="time" id="rTime" value="${esc(x.uhrzeit || '08:00')}"><button class="btn sm pri" data-ea="save">Speichern</button><button class="btn sm" data-ea="cancel">Abbrechen</button></div>` : ''}</div>`;
  };
  // Gruppieren und sortieren (gemerkt je Gerät)
  const EV = LS.get('eview', { grp: 'lage', sort: 'termin', q: 'alle' }), dir = EV.sort === 'termin_ab' ? -1 : 1;
  const key = (x) => ({ termin: x.termin + (x.uhrzeit || ''), termin_ab: x.termin + (x.uhrzeit || ''), firma: (x.firma || '~') + x.termin, projekt: (x.projekt || '~') + x.termin, titel: x.titel + x.termin }[EV.sort] || x.termin).toLowerCase();
  const items = E.items.filter((x) => EV.q === 'alle' || x.quelle === EV.q).slice().sort((a, b) => (key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : 0) * dir);
  const open = items.filter((x) => x.status !== 'erledigt'), done = items.filter((x) => x.status === 'erledigt');
  const gname = (x) => (EV.grp === 'projekt' ? x.projekt || 'ohne Projekt' : EV.grp === 'firma' ? x.firma || 'ohne Firma' : EV.grp === 'gewerk' ? x.gw || 'ohne Gewerk' : EV.grp === 'quelle' ? (SRC[x.quelle] || ['', x.quelle])[1] || x.quelle : '');
  const groups = () => {
    if (EV.grp === 'lage') return G.map(([k, l]) => [l, open.filter((x) => x.lage === k)]).filter(([, xs]) => xs.length);
    if (EV.grp === 'keine') return [['', open]];
    const m = new Map(); open.forEach((x) => { const n = gname(x); if (!m.has(n)) m.set(n, []); m.get(n).push(x); });
    return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0], 'de'));
  };
  const sel = (k, o) => `<select data-ev="${k}">${o.map(([v, l]) => `<option value="${v}"${EV[k] === v ? ' selected' : ''}>${l}</option>`).join('')}</select>`;
  const bar = `<div class="flt"><label class="mute" style="display:flex;gap:.4rem;align-items:center">Gruppieren ${sel('grp', [['lage', 'nach Fälligkeit'], ['projekt', 'nach Projekt'], ['firma', 'nach Firma'], ['gewerk', 'nach Gewerk'], ['quelle', 'nach Herkunft'], ['keine', 'nicht gruppieren']])}</label>
    <label class="mute" style="display:flex;gap:.4rem;align-items:center">Sortieren ${sel('sort', [['termin', 'Termin aufsteigend'], ['termin_ab', 'Termin absteigend'], ['firma', 'Firma'], ['projekt', 'Projekt'], ['titel', 'Text']])}</label>
    <label class="mute" style="display:flex;gap:.4rem;align-items:center">Zeigen ${sel('q', [['alle', 'alle'], ['plan', '📅 aus Bauzeitenplänen'], ['bautagebuch', '📒 aus dem Bautagebuch'], ['eigen', '✎ eigene']])}</label></div>`;
  $('#view').innerHTML = (E.mail ? '' : `<div class="note">Der Mailserver ist noch nicht eingerichtet – Erinnerungen werden hier angezeigt, aber nicht per E-Mail verschickt. ${appLink('admin', '') ? `<a href="${esc(appLink('admin', '#einstellungen-mail'))}">Verwaltung → Einstellungen → Mailserver</a>` : ''}</div>`)
    + bar
    + (open.length ? groups().map(([l, xs]) => `${l ? `<div class="grp">${esc(l)} <small>${xs.length}</small></div>` : ''}<div class="ml">${xs.map(row).join('')}</div>`).join('')
      : '<div class="empty">Keine offenen Erinnerungen. Erinnerungen entstehen aus Erledigungsdaten im Bautagebuch, aus den Bauzeitenplänen (wenn eine Firma zur Baustelle muss) oder mit „+ Erinnerung“.</div>')
    + (done.length ? `<details class="done-l"><summary>Erledigt (${done.length})</summary><div class="ml">${done.map(row).join('')}</div></details>` : '')
    + `<p class="mute" style="font-size:.82rem;margin-top:1.4rem">📒 aus dem Bautagebuch (Erledigungsdatum, Mail am Fälligkeitstag) · 📅 aus den Bauzeitenplänen: Firma kommt zum ersten Mal oder wieder auf die Baustelle – Erinnerung ${CFG ? CFG.vorlauf : 7} Tage vorher · ✎ eigene. Abgelaufene lassen sich neu terminieren.</p>`;
}

document.addEventListener('change', (e) => {

async function ruegeDialog(id) {

  const bg = modalBox(`<h3>Mängelrüge</h3><div class="fm">

    <label>Auftrag</label><input id="rA" placeholder="z. B. Nr. 12/2026 vom 03.03.2026 (optional)">

    <label>Frist bis</label><div style="display:flex;gap:.4rem;flex-wrap:wrap"><input type="date" id="rF" value="${plus(14)}">${[[7, '1 Woche'], [14, '2 Wochen'], [21, '3 Wochen']].map(([d, l]) => `<button class="btn sm" data-m="f${d}">${l}</button>`).join('')}</div>
    <label class="w">Mängel (offene im Projekt – vorausgewählt: dieselbe Firma)</label><div class="w" style="display:flex;flex-direction:column;gap:.35rem;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:.5rem .7rem">${ms()}</div>
    <label></label><label class="chk" style="color:var(--ink)"><input type="checkbox" id="rB" checked> Fotos als Anlage anhängen</label>
    <label></label><label class="chk" style="color:var(--ink)"><input type="checkbox" id="rT" checked> Frist bei den Mängeln eintragen (Erinnerung am Fristende)</label>

    <div class="acts"><button class="btn" data-m="x">Abbrechen</button><button class="btn pri" data-m="ok">PDF erzeugen</button></div>`, async (m, bg, close) => {

    <label for="sL">„Wieder“ ab</label><div><input id="sL" type="number" min="1" max="90" value="${CFG.luecke}" style="width:80px"> Tagen Pause – kürzere Pausen zählen als ein Einsatz</div>
    <label>E-Mail</label><label class="chk" style="color:var(--ink)"><input type="checkbox" id="sM"${CFG.mail_plan ? ' checked' : ''}> Erinnerungen aus den Bauzeitenplänen per E-Mail verschicken</label>
    <p class="w mute" style="font-size:.85rem;margin:0">Empfänger: die Zuständigen des verknüpften Bautagebuch-Projekts, sonst wer den Plan zuletzt gespeichert hat. Den Mailserver stellst du in der Verwaltung ein. Erinnerungen aus dem Bautagebuch verschickt das Bautagebuch am Fälligkeitstag selbst.</p></div>
    <div class="acts"><button class="btn" data-m="test" style="margin-right:auto">Testmail an mich</button><button class="btn" data-m="x">Abbrechen</button><button class="btn pri" data-m="ok">Speichern</button></div>`, async (m, bg, close) => {
    if (m === 'x') { close(); return; }
    if (m === 'test') { try { const r = await api('api/erinnerungen/test', 'POST', {}); toast('Testmail an ' + r.to + ' verschickt.'); } catch (e) { toast(e.message, true); } return; }
    if (m === 'ok') {
      try { CFG = await api('api/einstellungen', 'PUT', { vorlauf: +bg.querySelector('#sV').value, luecke: +bg.querySelector('#sL').value, uhrzeit: bg.querySelector('#sU').value, mail_plan: bg.querySelector('#sM').checked }); close(); toast('Gespeichert – Termine der Erinnerungen angepasst.'); E = null; if (tab === 'erinnerungen') reload(true); } catch (e) { toast(e.message, true); }
    }
  });
};

(async () => {
  ME = await api('api/me'); applyLook(ME);
  CONF = await api('api/platform');
  await header('Mängel & Erinnerungen', ME, CONF);
  try { CFG = await api('api/einstellungen'); } catch { /* egal */ }
  if (!['maengel', 'termine', 'erinnerungen'].includes(tab)) tab = 'maengel';
  renderTabs(); await reload(tab === 'erinnerungen');
  if (tab === 'maengel') api('api/erinnerungen?scope=' + scope + '&abgleich=1').then((r) => { E = r; renderTabs(); }).catch(() => {});
  else api('api/maengel?scope=' + scope).then((r) => { M = r; renderTabs(); }).catch(() => {});
  if (tab !== 'termine') api('api/termine?scope=' + scope).then((r) => { T = r; renderTabs(); }).catch(() => {});
})().catch((e) => toast(e.message, true));
</script>
</body>
</html>
