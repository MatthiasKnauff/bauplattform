<html lang="de">
<head>

<title>Ausschreibung & Abrechnung</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="static/bp.css">
<style>
.ava{display:flex;flex-direction:column;font-size:13.5px}
.rib{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--line);padding:.25rem .5rem 0}
.rg{display:flex;flex-direction:column;justify-content:space-between;padding:0 .7rem;border-right:1px solid var(--line)}

/* Volltextsuche */

.vqb input[type=search]{width:100%;font:inherit;font-size:.85rem;padding:.35rem .6rem;border-radius:999px;border:1px solid var(--line);background:var(--inp);color:var(--ink)}

.vqe button:hover,.vqe button.on{background:var(--hov)}
.vqe .i{font-size:.95rem;grid-row:1/3}
.vqe .oz{font-family:ui-monospace,Consolas,monospace;font-size:.8rem;color:var(--mute);padding-top:.1rem;grid-row:1/3}

.save{font-size:.78rem;color:var(--mute);align-self:center;padding:0 .6rem}
.body{flex:1;display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 140px)}
.nav{border-right:1px solid var(--line);background:var(--card);overflow:auto;padding:.5rem .45rem;position:sticky;top:52px;align-self:start;height:calc(100vh - 52px);box-sizing:border-box}

.pane{display:flex;flex-direction:column;min-width:0;padding:0 .8rem 3rem}

#view{min-height:0}
.tree{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--line)}
.tree th{position:sticky;top:0;z-index:2;background:var(--tabs);color:var(--ink);font-weight:500;text-align:left;padding:.25rem .45rem;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}

.dz-l select,.dz-l textarea{font:inherit;font-size:.9rem;color:var(--ink)}
.dz-g{display:flex;flex-direction:column;gap:.3rem}.dz-c{display:flex;gap:.45rem;align-items:center;font-size:.9rem}
.bed-s{overflow:auto;padding:1rem .75rem 3rem;display:flex;flex-direction:column;align-items:center;gap:1rem}
.bed-p{position:relative;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.35);flex:none}

.bed-f{position:absolute;box-sizing:border-box;margin:0;border:0;border-radius:2px;background:rgba(255,226,120,.3);color:#1c1c1a;font-family:Lato,Helvetica,Arial,sans-serif;line-height:1.2;resize:none;outline:none;overflow:hidden}

.bed-f:focus{background:rgba(255,236,160,.6);box-shadow:0 0 0 1.5px #e0a800}
.bed-l{color:#ddd;padding:3rem}

.body.mit-quelle{grid-template-columns:230px minmax(0,1fr) minmax(320px,36%)}
.qu{border-left:1px solid var(--line);background:var(--card);position:sticky;top:52px;align-self:start;height:calc(100vh - 52px);box-sizing:border-box;display:flex;flex-direction:column;min-width:0}

.qu-h .qu-s input[type=search]{flex:1 1 9rem;min-width:0;padding:.3rem .5rem}.qu-h .qu-s select{flex:0 1 auto;width:auto;padding:.3rem .4rem}
.qu-seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.qu-seg button{border:0;background:transparent;padding:.25rem .55rem;font:inherit;font-size:.82rem;color:var(--mute);cursor:pointer}

.qu th{position:sticky;top:0;background:var(--tabs);font-weight:500;z-index:1}

.qu .lt{color:var(--mute);font-size:11.5px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qu-f{padding:.55rem .7rem;border-top:1px solid var(--line);display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;background:var(--tabs)}
table.lv tr.drop-hier td{box-shadow:inset 0 -3px 0 #1e5aa0}

.fotos{display:flex;flex-wrap:wrap;gap:.45rem;margin:.4rem 0 0}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--card)}

.bar{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center;margin-bottom:.7rem}

      <label class="hint">Sicherheitseinbehalt <input data-ang="einbehalt" value="${nf(V.einbehalt ?? 5, 2)}" style="width:4rem" inputmode="decimal"> %</label><span class="fill"></span><button class="btn sm" data-act="vergabeWeg">Vergabe aufheben</button></div>` : ''}`;
  if (!A.length) return head + `<div class="card empty"><p>Noch keine Angebote. Bieter hinzufügen und Preise eintragen – oder die GAEB-Datei (X84) bzw. das ausgefüllte Excel einer Firma einlesen.</p>
    <p class="hint">Das LV gibst du oben unter „⇡ Ausgeben …“ als GAEB X83, Excel oder PDF an die Bieter.</p></div>`;
  const best = (id) => { const v = A.map((a) => a.preise[id]).filter((x) => x != null); return { mn: v.length > 1 ? Math.min(...v) : null, mit: v.length ? v.reduce((s, x) => s + x, 0) / v.length : null }; };
  const rows = items().filter((x) => !x.nt).map((x) => {
    if (x.typ === 'titel') return `<tr class="ti"><td class="oz">${esc(x.oz)}</td><td colspan="${3 + A.length}">${esc(x.kurz)}</td></tr>`;
    if (x.art === 'T') return '';
    const b = best(x.id);
    return `<tr><td class="oz">${esc(x.oz)}</td><td>${esc(x.kurz)}${x.art !== 'N' ? `<span class="badge">${esc(ARTEN[x.art])}</span>` : ''}</td><td class="r">${nf(x.menge)}</td><td>${esc(x.einheit)}</td>`
      + A.map((a) => { const e = a.preise[x.id]; const cls = e != null && b.mn != null && e === b.mn ? 'min' : e != null && b.mit && Math.abs(e / b.mit - 1) > 0.3 ? 'aus' : '';
        return `<td class="bp ${cls}"><input class="n ep" data-ang="ep" data-aid="${a.id}" data-pid="${x.id}" value="${e != null ? nf2(e) : ''}" inputmode="decimal" title="${cls === 'aus' ? 'weicht mehr als 30 % vom Mittel ab' : ''}"><span class="gp">${e != null && zaehlt(x) ? eur((x.menge || 0) * e) : ''}</span></td>`; }).join('') + '</tr>';
  }).join('');
  const sorted = [...A];
  return head + `<p class="hint" style="margin:-.2rem 0 .5rem">Einheitspreise direkt eintragen (Tab springt weiter). <b style="color:var(--ok)">Grün</b> = niedrigster Preis, <span style="text-decoration:underline wavy #e07b3a">unterstrichen</span> = mehr als 30 % vom Mittel entfernt.${K.schaetzung ? ` Schätzung des Planers: <b>${eur(K.schaetzung)}</b>.` : ''}</p>
    <div class="tblw"><table class="lv ps"><thead><tr><th>OZ</th><th style="min-width:11rem">Kurztext</th><th class="r">Menge</th><th>EH</th>
      ${sorted.map((a) => `<th class="bh${V.angebot_id === a.id ? ' win' : ''}"><div class="bn"><input data-ang="bieter" data-aid="${a.id}" value="${esc(a.bieter)}" style="font-weight:600"><button class="ib" data-angdel="${a.id}" title="Angebot löschen">✕</button></div>

let amAns = LS.get('amAns', 'baum'), AMX = LS.get('amx', {});
function vAufmass() {
  const um = `<div class="seg" role="group" aria-label="Ansicht" style="margin-bottom:.6rem"><button type="button" class="${amAns === 'baum' ? 'on' : ''}" data-amans="baum">Prüfung je Rechnung</button><button type="button" class="${amAns === 'erfassen' ? 'on' : ''}" data-amans="erfassen">Aufmaß erfassen</button></div>`;

function vAmBaum() {
  const I = items(), VP = (L.vergabe && L.vergabe.preise) || {}, nl = ((L.vergabe && L.vergabe.nachlass) || 0) / 100;
  const RE = [...L.rechnungen].sort((a, b) => a.nr - b.nr);
  const live = L.calc.aufmass || {};
  const staende = []; let vorher = {};
  RE.forEach((r, k) => {
    const st = r.status === 'geprueft' && r.data && r.data.stand ? r.data.stand : live;
    staende.push({ key: 'r' + r.id, titel: r.art === 'schluss' ? 'Schlussrechnung' : `${r.nr}. Teilrechnung`, sub: [r.re_nr ? 'Nr. ' + r.re_nr : '', r.status === 'geprueft' ? 'geprüft' : 'in Prüfung'].filter(Boolean).join(' · '), st, vorher, letzte: k === RE.length - 1 });
    if (r.status === 'geprueft') vorher = st;
  });
  if (!RE.length || RE[RE.length - 1].status === 'geprueft') staende.push({ key: 'rlive', titel: RE.length ? 'Aufmaß seit der letzten Rechnung' : 'Aufmaß (noch keine Rechnung)', sub: 'noch nicht abgerechnet', st: live, vorher, letzte: true });
  const offen = (k, def) => (k in AMX ? AMX[k] : def);
  const e2 = (v) => (v ? eur(v).replace(' €', '') : '');
  const prog = (x, m) => { const ep = VP[x.id]; if (ep == null || x.entf) return 0; const q = ohneGB(x) ? m : Math.max(x.menge || 0, m); return q * ep; };
  const summe = (st, von, bis) => { let g = 0, p = 0; for (let i = von; i < bis; i++) { const x = I[i]; if (x.typ !== 'pos' || x.art === 'T' || (x.nt && x.nt_status === 'abgelehnt')) continue; const ep = VP[x.id]; if (ep == null) continue; const m = st[x.id] || 0; g += m * ep; p += prog(x, m); } return [g, p]; };
  const ende = (i) => { const lv = I[i].lvl || 1; let j = i + 1; while (j < I.length && !(I[j].typ === 'titel' && (I[j].lvl || 1) <= lv)) j++; return j; };
  const [gAll, pAll] = summe(staende.length ? staende[staende.length - 1].st : live, 0, I.length);
  const out = [], car = (k, on) => `<span class="car" data-amx="${k}">${on ? '▾' : '▸'}</span>`;
  out.push(`<tr class="root"><td><span class="tw">${IC.proj}<span>LV ${esc(L.nr)} ${esc(L.name)}${L.vergabe && L.vergabe.bieter ? ' · ' + esc(L.vergabe.bieter) : ''}</span></span></td><td></td><td></td><td></td><td class="r">${e2(gAll * (1 - nl))}</td><td class="r">${e2(pAll * (1 - nl))}</td></tr>`);
  staende.forEach((S) => {
    const on = offen(S.key, S.letzte), [g, p] = summe(S.st, 0, I.length);
    out.push(`<tr class="rech${S.letzte ? ' akt' : ''}"><td><span class="tw" style="padding-left:1.1rem">${car(S.key, on)}${IC.lv}<span><b>${esc(S.titel)}</b> <span class="mu">${esc(S.sub)}</span></span></span></td><td></td><td></td><td></td><td class="r">${e2(g * (1 - nl))}</td><td class="r">${on ? '' : e2(p * (1 - nl))}</td></tr>`);
    if (!on) return;
    const zu = new Set();   // zugeklappte Titel
    I.forEach((x, i) => {
      for (const t of zu) if (i > t.i && i < t.e) return;
      if (x.typ === 'titel') {
        const k = S.key + ':' + x.id, o = offen(k, true), e = ende(i), [tg, tp] = summe(S.st, i + 1, e);
        if (!o) zu.add({ i, e });
        out.push(`<tr class="ti"><td><span class="tw" style="padding-left:${1.1 + (x.lvl || 1) * 1.1}rem">${car(k, o)}${IC.ti}<span>${esc(x.oz)} ${esc(x.kurz)}</span></span></td><td></td><td></td><td></td><td class="r">${e2(tg)}</td><td class="r">${e2(tp)}</td></tr>`);
        return;
      }
      const tiefe = 1.1 + ((I.slice(0, i).reverse().find((y) => y.typ === 'titel') || {}).lvl || 0) * 1.1 + 2.2;
      if (x.art === 'T') { out.push(`<tr class="txt"><td colspan="6"><span class="tw" style="padding-left:${tiefe}rem">${IC.pos}<span class="mu">${esc(x.kurz || x.lang || '')}</span></span></td></tr>`); return; }
      const ep = VP[x.id], m = S.st[x.id] || 0, z = m - (S.vorher[x.id] || 0), abg = x.nt && x.nt_status === 'abgelehnt';
      const ueb = x.menge && m > x.menge * 1.1;
      out.push(`<tr data-amp="${x.id}" class="${abg || x.entf ? 'mu' : ''}"><td><span class="tw" style="padding-left:${tiefe}rem">${IC.pos}<span>${esc(x.oz)} ${esc(x.kurz)}${x.nt ? ` <span class="nt">${esc(x.nt)}</span>` : ''}</span></span></td>
        <td class="r${ueb ? ' nt' : ''}" title="LV-Menge ${nf(x.menge)} ${esc(x.einheit || '')}">${nf3(m)}</td><td class="r">${nf3(z)}</td><td class="r">${ep != null ? nf2(ep) : ''}</td><td class="r">${ep != null && !abg ? e2(m * ep) || '0,00' : ''}</td><td class="r">${ep != null && !abg ? e2(prog(x, m)) : ''}</td></tr>`);
    });
  });
  return `<div class="tblw"><table class="tree"><thead><tr><th style="min-width:20rem">Bezeichnung</th><th class="r">Menge</th><th class="r">Zuwachsmenge</th><th class="r">Preis (EUR)</th><th class="r">Gesamt (EUR)</th><th class="r">Prognose (EUR)</th></tr></thead><tbody>${out.join('')}</tbody></table></div>
    <p class="hint" style="margin:.5rem 0 0">Menge = aufgemessen bis zu dieser Rechnung (bei geprüften Rechnungen der festgehaltene Stand), Zuwachsmenge = neu seit der vorigen geprüften Rechnung. Prognose = größere aus LV- und Aufmaßmenge × Auftragspreis. Orange: mehr als 110 % der LV-Menge. Doppelklick auf eine Position öffnet ihr Aufmaß.</p>`;
}

  const heute = new Date().toISOString().slice(0, 10), ende = S.gw_ende || '';

  const zurueck = (x) => x.form === 'buergschaft' ? !!x.rueckgabe : false;
  const warn = [];

      <div class="si-g"><label>Art<select data-si="${k}.form"><option value="einbehalt"${x.form !== 'buergschaft' ? ' selected' : ''}>Einbehalt</option><option value="buergschaft"${x.form === 'buergschaft' ? ' selected' : ''}>Bürgschaft</option></select></label>
      ${k === 've' ? `<label>Einbehalt %<input data-ve="einbehalt" value="${esc(nf(ve.pct, 2))}" inputmode="decimal" style="width:5rem"></label>` : `<label>Einbehalt %${ein(k, 'pct', nf(x.pct, 2), '3', 'text', '5rem')}</label>`}

      ${x.form === 'buergschaft' && x.eingang ? `<span class="hint">${k === 've' ? 'Bürgschaft liegt vor – in Teilrechnungen wird nichts einbehalten.' : 'Bürgschaft liegt vor – in der Schlussrechnung wird nichts einbehalten.'}</span>` : ''}</div>`;
  return `<div class="card si"><h3>Sicherheiten <span class="hint">VOB/B § 17</span></h3>

    <div class="si-sum"><span>einbehalten <b>${eur(S.einbehalten)}</b></span><span>freigegeben <b>${eur(S.freigegeben)}</b></span><span>noch einbehalten <b>${eur(S.offen)}</b></span></div>

    ${block('ma', ma, 'Mängelansprüche (Gewährleistung)', 'Einbehalt in der Schlussrechnung – oder abgelöst durch Bürgschaft')}
    <div class="si-g"><label>Abnahme am${ein('', 'abnahme', S.abnahme, '', 'date')}</label><label>Verjährung Jahre${ein('', 'gw_jahre', S.gw_jahre, '4', 'text', '4rem')}</label>
      <label>Frist endet am<input data-si=".gw_ende" type="date" value="${esc(ende)}"></label></div></div>`;

async function reBelegHoch(rid, f) {

    const r = await fetch(`api/rechnungen/${rid}/beleg`, { method: 'POST', body: fd, credentials: 'same-origin' });
    const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Fehler ' + r.status);

  } catch (e) { toast(e.message, true); }
}

  box.addEventListener('change', async (e) => { if (e.target.id === 'mQa') { st.alle = e.target.checked; LS.set('vqAlle', st.alle); suchen(); return; } if (e.target.id === 'mLv') { await openLv(+e.target.value); } });
  box.addEventListener('click', async (e) => {
    const mr = e.target.closest('[data-mr]'); if (mr) { gehe(st.R[+mr.dataset.mr]); return; }
    const m = e.target.closest('[data-mm]'); if (m) { st.q = ''; st.modus = m.dataset.mm; LS.set('mModus', st.modus); zeichnen(); scrollTo(0, 0); return; }
    const k = e.target.closest('[data-mlv]'); if (k) { st.modus = 'lv'; LS.set('mModus', 'lv'); await openLv(+k.dataset.mlv); scrollTo(0, 0); return; }
    const t = e.target.closest('[data-mt]'); if (t) { const id = t.dataset.mt; if (st.auf.has(id)) st.auf.delete(id); else st.auf.add(id); zeichnen(); return; }
    const p = e.target.closest('[data-mp]'); if (p) { st.lang = st.lang === p.dataset.mp ? null : p.dataset.mp; zeichnen(); return; }
    if (e.target.closest('[data-mdesk]')) { try { localStorage.setItem(LSK, '1'); } catch { /* egal */ } location.reload(); }
  });
  return { zeichnen };
})();
window.bpMobilAn = () => { try { localStorage.removeItem('ava.mobilAus'); } catch { /* egal */ } location.reload(); };
