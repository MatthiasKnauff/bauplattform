<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#84827c">
<title>Ausschreibung & Abrechnung</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="static/bp.css">
<style>
.ava{display:flex;flex-direction:column;font-size:13.5px}
.rib{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--line);padding:.25rem .5rem 0}
.rg{display:flex;flex-direction:column;justify-content:space-between;padding:0 .7rem;border-right:1px solid var(--line)}
.rr{display:flex;gap:.15rem;align-items:center;min-height:3.4rem}
.rl{font-size:.7rem;color:var(--mute);text-align:center;padding:.1rem 0 .25rem}
.rb{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.3rem .45rem;border-radius:6px;color:var(--ink);font-size:.76rem;min-width:3.4rem;line-height:1.1}
.rb:hover{background:var(--hov)}
.rb[disabled]{opacity:.4}
.rb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rb svg .ac{stroke:var(--y)}
.rib select#proj{max-width:15rem;font-size:.85rem;padding:.3rem .4rem}
.rib #sel{min-width:14rem;max-width:22rem;padding:.2rem .5rem}
.rib .fill{flex:1}
.save{font-size:.78rem;color:var(--mute);align-self:center;padding:0 .6rem}
.body{flex:1;display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 140px)}
.nav{border-right:1px solid var(--line);background:var(--card);overflow:auto;padding:.5rem .45rem;position:sticky;top:52px;align-self:start;height:calc(100vh - 52px);box-sizing:border-box}
.nav .ng{margin-bottom:.35rem}
.nav .nh{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;padding:.3rem .55rem;border-radius:5px;background:var(--tabs);color:var(--ink);font-weight:600;border:1px solid var(--line)}
.nav a.nh{text-decoration:none}
.nav .ni{display:flex;gap:.45rem;align-items:center;width:100%;text-align:left;padding:.3rem .55rem .3rem .9rem;border-radius:5px;color:var(--ink);font-size:.85rem}
.nav .ni:hover{background:var(--hov)}
.nav .ni.on{background:color-mix(in srgb,var(--y) 22%,transparent);font-weight:600}
.nav .ni small{margin-left:auto;color:var(--mute);font-size:.72rem}
.nav .ni svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;flex:none;opacity:.75}
.pane{display:flex;flex-direction:column;min-width:0;padding:0 .8rem 3rem}
.ph{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;padding:.45rem 0 .35rem;position:sticky;top:0;background:var(--bg);z-index:3}
.ph b{font-size:.95rem}
#view{min-height:0}
.tree{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--line)}
.tree th{position:sticky;top:0;z-index:2;background:var(--tabs);color:var(--ink);font-weight:500;text-align:left;padding:.25rem .45rem;border-right:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px}
.tree td{padding:.12rem .45rem;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:28rem;line-height:1.55}
.tree td.r,.tree th.r{text-align:right;font-variant-numeric:tabular-nums}
.tree tr:hover td{background:var(--hov)}
.tree tr.sel td{background:#cfe2f6;color:#10283f}
#kpi[hidden],#stat[hidden]{display:none!important}
.tree tr.root td{font-weight:600}
.tree .tw{display:inline-flex;align-items:center;gap:.3rem}
.tree .car{width:1rem;display:inline-block;text-align:center;color:var(--mute);cursor:pointer;user-select:none}
.tree .ico{width:16px;height:16px;flex:none}
.tree .mu{color:var(--mute)}
.lv tr.flash td{background:color-mix(in srgb,var(--y) 40%,transparent);transition:background .6s}
.bed{position:fixed;inset:0;z-index:1000;background:#3b3f45;display:flex;flex-direction:column}
.bed-bar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.5rem .9rem;background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.dz{flex:1;display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0}
.dz-side{background:var(--card);color:var(--ink);overflow:auto;padding:.9rem;display:flex;flex-direction:column;gap:.8rem;border-right:1px solid var(--line)}
.dz-l{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem;color:var(--mute)}
.dz-l select,.dz-l textarea{font:inherit;font-size:.9rem;color:var(--ink)}
.dz-g{display:flex;flex-direction:column;gap:.3rem}.dz-c{display:flex;gap:.45rem;align-items:center;font-size:.9rem}
.bed-s{overflow:auto;padding:1rem .75rem 3rem;display:flex;flex-direction:column;align-items:center;gap:1rem}
.bed-p{position:relative;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.35);flex:none}
.bed-p canvas{width:100%;height:100%;display:block}
.bed-f{position:absolute;box-sizing:border-box;margin:0;border:0;border-radius:2px;background:rgba(255,226,120,.3);color:#1c1c1a;font-family:Lato,Helvetica,Arial,sans-serif;line-height:1.2;resize:none;outline:none;overflow:hidden}
.bed-f:focus{background:rgba(255,236,160,.6);box-shadow:0 0 0 1.5px #e0a800}
.bed-l{color:#ddd;padding:3rem}
@media (max-width:860px){.dz{grid-template-columns:1fr;grid-template-rows:auto 1fr}.dz-side{max-height:40vh}}
.fotos{display:flex;flex-wrap:wrap;gap:.45rem;margin:.4rem 0 0}
.fotos figure{position:relative;margin:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}
.fotos img{display:block;height:92px;width:auto;max-width:180px;object-fit:cover;cursor:zoom-in}
.fotos .ib{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;border-radius:4px;opacity:0;transition:opacity .15s}
.fotos figure:hover .ib,.fotos figure:focus-within .ib{opacity:1}
tr.lang.drop td{outline:2px dashed var(--y);outline-offset:-3px}
.ib sup{font-size:.6em}
.tree .nt{color:#e07b3a;font-weight:600}
@media (max-width:860px){.body{grid-template-columns:1fr}.nav{display:flex;gap:.3rem;overflow-x:auto;padding:.3rem;border-right:0;border-bottom:1px solid var(--line)}.nav .ng{display:flex;gap:.2rem;margin:0}.nav .nh{display:none}.nav .ni{white-space:nowrap;padding:.35rem .6rem}.nav{position:static;height:auto}}
.stat{display:flex;gap:.25rem;flex-wrap:wrap;align-items:center;font-size:.8rem}
.stat button{border:1px solid var(--line);border-radius:999px;padding:.1rem .6rem;color:var(--mute);font-size:.78rem}
.stat button.on{border-color:var(--y);color:var(--ink);font-weight:600}
.kpi{display:flex;flex-wrap:wrap;gap:.35rem .5rem;margin:0 0 .6rem}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.25rem .6rem;font-size:.8rem}
.kpi small{color:var(--mute);font-size:.74rem;margin-right:.3rem}
.kpi b{font-variant-numeric:tabular-nums}
.kpi .sub{font-size:.72rem;color:var(--mute)}
.bar{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center;margin-bottom:.7rem}
.bar .fill{flex:1}
table.lv{width:100%;border-collapse:collapse;font-size:13px}
table.lv th{text-align:left;font-size:12.5px;color:var(--ink);font-weight:500;padding:.25rem .35rem;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--tabs);z-index:2}
table.lv td{padding:.08rem .3rem;border-bottom:1px solid var(--line);border-right:1px solid color-mix(in srgb,var(--line) 60%,transparent);vertical-align:top}
table.lv td.r,table.lv th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.lv input,table.lv select,table.lv textarea{font:inherit;font-size:13px;padding:.12rem .3rem;border-radius:6px;border:1px solid transparent;background:transparent;color:inherit;width:100%;box-sizing:border-box}
table.lv input:hover,table.lv select:hover,table.lv textarea:hover{border-color:var(--line)}
table.lv input:focus,table.lv select:focus,table.lv textarea:focus{border-color:var(--y);background:var(--inp);outline:0}
table.lv input.n{text-align:right;font-variant-numeric:tabular-nums}
table.lv tr.ti td{background:var(--hov);font-weight:700}
table.lv tr.ti input{font-weight:700}
table.lv tr.ti.l2 td{background:transparent}
table.lv tr.txt td{color:var(--mute);font-style:italic}
table.lv tr.nt td:first-child{box-shadow:inset 3px 0 0 #e07b3a}
table.lv tr.lang td{border-bottom:1px solid var(--line);padding-top:0}
table.lv textarea{min-height:5.5rem;resize:vertical;border-color:var(--line)}
.oz{font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap;font-size:.82rem;padding-top:.45rem!important}
.ib{background:transparent;border:0;color:var(--mute);cursor:pointer;padding:.15rem .3rem;border-radius:6px;font-size:.92rem;line-height:1}
.ib:hover{color:var(--ink);background:var(--hov)}
.ib.on{color:var(--y)}
.acts-c{white-space:nowrap;text-align:right}
.badge{display:inline-block;font-size:.7rem;border-radius:999px;padding:.02rem .4rem;border:1px solid var(--line);color:var(--mute);margin-left:.25rem;vertical-align:1px;font-style:normal;font-weight:500}
.badge.nt{border-color:#e07b3a;color:#e07b3a}
.tblw{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:4px;max-height:calc(100vh - 210px)}
.ps td.bp{min-width:8.5rem}
.ps input.ep{width:6.5rem}
.ps .min input{color:var(--ok);font-weight:700}
.ps .aus input{text-decoration:underline wavy #e07b3a}
.ps .gp{display:block;font-size:.72rem;color:var(--mute);text-align:right;padding-right:.4rem}
.ps tfoot td{font-weight:600;background:var(--hov)}
.ps th.bh{min-width:9rem;white-space:normal}
.ps th.bh .bn{display:flex;gap:.3rem;align-items:center;justify-content:space-between}
.ps th.win{box-shadow:inset 0 -3px 0 var(--ok)}
.empty{padding:2rem;text-align:center;color:var(--mute)}
.am td{font-size:.88rem}
.am tr.ph td{background:var(--hov);font-weight:600}
.am tr.ph .ok{color:var(--ok)}
.am tr.ph .ueb{color:#e07b3a}
.re{display:grid;gap:1rem}
.re .card h3{margin:0 0 .3rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.re .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem .8rem;margin:.6rem 0}
.re .g label{display:flex;flex-direction:column;font-size:.78rem;color:var(--mute);gap:.15rem}
.re table{width:100%;border-collapse:collapse;font-size:.9rem;max-width:620px}
.re table td{padding:.25rem .3rem;border-bottom:1px solid var(--line)}
.re table td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.re table tr.s td{font-weight:700;background:var(--hov)}
.re .abz{display:flex;gap:.4rem;margin:.2rem 0}
.re .abz input{padding:.25rem .4rem}
.ue td,.ue th{padding:.45rem .5rem}
.ue tr:hover td{background:var(--hov);cursor:pointer}
.modal.wide{width:min(860px,96vw)}
.fm{display:grid;grid-template-columns:9rem 1fr;gap:.5rem .8rem;align-items:center}
.fm .w{grid-column:1/-1}
.fm input,.fm select,.fm textarea{width:100%;box-sizing:border-box}
.src{display:grid;gap:.35rem;margin:.6rem 0}
.src label{display:flex;gap:.5rem;align-items:baseline}
.kgs[hidden]{display:none}
.kgs{display:flex;flex-wrap:wrap;gap:.3rem .8rem;margin:.3rem 0 0 1.6rem;font-size:.88rem}
.hint{color:var(--mute);font-size:.85rem}
.vb{border:1px solid var(--ok);border-radius:10px;padding:.55rem .8rem;margin-bottom:.8rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.menu{position:fixed;z-index:95;background:var(--card2);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.35);padding:.3rem;min-width:15rem}
.menu button{display:block;width:100%;text-align:left;padding:.45rem .7rem;border-radius:7px;color:var(--ink)}
.menu button:hover{background:var(--hov)}
.menu small{display:block;color:var(--mute);font-size:.75rem}
.menu hr{border:0;border-top:1px solid var(--line);margin:.25rem 0}
@media (max-width:760px){.top select#proj,#sel{min-width:0;flex:1 1 100%;width:100%}.top .fill{display:none}.fm{grid-template-columns:1fr}.hide-m{display:none}}
</style>
</head>
<body>
<main class="ava">
  <div class="rib" role="toolbar" aria-label="Werkzeuge">
    <div class="rg"><div class="rr"><select id="proj" aria-label="Projekt"></select><button type="button" id="sel" aria-label="Leistungsverzeichnis wählen"></button></div><div class="rl">Projekt und LV</div></div>
    <div class="rg"><div class="rr">
      <button class="rb" id="newBtn" title="Neues Leistungsverzeichnis / neuer Auftrag"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M12 11v6M9 14h6" class="ac"/></svg>Neu</button>
      <button class="rb" data-act="pos" data-need="lv" title="Position anhängen"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h12"/><path d="M19 15v6M16 18h6" class="ac"/></svg>Position</button>
      <button class="rb" data-act="titel" data-need="lv" title="Titel anhängen"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/><path d="M17 12v5M14.5 14.5h5" class="ac"/></svg>Titel</button>
    </div><div class="rl">Neu</div></div>
    <div class="rg"><div class="rr">
      <button class="rb" id="verBtn" title="Frühere Stände dieses LV ansehen und wiederherstellen"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v4h4"/><path d="M12 8v4l3 2"/></svg>Verlauf</button>
      <button class="rb" id="moreBtn" title="Archivieren oder löschen"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Archiv / Löschen</button>
    </div><div class="rl">Bearbeiten</div></div>
    <div class="rg"><div class="rr">
      <button class="rb" id="impBtn" title="GAEB-Datei (X81–X86) oder ausgefülltes Excel einlesen"><svg viewBox="0 0 24 24"><path d="M5 14v6h14v-6"/><path d="M12 3v11M8 10l4 4 4-4" class="ac"/></svg>Import</button>
      <button class="rb" id="expBtn" title="GAEB, Excel und PDF"><svg viewBox="0 0 24 24"><path d="M5 14v6h14v-6"/><path d="M12 15V4M8 8l4-4 4 4" class="ac"/></svg>Export</button>
    </div><div class="rl">Datenaustausch</div></div>
    <span class="fill"></span><span class="save" id="save" role="status"></span>
  </div>
  <div class="body">
    <aside class="nav" id="tabs" aria-label="Bereiche"></aside>
    <section class="pane">
      <div class="ph"><b id="phT"></b><span class="stat" id="stat"></span></div>
      <div class="kpi" id="kpi"></div>
      <div id="view"><p class="mute">Lade …</p></div>
    </section>
  </div>
</main>
<input type="file" id="fileIn" accept=".x81,.x82,.x83,.x84,.x85,.x86,.xml,.xlsx" hidden>
<datalist id="ehList"><option>m</option><option>m2</option><option>m3</option><option>St</option><option>psch</option><option>kg</option><option>t</option><option>h</option><option>lfm</option></datalist>
<datalist id="gwList"></datalist>
<script src="static/bp.js"></script>
<script>
const LS = { get(k, d) { try { const v = localStorage.getItem('ava.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('ava.' + k, JSON.stringify(v)); } catch { /* egal */ } } };
const NAVI = [   // wie in den gewohnten AVA-Programmen: links die Arbeitsschritte, rechts die Tabelle
  ['Ausschreibung', [['lv', 'Leistungsverzeichnis', '<path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h4"/>']]],
  ['Vergabe', [['angebote', 'Angebote & Preisspiegel', '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>']]],
  ['Vergabe und Abrechnung', [['auftraege', 'Aufträge', '<path d="M3 7h6l2 2h10v10H3z"/>'], ['aufmass', 'Aufmaßprüfung', '<path d="M3 17l14-14 4 4-14 14H3z"/><path d="M13 7l4 4"/>'], ['rechnungen', 'Rechnungen', '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>']]],
  ['Kostenübersicht', [['uebersicht', 'Kostenkontrolle', '<path d="M4 19h16M7 16V9M12 16V5M17 16v-4"/>']]],
];
const TABS = NAVI.flatMap((g) => g[1].map((x) => [x[0], x[1]]));
const NURLV = new Set(['lv', 'angebote', 'aufmass', 'rechnungen']);
const ARTEN = { N: 'Normal', E: 'Bedarf (ohne GB)', A: 'Wahl (ohne GB)', P: 'Pauschal', T: 'Hinweistext' };
const STATUS = [['entwurf', 'Entwurf'], ['versendet', 'An Bieter versendet'], ['vergeben', 'Vergeben'], ['abgerechnet', 'Abgerechnet']];
let PROJ = [], pid = null, LIST = [], L = null, tab = LS.get('tab', 'auftraege'), PC = {}, EXP = new Set(LS.get('exp', [])), TSEL = null, saveT = 0, saving = false, KONT = null, OPEN = new Set(), amPos = LS.get('amPos', null), amNur = LS.get('amNur', false);
if (!TABS.some((t) => t[0] === tab)) tab = 'auftraege';
const eur = (v) => (v == null || isNaN(v) ? '–' : (Math.abs(v) < 0.005 ? 0 : v).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €');
const eur0 = (v) => (v == null || isNaN(v) ? '–' : Math.round(v).toLocaleString('de-DE') + ' €');
const nf2 = (v) => (v == null || v === '' || isNaN(v) ? '' : (+v).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const nf = (v, n = 3) => (v == null || v === '' || isNaN(v) ? '' : (+v).toLocaleString('de-DE', { maximumFractionDigits: n }));
const pf = (s) => { if (s == null) return null; s = String(s).trim(); if (!s) return null; const v = parseFloat(s.replace(/\./g, (m, i, a) => (/\.\d{3}(\D|$)/.test(a.slice(i)) ? '' : '.')).replace(',', '.')); return isNaN(v) ? null : v; };
const de = (s) => { if (!s) return ''; const d = new Date(s); return isNaN(d) ? s : d.toLocaleDateString('de-DE'); };
const uid = () => Math.random().toString(36).slice(2, 12);
const zaehlt = (p) => p.typ === 'pos' && (p.art === 'N' || p.art === 'P') && !p.nt;
const items = () => (L && L.data && L.data.items) || [];
const posOf = () => items().filter((x) => x.typ === 'pos' && x.art !== 'T');
/* Rechenweg wie auf dem Server: „2 × 3,5 × 2,75 – 0,885 × 2,135“ */
function formel(s) {
  let t = String(s || '').trim(); if (!t) return null;
  t = t.replace(/[×·xX]/g, '*').replace(/÷|:/g, '/').replace(/[–−]/g, '-').replace(/(\d)\.(?=\d{3}(\D|$))/g, '$1').replace(/,/g, '.');
  if (!/^[\d\s.+\-*/()]+$/.test(t)) return null;
  try { const v = Function('"use strict";return (' + t + ')')(); return typeof v === 'number' && isFinite(v) ? Math.round(v * 10000) / 10000 : null; } catch { return null; }
}

/* ---------- Laden / Speichern ---------- */
async function loadProj() {
  PROJ = await api('api/projekte');
  const gp = window.BPHead && BPHead.projektId();
  pid = PROJ.some((p) => p.id === gp) ? gp : PROJ.some((p) => p.id === LS.get('pid')) ? LS.get('pid') : (PROJ.find((p) => !p.archived) || {}).id || null;
  $('#proj').innerHTML = `<optgroup label="Projekte">${PROJ.filter((p) => !p.archived).map((p) => `<option value="${p.id}"${p.id === pid ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</optgroup>`
    + (PROJ.some((p) => p.archived) ? `<optgroup label="Archiv">${PROJ.filter((p) => p.archived).map((p) => `<option value="${p.id}"${p.id === pid ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</optgroup>` : '');
}
async function loadList(want) {
  LIST = pid ? await api('api/lv?project_id=' + pid) : [];
  want = want || LS.get('lv:' + pid);
  const pick = LIST.find((x) => x.id === want) || LIST.find((x) => !x.archived) || LIST[0];
  if (pick) await openLv(pick.id); else { L = null; render(); }
}
async function openLv(id) {
  L = await api('api/lv/' + id); LS.set('lv:' + pid, id); render();
}
function changed(draw = false) {
  $('#save').textContent = 'Nicht gespeichert …';
  clearTimeout(saveT); saveT = setTimeout(saveNow, 800);
  if (draw) render(); else { kpis(); sums(); }
}
async function saveNow(extra = {}) {
  if (!L) return;
  if (saving) { clearTimeout(saveT); saveT = setTimeout(() => saveNow(extra), 400); return; }
  saving = true; saveT = 0;
  try {
    const r = await api('api/lv/' + L.id, 'PUT', { rev: L.rev, data: L.data, ...extra });
    const struct = !!extra.nummerieren;

  async function laden() {

          Object.assign(el.style, { left: Math.min(x1, x2) + 'px', top: Math.min(y1, y2) + 'px', width: Math.abs(x2 - x1) + 'px', height: Math.abs(y2 - y1) + 'px', fontSize: fs + 'px', padding: `${2 * sc}px`, fontWeight: a.fieldName === 'Titel' ? '700' : '400' });

/* ---------- Aufträge: Baum über alle Vergabeeinheiten (wie in ORCA: Projekt › LV › Titel › Position) ---------- */
const IC = {
  proj: '<svg class="ico" viewBox="0 0 24 24" fill="#d9a520" stroke="#a57a0c"><path d="M3 6h6l2 2h10v11H3z"/></svg>',
  lv: '<svg class="ico" viewBox="0 0 24 24" fill="#e9c46a" stroke="#b08a2e"><path d="M3 6h6l2 2h10v11H3z"/></svg>',
  ti: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#4a7fb5" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/></svg>',
  pos: '<svg class="ico" viewBox="0 0 24 24" fill="#fff" stroke="#7a8a99"><path d="M6 3h9l4 4v14H6z"/></svg>',
};
const jn = (b) => (b ? 'Ja' : 'Nein');
function lvBaum(lv) {   // Titel/Positionen eines LV mit Summen
  const I = (lv.data && lv.data.items) || [], V = lv.vergabe || {}, VP = V.preise || null, nl = (V.nachlass || 0) / 100;
  const ep = (x) => (VP ? (VP[x.id] ?? null) : (x.ep_s ?? null));
  const gp = (x) => (ep(x) != null ? (x.menge || 0) * ep(x) * (VP ? 1 - nl : 1) : null);
  const rows = []; const st = [];
  I.forEach((x) => {
    if (x.typ === 'titel') {
      const lvl = x.lvl || 1; while (st.length && st[st.length - 1].lvl >= lvl) st.pop();
      const r = { k: `l${lv.id}:${x.id}`, typ: 'ti', x, lvl, par: st.length ? st[st.length - 1].k : `l${lv.id}`, g: 0, nt: 0, ntj: false };
      rows.push(r); st.push(r); return;
    }
    if (x.typ !== 'pos' || x.art === 'T') return;
    const g = gp(x), isNt = !!x.nt && x.nt_status !== 'abgelehnt';
    const r = { k: `l${lv.id}:${x.id}`, typ: 'pos', x, par: st.length ? st[st.length - 1].k : `l${lv.id}`, g: zaehlt(x) ? g : null, gRoh: g, nt: isNt && g ? g : 0, ntj: !!x.nt };
    rows.push(r);
    st.forEach((t) => { if (zaehlt(x) && g) t.g += g; if (r.nt) t.nt += r.nt; if (x.nt) t.ntj = true; });
  });
  return rows;
}
function vAuftraege() {
  const xs = LIST.filter((x) => !x.archived);

  const pn = (PROJ.find((p) => p.id === pid) || {}).name || 'Projekt';
  const S = { g: 0, nt: 0, pr: 0, ab: 0 };
  xs.forEach((x) => { S.g += x.auftrag || x.schaetzung; S.nt += x.nachtraege + x.nt_angemeldet; S.pr += x.prognose; S.ab += x.abgerechnet; });
  const e2 = (v) => (v ? eur(v).replace(' €', '') : '');

  const row = (k, lvl, kids, ico, bez, c) => out.push(`<tr data-tr="${k}" class="${k === pk ? 'root' : ''}${TSEL === k ? ' sel' : ''}"><td><span class="tw" style="padding-left:${lvl * 1.1}rem"><span class="car" ${kids ? `data-car="${k}"` : ''}>${kids ? (EXP.has(k) ? '▾' : '▸') : ''}</span>${ico}<span>${bez}</span></span></td>${c.map((v, i) => `<td class="${[1, 3, 4, 8].includes(i) ? 'r' : ''}${i === 2 && v === 'Ja' ? ' nt' : ''}">${v}</td>`).join('')}</tr>`);
  const auf = !EXP.has('-' + pk);   // Projekt ist standardmäßig aufgeklappt
  out.push(`<tr data-tr="${pk}" class="root${TSEL === pk ? ' sel' : ''}"><td><span class="tw"><span class="car" data-car="-${pk}">${auf ? '▾' : '▸'}</span>${IC.proj}<span>${esc(pn)}</span></span></td><td></td><td class="r">${e2(S.g)}</td><td></td><td class="r">${e2(S.nt)}</td><td class="r">${e2(S.pr)}</td><td></td><td></td><td></td><td class="r">${e2(S.ab)}</td></tr>`);
  if (auf) xs.forEach((x) => {
    const k = 'l' + x.id, aufgetragen = !!x.auftrag;
    row(k, 1, true, IC.lv, `<b>${esc([x.nr, x.name].filter(Boolean).join(' '))}</b>`,
      [esc(x.auftragnehmer || ''), e2(x.auftrag || x.schaetzung), jn(x.n_nt), e2(x.nachtraege + x.nt_angemeldet), e2(x.prognose), aufgetragen ? 'Auftrag' : 'Ausschreibung', '', '', e2(x.abgerechnet)]);

      if (r.typ === 'ti') {

        if (EXP.has(r.k)) sicht.add(r.k);

        row(r.k, tief, false, IC.pos, `<span class="${mu ? 'mu' : ''}">${esc(x2.oz || '')} ${esc(x2.kurz || '')}</span>`,
          ['', r.gRoh != null ? `<span class="${mu ? 'mu' : ''}">${e2(r.gRoh)}</span>` : '', jn(x2.nt), e2(r.nt), e2((r.g || 0) + r.nt), x2.nt ? 'Nachtrag' : x2.art === 'P' ? 'Pauschal' : 'Position', jn(x2.art === 'E'), esc(x2.kg || ''), '']);

    <p class="hint" style="margin:.5rem 0 0">▸ klappt auf · Klick wählt das LV · Doppelklick öffnet es im Leistungsverzeichnis. Gesamt = Auftragssumme (nach Nachlass), ohne Auftrag die Schätzung. Prognose = Auftrag + beauftragte und angemeldete Nachträge. Grau: Bedarfs-/Wahlpositionen (nicht in der Summe).</p>`;
}

/* ---------- Übersicht Projekt (Kostenkontrolle) ---------- */
function vUebersicht() {
  if (!LIST.length) return '<div class="card empty">Noch keine Leistungsverzeichnisse in diesem Projekt.</div>';
  const S = { s: 0, a: 0, au: 0, nt: 0, ab: 0 };
  const rows = LIST.filter((x) => !x.archived).map((x) => {
    const auf = x.auftrag + x.nachtraege; S.s += x.schaetzung; S.a += x.min_angebot; S.au += x.auftrag; S.nt += x.nachtraege; S.ab += x.abgerechnet;
    return `<tr data-ue="${x.id}"><td>${esc(x.nr)}</td><td><b>${esc(x.name)}</b><br><span class="hint">${esc([x.gewerk, x.auftragnehmer].filter(Boolean).join(' · '))}</span></td><td>${esc(STATUS.find((s) => s[0] === x.status)[1])}</td>
      <td class="r">${x.schaetzung ? eur0(x.schaetzung) : '–'}</td><td class="r">${x.min_angebot ? eur0(x.min_angebot) : '–'}${x.n_angebote ? `<br><span class="hint">${x.n_angebote} Angebote</span>` : ''}</td>
      <td class="r">${x.auftrag ? eur0(x.auftrag) : '–'}</td><td class="r">${x.nachtraege ? eur0(x.nachtraege) : '–'}</td><td class="r">${x.abgerechnet ? eur0(x.abgerechnet) : '–'}</td>
      <td class="r">${auf ? eur0(auf - x.abgerechnet) : '–'}</td><td class="r" style="${auf && x.schaetzung && auf > x.schaetzung * 1.05 ? 'color:var(--red);font-weight:600' : ''}">${auf && x.schaetzung ? (auf >= x.schaetzung ? '+' : '') + Math.round((auf / x.schaetzung - 1) * 100) + ' %' : ''}</td></tr>`;
  }).join('');
  const ges = S.au + S.nt;
  return `<p class="hint" style="margin:0 0 .6rem">Alle Vergabeeinheiten des Projekts: Schätzung im LV, bestes Angebot, Auftrag und beauftragte Nachträge, anerkannte Abrechnung. Klick öffnet das LV.</p>
    <div class="tblw"><table class="lv ue"><thead><tr><th>Nr.</th><th>LV</th><th>Stand</th><th class="r">Schätzung</th><th class="r">bestes Angebot</th><th class="r">Auftrag</th><th class="r">Nachträge</th><th class="r">abgerechnet</th><th class="r">noch offen</th><th class="r">Abw. zur Schätzung</th></tr></thead>

      <td class="r">${ges && S.s ? (ges >= S.s ? '+' : '') + Math.round((ges / S.s - 1) * 100) + ' %' : ''}</td></tr></tfoot></table></div>`;
}
