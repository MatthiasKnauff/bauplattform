# =============================================================================
# Bauplattform – TESTSERVER (bekommt jeden Stand von main automatisch)
#
# Die Images baut GitHub Actions. Die Versionsnummer hinter dem Doppelpunkt trägt der
# Workflow nach jedem Build selbst ein; Portainer bemerkt die Änderung (Polling) und
# spielt die neue Version ein.
#
# Einstellungen kommen aus den Umgebungsvariablen des Stacks in Portainer
# (mindestens DB_PASSWORD, siehe README → „Testserver (Docker 1)“).
#
# SCHUTZ: TESTSERVER=1 (unten fest eingetragen) – die Ablage auf dem Dateiserver wird nur gelesen, es gehen keine Mails und
# keine Kalendertermine hinaus. Eigene Volumes (bauplattform_test_*): die Daten des Produktivservers werden nie berührt.
# Die eigene KI (Ollama) startet nur mit dem Profil „ki“ (COMPOSE_PROFILES=ki) – sie braucht 7 GB Speicher.
# Für die Installation per Skript (update.sh) gilt die docker-compose.yml im Hauptordner.
# =============================================================================
name: bauplattform

x-env: &env
  TESTSERVER: "1"                         # Kopie zum Ausprobieren: Ablage nur lesen, keine Mails, keine Kalendertermine
  TZ: ${TZ:-Europe/Berlin}
  DATABASE_URL: "postgresql://bautagebuch@bautagebuch_db:5432/bautagebuch"
  PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt – in Portainer unter Environment variables eintragen}
  TRUST_PROXY: ${TRUST_PROXY:-0}
  COOKIE_SECURE: ${COOKIE_SECURE:-0}
  SSO_COOKIE_DOMAIN: ${SSO_COOKIE_DOMAIN:-}
  BAUTAGEBUCH_PORT: ${BAUTAGEBUCH_PORT:-8080}
  GANTT_PORT: ${GANTT_PORT:-8082}
  PORTAL_PORT: ${PORTAL_PORT:-8090}
  ADMIN_PORT: ${ADMIN_PORT:-8091}
  ADRESSEN_PORT: ${ADRESSEN_PORT:-8093}
  BAUKOSTEN_PORT: ${BAUKOSTEN_PORT:-8094}
  BAUTAGEBUCH_URL: ${BAUTAGEBUCH_URL:-}
  GANTT_URL: ${GANTT_URL:-}
  PORTAL_URL: ${PORTAL_URL:-}
  ADMIN_URL: ${ADMIN_URL:-}
  ADRESSEN_URL: ${ADRESSEN_URL:-}
  BAUKOSTEN_URL: ${BAUKOSTEN_URL:-}
  # Alle Apps unter EINER Adresse, unterschieden durch den Pfad (/bautagebuch, /bauzeitenplan, /adressen, /baukosten, /verwaltung).
  # Im Nginx Proxy Manager reicht ein Eintrag auf Port 8090 (Verteiler). Eigene *_URL-Werte oben haben Vorrang.
  BAUPORTAL_URL: ${BAUPORTAL_URL:-}
  SERVER_HOST: ${SERVER_HOST:-}   # IP/Name des Servers – für Links zu Apps ohne eigene Adresse (optional)
  BAUTAGEBUCH_INTERNAL: http://bautagebuch:8000
  DIENSTE_INTERNAL: http://dienste:8102
  GANTT_INTERNAL: http://gantt:8082
  PORTAL_INTERNAL: http://portal:8090
  ADMIN_INTERNAL: http://admin:8091
  ADRESSEN_INTERNAL: http://adressen:8093
  BAUKOSTEN_INTERNAL: http://baukosten:8094
  AUFGABEN_INTERNAL: http://aufgaben:8095
  PLAENE_INTERNAL: http://plaene:8096
  AVA_INTERNAL: http://ava:8097
  KOMMUNIKATION_INTERNAL: http://kommunikation:8098
  BAUDATEN_INTERNAL: http://baudaten:8099
  ZEITEN_INTERNAL: http://zeiten:8101
  HONORAR_INTERNAL: http://honorar:8103
  BAUANTRAG_INTERNAL: http://bauantrag:8104
  WAERMESCHUTZ_INTERNAL: http://waermeschutz:8105
  # KI für alle Apps (Auswahl oben in der Kopfleiste). Ollama läuft als eigener Container im Docker-Netz.
  OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
  OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen3-vl:4b}   # liest Pläne (Bilder); leer = keins
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

services:
  bautagebuch_db:
    image: postgres:15
    container_name: bauplattform_db   # Daten der ganzen Bauplattform (früher „bauportal_db“/„Bautagebuch_db“; Volume unverändert)
    restart: unless-stopped
    environment:
      POSTGRES_USER: bautagebuch
      POSTGRES_DB: bautagebuch
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - bautagebuch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bautagebuch -d bautagebuch"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Hintergrundaufgaben der Plattform: Datenbank einrichten, tägliche Datensicherung, Erinnerungen (bautagebuch/dienste.py).
  # Alle Apps warten auf diesen Container – das Bautagebuch ist eine normale App.
  dienste:
    image: ghcr.io/matthiasknauff/bauplattform/plattform:541f508
    working_dir: /app/bautagebuch
    container_name: bauplattform_dienste
    restart: unless-stopped
    depends_on:
      bautagebuch_db: { condition: service_healthy }
    environment:
      <<: *env
      APP: dienste
    volumes:
      - bautagebuch_data:/data

  bautagebuch:
    image: ghcr.io/matthiasknauff/bauplattform/plattform:541f508
    working_dir: /app/bautagebuch   # Ordner der App im gemeinsamen Image (für „docker compose exec bautagebuch python …“)
    container_name: bauplattform_bautagebuch
    restart: unless-stopped
    depends_on:
      dienste: { condition: service_healthy }
    ports:
      - "${BAUTAGEBUCH_PUBLISH:-8080}:8000"
    environment:
      <<: *env
      APP: bautagebuch
      DIENSTE: extern   # Datenbank einrichten, sichern, erinnern: macht der Container „dienste“
      SECRET_KEY: ${SECRET_KEY:-}
    volumes:
      - bautagebuch_data:/data

  gantt:
    image: ghcr.io/matthiasknauff/bauplattform/plattform:541f508
    working_dir: /app/gantt   # Ordner der App im gemeinsamen Image (für „docker compose exec gantt python …“)
    container_name: bauplattform_bauzeitenplan
    restart: unless-stopped
    depends_on:
      dienste: { condition: service_healthy }
    ports:
      - "${GANTT_PUBLISH:-8082}:8082"
    environment:
      <<: *env
      APP: gantt
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - gantt_legacy:/legacy:ro

  portal:
    image: ghcr.io/matthiasknauff/bauplattform/plattform:541f508
    container_name: bauplattform_portal
    restart: unless-stopped
    depends_on:
      dienste: { condition: service_healthy }
    # kein eigener Port: erreichbar über den Verteiler (bauportal, Port 8090)
    environment:
      <<: *env
      APP_MODULE: portal
      APP_PORT: "8090"

  admin:
    image: ghcr.io/matthiasknauff/bauplattform/plattform:541f508
    container_name: bauplattform_admin
    restart: unless-stopped
    depends_on:
      portal: { condition: service_started }
      dienste: { condition: service_healthy }
    ports:
      - "${ADMIN_PUBLISH:-8091}:8091"
    environment:
      <<: *env
      APP_MODULE: admin
      APP_PORT: "8091"

  adressen:
    image: ghcr.io/matthiasknauff/bauplattform/plattform:541f508
    container_name: bauplattform_adressen
    restart: unless-stopped
    depends_on:
      portal: { condition: service_started }
      dienste: { condition: service_healthy }
    ports:
      - "${ADRESSEN_PUBLISH:-8093}:8093"
    environment:
      <<: *env
      APP_MODULE: adressen
      APP_PORT: "8093"



  # Verteiler: alle Apps unter einer Adresse (Pfad statt Port/Subdomain), siehe plattform/router.py
  bauportal:
    image: ghcr.io/matthiasknauff/bauplattform/plattform:541f508
    container_name: bauplattform_verteiler
    restart: unless-stopped
    depends_on:
      portal: { condition: service_started }
    ports:
      - "${PORTAL_PUBLISH:-8090}:8090"
    environment:
      <<: *env
      APP_MODULE: router
      APP_PORT: "8090"
      APP_THREADS: "32"
      APP_TIMEOUT: "320"
  baukosten:
    image: ghcr.io/matthiasknauff/bauplattform/plattform:541f508
    container_name: bauplattform_baukosten
    restart: unless-stopped
    depends_on:
      portal: { condition: service_started }
      dienste: { condition: service_healthy }
    ports:
      - "${BAUKOSTEN_PUBLISH:-8094}:8094"
    environment:
      <<: *env
      APP_MODULE: baukosten
      APP_PORT: "8094"
      APP_TIMEOUT: "300"

  # Mängel & Erinnerungen: Mängelverfolgung aus den Bautagesberichten, Erinnerungen aus Bautagebuch, Bauzeitenplänen und eigene
  aufgaben:
    image: ghcr.io/matthiasknauff/bauplattform/plattform:541f508
    container_name: bauplattform_aufgaben
    restart: unless-stopped
    depends_on:
      portal: { condition: service_started }
      dienste: { condition: service_healthy }
    ports:
      - "${AUFGABEN_PUBLISH:-8095}:8095"
    environment:
      <<: *env
      APP_MODULE: aufgaben
      APP_PORT: "8095"

  # Pläne & Dateien: Pläne im Projektordner (über das Bautagebuch), neuester Index, Versand an die Firmen, Planversandliste
  plaene:
    image: ghcr.io/matthiasknauff/bauplattform/plattform:541f508
    container_name: bauplattform_plaene
    restart: unless-stopped
    depends_on:
      portal: { condition: service_started }
      dienste: { condition: service_healthy }
    ports:
      - "${PLAENE_PUBLISH:-8096}:8096"
    environment:
      <<: *env
      APP_MODULE: plaene
      APP_PORT: "8096"
      APP_TIMEOUT: "300"

  # Ausschreibung & Abrechnung: Leistungsverzeichnisse, Angebote/Preisspiegel, Aufmaß, Rechnungsprüfung (GAEB)
  ava:
    image: ghcr.io/matthiasknauff/bauplattform/plattform:541f508
    container_name: bauplattform_ava
    restart: unless-stopped
    depends_on:
      portal: { condition: service_started }
      dienste: { condition: service_healthy }
    ports:
      - "${AVA_PUBLISH:-8097}:8097"
    environment:
      <<: *env
      APP_MODULE: ava
      APP_PORT: "8097"
      APP_TIMEOUT: "300"

  # Kommunikation: was an wen verschickt wurde (Planversand, Rügen) – je Projekt und je Kontakt
  kommunikation:
    image: ghcr.io/matthiasknauff/bauplattform/plattform:541f508
    container_name: bauplattform_kommunikation
    restart: unless-stopped
    depends_on:
      portal: { condition: service_started }
      dienste: { condition: service_healthy }
    ports:
      - "${KOMMUNIKATION_PUBLISH:-8098}:8098"
    environment:
      <<: *env
      APP_MODULE: kommunikation
      APP_PORT: "8098"
      APP_TIMEOUT: "120"

  # Zeiten: Arbeitszeit (Kommen/Gehen, Pausen, Urlaub) und Projektzeiten je Leistungsphase – Vorschläge aus der Arbeit in der Plattform
  zeiten:
    image: ghcr.io/matthiasknauff/bauplattform/plattform:541f508
    container_name: bauplattform_zeiten
    restart: unless-stopped
    depends_on:
      portal: { condition: service_started }
      dienste: { condition: service_healthy }
    ports:
      - "${ZEITEN_PUBLISH:-8101}:8101"
    environment:
      <<: *env
      APP_MODULE: zeiten
      APP_PORT: "8101"
      APP_TIMEOUT: "120"

  # Bauantrag: Antrag aus Projektdaten, Adressen, Baukosten – Bauvorlagen-Checkliste, PDF
  bauantrag:
    image: ghcr.io/matthiasknauff/bauplattform/plattform:541f508
    container_name: bauplattform_bauantrag
    restart: unless-stopped
    depends_on:
      portal: { condition: service_started }
      dienste: { condition: service_healthy }
    ports:
      - "${BAUANTRAG_PUBLISH:-8104}:8104"
    environment:
      <<: *env
      APP_MODULE: bauantrag
      APP_PORT: "8104"

  # Wärmeschutz: Bauteilnachweis je Projekt – U-Wert (DIN EN ISO 6946), Tauwasser (DIN 4108-3), Höchstwerte nach GModG Anlage 7
  waermeschutz:
    image: ghcr.io/matthiasknauff/bauplattform/plattform:541f508
    container_name: bauplattform_waermeschutz
    restart: unless-stopped
    depends_on:
      portal: { condition: service_started }
      dienste: { condition: service_healthy }
    ports:
      - "${WAERMESCHUTZ_PUBLISH:-8105}:8105"
    environment:
      <<: *env
      APP_MODULE: waermeschutz
      APP_PORT: "8105"

  # Honorar (nur Verwaltung): Honoraraufträge nach HOAI, nach Aufwand oder pauschal – Abgleich mit der Zeiterfassung, Honorarangebot als PDF
  honorar:
    image: ghcr.io/matthiasknauff/bauplattform/plattform:541f508
    container_name: bauplattform_honorar
    restart: unless-stopped
    depends_on:
      portal: { condition: service_started }
      dienste: { condition: service_healthy }
    ports:
      - "${HONORAR_PUBLISH:-8103}:8103"
    environment:
      <<: *env
      APP_MODULE: honorar
      APP_PORT: "8103"

  # Baudaten: Positionsdatenbank (Texte, DIN 276, Preise), importierte Kataloge (z. B. Sirados) und eigene Preise
  baudaten:
    image: ghcr.io/matthiasknauff/bauplattform/plattform:541f508
    container_name: bauplattform_baudaten
    restart: unless-stopped
    depends_on:
      portal: { condition: service_started }
      dienste: { condition: service_healthy }
    ports:
      - "${BAUDATEN_PUBLISH:-8099}:8099"
    environment:
      <<: *env
      APP_MODULE: baudaten
      APP_PORT: "8099"
      APP_TIMEOUT: "600"

  # ORCA-Import: ORCA-AVA-Projekte (Projektsicherung *.zip / *.ava) in die AVA übernehmen – nur für Administratoren,
  # eigener Port (http://<Server>:8100). Ein Arbeitsprozess, weil die Vorschau im Speicher gehalten wird.
  orca:
    image: ghcr.io/matthiasknauff/bauplattform/plattform:541f508
    container_name: bauplattform_orca
    restart: unless-stopped
    depends_on:
      portal: { condition: service_started }
      dienste: { condition: service_healthy }
    ports:
      - "${ORCA_PUBLISH:-8100}:8100"
    environment:
      <<: *env
      APP_MODULE: orca_import
      APP_PORT: "8100"
      APP_TIMEOUT: "900"

  # Eigene KI im Büro (Ollama) – nur im Docker-Netz erreichbar, kein Port nach außen.
  # Braucht für das Standardmodell qwen2.5:3b etwa 3 GB, für das Bildmodell qwen3-vl:4b (Pläne lesen) weitere ~4 GB freien Arbeitsspeicher;
  # ohne Grafikkarte antwortet es langsamer (ein Plan: einige Minuten).
  ollama:
    image: ollama/ollama:latest
    container_name: bauplattform_ollama
    profiles: ["ki"]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m          # Modell 30 Minuten im Speicher halten
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama_data:/root/.ollama     # heruntergeladene Modelle
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # lädt einmal beim Start die Modelle (OLLAMA_MODEL, OLLAMA_VISION_MODEL) herunter und beendet sich dann – vorhandene Modelle werden nur geprüft
  ollama_modell:
    image: ollama/ollama:latest
    container_name: bauplattform_ollama_modell
    profiles: ["ki"]
    restart: "no"
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull \"${OLLAMA_MODEL:-qwen2.5:3b}\" && echo \"Modell ${OLLAMA_MODEL:-qwen2.5:3b} bereit\"; V=\"${OLLAMA_VISION_MODEL-qwen3-vl:4b}\"; [ -z \"$$V\" ] || ollama pull \"$$V\" && echo \"Bildmodell $$V bereit\""]

volumes:   # eigene Volumes des Testservers – werden beim ersten Start leer angelegt
  bautagebuch_data:
    name: ${DATA_VOLUME:-bauplattform_test_data}
  bautagebuch_pgdata:
    name: ${DB_VOLUME:-bauplattform_test_pgdata}
  gantt_legacy:
    name: ${GANTT_LEGACY_VOLUME:-bauplattform_test_gantt_alt}
  ollama_data:
    name: bauplattform_test_ollama      # Modelle der eigenen KI
