# =============================================================================
# Bauplattform – TESTSERVER (bekommt jeden Stand von main automatisch)
#
# Die Images baut GitHub Actions. Die Versionsnummer hinter dem Doppelpunkt trägt der
# Workflow nach jedem Build selbst ein; Portainer bemerkt die Änderung (Polling) und
# spielt die neue Version ein.
#
# Einstellungen kommen aus den Umgebungsvariablen des Stacks in Portainer
# (mindestens DB_PASSWORD, siehe README → „Testserver mit Portainer“).
# Für die Installation per Skript (update.sh) gilt die docker-compose.yml im Hauptordner.
# =============================================================================
name: bauplattform

x-env: &env
  TZ: ${TZ:-Europe/Berlin}
  DATABASE_URL: "postgresql://bautagebuch@bautagebuch_db:5432/bautagebuch"
  PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt – in Portainer unter Environment variables eintragen}
  TRUST_PROXY: ${TRUST_PROXY:-0}
  COOKIE_SECURE: ${COOKIE_SECURE:-0}
  SSO_COOKIE_DOMAIN: ${SSO_COOKIE_DOMAIN:-}
  BAUTAGEBUCH_PORT: ${BAUTAGEBUCH_PORT:-8080}
  GANTT_PORT: ${GANTT_PORT:-8082}
  PORTAL_PORT: ${PORTAL_PORT:-8090}
  ADMIN_PORT: ${ADMIN_PORT:-8091}
  BAUTAGEBUCH_URL: ${BAUTAGEBUCH_URL:-}
  GANTT_URL: ${GANTT_URL:-}
  PORTAL_URL: ${PORTAL_URL:-}
  ADMIN_URL: ${ADMIN_URL:-}
  BAUTAGEBUCH_INTERNAL: http://bautagebuch:8000
  GANTT_INTERNAL: http://gantt:8082
  PORTAL_INTERNAL: http://portal:8090

services:
  bautagebuch_db:
    image: postgres:15
    container_name: Bautagebuch_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bautagebuch
      POSTGRES_DB: bautagebuch
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - bautagebuch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bautagebuch -d bautagebuch"]
      interval: 5s
      timeout: 3s
      retries: 30

  bautagebuch:
    image: ghcr.io/matthiasknauff/bauplattform/bautagebuch:26da4d7
    container_name: bautagebuch
    restart: unless-stopped
    depends_on:
      bautagebuch_db: { condition: service_healthy }
    ports:
      - "${BAUTAGEBUCH_PUBLISH:-8080}:8000"
    environment:
      <<: *env
      SECRET_KEY: ${SECRET_KEY:-}
    volumes:
      - bautagebuch_data:/data

  gantt:
    image: ghcr.io/matthiasknauff/bauplattform/gantt:26da4d7
    container_name: bauzeitenplan
    restart: unless-stopped
    depends_on:
      bautagebuch: { condition: service_healthy }
    ports:
      - "${GANTT_PUBLISH:-8082}:8082"
    environment:
      <<: *env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - gantt_legacy:/legacy:ro

  portal:
    image: ghcr.io/matthiasknauff/bauplattform/plattform:26da4d7
    container_name: bauplattform_portal
    restart: unless-stopped
    depends_on:
      bautagebuch: { condition: service_healthy }
    ports:
      - "${PORTAL_PUBLISH:-8090}:8090"
    environment:
      <<: *env
      APP_MODULE: portal
      APP_PORT: "8090"

  admin:
    image: ghcr.io/matthiasknauff/bauplattform/plattform:26da4d7
    container_name: bauplattform_admin
    restart: unless-stopped
    depends_on:
      portal: { condition: service_started }
      bautagebuch: { condition: service_healthy }
    ports:
      - "${ADMIN_PUBLISH:-8091}:8091"
    environment:
      <<: *env
      APP_MODULE: admin
      APP_PORT: "8091"

volumes:
  bautagebuch_data:
    name: bautagebuch_data
    external: true
  bautagebuch_pgdata:
    name: bautagebuch_pgdata
    external: true
  gantt_legacy:
    name: ${GANTT_LEGACY_VOLUME:-gantt-app_gantt-data}
    external: true
