name: Build & Publish

# Push auf main -> das Image bauen, Stand in server/test.yml eintragen (Testserver)
# Release v…    -> Image bauen, Version in server/docker-compose.yml eintragen (Produktiv)
#                  (auf GitHub: Releases → Draft a new release → Tag v… → Publish release)
#                  Portainer (Polling) erkennt die Änderung und spielt sie ein.
on:
  release:
    types: [published]
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'server/**'
      - '**.md'
      - 'tools/chronik/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/matthiasknauff/bauplattform

jobs:
  build:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}   # eigener Runner auf Docker 1: Variable RUNNER = bauportal (server/runner.yml)
    strategy:
      fail-fast: true
      matrix:
        app: [plattform]   # EIN Image für alle Apps (Dockerfile im Hauptordner; welche App ein Container ist, sagt APP – siehe apps.py / start.py)
    steps:
      - uses: actions/checkout@v4

      # Ordnungsprüfung: Regeln für den ganzen Code (keine heiklen Dateien, keine Systemdialoge, keine Kopien von Baukasten-Funktionen …)
      - name: Ordnungsprüfung
        run: python3 tools/tests/ordnung.py

      # Versionsanzeige (Verwaltung, Fußzeilen): bei einer Freigabe immer der Tag, sonst die Nummer, die die nächste Freigabe
      # bekommt, mit „-test“: „2026.11.192-test (abc1234)“ – auf Docker 1 steht so dieselbe Nummer, die man dann freigibt
      - name: Version setzen
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then echo "${GITHUB_REF_NAME#v}" > VERSION
          else
            git fetch --tags --quiet origin || true
            LETZTE=$(git tag -l 'v*' --sort=-v:refname | head -1); LETZTE=${LETZTE#v}
            if [ -n "$LETZTE" ]; then NAECHSTE="${LETZTE%.*}.$(( ${LETZTE##*.} + 1 ))"; else NAECHSTE=$(tr -d '[:space:]' < VERSION); fi
            echo "${NAECHSTE}-test (${GITHUB_SHA::7}, $(TZ=Europe/Berlin date '+%d.%m.%Y %H:%M'))" > VERSION
          fi
          cat VERSION

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags bestimmen
        id: meta
        run: |
          IMAGE="${REGISTRY}/${{ matrix.app }}"
          SHORT="${GITHUB_SHA::7}"
          # Freigabe: nur v… und stable – NICHT die Kurzkennung, sonst überschreibt das Freigabe-Image (Version ohne „-test“)
          # das Test-Image desselben Commits, und der Testserver verliert Wasserzeichen und Schutzanzeige
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGS="${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:stable"
          else
            TAGS="${IMAGE}:${SHORT},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          pull: true   # immer das neueste Basis-Image (Sicherheitskorrekturen)

  # Rauchtest: die eben gebauten Images mit frischer Datenbank und Testdaten starten, anmelden, jede App aufrufen.
  # Schlägt er fehl, wird KEINE Version eingetragen – Test- bzw. Produktivserver laufen mit dem alten Stand weiter.
  rauchtest:
    needs: build
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}   # eigener Runner auf Docker 1: Variable RUNNER = bauportal (server/runner.yml)
    timeout-minutes: 20
    env:
      DB_PASSWORD: rauchtest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose-Datei für den Test vorbereiten
        run: |
          # genau die Datei, die der Server bekommt: bei Freigabe die Produktiv-Fassung, sonst die des Testservers
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            SRC=server/docker-compose.yml; [ -f server/produktiv-naechste.yml ] && SRC=server/produktiv-naechste.yml
          else
            SRC=server/test.yml
          fi
          echo "Vorlage: $SRC"
          cp "$SRC" rauchtest.yml
          BILD="${GITHUB_SHA::7}"; [ "${GITHUB_REF_TYPE}" = "tag" ] && BILD="${GITHUB_REF_NAME}"   # das gerade gebaute Image
          sed -i -E "s#(image: ${REGISTRY}/(bautagebuch|gantt|plattform)):[A-Za-z0-9._-]+#\1:${BILD}#" rauchtest.yml
          sed -i '/^\s*external: true/d' rauchtest.yml     # frische, leere Volumes statt der vorhandenen Serverdaten
          grep -n "image: ${REGISTRY}" rauchtest.yml
          # Ollama (eigene KI) braucht mehrere GB Modelle – im Rauchtest nicht nötig
          docker compose -p rauchtest -f rauchtest.yml config --services | grep -v '^ollama' | tr '\n' ' ' > dienste.txt
          echo "Dienste: $(cat dienste.txt)"

      - name: Plattform starten
        run: docker compose -p rauchtest -f rauchtest.yml up -d --wait --wait-timeout 300 $(cat dienste.txt)

      - name: Testdaten anlegen
        run: docker compose -p rauchtest -f rauchtest.yml exec -T bautagebuch python tools/testdaten.py

      - name: Rauchtest
        run: python3 tools/rauchtest.py http://localhost:${PORTAL_PUBLISH:-8090}

      # Rechentests im Container der jeweiligen App (echter Programmcode), siehe tools/tests/einheit/run.py
      - name: Rechentests
        if: success() || failure()
        run: |
          rc=0
          for paar in plattform:ava gantt:gantt bautagebuch:bautagebuch; do
            art=${paar%%:*}; dienst=${paar#*:}
            ls tools/tests/einheit/${art}_*.py >/dev/null 2>&1 || continue
            docker compose -p rauchtest -f rauchtest.yml run --rm -T --no-deps -v "$PWD/tools/tests:/tests:ro" \
              --entrypoint python "$dienst" /tests/einheit/run.py "$art" || rc=1
          done
          if ls tools/tests/js/*.test.mjs >/dev/null 2>&1; then node --test tools/tests/js/*.test.mjs || rc=1; fi
          exit $rc

      # Ablauftests über die normalen Schnittstellen (anlegen, ändern, rechnen, drucken, Rechte), siehe tools/tests/run.py
      - name: Ablauftests
        if: success() || failure()
        env:
          RT_ARTEFAKTE: ${{ runner.temp }}/artefakte
        run: python3 tools/tests/run.py http://localhost:${PORTAL_PUBLISH:-8090}

      # erzeugte Ausdrucke (z. B. Bauzeitenplan-PDF) zum Ansehen am Lauf ablegen
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: ausdrucke
          path: ${{ runner.temp }}/artefakte
          if-no-files-found: ignore
          retention-days: 7

      # Oberflächentests: jede App im echten Browser (PC und Handy) laden – ohne JavaScript-Fehler, ohne fehlende Dateien, siehe tools/tests/ui/oberflaeche.mjs
      # Ein Fehler hier hält den Stand auf (seit 10.11.2026; davor Einführungsphase mit Warnung): er kommt nicht auf den Testserver.
      - name: Oberflächentests
        if: success() || failure()
        env:
          RT_ARTEFAKTE: ${{ runner.temp }}/artefakte
        run: |
          mkdir -p "$RUNNER_TEMP/ui" && cd "$RUNNER_TEMP/ui" && npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.63.0 >/dev/null
          # Systempakete von Ubuntu sind manchmal nicht erreichbar – dann ohne sie (das Runner-Image hat das Nötige meist schon)
          npx playwright install --with-deps chromium >/dev/null 2>&1 || { echo "::warning::Systempakete für Chromium nicht ladbar – versuche es ohne"; npx playwright install chromium >/dev/null; }
          NODE_PATH="$RUNNER_TEMP/ui/node_modules" node "$GITHUB_WORKSPACE/tools/tests/ui/oberflaeche.mjs" http://localhost:${PORTAL_PUBLISH:-8090} || { echo "::error::Oberflächentests melden Fehler (siehe Schritt „Oberflächentests“)."; exit 1; }

      # Lasttest: 8 gleichzeitige Nutzer (Doppelte der Büro-Spitze) arbeiten 60 s, danach alle gleichzeitig Foto + PDF, siehe tools/lasttest.py
      - name: Lasttest
        run: python3 tools/lasttest.py http://localhost:${PORTAL_PUBLISH:-8090} 8 60

      - name: Fehlermeldungen in den Protokollen
        if: always()
        run: |
          docker compose -p rauchtest -f rauchtest.yml ps -a
          if docker compose -p rauchtest -f rauchtest.yml logs --no-color 2>&1 | grep -n -B2 -A12 "Traceback"; then
            echo "::warning::In den Protokollen stehen Python-Fehlermeldungen (siehe oben)."
          fi

      - name: Protokolle bei Fehler
        if: failure()
        run: docker compose -p rauchtest -f rauchtest.yml logs --no-color --tail 150

  # Push auf main  -> server/test.yml (Testserver) bekommt den neuen Stand
  # Tag v…         -> server/docker-compose.yml (Produktiv, Docker 2) bekommt die freigegebene Version
  version-eintragen:
    needs: [build, rauchtest]
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}   # eigener Runner auf Docker 1: Variable RUNNER = bauportal (server/runner.yml)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # für den Vergleich Testserver ↔ Freigabe (welcher Stand ist älter)
      - name: Version eintragen
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            FILE=server/docker-compose.yml; TAG="${GITHUB_REF_NAME}"; MSG="Produktiv: Bauplattform ${TAG} freigegeben"
            # neue Dienste (z. B. Baukosten, Ollama) kommen erst mit der Freigabe auf den Produktivserver
            if [ -f server/produktiv-naechste.yml ]; then
              git mv -f server/produktiv-naechste.yml "$FILE"
              sed -i '/^# NÄCHSTE PRODUKTIV-FASSUNG/,/^# Neu: /d' "$FILE"
              sed -i '1{/^# =\+$/d}' "$FILE"
            fi
          else
            FILE=server/test.yml; TAG="${GITHUB_SHA::7}"; MSG="Testserver: Bauplattform auf ${TAG}"
          fi
          sed -i -E "s#(image: ${REGISTRY}/(bautagebuch|gantt|plattform)):[A-Za-z0-9._-]+#\1:${TAG}#" "$FILE"
          grep -n "image: ${REGISTRY}" "$FILE"
          # Freigabe eines Stands, der neuer ist als der Testserver (z. B. weil der letzte Lauf rot war oder abgebrochen wurde):
          # der Testserver bekommt dann dasselbe Test-Image (Kurzkennung, mit Wasserzeichen) – nie älter als die Produktion
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            T=$(grep -oE "image: ${REGISTRY}/plattform:[A-Za-z0-9._-]+" server/test.yml | head -1 | sed 's#.*:##')
            if [ -n "$T" ] && git cat-file -e "${T}^{commit}" 2>/dev/null && [ "$(git rev-parse "$T")" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$T" "$GITHUB_SHA"; then
              sed -i -E "s#(image: ${REGISTRY}/(bautagebuch|gantt|plattform)):[A-Za-z0-9._-]+#\1:${GITHUB_SHA::7}#" server/test.yml
              echo "Testserver war älter (${T}) – jetzt ${GITHUB_SHA::7}"
            fi
          fi
          if git diff --quiet && git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "$MSG"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 3; done
