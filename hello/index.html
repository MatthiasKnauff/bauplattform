<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bauplattform – Test</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; color: #1d2433;
           display: grid; place-items: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; border-radius: 12px; padding: 32px 40px;
            box-shadow: 0 2px 12px rgba(0,0,0,.08); max-width: 420px; }
    h1 { margin: 0 0 8px; font-size: 1.4rem; }
    p { margin: 4px 0; color: #4a5468; }
    code { background: #eef0f4; padding: 2px 6px; border-radius: 4px; }
    .ok { color: #1a7f37; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Bauplattform – Testcontainer</h1>
    <p class="ok">✔ Läuft auf deinem Docker-Server</p>
    <p>Version: <code>__VERSION__</code></p>
    <p>Gebaut: <code>__BUILD_TIME__</code></p>
    <p>Automatisch gebaut von GitHub Actions.</p>
  </div>
</body>
</html>
