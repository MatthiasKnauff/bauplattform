<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#84827c">
<title>Bauplattform</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="static/bp.css">
<style>
.hello{margin:.4rem 0 1.4rem}
.hello h1{margin:0}
.hello p{margin:.3rem 0 0;color:var(--mute)}
.pj{margin:0 0 1.6rem;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.pj .pick{min-width:min(420px,100%)}
.pj .pm-x a,.pickm .pm-x a{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:.2rem .6rem;color:var(--ink);text-decoration:none;white-space:nowrap}
.pickm .pm-x a:hover{border-color:var(--y);color:var(--y)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem}
.tile{display:flex;flex-direction:column;gap:.55rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1.2rem 1.2rem 1.1rem;color:var(--ink);text-decoration:none;transition:border-color .15s,transform .15s;min-height:168px}
.tile:hover,.tile:focus-visible{border-color:var(--y);transform:translateY(-2px)}
.tile .ic{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:var(--hov);color:var(--y)}
.tile b{font-size:1.15rem}
.tile span{color:var(--mute);font-size:.92rem}
.tile .go{margin-top:auto;color:var(--y);font-weight:600;font-size:.92rem}
.tile.off{opacity:.45;pointer-events:none}
.th{display:flex;gap:.35rem;flex-wrap:wrap}
.th label{border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;cursor:pointer;color:var(--mute);background:transparent}
.th label:hover{color:var(--ink)}
.th label.on{border-color:var(--y);color:var(--ink)}
.th input{position:absolute;opacity:0;pointer-events:none}
.sw{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.sw button,.sw label{width:20px;height:20px;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:0 0 0 1px var(--line);position:relative;overflow:hidden;cursor:pointer}
.sw .on{border-color:var(--ink)}
.sw label{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.foot{margin-top:2.4rem;color:var(--mute);font-size:.82rem;display:flex;gap:1rem;flex-wrap:wrap}
</style>
</head>
<body>
<main class="wrap">
  <div class="hello"><h1 id="hi">Willkommen</h1><p>Wähle eine App – du bist in allen Apps angemeldet.</p></div>
  <div class="pj"><button type="button" id="pjBtn" title="Projekt suchen und in einer App öffnen"></button></div>
  <div class="tiles" id="tiles"></div>
  <div class="foot"><span id="ver"></span></div>
</main>
<script src="static/bp.js"></script>
<script>
const DESC = {
  bautagebuch: ['Bautagebuch', 'Tagesberichte, Wetter, Anwesende, Fotos, Mängel und Weisungen – mit PDF.'],
  gantt: ['Bauzeitenplan', 'Terminplanung mit Gewerken, Firmen, kritischem Weg und Versionen.'],
  adressen: ['Adressen', 'Firmen, Bauherren und Baustellen – dieselben Kontakte wie im Bautagebuch und Bauzeitenplan.'],
  aufgaben: ['Mängel & Erinnerungen', 'Mängel aus allen Bautagesberichten verfolgen, Erinnerungen an Termine und Firmen aus den Bauzeitenplänen.'],
  plaene: ['Planstand & Versand', 'Pläne im Projektordner mit dem neuesten Index, Gewerk erkennen, Pläne mit CAD-Dateien an die Firmen schicken, Planversandliste.'],
  baukosten: ['Baukosten', 'Kosten nach DIN 276 aus Plänen (PDF) und Bauzeitenplan – mit Mittelabfluss und KI-Prüfung.'],
  admin: ['Verwaltung', 'Benutzer und Rechte, angemeldete Sitzungen, Zustand der Dienste.'],
};
/* ---------- Projekt direkt öffnen: Suche über alle Apps, zuletzt geöffnete zuerst ---------- */
let PJ = [], CONF = null;
const RECENT_KEY = 'bp.recent';
const recent = () => { try { return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch { return []; } };
const remember = (k) => { try { localStorage.setItem(RECENT_KEY, JSON.stringify([k, ...recent().filter((x) => x !== k)].slice(0, 6))); } catch { /* egal */ } };
function pjLinks(p) {
  const app = (k) => (CONF.apps || []).find((a) => a.key === k && a.allowed), L = [];
  if (p.bt && app('bautagebuch')) L.push(['Bautagebuch', appUrl(app('bautagebuch')) + '/#projekt=' + p.bt]);
  if (app('gantt')) p.plans.forEach((x) => L.push([p.plans.length > 1 ? 'Bauzeitenplan: ' + x.name : 'Bauzeitenplan', appUrl(app('gantt')) + '/#plan=' + encodeURIComponent(x.id)]));
  if (app('baukosten')) p.bks.filter((x) => !x.archived).forEach((x) => L.push([p.bks.length > 1 ? 'Baukosten: ' + (x.name.replace(p.name, '').replace(/^\s*[–-]\s*/, '') || x.name) : 'Baukosten', appUrl(app('baukosten')) + '/#bk=' + x.id]));
  return L;
}
function pjBtn() {
  const R = recent().map((k) => PJ.find((p) => p.key === k)).filter(Boolean);
  pickButton($('#pjBtn'), { title: 'Projekt öffnen …', sub: R.length ? 'Zuletzt: ' + R[0].name : `${PJ.filter((p) => !p.archived).length} Projekte – Bautagebuch, Bauzeitenplan, Baukosten` });
}
$('#pjBtn').addEventListener('click', () => {
  const R = recent(), item = (p, group) => { const L = pjLinks(p);
    return { group, title: p.name, sub: [p.client, p.address].filter(Boolean).join(' · '), value: p.key, p,
      extra: L.map(([n, u]) => `<a href="${esc(u)}" data-pk="${esc(p.key)}">${esc(n.replace(/^(Bauzeitenplan|Baukosten): .*/, '$1'))}</a>`).join('') }; };
  const rec = R.map((k) => PJ.find((p) => p.key === k)).filter(Boolean);
  pickMenu($('#pjBtn'), {
    search: 'Projekt suchen: Nummer, Name, Bauherr oder Ort …', empty: 'Kein Projekt gefunden.',
    items: [...rec.map((p) => item(p, 'Zuletzt geöffnet')), ...PJ.filter((p) => !p.archived && !R.includes(p.key)).map((p) => item(p, 'Projekte')), ...PJ.filter((p) => p.archived && !R.includes(p.key)).map((p) => item(p, 'Archiv'))],
    onPick: (k, x) => { const L = pjLinks(x.p); remember(k); if (L[0]) location.href = L[0][1]; else toast('Dieses Projekt gibt es in keiner deiner Apps.', true); },
  });
});
document.addEventListener('click', (e) => { const a = e.target.closest('.pickm a[data-pk]'); if (a) remember(a.dataset.pk); }, true);
(async () => {
  const me = await api('api/me'); if (!me.ok) { location.href = '/login'; return; }
  applyLook(me);
  const conf = await api('api/platform');
  await header('Startseite', me, conf);
  const h = new Date().getHours();
  $('#hi').textContent = `${h < 11 ? 'Guten Morgen' : h < 18 ? 'Hallo' : 'Guten Abend'}, ${me.vorname || me.name}`;
  CONF = conf; pjBtn(); api('api/projekte').then((r) => { PJ = r; pjBtn(); }).catch(() => { $('.pj').hidden = true; });
  $('#tiles').innerHTML = conf.apps.filter(a => DESC[a.key] && (a.allowed || a.key !== 'admin')).map(a => `
    <a class="tile ${a.allowed ? '' : 'off'}" href="${esc(appUrl(a))}/"${a.allowed ? '' : ' aria-disabled="true" tabindex="-1"'}>
      <span class="ic">${ICONS[a.key]}</span><b>${esc(DESC[a.key][0])}</b><span>${esc(a.allowed ? DESC[a.key][1] : 'Für dein Konto nicht freigeschaltet.')}</span>
      ${a.allowed ? '<span class="go">Öffnen →</span>' : ''}</a>`).join('');
  $('#ver').textContent = 'Version ' + conf.version;
  if (/^#(darstellung|look)$/.test(location.hash) && window.BPHead && BPHead.look) BPHead.ready.then(() => BPHead.look());   // alte Lesezeichen
})().catch(e => toast(e.message, true));
</script>
</body>
</html>
