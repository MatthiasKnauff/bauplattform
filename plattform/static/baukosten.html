<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1a">
<title>Baukosten</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="bp/bp.css">
<link rel="stylesheet" href="static/baukosten.css">
</head>
<body>
<div class="beta-wz" aria-hidden="true"><span>Betaversion</span></div>
<main class="wrap">
  <div class="top" hidden>   <!-- wandern in die Versionsleiste unter der Kopfleiste -->
    <button class="btn sm pri" id="pdfBtn" title="Kostenermittlung für den Bauherrn drucken oder als PDF – die Stufe nach DIN 276 wählst du dort">🖨 Drucken / PDF …</button>
    <button class="btn sm" id="ansBtn" title="Kostenansätze (Kennwerte, Prozente, Pauschalen, Bauteile mit Einheitspreisen) aus der Kostenermittlung eines anderen Projekts übernehmen">↪ Aus anderem Projekt übernehmen …</button>
    <button class="btn sm" id="verlBtn" title="Frühere Stände dieser Kostenermittlung ansehen, vergleichen und wiederherstellen">🕘 Verlauf</button>
    <span class="save" id="save" role="status"></span>
  </div>
  <nav class="tabs" id="tabs" aria-label="Bereiche"></nav>
  <div id="view"></div>
</main>
<input type="file" id="pdfIn" accept="application/pdf,.pdf,.ifc,.dxf" multiple class="hidden">
<script src="bp/baukasten.js"></script>
<script src="static/pdbwahl.js"></script>
<script src="static/baukosten-kern.js"></script>
<script src="static/baukosten-bauteile.js"></script>
<script src="static/baukosten-start.js"></script>
</body>
</html>
