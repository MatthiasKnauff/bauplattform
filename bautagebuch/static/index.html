<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#84827c">
<title>Bautagebuch</title>
<link rel="icon" type="image/png" href="api/favicon">
<link rel="apple-touch-icon" href="api/favicon?s=180">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bar:#84827c;--bg:#26282b;--card:#252729;--line:#3b3e42;--ink:#f3f3f1;--mute:#9a9c9e;--y:#ff5fb3;--on:#111;--red:#ff7a6b;--inp:#1d1f21;--pan:#2b2d30;--hov:#2a2d30;color-scheme:dark}
/* helles Schema – eingestellt auf der Startseite der Bauplattform (Darstellung), gilt für alle Apps */
html[data-theme="hell"]{--bg:#f3f2ef;--card:#ffffff;--line:#d9d8d3;--ink:#232427;--mute:#686a6d;--red:#c8372a;--inp:#ffffff;--pan:#ffffff;--hov:#ecebe7;color-scheme:light}
html[data-theme="hell"] #tabs{background:#e7e5e0}
html[data-theme="hell"] .menu{background:#ffffff}
html[data-theme="hell"] .tab.on{color:var(--ink)}
html[data-theme="hell"] .swb.on{border-color:var(--ink)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
html,body{position:fixed;inset:0;width:100%;overflow:hidden}   /* die Seite selbst scrollt nie; gescrollt wird nur im Inhaltsbereich (#detail) – sonst rutscht am iPhone die ganze App weg */
body{background:var(--bg);color:var(--ink);font:16px/1.4 Ubuntu,"Segoe UI",system-ui,-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;color:var(--y);padding:.45rem;border-radius:6px;display:inline-flex;align-items:center;justify-content:center}
input,select,textarea{background:var(--inp);border:1px solid var(--line);border-radius:6px;padding:.45rem .6rem;min-width:0}
textarea{width:100%;min-height:90px;resize:vertical}
input[type=checkbox]{width:1.15rem;height:1.15rem;accent-color:var(--y);padding:0}
@media (pointer:coarse){input,select,textarea{font-size:16px!important}}   /* unter 16 px zoomt Safari am iPhone beim Antippen hinein und zoomt nicht zurück */
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--y);outline-offset:1px}
.hidden{display:none!important}
svg{display:block}
.bd{border:1px solid var(--y);padding:.6rem 1rem;color:var(--y);font-weight:700;border-radius:8px}
.empty{color:var(--mute);padding:1.5rem 1rem;text-align:left}

#login{max-width:340px;margin:18vh auto;padding:0 1.25rem}
#login h1{margin:0 0 1rem;font-size:2rem}
#login input{width:100%;margin-bottom:.6rem;padding:.7rem}
#login p{color:var(--mute);margin:0 0 .8rem}
#login .lnks{margin-top:.9rem;text-align:center}
.lnk{color:var(--y)}
#err{color:#ff8a80;min-height:1.2rem;margin-bottom:.6rem}
.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.chip{padding:.25rem .6rem;border:1px solid var(--y);border-radius:999px;color:var(--y);background:transparent}
.chk{display:flex;align-items:center;gap:.5rem}
.chk input{width:auto}
label.chk{display:flex;flex-direction:row;align-items:flex-start;gap:.6rem;text-align:left}
label.chk input{flex:none;margin:.15rem 0 0}
.sugh{padding:.7rem .9rem .3rem;color:var(--mute);font-size:.8rem}
.who{padding:.4rem .8rem;color:#aaa;font-size:.85rem}
.stabs{display:flex;flex-wrap:wrap;gap:.4rem;max-width:640px;margin:0 auto;padding:.4rem 1rem 0}
.stabs button{border:1px solid var(--line);border-radius:999px;padding:.35rem .9rem;color:var(--mute);font-weight:600}
.stabs button.on{background:var(--y);border-color:var(--y);color:var(--on)}
.cform h4{grid-column:1/-1;margin:.8rem 0 0;font-size:1.05rem}
.usr{border:1px solid var(--line);border-radius:10px;margin:.5rem 0;overflow:hidden}
.uhead{width:100%;display:flex;align-items:center;gap:.6rem;padding:.65rem .8rem;color:var(--ink);text-align:left;border-radius:0;justify-content:flex-start}
.uhead:disabled{opacity:1;cursor:default}
.uhead .l{flex:1;min-width:0;display:flex;flex-direction:column}
.uhead small{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{border:1px solid var(--y);color:var(--y);border-radius:999px;padding:.05rem .55rem;font-size:.75rem;white-space:nowrap}
.usr.open .uchev{transform:rotate(180deg)}
.ubody{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;padding:.2rem .8rem .8rem;border-top:1px solid var(--line)}
.ubody .w,.ubody .acts{grid-column:1/-1}
.usr:not(.open) .ubody{display:none}
.usr.open .ubody{display:grid}
@media(max-width:720px){.ubody{grid-template-columns:1fr}}
#login .go{background:var(--y);color:var(--on);width:100%;padding:.7rem;font-weight:700}
#err{color:var(--red);min-height:1.3em}

/* Rahmen: Kopfleiste, Tabs, Inhalt */
#app{display:flex;flex-direction:column;height:100%}
#hdr{background:var(--bar);display:flex;align-items:center;gap:.2rem;padding:.4rem .6rem;flex:none;position:relative;min-height:58px}
#projBtn,#repBtn{justify-content:flex-start;gap:.6rem;color:#fff;text-align:left;padding:.35rem .7rem;background:rgba(0,0,0,.16);border-radius:10px}
#projBtn{flex:1;min-width:0;max-width:560px}
#repBtn{flex:none;margin-right:auto;min-width:110px;max-width:200px}
#repBtn.hidden{display:none}
#projBtn .t,#repBtn .t{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.2}
#projBtn b,#repBtn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.02rem}
#projBtn small,#repBtn small{color:#ecebe7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.78rem}
#tabs{display:flex;background:#303236;border-bottom:1px solid var(--line);flex:none;gap:.2rem;padding:0 .6rem}
.tab{color:var(--mute);padding:.7rem 1rem;border-radius:0;gap:.5rem;border-bottom:3px solid transparent;font-weight:600}
.tab.on{color:#fff;border-bottom-color:var(--y)}
#detail{flex:1;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:.8rem;min-height:0}
#detail.fill{display:flex;flex-direction:column;overflow:hidden}
.wrap{max-width:900px;margin:0 auto}
.menu{position:absolute;right:.5rem;top:54px;z-index:25;background:#34363a;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-width:210px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.menu button{color:var(--ink);justify-content:flex-start;padding:.7rem 1rem;border-radius:0;gap:.7rem}
.menu a.mapp{color:var(--ink);display:flex;align-items:center;padding:.7rem 1rem;gap:.7rem;text-decoration:none}
.menu a.mapp:hover,.menu a.mapp:focus-visible{background:rgba(255,255,255,.06)}
.menu a.mapp svg{color:var(--y)}
.menu .msep{border-top:1px solid var(--line);margin:.2rem 0}

/* Projektauswahl */
#sheet{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:flex-start}
#sheet .panel{background:var(--pan);border:1px solid var(--line);border-radius:0 0 14px 14px;width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column}
#sheet .ph{display:flex;gap:.4rem;padding:.6rem;border-bottom:1px solid var(--line)}
#sheet .ph input{flex:1}
#sheet .pl{overflow:auto;flex:1}
#sheet .pf{display:flex;gap:.5rem;padding:.6rem;border-top:1px solid var(--line);flex-wrap:wrap}
#sheet .pf .bd{flex:1;white-space:nowrap}
.pi{display:flex;width:100%;justify-content:space-between;gap:.6rem;text-align:left;color:var(--mute);border-radius:0;border-bottom:1px solid var(--line);padding:.8rem 1rem}
.cx{display:flex;flex-wrap:wrap;gap:.4rem;padding:.3rem .6rem .5rem;align-items:center}.cx select{flex:1 1 40%;min-width:0}.cx button{border:1px solid var(--line);border-radius:8px;padding:.35rem .6rem;color:var(--y);font-weight:700;font-size:.85rem}
.hgrid .checks input{flex:none}
.pconly{display:none}@media(hover:hover) and (pointer:fine) and (min-width:900px){.pconly{display:inline-flex}.pconly.hidden{display:none}}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:1rem;align-items:start}.hgrid>h3{grid-column:1;grid-row:1}.hgrid>.meta,.hgrid>.wgrid{grid-column:1;grid-row:2}.hgrid>.checks{grid-column:1;grid-row:3}.hgrid>*{min-width:0}
.hmap{grid-column:2;grid-row:1/4;display:block;line-height:0}.hmap img{width:280px;height:94px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;opacity:.95}
@media(max-width:640px){.hgrid>h3{grid-column:1/-1}.hmap{grid-row:2/4;margin-top:.3rem}.hmap img{width:96px;height:96px}}
.mapb{grid-column:1/-1;border:1px solid var(--line);border-radius:10px;overflow:hidden}.mapb iframe{display:block;width:100%;height:210px;border:0;background:#2a2c30}.mapb.sm iframe{height:150px}@media(max-width:640px){.mapb iframe{height:130px}.mapb.sm iframe{height:90px}.mapr{padding:.45rem .8rem;font-size:.85rem}}
.mapr{display:block;color:var(--y);text-decoration:none;padding:.6rem .9rem;font-weight:700;border-top:1px solid var(--line)}
.cform>*{min-width:0}.sugc .pi{overflow:hidden}.sugc{border:1px solid var(--line);border-radius:10px;overflow:hidden}.sugc .pi:last-child{border-bottom:0}
.rnb{margin:0 0 1rem;padding:.8rem 1rem;border:1px solid var(--y);border-radius:10px;font-size:.9rem;display:grid;gap:.6rem}.rnb .acts{display:flex;gap:.5rem;flex-wrap:wrap}.rnb .acts button{border:1px solid var(--line);border-radius:8px;padding:.45rem .8rem;color:var(--y);font-weight:700}.rnb .acts .pri{background:var(--y);color:var(--on);border-color:var(--y)}
.pi.arch{color:var(--mute);justify-content:flex-start;align-items:center;font-size:.9rem}.pi.old b{color:var(--mute)}
.pi.on{color:var(--ink);box-shadow:inset 3px 0 var(--y);background:var(--hov)}
.pi .l{min-width:0;display:flex;flex-direction:column}
.pi .l b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .l small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.8rem}
.pi .dist{color:var(--y);white-space:nowrap;font-size:.85rem;align-self:center}

/* Bericht-Karten */
#app{position:relative}
#fab{position:absolute;right:1rem;bottom:1.2rem;z-index:15;width:60px;height:60px;border-radius:50%;background:var(--y);color:var(--on);box-shadow:0 4px 16px rgba(0,0,0,.55);padding:0}
#detail .wrap{padding-bottom:5.5rem}
#qs{position:absolute;inset:0;z-index:25;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
#qs.typing .qadd textarea{min-height:4.5rem}#qs.typing{align-items:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 3.6rem)}#qs.typing .qp{border-radius:16px;max-height:55%}
#qs .qp{background:var(--pan);border:1px solid var(--line);border-radius:16px 16px 0 0;width:min(560px,100%);max-height:100%;overflow:auto;padding:.9rem 1rem 1.1rem;text-align:left}
#qs h4{margin:0 0 .7rem;font-size:1.15rem;display:flex;justify-content:space-between;align-items:center}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.qgrid button{border:1px solid var(--line);border-radius:12px;padding:.9rem .5rem;color:var(--ink);flex-direction:column;gap:.35rem;font-weight:600;min-height:78px}
.qgrid button svg{color:var(--y)}
.padd{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.padd>button{border:1px solid var(--line);border-radius:8px;padding:.45rem .7rem;color:var(--ink);gap:.4rem}
.apv{display:flex;gap:.4rem;flex-wrap:wrap;flex:1 1 100%}
.apv span{position:relative;display:inline-block}
.apv img{width:54px;height:54px;object-fit:cover;border-radius:6px;display:block}
.apv .rm{position:absolute;top:-4px;right:-4px;background:rgba(0,0,0,.8);color:#fff;border-radius:50%;width:20px;height:20px;padding:0;font-size:.7rem}
.apv .nf{display:inline-flex;width:54px;height:54px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;color:var(--mute)}
.qadd{display:flex;flex-wrap:wrap;gap:.5rem}
.qadd textarea{flex:1 1 100%;min-height:7rem}
.qadd [data-add-act]{flex:1 1 150px}.qadd [data-add-cnt]{flex:0 0 80px}
.qadd .qact{flex:1 1 100%;display:flex;gap:.5rem}
.qadd .qact .ok{flex:1;background:var(--y);color:var(--on);font-weight:700;padding:.8rem;border-radius:10px;font-size:1.05rem}
.qadd .qact .bd{padding:.8rem 1rem}
.qpick{display:flex;flex-direction:column;gap:.4rem;max-height:50vh;overflow:auto}
.qpick button{justify-content:flex-start;text-align:left;border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem;color:var(--ink)}
.qpick small{color:var(--mute);margin-right:.5rem}
.sec h3.tg{display:flex;align-items:center;gap:.5rem;cursor:pointer;-webkit-user-select:none;user-select:none}
.tg .cn{font-size:.85rem;font-weight:700;background:var(--y);color:var(--on);border-radius:999px;padding:.05rem .55rem;line-height:1.4}
.tg .cv{margin-left:auto;color:var(--mute);transition:transform .15s;transform:rotate(-90deg)}
.tg .cv.o{transform:rotate(0)}
.sec.col{min-height:0}.sec.col .main{padding:.8rem 1rem}.sec.col .main h3{margin:0}.sec.col .side{margin:.4rem 0}
.sec{display:grid;grid-template-columns:1fr auto;border:1px solid var(--line);border-radius:12px;background:var(--card);min-height:122px;margin:0 0 .6rem}
.main{position:relative;padding:1rem 1rem 1.1rem;text-align:left;min-width:0}
.main h3{margin:.1rem 0 .1rem;font-size:1.85rem;font-weight:700;text-transform:uppercase;line-height:1.15}
.meta{line-height:1.35}
.side{margin:.8rem 0;border-left:1px solid var(--line);width:58px;display:flex;align-items:center;justify-content:center}
.side.q4{width:116px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.q4 button{border-radius:0;height:100%}
.q4 button:nth-child(2),.q4 button:nth-child(4){border-left:1px solid var(--line)}
.q4 button:nth-child(1),.q4 button:nth-child(2){border-bottom:1px solid var(--line)}
.side.wx{width:150px;flex-direction:column;gap:.2rem;border-left:0;color:var(--ink);font-size:.95rem}
.side.wx .cl{color:var(--y)}
.mini{margin-top:.5rem;padding:.25rem .5rem;font-size:.85rem;color:var(--mute)}
.lines{max-width:660px;margin:.3rem 0 0}
.ln{display:flex;justify-content:flex-start;gap:.5rem;align-items:flex-start;padding:.15rem 0;overflow-wrap:anywhere}
.ln.done span{text-decoration:line-through;color:var(--mute)}
.ln .x{color:var(--mute);padding:0 .3rem;font-size:.9rem}
/* Bericht Schritt für Schritt */
.bwz-bar{display:flex;gap:.5rem;align-items:center;margin:0 0 .8rem}
.bwz-bar button{border:1px solid var(--line);border-radius:999px;padding:.45rem .95rem;color:var(--ink);background:var(--card)}
.bwz-bar button.go{border-color:var(--y);color:var(--y);font-weight:700}
#bwz{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
#bwz .bp{background:var(--pan);border:1px solid var(--line);border-radius:16px 16px 0 0;width:min(620px,100%);max-height:94%;display:flex;flex-direction:column;text-align:left}
@media (min-width:700px){#bwz{align-items:center}#bwz .bp{border-radius:16px;max-height:88%}}
#bwz.kb{align-items:flex-start}#bwz.kb .bp{border-radius:0 0 16px 16px;max-height:100%;height:100%}#bwz.kb .dots,#bwz.kb .bh{padding-top:.5rem}
#bwz .bh{padding:.8rem 1rem .4rem;display:flex;align-items:center;gap:.5rem}
#bwz .bh b{flex:1;font-size:1.15rem}
#bwz .bh button{border:0;background:none;color:var(--mute);font-size:1.3rem;padding:.2rem .4rem}
#bwz .dots{display:flex;gap:4px;padding:0 1rem .5rem}
#bwz .dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}#bwz .dots i.on{background:var(--y)}#bwz .dots i.done{background:color-mix(in srgb,var(--y) 45%,var(--line))}
#bwz .bb{padding:.3rem 1rem 1rem;overflow:auto;flex:1}
#bwz .bb .sub{color:var(--mute);font-size:.88rem;margin:.1rem 0 .7rem}
#bwz .bf{display:flex;gap:.5rem;padding:.7rem 1rem calc(.8rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
#bwz .bf button{border:1px solid var(--line);border-radius:10px;padding:.7rem 1rem;color:var(--ink);background:transparent}
#bwz .bf .nx{margin-left:auto;background:var(--y);color:var(--on);border-color:var(--y);font-weight:700;min-width:120px}
#bwz .card{border:1px solid var(--line);border-radius:12px;padding:.6rem .7rem;margin-bottom:.5rem}
#bwz .card.fehlt{opacity:.7}#bwz .card.fehlt b{color:var(--red)}
#bwz .card .r2{display:grid;grid-template-columns:1fr 76px;gap:.4rem;margin-top:.4rem}
#bwz .card .r2 textarea{min-height:0;height:2.7rem;resize:vertical}
#bwz .card .r3{display:flex;gap:.4rem;margin-top:.45rem;flex-wrap:wrap}
#bwz .card .r3 button{flex:1;border:1px solid var(--line);border-radius:10px;padding:.55rem .4rem;color:var(--ink);background:transparent;white-space:nowrap}
#bwz .card .r3 button.ok{border-color:var(--y);color:var(--y);font-weight:700}
#bwz .have{color:var(--mute);font-size:.88rem;margin:.6rem 0}
#bwz .have li{margin:.15rem 0}
#bwz textarea,#bwz input:not([type=checkbox]),#bwz select{width:100%}
#bwz .add{display:flex;flex-direction:column;gap:.45rem;margin-top:.5rem}
#bwz .add .ok{background:var(--y);color:var(--on);font-weight:700;padding:.7rem;border-radius:10px;border:0}
#bwz .chk{display:flex;align-items:center;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:1.02rem}
#bwz .chk input{width:22px;height:22px}
#bwz .wg{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
#bwz .wg label{display:flex;flex-direction:column;gap:.2rem;color:var(--mute);font-size:.82rem}
#bwz .big{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;margin-bottom:.5rem;color:var(--ink);background:transparent;font-size:1rem}
#bwz .big.pri{border-color:var(--y);color:var(--y);font-weight:700}
.soll-box:empty{display:none}
.soll{border:1px dashed var(--line);border-radius:8px;padding:.5rem .7rem;margin:.4rem 0 .2rem;text-align:left}
.soll-h{font-size:.8rem;color:var(--mute);margin-bottom:.3rem}
.soll-r{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;padding:.3rem 0;border-top:1px solid var(--line)}
.soll-r:first-of-type{border-top:0}
.soll-r>span:first-child{flex:1 1 220px;min-width:0}
.soll-r.pend{display:grid;grid-template-columns:1fr 1.3fr 74px auto;gap:.5rem;align-items:center}
.soll-r.pend .sn{min-width:0}
.soll-r.pend textarea,.soll-r.pend input{width:100%;padding:.3rem .45rem;border-style:dashed}
.soll-bt{display:flex;gap:.3rem}
.soll-bt button{min-width:38px;padding:.3rem .5rem}
@media (max-width:640px){.soll-r.pend{grid-template-columns:1fr 70px}.soll-r.pend .sn{grid-column:1/-1}.soll-r.pend .soll-bt{grid-column:1/-1;justify-content:flex-end}}
.soll-r small{display:block;color:var(--mute);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.soll-r button{padding:.3rem .65rem;border-radius:16px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-size:.85rem}
.soll-r button.ok{border-color:var(--y);color:var(--y)}
.soll-r.fehlt b{color:var(--red)}
.soll-st{color:var(--red);font-size:.82rem}
.ln.firm{display:grid;grid-template-columns:1fr 1.3fr 74px auto;gap:.5rem;align-items:center;text-align:left}
.due{font-size:.8rem;color:var(--y);border:1px solid var(--line);border-radius:999px;padding:.1rem .55rem;white-space:nowrap;align-self:center}
.due.late{color:#ff8a80;border-color:#ff8a80}
.dueb{color:var(--mute);padding:0 .3rem;align-self:center}
.dueinp{width:9.5rem;align-self:center}
.ln:has(.duepanel){flex-wrap:wrap}
@media(max-width:640px){.ln:has(.due){flex-wrap:wrap}.ln:has(.due) .ed{flex:1 1 9rem;min-width:9rem}.ln:has(.due) .x{order:3}.ln:has(.due) .due{order:4;margin-left:1.9rem}}
.ln:has(.duepanel) .ed{flex:1 1 10rem}

  let blob, name = 'Bautagebuch.pdf';
  try {
    const r = await fetch(url);
    if (!r.ok) { const j = await r.json().catch(() => ({})); toast(j.error || 'Das PDF konnte nicht erzeugt werden.'); return; }
    const m = /filename\*?=(?:UTF-8'')?"?([^";]+)/i.exec(r.headers.get('Content-Disposition') || ''); if (m) name = decodeURIComponent(m[1]);
    blob = await r.blob();

    const doc = await pdfjsLib.getDocument({data: await blob.arrayBuffer()}).promise;
    const el = document.createElement('div'); el.id = 'pv';
    el.innerHTML = `<div class="pvb"><button class="pvc" data-act="pvClose">✕ Schließen</button><span>${esc(name)}</span><button data-act="pvZoom" data-d="-1" aria-label="Verkleinern">−</button><button data-act="pvZoom" data-d="1" aria-label="Vergrößern">+</button><button data-act="pvShare">Teilen</button></div><div class="pvs"><div class="pvw"></div></div>`;

async function api(u, m = 'GET', d, form) {

function toast(msg, undo) {   // höchstens zwei Meldungen gleichzeitig; mit undo gibt es einen "Rückgängig"-Knopf
  let box = $('#toasts'); if (!box) { box = document.createElement('div'); box.id = 'toasts'; document.body.appendChild(box); }
  while (box.children.length >= 2) box.firstChild.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; box.appendChild(t);
  if (undo) {
    const b = document.createElement('button'); b.className = 'undo'; b.textContent = 'Rückgängig';
    b.onclick = async () => { b.disabled = true; t.remove(); await undo(); };
    t.appendChild(b);
  }
  setTimeout(() => t.remove(), undo ? 8000 : 5000);
}

const HTTP_GPS = 'Der Browser (nicht die App) sperrt GPS bei Adressen mit http://. Mit https:// über den Reverse Proxy geht es. Zum Testen: Chrome/Edge → chrome://flags bzw. edge://flags → „Insecure origins treated as secure“ → diese Adresse eintragen.';
async function locate(silent) {
  const say = m => { if (!silent) toast(m); };
  if (!navigator.geolocation) { say(window.isSecureContext ? 'Dieser Browser unterstützt keine Standortbestimmung.' : HTTP_GPS); return null; }
  if (!silent) toast('Standort wird ermittelt …');
  const pos = await new Promise(ok => navigator.geolocation.getCurrentPosition(ok, e => ok(e), {timeout: silent ? 8000 : 15000, maximumAge: 120000, enableHighAccuracy: true}));
  if (!pos.coords) { say(pos.code === 1 ? (window.isSecureContext ? 'Standortzugriff wurde nicht erlaubt.' : HTTP_GPS) : 'Standort konnte nicht ermittelt werden.'); return null; }
  return here = {lat: pos.coords.latitude, lon: pos.coords.longitude};
}
async function autoPick(silent) {

  const h = await locate(silent); if (!h) return;
  let best = null;
  for (const p of projects) if (hasPos(p) && !p.archived) { const m = dist(h.lat, h.lon, p.lat, p.lon); if (!best || m < best.m) best = {p, m}; }
  if (best.m > NEAR_M) { if (!silent) toast(`Kein Projekt in der Nähe. Am nächsten: ${best.p.name} (${fmtDist(best.m)}).`); return; }

  closeSheet(); if (tab !== 'projekt') tab = 'bericht'; await openProject(best.p.id);

async function fillGeo(silent, force) {   // Wetter für die ADRESSE DES PROJEKTS zum DATUM/zur Uhrzeit des Berichts (nicht GPS des Geräts)
  const r = curReport(), p = curProject(); if (!r || !p) return;

  if (lat == null || lon == null) {   // noch keine Koordinaten am Projekt: aus der Adresse ermitteln
    const addr = [p.street, [p.zip, p.city].filter(Boolean).join(' ')].filter(Boolean).join(', ');
    if (addr) { try { const h = await api('api/geocode?q=' + encodeURIComponent(addr)); if (h.found) { lat = h.lat; lon = h.lon; } } catch {} }
  }
  if (lat == null || lon == null) { if (!silent) toast('Für das Wetter bitte zuerst die Adresse im Projekt eintragen.'); return; }
  const rid0 = r.id, needAddr = !(p.zip && p.city);
  let g; try { g = await api(`api/geo?lat=${lat}&lon=${lon}&date=${encodeURIComponent(r.date || '')}&time=${encodeURIComponent(r.time || '')}${needAddr ? '' : '&noaddr=1'}`); } catch { return; }
  if (g.error) { if (!silent) toast(g.error); return; }
  if (rid0 !== (curReport() || {}).id) return;   // inzwischen anderer Bericht geöffnet

  if (!Object.keys(upd).length) { if (!silent) toast('Keine Daten erhalten.'); return; }
  await api('api/reports/' + r.id, 'PUT', upd);
  if (!silent) toast(`Wetter für die Projektadresse am ${fmt(r.date)} übernommen` + (g.partial.length ? ` (${g.partial.join(', ')} nicht verfügbar)` : '') + '.');
  await openProject(pid, true);
}

const ACCENTS = [['#ff5fb3', 'Pink'], ['#ffd200', 'Gelb'], ['#ff9a2e', 'Orange'], ['#ff6b5e', 'Rot'], ['#3ddc84', 'Grün'], ['#2fd6c9', 'Türkis'], ['#4da3ff', 'Blau'], ['#b18cff', 'Violett'], ['#f3f3f1', 'Weiß']];
function applyAccent(c) {   // Akzentfarbe der Oberfläche; Schriftfarbe auf der Farbe je nach Helligkeit
  c = /^#[0-9a-f]{6}$/i.test(c || '') ? c : ACCENTS[0][0];
  const [r, g, b] = [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)), lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  document.documentElement.style.setProperty('--y', c); document.documentElement.style.setProperty('--on', lum > 0.55 ? '#111' : '#fff');
  try { localStorage.setItem('accent', c); } catch {}
}
function applyTheme(t) {   // Farbschema von der Startseite (Darstellung): dunkel, hell, auto; „klassisch“ gilt hier wie hell
  try { localStorage.setItem('bpTheme', t || 'dunkel'); } catch {}
  const dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = t === 'hell' || t === 'klassisch' || (t === 'auto' && !dark) ? 'hell' : 'dunkel';
}
function applyLook(u) { applyTheme(u.theme); applyAccent(u.accent); }
try { applyTheme(localStorage.getItem('bpTheme')); applyAccent(localStorage.getItem('accent')); } catch { applyAccent(); }   // schon auf der Anmeldeseite die zuletzt gewählte Darstellung
let me = {}, users = null, people = [];
function authView(v, msg = '') {
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  const inp = (id, ph, type = 'password', ac = 'new-password') => `<input id="${id}" type="${type}" placeholder="${ph}" autocomplete="${ac}" autocapitalize="none">`;
  const V = {
    login: ['Bautagebuch', '', inp('un', 'Name', 'text', 'username') + inp('pw', 'Kennwort', 'password', 'current-password'), 'Anmelden', '<a href="#" class="lnk" data-auth="forgot">Kennwort vergessen?</a>'],
    forgot: ['Kennwort vergessen', '<p>Gib deinen Namen oder deine E-Mail-Adresse ein. Du bekommst einen Link zum Zurücksetzen per E-Mail.</p>', inp('un', 'Name oder E-Mail', 'text', 'username'), 'Link senden', '<a href="#" class="lnk" data-auth="login">Zurück zur Anmeldung</a>'],
    reset: ['Neues Kennwort', '<p>Vergib ein neues Kennwort (mindestens 8 Zeichen).</p>', inp('pw', 'Neues Kennwort') + inp('pw2', 'Kennwort wiederholen'), 'Kennwort speichern', '<a href="#" class="lnk" data-auth="login">Zur Anmeldung</a>'],
    change: ['Kennwort ändern', '<p>Bitte vergib jetzt dein eigenes Kennwort (mindestens 8 Zeichen).</p>', inp('pw0', 'Bisheriges Kennwort', 'password', 'current-password') + inp('pw', 'Neues Kennwort') + inp('pw2', 'Kennwort wiederholen') + (me.email ? '' : inp('em', 'E-Mail-Adresse (für „Kennwort vergessen“)', 'email', 'email')), 'Speichern', '<a href="#" class="lnk" data-auth="logout">Abmelden</a>'],
  }[v];
  const s = $('#login'); s.dataset.v = v;
  s.innerHTML = `<h1>${V[0]}</h1>${V[1]}${V[2]}<div id="err" role="alert">${esc(msg)}</div><button class="go" id="go">${V[3]}</button><div class="lnks">${V[4]}</div>`;
  (s.querySelector('input'))?.focus();
}
const showLogin = () => authView('login');
async function authGo() {
  const v = $('#login').dataset.v, val = id => $('#' + id)?.value || '', err = m => { $('#err').textContent = m; };
  try {
    if (v === 'login') {
      const r = await api('api/login', 'POST', {name: val('un'), password: val('pw')});
      if (!r.ok) return err(r.error || 'Fehler');
      me = r; applyLook(r); r.must_change ? authView('change') : showApp();
    } else if (v === 'forgot') {
      const r = await api('api/forgot', 'POST', {ident: val('un')});
      authView('login', r.message || r.error || '');
    } else {
      if (val('pw') !== val('pw2')) return err('Die beiden Kennwörter sind nicht gleich.');
      const r = v === 'reset' ? await api('api/reset', 'POST', {token: location.hash.slice(7), password: val('pw')})
                              : await api('api/password', 'POST', {old: val('pw0'), new: val('pw'), email: val('em')});
      if (!r.ok) return err(r.error || 'Fehler');
      if (v === 'reset') { history.replaceState(null, '', location.pathname); authView('login', 'Kennwort geändert. Bitte anmelden.'); }
      else { me.must_change = false; showApp(); }
    }
  } catch {}
}
$('#login').onclick = async e => {
  if (e.target.id === 'go') authGo();
  const a = e.target.dataset.auth; if (!a) return; e.preventDefault();
  if (a === 'logout') { await api('api/logout', 'POST'); authView('login'); } else authView(a);
};
$('#login').onkeydown = e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') authGo(); };

  }
  else if (a === 'editHead') { headEdit = !headEdit; renderDetail(); }
  else if (a === 'gps') fillGeo(false);
  else if (a === 'wxEdit') { wxEdit = !wxEdit; renderDetail(); }
  else if (a === 'adding') { adding = adding === b.dataset.kind ? null : b.dataset.kind; addFiles = []; if (adding) setSecOpen(adding, true); renderDetail(); renderApv(); }
  else if (a === 'secToggle') { setSecOpen(b.dataset.key, b.dataset.open !== '1'); renderDetail(); }
  else if (a === 'addItem') addItem(b.dataset.kind);
  else if (a === 'delItem') {
    const r = await api('api/items/' + id, 'DELETE'); await openProject(pid, true);
    if (r.item) toast('Eintrag gelöscht.', async () => {
      const x = await api('api/items/restore', 'POST', r.item);
      if (x.error) toast(x.error); else await openProject(pid, true);
    });
  }
  else if (a === 'pickFile') $('#file').click();
  else if (a === 'itemPhoto') { itemPhotoFor = id; $('#ifile').click(); }
  else if (a === 'moreImgs') { allImgs = true; renderDetail(); }
  else if (a === 'lessImgs') { allImgs = false; renderDetail(); }
  else if (a === 'bwzStart') bwzOpen();
  else if (a === 'bwzStartNow') { BWZ.set = false; bwzOpen(); }
  else if (a === 'bwzSet') { if (!BWZ.open) { BWZ.open = true; } BWZ.set = !BWZ.set || !$('#bwz'); bwzRender(); }
  else if (a === 'bwzClose') bwzClose();
  else if (a === 'bwzNext') { addFiles = []; BWZ.i++; bwzRender(); $('#bwz .bb')?.scrollTo(0, 0); }
  else if (a === 'bwzPrev') { addFiles = []; BWZ.i--; bwzRender(); }
  else if (a === 'bwzAdd') bwzAdd(b.dataset.kind);
  else if (a === 'sollDa' || a === 'sollSet') {
    const r = curReport(); if (!r) return;
    try {
      const row = b.closest('[data-sollf]'), firma = row ? row.dataset.sollf : b.dataset.f;
      if (a === 'sollDa') {
        const act = row && row.querySelector('[data-soll-act]'), cnt = row && row.querySelector('[data-soll-cnt]');
        const x = await api('api/reports/' + r.id + '/items', 'POST', {kind: b.dataset.kind, text: firma, activity: act ? act.value.trim() : '', headcount: cnt && cnt.value !== '' ? +cnt.value : null}); if (x.error) { toast(x.error); return; }
      } else { const x = await api('api/reports/' + r.id + '/soll', 'POST', {firma, status: b.dataset.st}); if (x.error) { toast(x.error); return; } }
    } catch (e) { return; }
    SOLL.rid = 0; openProject(pid, true);
  }
  else if (a === 'delImg') { await api('api/images/' + id, 'DELETE'); openProject(pid, true); }
  else if (a === 'print') {
    if (!rid) { toast('Lege zuerst einen Tagesbericht an.'); return; }
    if (isStandalone()) { await Promise.allSettled([...saving]); await openPdf('api/reports/' + rid + '/pdf'); return; }   // Startbildschirm-App: eigene Ansicht mit Schließen-Knopf
    const w = window.open('', '_blank'); await Promise.allSettled([...saving]);  // erst fertig speichern, dann PDF laden
    if (w) w.location = 'api/reports/' + rid + '/pdf'; else location.href = 'api/reports/' + rid + '/pdf';
  }
  else if (a === 'pvClose') { if (history.state && history.state.pv) history.back(); else closePv(); }
  else if (a === 'pvZoom') { pv.zoom = Math.min(2.6, Math.max(1, +(pv.zoom + (+b.dataset.d) * .6).toFixed(1))); pvRender(); }
  else if (a === 'pvShare') pvShare();
  else if (a === 'pickLogo') $('#logoFile').click();
  else if (a === 'storeTest') { toast('Verbindung wird getestet …'); const r = await api('api/store/test', 'POST'); toast(r.ok ? 'Verbindung funktioniert, Schreiben ist möglich.' : 'Fehlgeschlagen: ' + (r.error || 'unbekannt')); }
  else if (a === 'storeRun') { toast('Übertragung läuft …'); const r = await api('api/store/run', 'POST'); await storeStatus(); toast(r.error && r.pending ? 'Server nicht erreichbar – wird später erneut versucht.' : `${r.sent} Datei(en) übertragen.`); }
  else if (a === 'storeBackfill') { const r = await api('api/store/backfill', 'POST'); toast(r.error || `${r.queued} Foto(s) werden übertragen.`); setTimeout(storeStatus, 2500); }
  else if (a === 'stab') { stab = b.dataset.s; renderDetail(); }
  else if (a === 'pickContact') {
    const inp = b.closest('.sgw').querySelector('input'); inp.value = b.dataset.name; hideSug();
    const row = b.closest('.addrow,.qadd');
    if (!row) inp.dispatchEvent(new Event('change', {bubbles: true}));   // bestehende Zeile: gleich speichern
    else (row.querySelector('[data-add-act]') || (inp.matches('[data-add-co]') && row.querySelector('[data-add]')) || inp).focus();
  }
  else if (a === 'qOpen') { adding = null; q = {step: 'menu'}; renderQ(); }
  else if (a === 'qClose') { q = null; renderQ(); }
  else if (a === 'qCam') { $('#qcam').click(); }
  else if (a === 'qLib') { $('#qlib').click(); }
  else if (a === 'qAdd') { adding = null; addFiles = []; renderDetail(); setSecOpen(b.dataset.kind, true); q = {step: 'add', kind: b.dataset.kind}; renderQ(); renderApv(); }
  else if (a === 'aCam') { $('#acam').click(); }
  else if (a === 'aLib') { $('#alib').click(); }
  else if (a === 'aRm') { addFiles.splice(+b.dataset.i, 1); renderApv(); }
  else if (a === 'qDate') { const d = new Date(Date.now() + +b.dataset.d * 864e5); b.closest('.qadd').querySelector('[data-add-due]').value = new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); }
  else if (a === 'qAssign') { const fs = qFiles; q = null; renderQ(); await uploadPhotos(fs, b.dataset.id || null); }
  else if (a === 'accent') { await setAccent(b.dataset.c); }
  else if (a === 'userOpen') { uopen = uopen === id ? null : id; fillUsers(); }
  else if (a === 'userNew') { unew = !unew; fillUsers(); }
  else if (a === 'changePw') {
    if ($('#pwNew').value !== $('#pwNew2').value) return toast('Die beiden Kennwörter sind nicht gleich.');
    const r = await api('api/password', 'POST', {new: $('#pwNew').value});
    toast(r.ok ? 'Kennwort geändert.' : r.error); if (r.ok) ['#pwNew', '#pwNew2'].forEach(x => $(x).value = '');
  }
  else if (a === 'addUser') {
    const r = await api('api/users', 'POST', {name: $('#nuName').value, email: $('#nuMail').value});
    if (r.error) return toast(r.error);
    unew = false; uopen = r.id; toast('Benutzer angelegt. Das Startkennwort wurde an ' + r.to + ' geschickt.'); fillUsers();
  }
  else if (a === 'userPw') {
    const el = document.querySelector(`[data-upw="${id}"]`), r = await api('api/users/' + id, 'PUT', {password: el.value});
    toast(r.error || 'Kennwort gesetzt – der Benutzer muss es beim nächsten Anmelden ändern.'); if (!r.error) { el.value = ''; fillUsers(); }
  }
  else if (a === 'userMail') { toast('E-Mail wird gesendet …'); const r = await api('api/users/' + id + '/access', 'POST'); toast(r.error || 'Zugangsdaten an ' + r.to + ' gesendet.'); if (!r.error) fillUsers(); }
  else if (a === 'delUser') { const r = await api('api/users/' + id, 'DELETE'); toast(r.error || 'Benutzer gelöscht.'); fillUsers(); }
  else if (a === 'mailTest') { toast('Testmail wird gesendet …'); const r = await api('api/mail/test', 'POST'); toast(r.ok ? 'Testmail an ' + r.to + ' gesendet.' : 'Fehlgeschlagen: ' + r.error); }
  else if (a === 'mailPassClear') { await api('api/settings', 'PUT', {mail_pass_clear: '1'}); settings = await api('api/settings'); renderDetail(); }
  else if (a === 'storePassClear') { await api('api/settings', 'PUT', {store_pass_clear: '1'}); settings = await api('api/settings'); renderDetail(); }
  else if (a === 'delLogo') { await api('api/logo', 'DELETE'); settings = await api('api/settings'); favicon(); renderDetail(); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.tagName === 'SELECT' && t.value === '__x') {   // „Andere Zeit …“: Auswahlliste wird zum freien Zeitfeld (Minutengenau)
    const prev = [...t.options].find(o => o.defaultSelected)?.value || '09:00', n = document.createElement('input');
    n.type = 'time'; n.value = prev; n.step = 60; n.setAttribute('aria-label', 'Uhrzeit');
    for (const a of ['data-dp', 'data-add-time', 'data-f']) if (t.hasAttribute(a)) n.setAttribute(a, t.getAttribute(a));
    t.replaceWith(n); n.focus(); try { n.showPicker?.(); } catch (_) {} return;
  }
  if (t.dataset.act === 'pick') { rid = +t.value; wxEdit = headEdit = false; renderDetail(); }
  else if (t.dataset.act === 'toggle') { await api('api/items/' + t.dataset.id, 'PUT', {done: t.checked}); openProject(pid, true); }
  else if (t.dataset.img) { const r = await api('api/images/' + t.dataset.img, 'PUT', {caption: t.value}); if (r.error) toast(r.error); else { const im = curReport().images.find(x => x.id === +t.dataset.img); if (im) im.caption = t.value.trim().replace(/\s+/g, ' '); } }
  else if (t.dataset.pf) saveProjectField(t);
  else if (t.dataset.cf) saveContactField(t);
  else if ('accentCustom' in t.dataset) setAccent(t.value);
  else if (t.dataset.acc) { const r = await api('api/account', 'PUT', {email: t.value}); if (r.error) { toast(r.error); t.value = me.email; } else { me.email = t.value.trim(); toast('E-Mail-Adresse gespeichert.'); if (me.is_admin) fillUsers(); } }
  else if (t.dataset.uf) { const r = await api('api/users/' + t.dataset.id, 'PUT', {[t.dataset.uf]: t.type === 'checkbox' ? t.checked : t.value}); if (r.error) toast(r.error); else toast('Gespeichert.'); fillUsers(); }
  else if (t.dataset.st) {
    const k = t.dataset.st, sec = /_pass$/.test(k); if (sec && !t.value) return;
    if (!sec) settings[k] = t.value;
    await track(api('api/settings', 'PUT', {[k]: t.value}));
    if (sec || k === 'store_mode') { settings = await api('api/settings'); renderDetail(); }
    else if (k.startsWith('store_')) storeStatus();
  }
  else if (t.dataset.cl !== undefined) { cln.sel[t.checked ? 'add' : 'delete'](t.dataset.cl); fillCleanup(); }
  else if (t.id === 'audu') { aud.user = t.value; loadAudit(); }
  else if (t.dataset.dp && t.closest('.duepanel')) saveDue(t.closest('.duepanel'), t.dataset.dp === 'time');
  else if (t.dataset.it) {
    const v = t.dataset.k === 'headcount' ? (t.value === '' ? null : +t.value) : t.value.trim();
    const it = curReport().items.find(x => x.id === +t.dataset.it);
    if (t.dataset.k === 'text' && !v) { toast('Der Eintrag darf nicht leer sein. Zum Entfernen ✕ tippen.'); if (it) t.value = it.text; grow(t); return; }
    if (it) it[t.dataset.k] = v;
    await track(api('api/items/' + t.dataset.it, 'PUT', {[t.dataset.k]: v}));

  }
  else if (t.dataset.f) {
    const r = curReport(), v = t.type === 'checkbox' ? (t.checked ? 1 : 0) : t.value; r[t.dataset.f] = v;
    const manualWx = WXK.includes(t.dataset.f);   // von Hand geändert: nicht mehr automatisch überschreiben
    await track(api('api/reports/' + r.id, 'PUT', manualWx ? {[t.dataset.f]: v, extra: {wx_auto: 0}} : {[t.dataset.f]: v}));
    if (manualWx) r.extra = {...(r.extra || {}), wx_auto: 0};
    if (['date', 'time'].includes(t.dataset.f) && r.extra && r.extra.wx_auto) { await fillGeo(true, true); openProject(pid, true); return; }   // Datum/Uhrzeit geändert: automatisches Wetter nachziehen
    if (['date', 'number'].includes(t.dataset.f)) openProject(pid, true);
  }
});
document.addEventListener('change', e => { if (e.target.id === 'ctr') { cTrade = e.target.value; fillContactList(); } if (e.target.id === 'cpr') { cProj = e.target.value; fillContactList(); } });
document.addEventListener('input', e => {
  if (e.target.classList.contains('ed')) grow(e.target);
  else if (e.target.dataset.dp && draft) {
    draft[e.target.dataset.dp] = e.target.value;
    if (e.target.dataset.dp === 'name') suggestProjects(e.target.value);
  }
  else if (e.target.id === 'sq') { sheetQ = e.target.value; renderSheet(); if (sheetMode === 'proj') sheetSuggest(); }
  else if (e.target.id === 'cq') { cq = e.target.value; fillContactList(); }
  else if (e.target.id === 'ncName') suggestContacts(e.target.value);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSheet(); $('#menu').classList.add('hidden'); if (BWZ.open) bwzClose(); }
  const wrow = e.target.closest && e.target.closest('#bwz .add');
  if (wrow && e.key === 'Enter' && !e.defaultPrevented && (e.target.tagName !== 'TEXTAREA' || e.ctrlKey || e.metaKey)) { e.preventDefault(); bwzAdd(wrow.querySelector('[data-add]').dataset.add); return; }
  const row = e.target.closest && e.target.closest('.addrow');
  const ta = e.target.tagName === 'TEXTAREA';
  if (e.key === 'Enter' && row && (!ta || e.ctrlKey || e.metaKey)) { e.preventDefault(); addItem(row.querySelector('[data-add]').dataset.add); }
  else if (e.key === 'Enter' && e.target.dataset && e.target.dataset.dp) createProject();
  else if (e.key === 'Enter' && e.target.id === 'ncName') createContact();
});
window.addEventListener('resize', growAll);
if (location.hash.startsWith('#reset=')) authView('reset');
else if (location.hash === '#forgot') { history.replaceState(null, '', location.pathname); authView('forgot'); }   // Link „Kennwort vergessen“ der Startseite
else api('api/me').then(r => { if (!r.ok) return authView('login'); me = r; applyLook(r); r.must_change ? authView('change') : showApp(); });
</script>
</body>
</html>
