<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#84827c">
<title>Papierkorb</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="static/bp.css">
<style>
.wrap{max-width:1000px}
.pk-top{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin:.4rem 0 1rem}
.pk-top h1{font-size:1.35rem;margin:0;flex:1}
.pk-ein{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;color:var(--mute);font-size:.92rem;margin:0 0 1rem}
.pk-ein select{width:auto}
.pk-l{display:flex;flex-direction:column;gap:.5rem}
.pk-i{display:flex;gap:.8rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem}
.pk-i .ic{font-size:1.4rem;width:2rem;text-align:center;flex:none}
.pk-i .t{flex:1;min-width:0}
.pk-i .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-i .t small{display:block;color:var(--mute);font-size:.84rem}
.pk-f{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:.2rem 0 .8rem}.pk-f input{flex:1;min-width:12rem;max-width:22rem}
.pk-chips{display:flex;gap:.35rem;flex-wrap:wrap}.pk-chips button{border:1px solid var(--line);border-radius:999px;padding:.3rem .75rem;color:var(--ink);font-size:.88rem}
.pk-chips button small{color:var(--mute);margin-left:.35rem;font-size:.76rem}.pk-chips button.on{background:var(--y);border-color:var(--y);color:var(--on);font-weight:600}.pk-chips button.on small{color:inherit;opacity:.75}
.pk-i .art{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.pk-i .a{display:flex;gap:.4rem;flex:none;flex-wrap:wrap;justify-content:flex-end}
.pk-g{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:1rem .2rem .2rem}
.leer{text-align:center;color:var(--mute);padding:3rem 1rem;background:var(--card);border:1px dashed var(--line);border-radius:12px}
@media (max-width:640px){.pk-i{flex-wrap:wrap}.pk-i .a{width:100%;justify-content:flex-start}}
</style>
</head>
<body>
<main class="wrap">
  <div class="pk-top"><h1>🗑 Papierkorb</h1><button class="btn sm" id="leeren" hidden>Papierkorb leeren …</button></div>
  <p class="pk-ein" id="ein"></p>
  <div id="liste"><p class="mute">Lade …</p></div>
</main>
<script src="static/bp.js"></script>
<script>
let D = null, CONF = null, WER = '', ART = '', SUCH = '';   // Filter: Benutzer (Verwaltung), Art, Suchtext
const APP = { bautagebuch: ['📒', 'Bautagebuch'], gantt: ['📅', 'Bauzeitenplan'], baukosten: ['💶', 'Baukosten'], ava: ['📄', 'Ausschreibung & Abrechnung'], aufgaben: ['☑', 'Aufgaben & Mängel'], adressen: ['📇', 'Adressen'] };
const wann = (t) => { if (!t) return ''; const d = new Date(t); return d.toLocaleDateString('de-DE') + ' ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); };
const tagGruppe = (t) => { const d = new Date(t), h = new Date(); const tage = Math.floor((new Date(h.toDateString()) - new Date(d.toDateString())) / 864e5); return tage <= 0 ? 'Heute' : tage === 1 ? 'Gestern' : tage < 7 ? 'Diese Woche' : tage < 31 ? 'Diesen Monat' : 'Älter'; };
function rest(t) {
  const tage = D.einst.tage; if (!tage) return '';
  const bis = new Date(new Date(t).getTime() + tage * 864e5), n = Math.ceil((bis - new Date()) / 864e5);
  return n <= 1 ? ' · wird morgen endgültig gelöscht' : ` · noch ${n} Tage`;
}
function zeigen() {
  const A = D.admin;
  $('#leeren').hidden = !A || !D.eintraege.length;
  const T = [[0, 'nie (nur von Hand)'], [7, '7 Tagen'], [14, '14 Tagen'], [30, '30 Tagen'], [60, '60 Tagen'], [90, '90 Tagen'], [180, '180 Tagen'], [365, 'einem Jahr']];
  if (!T.some(([k]) => k === D.einst.tage)) T.push([D.einst.tage, D.einst.tage + ' Tagen']);
  const leute = [...new Set(D.eintraege.map((x) => x.von || ''))].sort((a, b) => a.localeCompare(b, 'de'));
  $('#ein').innerHTML = (A ? `Gelöschtes aus allen Apps und von allen Benutzern – mit allem, was daran hing. Gelöscht von <select id="wer" aria-label="Gelöscht von"><option value="">allen (${D.eintraege.length})</option>${leute.map((n) => `<option value="${esc(n)}"${n === WER ? ' selected' : ''}>${esc(n || 'unbekannt')} (${D.eintraege.filter((x) => (x.von || '') === n).length})</option>`).join('')}</select><br>`
    : `Was du gelöscht hast – mit allem, was daran hing (Berichte, Fotos, Pläne, Angebote …). Endgültig löschen kann die Verwaltung.<br>`) + `
    Automatisch endgültig löschen nach ${A ? `<select id="tage" aria-label="Automatisch endgültig löschen nach">${T.map(([k, l]) => `<option value="${k}"${k === D.einst.tage ? ' selected' : ''}>${l}</option>`).join('')}</select>` : `<b>${(T.find(([k]) => k === D.einst.tage) || [, D.einst.tage + ' Tagen'])[1]}</b>`}`;
  const E0 = A && WER !== '' ? D.eintraege.filter((x) => (x.von || '') === WER) : D.eintraege;
  const arten = [...new Set(E0.map((x) => x.art || ''))].sort((a, b) => a.localeCompare(b, 'de'));
  if (ART && !arten.includes(ART)) ART = '';
  const q = SUCH.trim().toLowerCase();
  const E = E0.filter((x) => (!ART || x.art === ART) && (!q || [x.titel, x.projekt, x.art, x.von].join(' ').toLowerCase().includes(q)));
  const filt = E0.length ? `<div class="pk-f"><div class="pk-chips">${[['', 'Alles', E0.length], ...arten.map((a) => [a, a, E0.filter((x) => x.art === a).length])].map(([k, l, n]) => `<button type="button" class="${ART === k ? 'on' : ''}" data-art="${esc(k)}">${esc(l)}<small>${n}</small></button>`).join('')}</div>
    <input type="search" id="pkq" placeholder="Suchen: Name, Projekt …" value="${esc(SUCH)}" aria-label="Im Papierkorb suchen"></div>` : '';
  if (!E.length) { $('#liste').innerHTML = filt + `<div class="leer">${E0.length ? 'Nichts gefunden.' : 'Der Papierkorb ist leer.'}</div>`; return; }
  let g = '', h = '';
  for (const x of E) {
    const gr = tagGruppe(x.geloescht); if (gr !== g) { g = gr; h += `<div class="pk-g">${g}</div>`; }
    const ap = APP[x.app] || ['🗂', x.app || ''];
    h += `<div class="pk-i" data-id="${x.id}"><span class="ic" aria-hidden="true">${ap[0]}</span>
      <div class="t"><span class="art">${esc(x.art)}${ap[1] && ap[1] !== x.art ? ' · ' + esc(ap[1]) : ''}</span><b>${esc(x.titel || '–')}</b>
        <small>${x.projekt && x.projekt !== x.titel ? esc(x.projekt) + ' · ' : ''}gelöscht ${esc(wann(x.geloescht))}${x.von ? ' von ' + esc(x.von) : ''}${esc(rest(x.geloescht))}</small></div>
      <div class="a"><button class="btn sm pri" data-zurueck="${x.id}">↩ Wiederherstellen</button>${A ? `<button class="btn sm" data-weg="${x.id}" title="Endgültig löschen – lässt sich nicht rückgängig machen">Endgültig löschen</button>` : ''}</div></div>`;
  }
  $('#liste').innerHTML = filt + `<div class="pk-l">${h}</div>`;
  const qi = $('#pkq'); if (qi && document.activeElement === document.body && SUCH) { qi.focus(); qi.setSelectionRange(SUCH.length, SUCH.length); }
}
async function laden() { D = await api('api/bp/papierkorb'); zeigen(); }
const appLink = (k) => { const a = (CONF.apps || []).find((x) => x.key === k && x.allowed); return a ? appUrl(a) + '/' : ''; };
document.addEventListener('input', (e) => { if (e.target.id === 'pkq') { SUCH = e.target.value; const pos = e.target.selectionStart; zeigen(); const i = $('#pkq'); if (i) { i.focus(); i.setSelectionRange(pos, pos); } } });
document.addEventListener('click', async (e) => {
  const ab = e.target.closest('[data-art]'); if (ab) { ART = ab.dataset.art; zeigen(); return; }
  const z = e.target.closest('[data-zurueck]');
  if (z) {
    z.disabled = true;
    try { const r = await api(`api/bp/papierkorb/${z.dataset.zurueck}/zurueck`, 'POST'); const l = appLink(r.app);
      toast(`„${r.titel}“ ist wieder da${l ? ' – in ' + (APP[r.app] || [, r.app])[1] : ''}.`); await laden(); }
    catch (er) { z.disabled = false; toast(er.message, true); }
    return;
  }
  const w = e.target.closest('[data-weg]');
  if (w) {
    if (!w.dataset.s) { w.dataset.s = 1; w.textContent = 'Wirklich endgültig?'; w.classList.add('danger'); setTimeout(() => { if (w.isConnected) { delete w.dataset.s; w.textContent = 'Endgültig löschen'; w.classList.remove('danger'); } }, 4000); return; }
    try { await api('api/bp/papierkorb/loeschen', 'POST', { ids: [+w.dataset.weg] }); await laden(); } catch (er) { toast(er.message, true); }
  }
});
$('#leeren').onclick = () => { const E = WER !== '' ? D.eintraege.filter((x) => (x.von || '') === WER) : D.eintraege; modalBox(`<h3>Papierkorb leeren</h3><p>${WER !== '' ? `Alle ${E.length} Einträge von ${esc(WER || 'unbekannt')}` : `Alle ${E.length} Einträge`} werden endgültig gelöscht – mit Berichten, Fotos, Plänen und allem, was daran hängt. Das lässt sich nicht rückgängig machen.</p>
  <div class="acts"><button class="btn" data-m="x">Abbrechen</button><button class="btn danger" data-m="ok">Endgültig löschen</button></div>`, async (m, bg, close) => {
  if (m !== 'ok') { close(); return; }
  try { const r = await api('api/bp/papierkorb/loeschen', 'POST', WER !== '' ? { ids: E.map((x) => x.id) } : { alle: true }); close(); toast(`${r.n} Einträge endgültig gelöscht.`); await laden(); } catch (er) { toast(er.message, true); }
}); };
document.addEventListener('change', async (e) => {
  if (e.target.id === 'wer') { WER = e.target.value; zeigen(); return; }
  if (e.target.id !== 'tage') return;
  try { const r = await api('api/bp/papierkorb/einst', 'PUT', { tage: +e.target.value }); D.einst = r.einst; toast(+e.target.value ? `Einträge werden nach ${e.target.options[e.target.selectedIndex].text} endgültig gelöscht.` : 'Der Papierkorb wird nur noch von Hand geleert.'); await laden(); }
  catch (er) { toast(er.message, true); }
});
(async () => {
  const me = await api('api/me'); if (!me.ok) { location.href = '/login'; return; }
  applyLook(me);
  CONF = await api('api/platform');
  await header('Papierkorb', me, CONF);
  await laden();
})().catch((e) => toast(e.message, true));
</script>
</body>
</html>
