name: Build & Publish

# Push auf main -> alle Images bauen, neue Versionsnummer in server/docker-compose.yml
#                  eintragen. Portainer (Polling) erkennt die Änderung und aktualisiert.
# Tag v*        -> zusätzlich Tag "stable" (für den späteren Produktivserver)
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'server/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/matthiasknauff/bauplattform

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app: [bautagebuch, gantt, plattform]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags bestimmen
        id: meta
        run: |
          IMAGE="${REGISTRY}/${{ matrix.app }}"
          SHORT="${GITHUB_SHA::7}"
          TAGS="${IMAGE}:${SHORT}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:stable"
          else
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  testserver:
    needs: build
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Neue Version in server/docker-compose.yml eintragen
        run: |
          SHORT="${GITHUB_SHA::7}"
          sed -i -E "s#(image: ${REGISTRY}/(bautagebuch|gantt|plattform)):[A-Za-z0-9._-]+#\1:${SHORT}#" server/docker-compose.yml
          grep -n "image: ${REGISTRY}" server/docker-compose.yml
          if git diff --quiet; then echo "Keine Änderung"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Testserver: Bauplattform auf ${SHORT}"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 3; done
