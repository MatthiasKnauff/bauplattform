<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1a">
<title>Baukosten</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="static/bp.css">
<style>
.wrap{max-width:1240px}
.num{white-space:nowrap;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
.r{text-align:right}
.top{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.9rem}
.top .pick{flex:1 1 280px;max-width:520px}
.top .fill{flex:1}
.save{color:var(--mute);font-size:.85rem}
.stufen{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;margin:0 0 1rem}
.stinfo{margin:-.5rem 0 1rem;font-size:.85rem;color:var(--mute)}
.stinfo b{color:var(--ink);font-weight:600}
.stufen .lbl{font-size:.8rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin-right:.3rem}
.pills button{border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:.35rem .85rem;font-size:.88rem;min-height:36px}
.pills button.on{border-color:var(--y);color:var(--ink);background:var(--hov);font-weight:600}
.tabs{margin:0 -1rem 1.2rem;padding:0 1rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;margin-bottom:1.2rem}
.kpi{display:flex;flex-direction:column;gap:.3rem}
.kpi .lbl{font-size:.78rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.kpi b{font-size:1.6rem;font-weight:600}
.kpi span{font-size:.85rem;color:var(--mute)}
.two{display:flex;flex-wrap:wrap;gap:1.2rem}
.two>*{flex:1 1 440px;min-width:0}
.card h2{margin:0 0 .2rem;font-size:1.05rem}
.card .sub{margin:0 0 1rem;font-size:.85rem;color:var(--mute)}
.bars{display:flex;flex-direction:column;gap:.7rem}
.bar .t{display:flex;justify-content:space-between;gap:1rem;font-size:.92rem}
.bar .tr{height:8px;background:var(--hov);border-radius:4px;margin-top:.25rem}
.bar .f{height:8px;border-radius:4px;background:var(--y)}
.cols{display:flex;align-items:flex-end;gap:4px;height:180px;border-bottom:1px solid var(--line);padding-top:1rem}
.cols>div{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;position:relative}
.cols .c{width:100%;max-width:42px;background:var(--y);border-radius:3px 3px 0 0;opacity:.9}
.cols .c.i{position:absolute;bottom:0;background:transparent;border:2px solid var(--ink);border-bottom:0;opacity:.55}
.axis{display:flex;gap:4px;margin-top:.3rem}
.axis span{flex:1 1 0;text-align:center;font-size:.7rem;color:var(--mute);min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;gap:1.2rem;font-size:.82rem;color:var(--mute);margin-top:.6rem;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:.35rem}
.alert{border-left:4px solid var(--y);display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-top:1.2rem}
.alert .fill{flex:1 1 280px;color:var(--mute);font-size:.92rem}
.files{display:flex;flex-direction:column;gap:.6rem}
.files .acts{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
.files .acts .btn{white-space:nowrap;flex:0 0 auto;min-width:0}
.fc{display:flex;flex-direction:column;gap:.25rem;cursor:pointer;text-align:left;color:var(--ink)}
.fc.on{border-color:var(--y);box-shadow:0 0 0 1px var(--y)}
.fc small{color:var(--mute)}
.fc .acts{display:flex;gap:.4rem;margin-top:.3rem}
.drop{border:1px dashed var(--line);border-radius:10px;padding:1rem;text-align:center;color:var(--mute);cursor:pointer}
.drop:hover,.drop.on{border-color:var(--y);color:var(--ink)}
.plan{position:relative;background:#fff;border-radius:8px;overflow:hidden}
.plan img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.plan{touch-action:none;cursor:grab}
.card.h.go{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,transform .15s}
.card.h.go:hover,.card.h.go:focus-visible{border-color:var(--y);transform:translateX(2px)}
.card.h.go .src i{font-style:normal;margin-left:.5rem;color:var(--y)}
.bt td{vertical-align:top}
.bt select{max-width:260px}
.bt tr.bt-g td{background:var(--hov);padding-top:.55rem;padding-bottom:.45rem}
.btn.ki{border-color:color-mix(in srgb,var(--y) 60%,var(--line))}
#histBar{position:fixed;left:16px;bottom:16px;z-index:44;display:flex;gap:.35rem;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:.3rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#histBar[hidden]{display:none}
#histBar .btn{border-radius:999px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--y);background:color-mix(in srgb,var(--y) 18%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.plan.drag{cursor:grabbing}
.pz{position:relative;transform-origin:0 0;--z:1}
.pzc{position:absolute;right:8px;top:8px;display:flex;gap:4px;z-index:3;background:rgba(255,255,255,.92);border:1px solid #cfcbc2;border-radius:999px;padding:3px;box-shadow:0 2px 8px #0003}
.pzc button{width:30px;height:30px;border-radius:50%;color:#1c1c1a;font-size:1rem;line-height:1;padding:0}
.pzc button:hover{background:#ece9e2}
.pzc span{font:600 12px/30px ui-monospace,monospace;color:#555;min-width:44px;text-align:center}
.plan .mk{position:absolute;transform:translate(-30%,-60%) scale(calc(1 / var(--z)));transform-origin:30% 60%;min-width:22px;height:22px;padding:0 5px;border-radius:11px;font:600 11px/22px ui-monospace,monospace;text-align:center;color:#fff;background:#2c5876;border:2px solid #fff;box-shadow:0 1px 4px #0006}
.plan .mk.ok{background:#2e7d4f}
.plan .mk.warn{background:#b3541e}
.plan .mk.sel{outline:3px solid var(--y)}
.layout{display:flex;flex-wrap:wrap;gap:1.2rem;align-items:flex-start}
.layout .side{flex:0 1 300px;min-width:260px;display:flex;flex-direction:column;gap:.8rem}
.layout .main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:1rem}
.tbl input,.tbl select{padding:.35rem .5rem;font-size:.92rem}
.tbl input.n{width:96px;text-align:right;font-family:ui-monospace,monospace}
.tbl input.w{width:100%;min-width:140px}
.tbl tr.sel td{background:var(--hov)}
.tbl tr.warn td:first-child{box-shadow:inset 3px 0 0 #e07b3a}
.tbl tfoot td{font-weight:600;border-top:1px solid var(--line)}
.okb{border:1px solid var(--line);border-radius:6px;padding:.3rem .7rem;font-size:.85rem;color:var(--mute);min-height:34px;white-space:nowrap}
.okb.on{border-color:var(--ok);color:var(--ok)}
.hint{font-size:.85rem;color:var(--mute)}
.wn{display:block;font-size:.78rem;color:#e07b3a}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.row label{display:flex;flex-direction:column;gap:.2rem;font-size:.85rem;color:var(--mute)}
.row label select,.row label input{color:var(--ink);font-size:.95rem;min-width:220px}
.h{display:flex;gap:1rem;align-items:flex-start}
.h .d{flex:0 0 10px;width:10px;height:10px;border-radius:50%;margin-top:.45rem;background:var(--mute)}
.h .d.hoch{background:#e5533d}.h .d.mittel{background:#e0a030}.h .d.info{background:#4da3ff}
.h b{display:block}
.h p{margin:.2rem 0 0;color:var(--mute);font-size:.92rem}
.h .src{margin-left:auto;font-size:.75rem;color:var(--mute);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.list{display:flex;flex-direction:column;gap:.6rem}
.empty{color:var(--mute);padding:2.5rem 1rem;text-align:center}
.nk{display:flex;flex-direction:column;gap:.35rem}
.nk input,.nk select{width:100%;color:var(--ink);font-size:1rem;padding:.6rem .75rem}
.nkl{font-size:.85rem;color:var(--mute);margin-top:.55rem}
.nkList{border:1px solid var(--line);border-radius:10px;max-height:min(240px,32vh);overflow:auto;display:flex;flex-direction:column;padding:.25rem;background:var(--card)}
.nkGrp{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);padding:.55rem .6rem .25rem}
.nkOpt{display:flex;flex-wrap:wrap;align-items:center;gap:.1rem .6rem;text-align:left;color:var(--ink);border:1px solid transparent;border-radius:8px;padding:.5rem .65rem;width:100%}
.nkOpt b{font-weight:600}
.nkOpt small{flex-basis:100%;color:var(--mute);font-size:.8rem}
.nkOpt:hover{background:var(--hov)}
.nkOpt.on{border-color:var(--y);background:var(--hov)}
.nkRow{display:grid;grid-template-columns:1fr 190px;gap:.8rem}
@media (max-width:560px){.nkRow{grid-template-columns:1fr}}
input[data-own]{border-color:var(--y)}
.gbar{position:relative;height:22px;background:var(--hov);border-radius:4px;min-width:120px}
.gbar i{position:absolute;top:3px;bottom:3px;border-radius:3px;background:var(--y)}
.acc{display:flex;flex-direction:column;gap:.6rem}
.band{position:relative;height:14px;border-radius:7px;background:var(--hov);margin:.4rem 0 .2rem}
.band i{position:absolute;top:0;bottom:0;border-radius:7px;background:linear-gradient(90deg,transparent,var(--y) 30%,var(--y) 45%,transparent)}
.band b{position:absolute;top:-4px;width:3px;height:22px;background:var(--ink);border-radius:2px}
.fx{display:flex;gap:.8rem;justify-content:space-between;font-size:.9rem;padding:.35rem 0;border-bottom:1px solid var(--line)}
.fx:last-child{border-bottom:0}
.fx small{display:block;color:var(--mute);font-size:.8rem}
.est{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.8rem}
.ec{display:flex;flex-direction:column;gap:.35rem}
.ec .v{font-size:1.25rem;font-weight:600}
.ec .sp{font-size:.82rem;color:var(--mute)}
.ec .src{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--y);font-weight:600}
.badge{display:inline-block;font-size:.72rem;border:1px solid var(--y);color:var(--y);border-radius:999px;padding:0 .45rem;margin-left:.3rem;white-space:nowrap}
.sich{font-size:.72rem;border-radius:999px;padding:.05rem .5rem;border:1px solid var(--line);color:var(--mute)}
.sich.hoch{border-color:var(--ok);color:var(--ok)}.sich.mittel{border-color:#e0a030;color:#e0a030}.sich.gering{border-color:#e07b3a;color:#e07b3a}
#asst{position:fixed;right:16px;bottom:16px;width:min(380px,calc(100vw - 32px));max-height:min(72vh,640px);display:flex;flex-direction:column;z-index:45;
  background:var(--card2);border:1px solid var(--y);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
#asst .ah{display:flex;align-items:center;gap:.5rem;padding:.7rem .9rem;border-bottom:1px solid var(--line);cursor:move;user-select:none;touch-action:none}
#asst .ah .grip{color:var(--mute);font-size:.9rem;letter-spacing:-2px}
#asst .ah b{flex:1}
#asst .ab{overflow:auto;padding:.8rem .9rem;display:flex;flex-direction:column;gap:.7rem}
#asst .steps{display:flex;gap:4px}
#asst .steps button{flex:1;height:6px;border-radius:3px;padding:0;background:var(--line)}
#asst .steps button.ok{background:var(--ok)}
#asst .steps button.cur{background:var(--y)}
#asst h3{margin:0;font-size:1.05rem}
#asst p{margin:0;color:var(--mute);font-size:.92rem;line-height:1.45}
#asst .st{font-size:.85rem;padding:.5rem .7rem;border-radius:8px;background:var(--hov)}
#asst .st.ok{color:var(--ok)}
#asst .acts{display:flex;gap:.45rem;flex-wrap:wrap}
#asst .af{display:flex;gap:.45rem;padding:.6rem .9rem;border-top:1px solid var(--line);align-items:center}
#asst .af .fill{flex:1;font-size:.8rem;color:var(--mute)}
#asstFab{position:fixed;right:16px;bottom:16px;z-index:44;box-shadow:0 8px 24px rgba(0,0,0,.35)}
body.as-open .wrap{padding-bottom:45vh}
@media (max-width:640px){#asst{right:0;bottom:0;width:100vw;border-radius:14px 14px 0 0;max-height:58vh}.wrap{padding-bottom:8rem}}
@media (max-width:640px){.tabs{margin:0 -.8rem 1rem}.kpi b{font-size:1.3rem}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <label for="sel" class="hidden">Kostenermittlung</label>
    <button type="button" id="sel" aria-label="Kostenermittlung wählen" title="Kostenermittlung wechseln, neu anlegen"></button>
    <button class="btn sm" id="newBtn">+ Neue Kostenermittlung</button>
    <button class="btn sm pri" id="pdfBtn">PDF für den Bauherrn …</button>
    <button class="btn sm" id="moreBtn" aria-haspopup="dialog">Archivieren / Löschen …</button>
    <button class="btn sm" id="verBtn" title="Frühere Stände dieser Kostenermittlung ansehen und wiederherstellen">↶ Verlauf</button>
    <span class="fill"></span>
    <span class="save" id="save" role="status"></span>
  </div>
  <div class="stufen"><span class="lbl">Stufe DIN 276</span><div class="pills" id="stufen" style="display:flex;gap:.35rem;flex-wrap:wrap"></div></div>
  <p class="stinfo" id="stinfo"></p>
  <nav class="tabs" id="tabs" aria-label="Bereiche"></nav>
  <div id="view"></div>
</main>
<input type="file" id="pdfIn" accept="application/pdf,.pdf" multiple class="hidden">
<script src="static/bp.js"></script>
<script>
const TABS = [['uebersicht', 'Übersicht'], ['plaene', 'Pläne & Mengen'], ['bauteile', 'Bauteile & Material'], ['kosten', 'Kosten'], ['mittel', 'Mittelabfluss'], ['pruefung', 'Prüfung']];
// Was die Stufe bedeutet und bewirkt (Genauigkeit, Gliederungstiefe im PDF, zusätzliche Prüfregeln)
const STUFE_INFO = {
  rahmen: { lph: 'LPH 1 · Grundlagen', ebene: 1, genau: 35, txt: 'Gesamtkosten aus Fläche × Kennwert, Gliederung nach der 1. Ebene.' },
  schaetzung: { lph: 'LPH 2 · Vorplanung', ebene: 2, genau: 25, txt: 'Gliederung mindestens bis zur 2. Ebene (z. B. 330 Außenwände).' },
  berechnung: { lph: 'LPH 3 · Entwurf', ebene: 3, genau: 15, txt: 'Gliederung bis zur 3. Ebene; alle Räume bestätigt, Aufteilung auf die 2. Ebene nötig.' },
  voranschlag: { lph: 'LPH 6 · Vorbereitung der Vergabe', ebene: 3, genau: 10, txt: 'Bepreiste Leistungsverzeichnisse statt Kennwerte, gegliedert bis zur 3. Ebene bzw. nach Vergabeeinheiten.' },
  anschlag: { lph: 'LPH 7 · Vergabe', ebene: 3, genau: 8, txt: 'Angebots- und Auftragspreise statt Kennwerte – geschätzte Positionen werden in der Prüfung gemeldet.' },
  feststellung: { lph: 'LPH 8 · Abrechnung', ebene: 3, genau: 2, txt: 'Abgerechnete Kosten aus den Schlussrechnungen – geschätzte Positionen werden in der Prüfung gemeldet.' },
};
const STUFEN = [['rahmen', 'Kostenrahmen'], ['schaetzung', 'Kostenschätzung'], ['berechnung', 'Kostenberechnung'], ['voranschlag', 'Kostenvoranschlag'], ['anschlag', 'Kostenanschlag'], ['feststellung', 'Kostenfeststellung']];
let VG = null;   // eigene Vergleichsobjekte und importierte Kennwerte
const vgOf = (label) => VG && VG.auswertung[(label || '').toLowerCase().replace(/[^a-z0-9äöüß]+/g, ' ').trim()];
const vgHint = (t) => { const v = vgOf(t.label); return v ? `<div class="hint" style="font-size:.72rem;white-space:nowrap" title="${esc(v.werte.map((w) => `${w.obj}: ${Math.round(w.kw).toLocaleString('de-DE')} €`).join('\n'))}">Vergleich Ø ${Math.round(v.mittel).toLocaleString('de-DE')} € (${v.n}${v.n > 1 ? `, ${Math.round(v.min).toLocaleString('de-DE')}–${Math.round(v.max).toLocaleString('de-DE')}` : ''})</div>` : ''; };
let LIST = [], B = null, FLOW = null, CHECK = null, SRC = null, tab = (location.hash || '').slice(1) || 'uebersicht', selFile = null, selRoom = null, saveT = 0, saving = false;
const eur = (v) => (v == null ? '–' : Math.round(v).toLocaleString('de-DE') + ' €');
const m2 = (v) => (+v || 0).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (v) => (+v || 0).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' %';
const pnum = (s) => { const v = parseFloat(String(s).replace(/\./g, '').replace(',', '.')); return isFinite(v) ? v : 0; };
const ym = (s) => { const [y, m] = s.split('-'); return ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'][+m - 1] + ' ' + y.slice(2); };

/* ---------- Rechnen (wie auf dem Server, damit Eingaben sofort wirken) ---------- */
const btBetrag = (b) => Math.round((+b.menge || 0) * (+b.ep || 0) * 100) / 100;
function calc(d) {   // wie calc() auf dem Server
  const ju = Object.assign({ region: 100, preis: 100, rest: 'kw', f: 1 }, d.justage || {}), jf = ju.region / 100 * ju.preis / 100;
  const by = {}; d.rooms.forEach((r) => { const t = by[r.typ] ||= { area: 0, n: 0 }; t.area += +r.area || 0; t.n++; });
  let raw = 0; const types = Object.entries(d.types).map(([k, t]) => { const a = by[k] || { area: 0, n: 0 }; const s = a.area * t.kw; raw += s; return { typ: k, label: t.label, n: a.n, area: a.area, kw: t.kw, sum: s }; });
  let bau = raw * jf; const bauKw = bau; let k300 = bau * d.kg['300'] / 100, k400 = bau * d.kg['400'] / 100; const kg2 = {};
  const J = { region: ju.region, preis: ju.preis, faktor: jf, rest: ju.rest, rest_f: 1, k: null, bt_wert: 0, bt_kw: 0, rest_kw: 0, rest_wert: 0 };
  const bts = (d.bauteile || []).filter((b) => /^[34]\d\d$/.test(b.kg || ''));
  if (bts.length) {   // Bauteile ersetzen in ihrer Gruppe der 2. Ebene den Kennwert-Anteil
    const sums = {}; bts.forEach((b) => { const k = b.kg.slice(0, 2) + '0', x = sums[k] ||= { wert: 0, n: 0 }; x.wert += btBetrag(b); x.n++; });
    const std = (B && B.kg2_std) || {}, anteil = {};
    for (const [main, base] of [['3', k300], ['4', k400]]) {
      let src = Object.fromEntries(Object.entries(Object.keys(d.kg2 || {}).length ? d.kg2 : std).filter(([k]) => k[0] === main));
      if (!Object.keys(src).length) src = Object.fromEntries(Object.entries(std).filter(([k]) => k[0] === main));
      const ssum = Object.values(src).reduce((a, x) => a + +x, 0) || 1;
      for (const k of new Set([...Object.keys(src), ...Object.keys(sums).filter((x) => x[0] === main)])) anteil[k] = base * (src[k] || 0) / ssum;
    }
    J.bt_wert = Object.values(sums).reduce((a, x) => a + x.wert, 0);
    J.bt_kw = Object.keys(sums).reduce((a, k) => a + (anteil[k] || 0), 0);
    J.k = J.bt_kw ? J.bt_wert / J.bt_kw : null;
    J.rest_f = ju.rest === 'angl' ? (J.k || 1) : ju.rest === 'eigen' ? +ju.f || 1 : 1;
    const tot = { 3: 0, 4: 0 };
    for (const k of Object.keys(anteil).sort()) {
      if (sums[k]) kg2[k] = { wert: sums[k].wert, quelle: 'bauteile', n: sums[k].n, kennwert: anteil[k] };
      else { kg2[k] = { wert: anteil[k] * J.rest_f, quelle: 'kennwerte', n: 0, kennwert: anteil[k] }; J.rest_kw += anteil[k]; J.rest_wert += kg2[k].wert; }
      tot[k[0]] += kg2[k].wert;
    }
    k300 = tot[3]; k400 = tot[4]; bau = k300 + k400;
  }
  const extra = d.items.reduce((s, i) => s + (i.kg !== '700' && i.amount != null ? +i.amount : 0), 0);
  const nk = (bau + extra) * d.nk / 100, area = d.rooms.reduce((s, r) => s + (+r.area || 0), 0), risiko = (bau + extra + nk) * (+d.risiko || 0) / 100;
  return { types, kw_summe: raw, bauwerk: bau, bauwerk_kw: bauKw, kg2, justage: J, kg300: k300, kg400: k400, extra, nk, risiko, total: bau + extra + nk + risiko, area, kw: area ? bau / area : 0 };
}
/* Justage: Kennwerte an Region und Preisstand anpassen; Gruppen ohne Bauteile angleichen */
const fx = (v, n = 2) => (v == null ? '–' : (Math.round(v * 10 ** n) / 10 ** n).toLocaleString('de-DE', { minimumFractionDigits: n }));
/* Abweichung in Worten: „Bauteile 89 % mehr als Kennwert“ */
const vglTxt = (wert, kw, kurz) => { if (!kw) return '–'; const d = Math.round((wert / kw - 1) * 100); return Math.abs(d) < 1 ? (kurz ? 'wie Kennwert' : 'Bauteile wie Kennwert') : `${kurz ? '' : 'Bauteile '}${Math.abs(d)} % ${d > 0 ? 'mehr' : 'weniger'} als Kennwert`; };
const kPct = (k) => vglTxt(k || 1, 1);
/* Empfehlung für die Kostengruppen ohne Bauteile – aus Abweichung (k), Zahl der bepreisten Gruppen und ihrem Anteil am Bauwerk */
function juEmpfehlung(J) {
  const n = Object.values(B.calc.kg2 || {}).filter((x) => x.quelle === 'bauteile').length, cov = J.bt_kw / ((J.bt_kw + J.rest_kw) || 1), k = J.k || 1, p = Math.round(cov * 100);
  if (k >= 0.9 && k <= 1.1) return { v: 'kw', s: 'Kennwert-Anteil unverändert lassen', t: `Bauteile und Kennwerte passen zusammen (Abweichung unter 10 %). Die übrigen Gruppen können beim Kennwert bleiben.` };
  if (n < 2 || cov < 0.25) return { v: 'kw', s: 'Kennwert-Anteil lassen, weitere Gruppen bepreisen', t: `Erst ${n} Gruppe${n === 1 ? '' : 'n'} mit Bauteilen (${p} % des Bauwerks) – zu wenig, um auf das ganze Gebäude zu schließen. Kennwert-Anteil lassen, Mengen und Einheitspreise der Bauteile prüfen und weitere Gruppen bepreisen.` };
  if (k < 0.9) return { v: 'kw', s: 'Bauteile auf Vollständigkeit prüfen, Kennwert-Anteil lassen', t: `Die Bauteile liegen unter dem Kennwert-Anteil ihrer Gruppen (${kPct(k)}). Meist fehlen dort noch Positionen – z. B. Fenster und Türen in 330, Bekleidungen, Beläge, Abdichtung oder Baustelleneinrichtung. Kennwert-Anteil der übrigen Gruppen lassen und die bepreisten Gruppen auf Vollständigkeit prüfen. Sind sie vollständig und das Büro baut wirklich günstiger, den Faktor unter „eigener Faktor“ eintragen.` };
  if (k > 1.6 && J.region === 100 && J.preis === 100) return { v: 'preis', p: Math.round(k * 100), s: `Preisstand auf ${Math.round(k * 100)} % anpassen`, t: `Die Bauteile liegen sehr weit vom Kennwert entfernt (${kPct(k)}), obwohl ${p} % des Bauwerks bepreist sind. Das spricht für Kennwerte mit altem Preisstand oder anderer Region. Empfehlung: Preisstand bzw. Regionalfaktor anpassen (gleicht alle Kennwerte an) – vorher Mengen und Einheitspreise auf Ausreißer prüfen.` };
  return { v: 'angl', s: 'übrige Gruppen an die Bauteile angleichen', t: `${n} Gruppen mit Bauteilen decken ${p} % des Bauwerks ab – ${kPct(k)}. Das ist ein belastbarer Hinweis auf das Preisniveau – die übrigen Gruppen angleichen, sonst werden zwei Preisniveaus gemischt.` };
}
function justageHtml() {
  const J = B.calc.justage || { region: 100, preis: 100, faktor: 1, rest: 'kw' }, ju = B.data.justage || {}, bt = J.bt_kw > 0;

  const rad = (v, l, x = '') => `<label class="chk" style="color:var(--ink);align-items:flex-start"><input type="radio" name="juRest" data-ju="rest" value="${v}"${cur === v ? ' checked' : ''}><span>${l}${E && E.v === v ? ' <span class="pill ok">empfohlen</span>' : ''}${x}</span></label>`;
  const ok = E && (E.v === cur || (E.v === 'preis' && Math.abs(J.preis - E.p) < 1));
  const emp = E ? `<div class="card" style="margin:.6rem 0;padding:.6rem .8rem;border-color:${ok ? 'var(--ok)' : 'var(--y)'}"><b style="font-size:.9rem">${ok ? '✓ ' : '💡 '}Empfehlung</b> <a href="#" data-act="juWarum" class="hint">Warum?</a><p class="hint" style="margin:.2rem 0 ${ok ? 0 : '.5rem'}">${esc(E.t)}</p>
    ${ok ? '' : E.v === 'preis' ? `<button class="btn sm" data-act="juEmpf" data-v="preis" data-p="${E.p}">Preisstand auf ${E.p} % setzen</button>` : `<button class="btn sm" data-act="juEmpf" data-v="${E.v}">Empfehlung übernehmen</button>`}</div>` : '';
  return `<section class="card" id="justage" style="margin-bottom:1rem"><h2 style="margin:0">Justage</h2>
    <p class="sub" style="margin:.3rem 0 .6rem">Kennwerte sind Durchschnittswerte zu einem bestimmten Preisstand. Hier passt du sie an Ort und heutige Preise an – Bauteile mit eigenen Einheitspreisen bleiben unberührt.</p>
    <div class="row"><label>Regionalfaktor in %<input class="n" style="width:110px" data-ju="region" value="${fx(J.region, 1)}" inputmode="decimal" title="100 = Bundesdurchschnitt; z. B. aus den BKI-Regionalfaktoren für den Landkreis"></label>
      <label>Preisstand in %<input class="n" style="width:110px" data-ju="preis" value="${fx(J.preis, 1)}" inputmode="decimal" title="Baupreisindex heute ÷ Index zum Stand der Kennwerte × 100"></label>
      <span class="hint" style="align-self:flex-end;padding-bottom:.45rem">= Faktor ${fx(J.faktor, 3)} auf alle Kennwerte</span></div>
    ${bt ? `<div style="margin-top:.8rem"><b style="font-size:.9rem">Kostengruppen ohne Bauteile</b>
      <div class="tbl" style="margin:.4rem 0"><table><thead><tr><th>Gruppen mit Bauteilen</th><th class="r">Kennwert-Anteil</th><th class="r">Bauteile</th><th class="r">Abweichung</th></tr></thead>
        <tbody><tr><td>${Object.entries(B.calc.kg2 || {}).filter(([, x]) => x.quelle === 'bauteile').map(([k]) => k).join(', ')}</td><td class="r num">${eur(J.bt_kw)}</td><td class="r num">${eur(J.bt_wert)}</td><td class="r"${J.k && (J.k > 1.4 || J.k < 0.7) ? ' style="color:#e07b3a"' : ''}>${vglTxt(J.bt_wert, J.bt_kw)}</td></tr></tbody></table></div>${emp}
      <div style="display:flex;flex-direction:column;gap:.3rem">${rad('kw', 'Kennwert-Anteil unverändert', ' <span class="hint">– mischt zwei Preisniveaus, wenn der Faktor deutlich von 1 abweicht</span>')}
      ${rad('angl', `an die Bauteile angleichen (${J.k >= 1 ? '+' : '−'}${Math.abs(Math.round((J.k - 1) * 100))} %)`, ' <span class="hint">– unterstellt, dass die übrigen Gewerke ebenso abweichen</span>')}
      ${rad('eigen', 'eigener Faktor', ` <input class="n" style="width:80px;margin-left:.4rem" data-ju="f" value="${fx(ju.f || 1)}" inputmode="decimal" aria-label="eigener Faktor">`)}</div></div>` : ''}</section>`;
}

/* ---------- Rückgängig / Wiederholen: eigene Eingaben, Löschen und automatische Übernahmen ---------- */
let HIST = { id: null, last: null, undo: [], redo: [] };
const histLabel = (a, b) => {
  try {
    const A = JSON.parse(a), Bd = JSON.parse(b);
    if (Bd.rooms.length < A.rooms.length) return `${A.rooms.length - Bd.rooms.length === 1 ? 'Raum' : (A.rooms.length - Bd.rooms.length) + ' Räume'} gelöscht`;
    if (Bd.rooms.length > A.rooms.length) return `${Bd.rooms.length - A.rooms.length} Räume hinzugefügt`;
    if (Bd.items.length < A.items.length) return 'Position gelöscht';
    if (Bd.items.length > A.items.length) return 'Positionen hinzugefügt';
    if (JSON.stringify(A.rooms.map((r) => r.ok)) !== JSON.stringify(Bd.rooms.map((r) => r.ok))) return 'Bestätigung geändert';
  } catch { /* egal */ }
  return 'Änderung';
};
function histTrack() {   // nach jeder Änderung aufrufen: alten Stand merken
  if (!B) return;
  const cur = JSON.stringify(B.data);
  if (HIST.id !== B.id) { HIST = { id: B.id, last: cur, undo: [], redo: [] }; histUi(); return; }
  if (cur === HIST.last) return;
  HIST.undo.push({ data: HIST.last, label: histLabel(HIST.last, cur) }); if (HIST.undo.length > 60) HIST.undo.shift();
  HIST.redo = []; HIST.last = cur; histUi();
}
function histGo(dir) {
  histTrack();
  const from = dir < 0 ? HIST.undo : HIST.redo, to = dir < 0 ? HIST.redo : HIST.undo, s = from.pop(); if (!s) return;
  to.push({ data: HIST.last, label: s.label });
  B.data = JSON.parse(s.data); HIST.last = s.data; CHECK = null;
  changed(); histUi(); toast(`${dir < 0 ? 'Rückgängig' : 'Wiederholt'}: ${s.label}`);
}
function histUi() {
  let el = $('#histBar');
  if (!el) { el = document.createElement('div'); el.id = 'histBar'; el.innerHTML = '<button class="btn" data-hist="-1">↶ Rückgängig</button><button class="btn" data-hist="1" title="Wiederholen (Strg+Y)">↷</button>'; document.body.appendChild(el);
    el.addEventListener('click', (e) => { const b = e.target.closest('[data-hist]'); if (b) histGo(+b.dataset.hist); }); }
  const u = HIST.undo[HIST.undo.length - 1], r = HIST.redo[HIST.redo.length - 1];
  el.hidden = !B || (!u && !r);
  const bu = el.querySelector('[data-hist="-1"]'), br = el.querySelector('[data-hist="1"]');
  bu.disabled = !u; bu.title = u ? `Rückgängig: ${u.label} (Strg+Z)` : 'Nichts rückgängig zu machen'; bu.textContent = u ? `↶ ${u.label}` : '↶ Rückgängig';
  br.disabled = !r; br.title = r ? `Wiederholen: ${r.label} (Strg+Y)` : 'Nichts zu wiederholen';
}
document.addEventListener('keydown', (e) => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey || document.querySelector('.modal-bg')) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '')) return;   // im Feld macht der Browser selbst rückgängig
  const k = e.key.toLowerCase();
  if (k === 'z' && !e.shiftKey) { e.preventDefault(); histGo(-1); } else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); histGo(1); }
});

/* ---------- Planvorschau zoomen und verschieben ---------- */
let ZM = { key: '', s: 1, x: 0, y: 0 };
function zmApply() {
  const pz = $('#pz'), box = $('#planBox'); if (!pz || !box) return;
  const W = box.clientWidth, H = pz.offsetHeight;
  ZM.s = Math.max(1, Math.min(10, ZM.s));
  ZM.x = Math.min(0, Math.max(W - W * ZM.s, ZM.x)); ZM.y = Math.min(0, Math.max(H - H * ZM.s, ZM.y));
  pz.style.transform = `translate(${ZM.x}px,${ZM.y}px) scale(${ZM.s})`; pz.style.setProperty('--z', ZM.s);
  const p = $('#pzp'); if (p) p.textContent = Math.round(ZM.s * 100) + ' %';
}
function zmAt(f, px, py) { const ns = Math.max(1, Math.min(10, ZM.s * f)); ZM.x = px - (px - ZM.x) * ns / ZM.s; ZM.y = py - (py - ZM.y) * ns / ZM.s; ZM.s = ns; zmApply(); }
function zmInit() {
  const box = $('#planBox'); if (!box) return;
  const key = B.id + ':' + selFile; if (ZM.key !== key) ZM = { key, s: 1, x: 0, y: 0 };
  const img = box.querySelector('img'); if (img.complete) zmApply(); else img.onload = zmApply;
  const pt = new Map(); let last = null, moved = 0, pinch = null;
  const rel = (e) => { const r = box.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  box.addEventListener('wheel', (e) => { e.preventDefault(); const [x, y] = rel(e); zmAt(Math.exp(-e.deltaY * 0.0015), x, y); }, { passive: false });
  box.addEventListener('dblclick', (e) => { if (e.target.closest('.pzc')) return; const [x, y] = rel(e); if (ZM.s >= 6) { ZM.s = 1; ZM.x = ZM.y = 0; zmApply(); } else zmAt(2, x, y); });
  box.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.pzc')) return;
    pt.set(e.pointerId, rel(e)); moved = 0; last = rel(e);
    if (pt.size === 2) { const [a, b] = [...pt.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: ZM.s }; }
  });
  box.addEventListener('pointermove', (e) => {
    if (!pt.has(e.pointerId)) return;
    const p = rel(e); pt.set(e.pointerId, p);
    if (pt.size === 2 && pinch) { const [a, b] = [...pt.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); zmAt(pinch.s * d / pinch.d / ZM.s, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); moved = 99; return; }
    const dx = p[0] - last[0], dy = p[1] - last[1]; last = p; moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 4 && ZM.s > 1) { if (!box.hasPointerCapture(e.pointerId)) box.setPointerCapture(e.pointerId); box.classList.add('drag'); ZM.x += dx; ZM.y += dy; zmApply(); }
  });
  const end = (e) => { pt.delete(e.pointerId); if (pt.size < 2) pinch = null; if (!pt.size) { box.classList.remove('drag'); if (moved > 4) box.dataset.dragged = '1'; } };
  box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end);
  box.addEventListener('click', (e) => { if (box.dataset.dragged) { delete box.dataset.dragged; e.stopPropagation(); e.preventDefault(); } }, true);
  box.querySelector('.pzc').addEventListener('click', (e) => { const b = e.target.closest('[data-zm]'); if (!b) return; const W = box.clientWidth / 2, H = box.clientHeight / 2;
    if (b.dataset.zm === '0') { ZM.s = 1; ZM.x = ZM.y = 0; zmApply(); } else zmAt(b.dataset.zm === '+' ? 1.5 : 1 / 1.5, W, H); });
}

      <select id="nkPlan"><option value="">– später wählen –</option>${SRC.plans.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select>
    </div>
    <div class="acts"><button class="btn" data-m="x">Abbrechen</button><button class="btn pri" data-m="ok">Anlegen</button></div>`,
  async (m, bgx, close, btn) => {
    if (m === 'x') { close(); return; }
    if (m !== 'ok') return;
    if (!sel) { toast('Bitte ein Projekt wählen – oder „Ohne Projekt“.', true); $('#nkQ').focus(); return; }
    btn.disabled = true; btn.textContent = 'Lege an …';
    try {
      let pid = sel.kind === 'bt' ? sel.id : null;
      if (sel.kind === 'folder') { const r = await api('api/bautagebuch-projekt', 'POST', { name: sel.name }); pid = r.id; toast(`Projekt „${sel.name}“ im Bautagebuch angelegt.`); }
      const r = await api('api/bk', 'POST', { name: $('#nkName').value.trim() || sel.name, project_id: pid, gantt_id: $('#nkPlan').value || null, stufe: $('#nkStufe').value });
      close(); SRC = null; tab = 'uebersicht'; await loadList(r.id);
    } catch (e) { btn.disabled = false; btn.textContent = 'Anlegen'; toast(e.message, true); }
  });
  bg.querySelector('.modal').style.width = 'min(620px, 100%)';
  const stufeName = () => (STUFEN.find((x) => x[0] === $('#nkStufe').value) || [, ''])[1];
  const setName = () => { if (!nameTouched && sel) $('#nkName').value = (sel.kind === 'none' ? '' : sel.name + ' – ') + stufeName(); };
  const draw = () => {
    const q = $('#nkQ').value.trim().toLowerCase(), words = q.split(/\s+/).filter(Boolean);
    const hit = (t) => words.every((w) => t.toLowerCase().includes(w));
    const pr = SRC.projects.filter((p) => !p.archived || q).filter((p) => !q || hit(p.name + ' ' + (p.client || '') + ' ' + (p.address || ''))).slice(0, q ? 30 : 8);
    const fo = folders.filter((f) => !SRC.projects.some((p) => p.name.toLowerCase() === f.toLowerCase()));
    const opt = (kind, key, title, sub, extra = '') => `<button type="button" role="option" class="nkOpt ${sel && sel.kind === kind && String(sel.key) === String(key) ? 'on' : ''}" data-k="${kind}" data-key="${esc(String(key))}" aria-selected="${!!(sel && sel.kind === kind && String(sel.key) === String(key))}"><b>${esc(title)}</b>${extra}${sub ? `<small>${esc(sub)}</small>` : ''}</button>`;
    $('#nkList').innerHTML = (pr.length ? `<div class="nkGrp">Projekte im Bautagebuch</div>` + pr.map((p) => opt('bt', p.id, p.name, [p.client, p.address].filter(Boolean).join(' · ') + (p.archived ? ' · archiviert' : ''))).join('') : '')
      + (fo.length ? `<div class="nkGrp">Ordner auf dem Server – noch kein Projekt</div>` + fo.map((f) => opt('folder', f, f, 'wird beim Anlegen im Bautagebuch als Projekt angelegt', '<span class="pill y">neu</span>')).join('') : '')
      + (q && !pr.length && !fo.length ? `<p class="hint" style="padding:.6rem .8rem;margin:0">Nichts gefunden zu „${esc(q)}“${q.length < 2 ? '' : ' – auch kein Ordner auf dem Server'}.</p>` : '')
      + `<div class="nkGrp">Sonstiges</div>` + opt('none', 'none', 'Ohne Projekt anlegen', 'z. B. für eine erste Machbarkeitsschätzung');
  };
  $('#nkQ').addEventListener('input', () => {
    draw(); clearTimeout(fT); const q = $('#nkQ').value.trim();
    if (q.length < 2) { folders = []; draw(); return; }
    fT = setTimeout(async () => { try { const r = await api('api/folders?q=' + encodeURIComponent(q)); if (q === $('#nkQ').value.trim()) { folders = r; draw(); } } catch { /* ohne Vorschläge */ } }, 250);
  });
  $('#nkList').addEventListener('click', (e) => {
    const o = e.target.closest('[data-k]'); if (!o) return;
    const k = o.dataset.k, key = o.dataset.key;
    if (k === 'bt') { const p = SRC.projects.find((x) => String(x.id) === key); sel = { kind: k, key, id: p.id, name: p.name }; const pl = SRC.plans.find((x) => x.project_id === p.id); if (pl) $('#nkPlan').value = pl.id; }
    else if (k === 'folder') sel = { kind: k, key, name: key };
    else sel = { kind: 'none', key: 'none', name: '' };
    setName(); draw(); $('#nkName').focus();
  });
  $('#nkName').addEventListener('input', () => { nameTouched = true; });
  $('#nkStufe').addEventListener('change', setName);
  draw(); $('#nkQ').focus();
}
/* ---------- Erklärung der Justage-Empfehlung ---------- */
function juWarum() {
  const J = B.calc.justage || {}; if (!J.bt_kw) return;
  const E = juEmpfehlung(J), n = Object.values(B.calc.kg2 || {}).filter((x) => x.quelle === 'bauteile').length, cov = Math.round(J.bt_kw / ((J.bt_kw + J.rest_kw) || 1) * 100);
  const z = (c, t) => `<tr${c ? ' style="background:rgba(127,127,127,.12);font-weight:600"' : ''}><td>${t[0]}</td><td>${t[1]}</td></tr>`;
  modalBox(`<h3>Warum diese Empfehlung?</h3>
    <p>Hat eine Kostengruppe der 2. Ebene Bauteile mit Menge und Einheitspreis, ersetzen sie dort den Anteil aus den Raumtyp-Kennwerten. Die übrigen Gruppen stehen weiter beim Kennwert. Weichen beide stark voneinander ab, ergibt die Summe einen <b>Mischwert aus zwei Preisniveaus</b> – die Justage legt fest, wie die übrigen Gruppen damit umgehen.</p>
    <div class="tbl" style="margin:.6rem 0"><table><tbody>
      <tr><td>Gruppen mit Bauteilen</td><td class="r">${n} (${cov} % des Bauwerks)</td></tr>
      <tr><td>Kennwert-Anteil dieser Gruppen</td><td class="r num">${eur(J.bt_kw)}</td></tr>
      <tr><td>Bauteile dieser Gruppen</td><td class="r num">${eur(J.bt_wert)}</td></tr>
      <tr><td>Abweichung</td><td class="r"><b>${vglTxt(J.bt_wert, J.bt_kw)}</b></td></tr></tbody></table></div>
    <h4 style="margin:.8rem 0 .3rem">So entscheidet die App</h4>
    <div class="tbl"><table><thead><tr><th>Lage</th><th>Empfehlung</th></tr></thead><tbody>
      ${z(E.v === 'kw' && J.k >= 0.9 && J.k <= 1.1, ['Abweichung höchstens 10 %', 'Kennwert-Anteil unverändert – beide Preisniveaus passen'])}
      ${z(E.s.startsWith('Kennwert-Anteil lassen'), ['nur 1 Gruppe oder unter 25 % des Bauwerks bepreist', 'Kennwert-Anteil lassen – zu wenig, um aufs ganze Gebäude zu schließen'])}
      ${z(E.s.startsWith('Bauteile auf'), ['Bauteile günstiger als der Kennwert', 'meist fehlen Positionen (Fenster, Beläge, Abdichtung …) – erst vervollständigen'])}
      ${z(E.v === 'angl', ['mind. 2 Gruppen und 25 % bepreist, Bauteile 10–60 % teurer', 'übrige Gruppen angleichen – die Bauteile zeigen das tatsächliche Preisniveau'])}
      ${z(E.v === 'preis', ['Bauteile mehr als 60 % teurer, noch keine Justage', 'Preisstand/Region anpassen – die Kennwerte sind vermutlich veraltet'])}
    </tbody></table></div>
    <h4 style="margin:.8rem 0 .3rem">Hier: ${esc(E.s)}</h4><p class="hint" style="margin:0">${esc(E.t)}</p>
    <h4 style="margin:.8rem 0 .3rem">Die Möglichkeiten</h4>
    <ul style="margin:0;padding-left:1.2rem;font-size:.92rem"><li><b>Kennwert-Anteil unverändert</b> – sicher, solange Bauteile und Kennwerte zusammenpassen.</li>
      <li><b>an die Bauteile angleichen</b> – überträgt die Abweichung der bepreisten auf alle übrigen Gruppen.</li>
      <li><b>eigener Faktor</b> – wenn du das Preisniveau des Projekts besser kennst (z. B. aus Angeboten).</li>
      <li><b>Regionalfaktor / Preisstand</b> – ändert alle Kennwerte (Ort, Baupreisindex); die Bauteile bleiben, wie sie sind.</li></ul>
    <p class="hint">Die Empfehlung ist eine Hilfe. Entscheidend bleibt deine fachliche Einschätzung des Projekts.</p>
    <div class="acts"><button class="btn" data-m="x">Schließen</button>${E.v === 'preis' ? `<button class="btn pri" data-m="ok">Preisstand auf ${E.p} % setzen</button>` : `<button class="btn pri" data-m="ok">Empfehlung übernehmen</button>`}</div>`, (m, bg, close) => {
    if (m === 'x') { close(); return; }
    close(); const j = B.data.justage ||= { region: 100, preis: 100, rest: 'kw', f: 1 };
    if (E.v === 'preis') { j.preis = Math.max(30, Math.min(400, E.p)); j.rest = 'kw'; } else j.rest = E.v;
    toast('Empfehlung übernommen.'); changed();
  }).querySelector('.modal').style.width = 'min(760px, 96vw)';
}
/* ---------- Kennwerte importieren, Kostendatenbanken ---------- */
function vgImport() {
  modalBox(`<h3>Kennwerte importieren</h3><p class="hint">Export aus einer Kostendatenbank oder eine eigene Liste als Excel (.xlsx) oder CSV: je Zeile eine Bezeichnung (z. B. „Büro“, „Wohnen“, „Sanitär“ – wie die Raumtypen) und ein Kennwert in € je m² Raumfläche (KG 300 + 400, netto). Weitere Spalten werden ignoriert.</p>
    <div class="fm" style="display:grid;gap:.6rem"><label>Quelle<input id="iQ" placeholder="z. B. BKI Baukosten 2026, Büro-Neubau" style="width:100%"></label>
    <label>Kostenstand<input type="month" id="iS" value="${new Date().toISOString().slice(0, 7)}"></label><input type="file" id="iF" accept=".xlsx,.csv,.txt"></div>
    <div class="acts"><button class="btn" data-m="x">Abbrechen</button><button class="btn pri" data-m="ok">Importieren</button></div>`, async (m, bg, close) => {
    if (m === 'x') { close(); return; }
    const f = $('#iF', bg).files[0]; if (!f) { toast('Bitte eine Datei wählen.', true); return; }
    const fd = new FormData(); fd.append('file', f); fd.append('quelle', $('#iQ', bg).value.trim() || f.name); fd.append('stand', $('#iS', bg).value);
    try { const r = await fetch('api/vergleich/import', { method: 'POST', body: fd }); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); VG = j; close(); toast(`${j.n} Kennwerte importiert.`); render(); } catch (e) { toast(e.message, true); }
  });
}
async function diensteDialog(host) {
  let D; try { D = await api('api/dienste'); } catch (e) { toast(e.message, true); return; }
  const dis = D.admin ? '' : ' disabled';
  boxIn(host)(`<h3>Kostendatenbanken (kostenpflichtig)</h3><p class="hint">Für genauere Kennwerte nach DIN 276 bieten diese Anbieter Daten aus abgerechneten Projekten an. Eine direkte Abfrage geben sie nur für Software-Partner frei – bis dahin die Kennwerte dort als Excel/CSV exportieren und unter „Kennwerte importieren“ einlesen. Die Zugangsdaten werden hier schon hinterlegt (nur der Administrator sieht und ändert sie; Kennwörter werden nie angezeigt).</p>
    ${D.dienste.map((x) => `<div class="card" style="margin:.6rem 0;padding:.7rem .9rem"><label class="chk" style="font-weight:600"><input type="checkbox" data-dk="${x.key}" data-df="an"${x.an ? ' checked' : ''}${dis}> ${esc(x.name)}</label>
      <p class="hint" style="margin:.2rem 0 .5rem">${esc(x.info)} · <a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url.replace('https://', ''))}</a></p>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem"><label>Benutzer<input data-dk="${x.key}" data-df="user" value="${esc(x.user)}"${dis}></label>
      <label>Kennwort<input type="password" data-dk="${x.key}" data-df="pass" placeholder="${x.pass_set ? 'hinterlegt' : ''}" autocomplete="new-password"${dis}></label>
      <label>API-Schlüssel / Lizenz<input type="password" data-dk="${x.key}" data-df="key" placeholder="${x.key_set ? 'hinterlegt' : ''}" autocomplete="new-password"${dis}></label></div></div>`).join('')}
    <div class="acts"><button type="button" class="btn" data-bph-verlauf="bk:dienste" style="margin-right:auto">↶ Verlauf</button><button class="btn" data-m="x">${D.admin ? 'Abbrechen' : 'Schließen'}</button>${D.admin ? '<button class="btn pri" data-m="ok">Speichern</button>' : ''}</div>`, async (m, bg, close) => {
    if (m === 'x') { close(); return; }
    const b = {}; bg.querySelectorAll('[data-dk]').forEach((el) => { const o = b[el.dataset.dk] ||= {}; o[el.dataset.df] = el.type === 'checkbox' ? el.checked : el.value; });
    try { await api('api/dienste', 'PUT', b); if (!host) close(); toast('Zugänge gespeichert.'); } catch (e) { toast(e.message, true); }
  });
}
/* ---------- Hinweis beim Öffnen (abschaltbar) ---------- */
async function hinweis() {
  let K = null; try { K = await api('api/bp/konto'); } catch { return; }
  if ((K.hinweise_aus || []).includes('baukosten')) return;
  modalBox(`<h3>Baukosten – bitte kurz lesen</h3>
    <p>Die App ermittelt Kosten nach <b>DIN 276:2018-12</b> (Stufen Kostenrahmen bis Kostenfeststellung, Gliederung bis zur 3. Ebene, Kostenstand und Kostenrisiken gesondert ausgewiesen). Unter „Prüfung“ steht, was für die gewählte Stufe nach der Norm noch fehlt.</p>
    <p><b>Die Kennwerte sind Annahmen</b>: vorgegebene Beispielwerte, eigene Werte des Büros, Vergleichsobjekte oder importierte Werte aus Kostendatenbanken. Die Ergebnisse sind nur so gut wie diese Kennwerte, die Flächen und die eingetragenen Mengen – bitte jede Ermittlung fachlich prüfen, bevor sie den Bauherrn erreicht. Vorschläge der KI sind Hilfen, keine Kalkulation.</p>
    <p><b>Besser werden</b>: abgerechnete Projekte unter „Kosten → Vergleichsobjekte“ speichern, Kennwerte aus BKI & Co. importieren (Zugänge unter „Kostendatenbanken“), Kennwerte mit Region und Preisstand justieren.</p>
    <label class="chk" style="margin-top:.6rem"><input type="checkbox" id="hwAus"> nicht mehr anzeigen</label>
    <div class="acts"><button class="btn pri" data-m="ok">Verstanden</button></div>`, async (m, bg, close) => {
    if ($('#hwAus', bg).checked) { try { await api('api/bp/konto', 'PUT', { hinweise_aus: [...(K.hinweise_aus || []), 'baukosten'] }); } catch { /* egal */ } }
    close();
  });
}
(async () => {
  const me = await api('api/me'); applyLook(me);
  const conf = await api('api/platform');
  await header('Baukosten', me, conf);
  BPHead.appEinstellungen([{ key: 'raumtypen', label: 'Raumtypen & Kennwerte', render: (h) => typesDialog(h) },
    { key: 'dienste', label: 'Kostendatenbanken', render: (h) => diensteDialog(h) }]);
  BPHead.onKi(() => { CHECK = null; if (tab === 'pruefung') render(); });
  const hb = /^#bk=(\d+)/.exec(location.hash);   // Link aus der Verwaltung: diese Kostenermittlung öffnen
  if (!TABS.some((t) => t[0] === tab)) tab = 'uebersicht';
  if (hb) history.replaceState(null, '', location.pathname + '#' + tab);
  await loadList(hb ? +hb[1] : undefined);
  api('api/vergleich').then((v) => { VG = v; if (B && tab === 'kosten') render(); }).catch(() => {});
  hinweis();
})().catch((e) => toast(e.message, true));
$('#verBtn').onclick = async () => {
  if (!B || !window.BPHead) return;
  clearTimeout(saveT); if ($('#save').textContent.startsWith('Nicht')) await saveNow();
  BPHead.verlauf({ bereich: 'bkp:' + B.id, nach: () => openBk(B.id) });
};
window.bpNachVerlauf = () => (B ? openBk(B.id) : location.reload());
</script>
