<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#84827c">
<title>Bauplattform</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="bp/bp.css">
<link rel="stylesheet" href="static/todo.css">
<style>
main.wrap{max-width:1400px}
/* Raster der Startseite: 12 Spalten, Zeilen zu 64 px */
.raster{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:64px;gap:10px;position:relative;margin-bottom:1rem}
.ri{position:relative;min-width:0;min-height:0}
.ri>.tile{height:100%;box-sizing:border-box}
.ri-w>.ue-b,.ri-w>.post{height:100%;box-sizing:border-box;overflow:auto;margin:0;padding-bottom:.15rem;border-bottom:.6rem solid var(--card);box-shadow:0 1px 0 var(--line);scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--mute) 45%,transparent) transparent}
.ri-w>.ue-b::-webkit-scrollbar,.ri-w>.post::-webkit-scrollbar{width:6px}.ri-w>.ue-b::-webkit-scrollbar-thumb,.ri-w>.post::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--mute) 45%,transparent);border-radius:calc(3px*var(--rk,1))}.ri-w>.ue-b::-webkit-scrollbar-track,.ri-w>.post::-webkit-scrollbar-track{background:transparent}
.r-weg{display:none!important}
.ri-w [data-mehr]::after{content:"+ " attr(data-mehr) " weitere – Widget größer ziehen oder öffnen";display:block;color:var(--mute);font-size:.76rem;padding-top:.25rem}
.ri-w>.ue-b>h3,.ri-w .post-h{position:sticky;top:-.6rem;background:var(--card);z-index:3;cursor:grab;margin-top:-.6rem;padding-top:.6rem;margin-bottom:0;padding-bottom:.4rem}   /* ganz deckend: beim Rollen schaut nichts unter der Überschrift hervor */
.ri-w .post-h{top:-.9rem;margin-top:-.9rem;padding-top:.9rem}
.ri-a>.tile{cursor:pointer}.ri-a{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ri .ue-x{opacity:0}.ri:hover>.ue-x,.ri:focus-within>.ue-x{opacity:1}
.ri>.kx,.ri>.ue-x{position:absolute;top:-8px;right:-8px;z-index:4}
.ri .rz{position:absolute;right:3px;bottom:3px;width:14px;height:14px;cursor:nwse-resize;opacity:0;border-right:3px solid var(--y);border-bottom:3px solid var(--y);border-radius:0 0 calc(8px*var(--rk,1)) 0;z-index:4;touch-action:none;transition:opacity .12s}
.ri:hover>.rz{opacity:.85}@media (hover:none){.ri .rz{opacity:.35}}
.ri.zieh{z-index:30;pointer-events:none;opacity:.94}.ri.zieh>*{box-shadow:var(--sh0,0 12px 30px rgba(0,0,0,.25))}
.ri.zieh>.tile{transform:none}
.r-platz{border:2px dashed var(--y);border-radius:calc(12px*var(--rk,1));background:color-mix(in srgb,var(--y) 8%,transparent);pointer-events:none}
body.r-zieht{user-select:none;-webkit-user-select:none}body.r-zieht .ri:not(.zieh){transition:all .15s ease}
.ri.ziel>*{outline:2px dashed var(--y);outline-offset:2px}
.ri.neu>*{animation:rneu 1.2s ease}@keyframes rneu{0%,40%{box-shadow:0 0 0 3px var(--y)}100%{box-shadow:none}}
.raster.fest .kx,.raster.fest .ue-x,.raster.fest .rz,.raster.fest .ri-plus,.raster.fest .ue-grip{display:none!important}.raster.fest .ri-w>.ue-b>h3,.raster.fest .post-h{cursor:default}
.rfest{margin-left:auto;align-self:center;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:calc(999px*var(--rkp,1));padding:.3rem .8rem;font:inherit;font-size:.82rem;cursor:pointer}.rfest.on{background:var(--y);border-color:var(--y);color:var(--on);font-weight:600}.rfest[hidden]{display:none}
.ri-plus{display:flex;align-items:center;justify-content:center;gap:.3rem;border:2px dashed var(--line);border-radius:calc(10px*var(--rk,1));background:transparent;color:var(--mute);font:inherit;font-weight:600;cursor:pointer}.ri-plus:hover{border-color:var(--y);color:var(--y)}.ri-plus small{font-weight:400}
.raster.touchzieh{touch-action:none}
.wx-p{margin-left:.4rem;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:calc(999px*var(--rkp,1));padding:0 .55rem;font:inherit;font-size:.74rem;font-weight:400;cursor:pointer;max-width:14rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wx-p:hover{border-color:var(--y);color:var(--y)}
.wx-sub{margin:.1rem 0 .4rem;color:var(--mute);font-size:.78rem}
.wx-bz,.wx-ks{display:block;color:inherit;text-decoration:none}
.bz-pl{display:block;font-size:.8rem;margin:.3rem 0 .15rem}
.bz-z{display:grid;grid-template-columns:minmax(5rem,32%) 1fr;gap:.5rem;align-items:center;font-size:.8rem;padding:.08rem 0}
.bz-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.bz-b{position:relative;height:12px;background:color-mix(in srgb,var(--line) 35%,transparent);border-radius:calc(3px*var(--rk,1))}
.bz-b i{position:absolute;top:1px;bottom:1px;background:#3a7bd5;border-radius:calc(3px*var(--rk,1))}.bz-b i.v{background:#e07b3a}.bz-b i.f{background:#1f9d4c}
.bz-b i.ms{width:9px!important;height:9px;top:1px;transform:translateX(-4px) rotate(45deg);border-radius:calc(1px*var(--rk,1))}
.bz-b u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--red);opacity:.8;text-decoration:none}
.bz-l{display:inline-block;width:12px;height:7px;border-radius:calc(2px*var(--rk,1));background:#e07b3a;vertical-align:middle;margin:0 .15rem 0 .3rem}.bz-l.f{background:#1f9d4c}
.ks-z{display:grid;grid-template-columns:6.5rem 1fr auto;gap:.5rem;align-items:center;font-size:.82rem;padding:.12rem 0}.ks-z span{color:var(--mute)}.ks-z b{font-weight:600;white-space:nowrap}
.ks-b{height:10px;background:color-mix(in srgb,var(--line) 35%,transparent);border-radius:calc(3px*var(--rk,1));overflow:hidden}.ks-b i{display:block;height:100%;border-radius:calc(3px*var(--rk,1))}
/* Handy: zwei Spalten, Kacheln je eine, Widgets volle Breite, Höhe nach Inhalt (begrenzt) */
.raster.handy{grid-template-columns:1fr 1fr;grid-auto-rows:auto}
.raster.handy .ri{grid-column:auto!important;grid-row:auto!important}.raster.handy .ri-w,.raster.handy .ri-plus{grid-column:1/-1!important}
.raster.handy .ri-a>.tile{min-height:62px}.raster.handy .ri-w>.ue-b,.raster.handy .ri-w>.post{max-height:65vh}.raster.handy .rz{display:none}.raster.handy .ri-plus{min-height:48px}
.hello{margin:.1rem 0 .6rem;display:flex;align-items:baseline;gap:.2rem .8rem;flex-wrap:wrap}   /* Begrüßung und Hinweis in einer Zeile – mehr Platz für die Kacheln */
.hello h1{margin:0;font-size:1.3rem}
.hello p{margin:0;color:var(--mute);font-size:.92rem}
.pickm .pm-x a:hover{border-color:var(--y);color:var(--y)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.6rem;margin-bottom:1.4rem}
.tile{display:grid;grid-template-columns:40px minmax(0,1fr);grid-template-rows:auto auto;column-gap:.7rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:calc(10px*var(--rk,1));padding:.6rem .75rem;color:var(--ink);text-decoration:none;transition:border-color .15s,transform .15s}
.tile:hover,.tile:focus-visible{border-color:var(--y);transform:translateY(-1px)}
.tile .ic{grid-row:1/3;width:40px;height:40px;border-radius:calc(10px*var(--rk,1));display:grid;place-items:center;background:color-mix(in srgb,var(--af,var(--y)) 13%,transparent);color:var(--af,var(--y))}
.tile .ic svg{width:24px;height:24px}
.tile b{font-size:1rem;line-height:1.2;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}
.hello{position:relative}
.tile{position:relative}.tile .kx,.ri>.kx{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--mute);font-size:.72rem;line-height:1;display:grid;place-items:center;cursor:pointer;opacity:0;transition:opacity .12s;box-shadow:0 1px 4px rgba(0,0,0,.2);padding:0}
.tile:hover .kx,.tile:focus-within .kx,.ri:hover>.kx,.ri:focus-within>.kx{opacity:1}.tile .kx:hover,.ri>.kx:hover{color:var(--red);border-color:var(--red)}@media (hover:none){.tile .kx,.ri>.kx{opacity:.45;top:4px;right:4px;border:0;box-shadow:none;background:transparent}}
.tile.kadd{display:flex;align-items:center;justify-content:center;gap:.3rem;border:2px dashed var(--line);background:transparent;color:var(--mute);font:inherit;font-weight:600;cursor:pointer;min-height:62px}.tile.kadd:hover{border-color:var(--y);color:var(--y)}.tile.kadd small{font-weight:400}
.tiles:not(.edit) .tile[data-key]{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.tiles.touchzieh,.tiles.edit{touch-action:none}
.tiles.edit .tile{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none}.tiles.edit .tile .kx{display:none}
.tiles.edit .tile:hover{transform:none}
.tiles.edit .tile.zieh{opacity:.35}
.tiles.edit .tile.ziel{border-color:var(--y);border-style:solid}
.tile.leer{visibility:hidden;min-height:62px}
.tiles.edit .tile.leer{visibility:visible;background:transparent;border:1px dashed color-mix(in srgb,var(--line) 70%,transparent);cursor:default}
.tiles.edit .tile.leer.ziel{border:2px dashed var(--y);background:color-mix(in srgb,var(--y) 8%,transparent)}
.tile span.d{color:var(--mute);font-size:.8rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Post zu meinen Projekten */
.post{background:var(--card);border:1px solid var(--line);border-radius:calc(12px*var(--rk,1));padding:.9rem 1rem 1rem}
.post-h{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem}
.post-h h2{margin:0;font-size:1.1rem}.post-h .mute{font-size:.85rem}
.pg{margin-top:.8rem}.pg-h{display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:.25rem;margin-bottom:.2rem}
.pg-h b{font-size:.98rem}.pg-h small{color:var(--mute)}
.pm{display:grid;grid-template-columns:1.6rem minmax(0,1fr) auto;gap:.15rem .55rem;padding:.4rem .2rem;border-bottom:1px dashed var(--line);align-items:start}
.pm:last-child{border-bottom:0}.pm .ic2{font-size:1.05rem;line-height:1.3}
.pm .t{min-width:0}.pm .t b{font-weight:600}.pm .t .s{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm .t .v{display:block;color:var(--mute);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm .t .g{color:var(--mute);font-size:.76rem}
.pm .z{color:var(--mute);font-size:.8rem;white-space:nowrap;text-align:right}
.pm .z .ib2{border:0;background:none;cursor:pointer;font-size:1rem;padding:.15rem .2rem;opacity:.55}.pm .z .ib2:hover{opacity:1}
.pm .z .pmx{font-size:.8rem;color:var(--mute);margin-right:.2rem;opacity:.45}.pm:hover .z .pmx{opacity:.9}
.pm .z .pm-td{color:var(--y);font-weight:700;font-size:1.05rem}   /* → To-do (kein Häkchen – sieht sonst nach „erledigt“ aus) */
.post-aus{margin-top:.7rem;border-top:1px solid var(--line);padding-top:.4rem}.post-aus summary{cursor:pointer;color:var(--mute);font-size:.88rem}
.post-aus .pg-a{opacity:.75}.post-aus .pg-a>small{display:block;margin:.4rem 0 -.2rem .2rem}
.vs .vst{flex:1;min-width:12rem;font:inherit;font-weight:600}
.pm .z .pf{display:inline-block;max-width:14rem;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
@media (max-width:640px){.pm .z .pf{max-width:7rem}}
.pm .z .erl{font-size:.78rem;color:var(--y);white-space:nowrap}
.pm .z .app{font-size:.78rem;text-decoration:none}
.pm a.s{color:var(--ink);text-decoration:none}.pm a.s:hover{text-decoration:underline}
.art{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:calc(999px*var(--rkp,1));padding:0 .45rem;margin-right:.3rem;color:var(--mute)}
.art.w{border-color:#e07b3a;color:#b35a1f}
.vs{grid-column:2/4;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;background:var(--hov);border-radius:calc(8px*var(--rk,1));padding:.3rem .5rem;font-size:.86rem;margin-top:.2rem}
.vs input[type=date]{font:inherit;font-size:.85rem;padding:.1rem .3rem}
.post .fehler{color:#b33;font-size:.82rem;margin-top:.5rem}
.tile.off{opacity:.45;pointer-events:none}
.th{display:flex;gap:.35rem;flex-wrap:wrap}
.th label{border:1px solid var(--line);border-radius:calc(999px*var(--rkp,1));padding:.2rem .7rem;cursor:pointer;color:var(--mute);background:transparent}
.th label:hover{color:var(--ink)}
.th label.on{border-color:var(--y);color:var(--ink)}
.th input{position:absolute;opacity:0;pointer-events:none}
/* Einfache Ansicht: vier Aufgaben groß, Apps klein unten */
.ein{display:none}
html[data-modus="einfach"] .ein{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem;margin:0 0 1.6rem}
.ein a{position:relative;display:flex;flex-direction:column;gap:.75rem;min-height:170px;padding:1.3rem;border-radius:calc(18px*var(--rk,1));background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;transition:transform .12s,border-color .12s}
.ein a:hover,.ein a:focus-visible{border-color:var(--y);transform:translateY(-2px)}
.ein a:first-child{background:linear-gradient(145deg,color-mix(in srgb,var(--y) 20%,var(--card)) 0%,var(--card) 70%);border-color:color-mix(in srgb,var(--y) 40%,var(--line))}
.ein .ic{width:52px;height:52px;border-radius:calc(16px*var(--rk,1));display:grid;place-items:center;font-size:1.6rem}
.ein b{font-size:1.15rem;letter-spacing:-.01em}.ein small{color:var(--mute);font-size:.9rem;line-height:1.35}
.ein .go{position:absolute;right:1.1rem;top:1.3rem;color:var(--mute);font-size:1.2rem}
@media (max-width:980px){html[data-modus="einfach"] .ein{grid-template-columns:1fr 1fr}}
@media (max-width:520px){html[data-modus="einfach"] .ein{grid-template-columns:1fr}.ein a{min-height:0}}
html[data-modus="einfach"] .hello p{font-size:1.05rem}

html[data-modus="einfach"] main.wrap{display:flex;flex-direction:column}
html[data-modus="einfach"] #raster{order:5;margin-top:1.6rem}
html[data-modus="einfach"] .tile{padding:.5rem .65rem;grid-template-columns:30px minmax(0,1fr);grid-template-rows:auto;min-height:48px}html[data-modus="einfach"] .tile .ic{grid-row:1}html[data-modus="einfach"] .tile b{font-size:.92rem;line-height:1.25}html[data-modus="einfach"] .tile .ic{width:30px;height:30px}html[data-modus="einfach"] .tile .ic svg{width:18px;height:18px}html[data-modus="einfach"] .tile span.d{display:none}
html[data-modus="einfach"] .tile.leer{display:none}
html[data-modus="einfach"] .foot{order:6}
.foot{margin-top:2.4rem;color:var(--mute);font-size:.82rem;display:flex;gap:1rem;flex-wrap:wrap}
</style>
</head>
<body>
<main class="wrap">
  <div class="hello"><h1 id="hi">Willkommen</h1><p>Wähle eine App – du bist in allen Apps angemeldet.</p><button type="button" class="rfest" id="rFest" hidden></button></div>
  <nav class="ein" id="ein" aria-label="Häufige Aufgaben"></nav>
  <div class="raster" id="raster" aria-label="Startseite: Apps und Widgets"></div>
  <div hidden><section class="post" id="post" hidden aria-label="Post zu meinen Projekten"></section></div>
  <div class="foot"><span id="ver"></span></div>
</main>
<script src="bp/baukasten.js"></script>
<script src="static/todo.js"></script>
<script>
const DESC = {
  bautagebuch: ['Bautagebuch', 'Tagesberichte, Wetter, Anwesende, Fotos, Mängel und Weisungen – mit PDF.'],
  gantt: ['Bauzeitenplan', 'Terminplanung mit Gewerken, Firmen, kritischem Weg und Versionen.'],
  adressen: ['Adressen', 'Firmen, Bauherren und Baustellen – dieselben Kontakte wie im Bautagebuch und Bauzeitenplan.'],
  aufgaben: ['Aufgaben & Mängel', 'To-dos, Mängel aus den Bautagesberichten, Termine und Erinnerungen an Firmen aus den Bauzeitenplänen.'],
  plaene: ['Pläne & Dateien', 'Pläne im Projektordner mit dem neuesten Index, Gewerk erkennen, Pläne mit CAD-Dateien an die Firmen schicken, Planversandliste.'],
  kommunikation: ['Kommunikation', 'Was an wen verschickt wurde – Pläne, Mängel- und Terminrügen je Projekt und je Kontakt.'],
  zeiten: ['Zeiten', 'Arbeitszeit und Projektzeiten – Vorschläge aus deiner Arbeit in der Plattform und von der Baustelle, abends bestätigen.'],
  baudaten: ['Baudaten', 'Positionsdatenbank mit Lang- und Kurztexten, DIN-276-Kostengruppen und Preisspannen – dazu importierte Kataloge (z. B. Sirados) und eigene Preise.'],
  ava: ['Ausschreibung & Abrechnung', 'Leistungsverzeichnisse, Angebote mit Preisspiegel, Aufmaß und Rechnungsprüfung – GAEB-Austausch mit den Firmen.'],
  baukosten: ['Baukosten', 'Kosten nach DIN 276 aus Plänen (PDF) und Bauzeitenplan – mit Mittelabfluss und KI-Prüfung.'],
  honorar: ['Honorar', 'Honoraraufträge nach HOAI, nach Aufwand oder pauschal – Abgleich mit den Zeiten, Angebot als PDF. Nur Verwaltung.'],
  admin: ['Verwaltung', 'Benutzer und Rechte, angemeldete Sitzungen, Zustand der Dienste.'],
  papierkorb: ['Papierkorb', 'Gelöschtes aus allen Apps – wiederherstellen oder endgültig löschen.'],
};
/* ---------- Startseite als Raster (12 Spalten): App-Kacheln und Widgets frei verschieben (Kachel bzw. Kopf ziehen, Handy: lange drücken),
   Größe an der Ecke ↘ in Feldern, ✕ blendet aus, „＋ App / Widget“ holt zurück. Gespeichert je Benutzer (api/bp/kacheln → raster). ---------- */
let APPS = [], REIHE = [], RASTER = null, WB = [], RZIEH = null, RNEU = false;   // WB: Widgets aus deskZeigen · RZIEH: gerade gezogen
const SP = 12, ZH = 64, LUE = 10;   // Spalten, Zeilenhöhe, Abstand (px)
const RGR = { a: { w: [2, 6], h: [1, 2], d: [3, 1] }, w: { w: [3, 12], h: [2, 16], d: [6, 4] } };   // je Art: Breite/Höhe min–max, Standard
const RSTD = { 'w:post': [6, 7], 'w:todos': [6, 4], 'w:kosten': [4, 4] };
const rArt = (i) => (i[0] === 'a' ? 'a' : 'w');
const rKoll = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
const rHandy = () => innerWidth < 760;
/* eigene Widgets mit Daten aus anderen Apps; je Widget ein Projekt (o.p) oder das aktuelle. Mehrere gleiche: w:bauzeit.2 … */
const WX = { bauzeit: { name: 'Bauzeitenplan', app: 'gantt', ic: ['▤', '#1f9d4c'], d: [6, 4] }, kosten: { name: 'Kostenstand', app: 'ava', ic: ['€', '#c0392b'], d: [4, 4] },
  honorar: { name: 'Honorarstand', app: 'honorar', ic: ['§', '#6d4bd8'], d: [4, 4] } };
const wxTyp = (i) => (String(i).match(/^w:(bauzeit|kosten|honorar)(\.\d+)?$/) || [])[1];
const wxOk = (t) => APPS.some((a) => a.key === WX[t].app && a.allowed);
function rIds() {
  const extra = ((RASTER && RASTER.items) || []).map((it) => it.i).filter((i) => /\.\d+$/.test(i) && wxTyp(i) && wxOk(wxTyp(i)));
  return [...APPS.map((a) => 'a:' + a.key), 'w:post', ...WB.map((b) => 'w:' + b.k), ...Object.keys(WX).filter(wxOk).map((t) => 'w:' + t), ...extra];
}
function rWeg() { return new Set((RASTER && RASTER.weg) || []); }
function rFrei(L, w, h) { for (let y = 0; ; y++) for (let x = 0; x + w <= SP; x++) { const t = { x, y, w, h }; if (!L.some((r) => rKoll(r, t))) return t; } }
/* alles nach oben rücken, ohne Überlappung; „fest“ (gerade gezogen/vergrößert) bekommt seinen Platz zuerst */
function rVerdichten(L, fest) {
  const R = []; if (fest) R.push(fest);
  for (const it of L.filter((i) => i !== fest).sort((p, q) => p.y - q.y || p.x - q.x)) { it.y = 0; while (R.some((r) => rKoll(r, it))) it.y++; R.push(it); }
  if (fest) { const A = R.filter((r) => r !== fest); while (fest.y > 0 && !A.some((r) => rKoll(r, { ...fest, y: fest.y - 1 }))) fest.y--; }
  return L;
}
/* Raster aus dem Gespeicherten; Neues (Apps, Widgets) bekommt den ersten freien Platz. Beim ersten Mal aus der alten Kachel-Reihenfolge */
function rLayout() {
