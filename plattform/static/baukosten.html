<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1a">
<title>Baukosten</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="static/bp.css">
<style>
.wrap{max-width:1680px}   /* breite Bildschirme nutzen – das Raumbuch hat viele Spalten */
.num{white-space:nowrap;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
.r{text-align:right}
.top{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.9rem}
.top .pick{flex:1 1 280px;max-width:520px}
.top .fill{flex:1}
.bk-vm{width:280px;max-width:100%}.top #save{margin-left:auto}
.save{color:var(--mute);font-size:.85rem}
.stufen{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;margin:0 0 1rem}
.reife{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,7.5rem),1fr));gap:.45rem;margin-top:.9rem}
.reife .rf{min-width:0;overflow-wrap:anywhere}
.rf{position:relative;border:1px solid var(--line);border-radius:calc(10px*var(--rk,1));padding:.55rem .6rem;font-size:.82rem;color:var(--mute);display:flex;flex-direction:column;gap:.15rem}
.rf b{font-size:.86rem;font-weight:600}.rf.ok{border-color:color-mix(in srgb,var(--ok) 55%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent);color:var(--ink)}
.rf.ok b{color:var(--ink)}.rf.cur{outline:2px solid var(--ok);outline-offset:-1px}
.rf .pin{position:absolute;top:-.6rem;left:.5rem;background:var(--ok);color:#fff;font-size:.68rem;font-weight:700;border-radius:calc(999px*var(--rkp,1));padding:0 .45rem}
.pwarn{background:color-mix(in srgb,#f08c00 12%,transparent);border:1px solid color-mix(in srgb,#f08c00 45%,transparent);border-radius:calc(10px*var(--rk,1));padding:.6rem .8rem;font-size:.9rem;margin:.4rem 0}
.rfl{margin:.2rem 0 0;padding-left:1.2rem;font-size:.9rem;line-height:1.6}
@media (max-width:900px){.reife{grid-template-columns:repeat(3,1fr)}}
.stufen .lbl{font-size:.8rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin-right:.3rem}
.pills button{border:1px solid var(--line);color:var(--mute);border-radius:calc(999px*var(--rkp,1));padding:.35rem .85rem;font-size:.88rem;min-height:36px}
.pills button.on{border-color:var(--y);color:var(--ink);background:var(--hov);font-weight:600}
.tabs{margin:0 -1rem 1.2rem;padding:0 1rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;margin-bottom:1.2rem}
.kpi{display:flex;flex-direction:column;gap:.3rem}
.kpi .lbl{font-size:.78rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.kpi b{font-size:1.6rem;font-weight:600}
.kpi span{font-size:.85rem;color:var(--mute)}
.two{display:flex;flex-wrap:wrap;gap:1.2rem}
.two>*{flex:1 1 440px;min-width:0}
.card h2{margin:0 0 .2rem;font-size:1.05rem}
.card .sub{margin:0 0 1rem;font-size:.85rem;color:var(--mute)}
.bars{display:flex;flex-direction:column;gap:.7rem}
.bar .t{display:flex;justify-content:space-between;gap:1rem;font-size:.92rem}
.bar .tr{height:8px;background:var(--hov);border-radius:calc(4px*var(--rk,1));margin-top:.25rem}
.bar .f{height:8px;border-radius:calc(4px*var(--rk,1));background:var(--y)}
.cols{display:flex;align-items:flex-end;gap:4px;height:180px;border-bottom:1px solid var(--line);padding-top:1rem}
.cols>div{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;position:relative}
.cols .c{width:100%;max-width:42px;background:var(--y);border-radius:calc(3px*var(--rk,1)) calc(3px*var(--rk,1)) 0 0;opacity:.9}
.cols .c.i{position:absolute;bottom:0;background:transparent;border:2px solid var(--ink);border-bottom:0;opacity:.55}
.axis{display:flex;gap:4px;margin-top:.3rem}
.axis span{flex:1 1 0;text-align:center;font-size:.7rem;color:var(--mute);min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;gap:1.2rem;font-size:.82rem;color:var(--mute);margin-top:.6rem;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:calc(2px*var(--rk,1));vertical-align:-1px;margin-right:.35rem}
.alert{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-top:1.2rem}
.alert .fill{flex:1 1 280px;color:var(--mute);font-size:.92rem}
.files{display:flex;flex-direction:column;gap:.6rem}
.files .acts{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
.files .acts .btn{white-space:nowrap;flex:0 0 auto;min-width:0}
.fc{display:flex;flex-direction:column;gap:.25rem;cursor:pointer;text-align:left;color:var(--ink)}
.fc.on{border-color:var(--y);box-shadow:0 0 0 1px var(--y)}
.fc small{color:var(--mute)}
.fc .acts{display:flex;gap:.4rem;margin-top:.3rem}
.drop{border:1px dashed var(--line);border-radius:calc(10px*var(--rk,1));padding:1rem;text-align:center;color:var(--mute);cursor:pointer}
.drop:hover,.drop.on{border-color:var(--y);color:var(--ink)}
.plan{position:relative;background:#fff;border-radius:calc(8px*var(--rk,1));overflow:hidden}
.plan img{width:100%;height:auto;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.plan{touch-action:none;cursor:grab}
.card.h.go{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,transform .15s}
.card.h.go:hover,.card.h.go:focus-visible{border-color:var(--y);transform:translateX(2px)}
.card.h.go .src i{font-style:normal;margin-left:.5rem;color:var(--y)}
.bt td{vertical-align:top}
.bt select{max-width:260px}
.bt tr.bt-g td{background:var(--hov);padding-top:.55rem;padding-bottom:.45rem}
.btn.ki{border-color:color-mix(in srgb,var(--y) 60%,var(--line))}
#histBar{position:fixed;left:16px;bottom:16px;z-index:44;display:flex;gap:.35rem;background:var(--card2);border:1px solid var(--line);border-radius:calc(999px*var(--rkp,1));padding:.3rem;box-shadow:var(--sh0,0 8px 24px rgba(0,0,0,.25))}
#histBar[hidden]{display:none}
#histBar .btn{border-radius:calc(999px*var(--rkp,1));max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--y);background:color-mix(in srgb,var(--y) 18%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.plan.drag{cursor:grabbing}
.pz{position:relative;transform-origin:0 0;--z:1}
.pzc{position:absolute;right:8px;top:8px;display:flex;gap:4px;z-index:3;background:rgba(255,255,255,.92);border:1px solid #cfcbc2;border-radius:calc(999px*var(--rkp,1));padding:3px;box-shadow:var(--sh0,0 2px 8px #0003)}
.pzc button{width:30px;height:30px;border-radius:50%;color:#1c1c1a;font-size:1rem;line-height:1;padding:0}
.pzc button:hover{background:#ece9e2}
.pzc span{font:600 12px/30px ui-monospace,monospace;color:#555;min-width:44px;text-align:center}
.plan .mk{position:absolute;transform:translate(-30%,-60%) scale(calc(1 / var(--z)));transform-origin:30% 60%;min-width:22px;height:22px;padding:0 5px;border-radius:calc(11px*var(--rk,1));font:600 11px/22px ui-monospace,monospace;text-align:center;color:#fff;background:#2c5876;border:2px solid #fff;box-shadow:0 1px 4px #0006}
.plan .mk.ok{background:#2e7d4f}
.plan .mk.warn{background:#b3541e}
.plan .mk.sel{outline:3px solid var(--y)}
.pbar{display:flex;justify-content:flex-end;margin-bottom:-.6rem}
.pmodes{display:inline-flex;border:1px solid var(--line);border-radius:calc(999px*var(--rkp,1));overflow:hidden;flex:none}
.pmodes button{background:transparent;border:0;color:inherit;padding:.25rem .7rem;font-size:1rem;line-height:1.2;cursor:pointer}
.pmodes button.on{background:var(--y);color:#1c1c1a}
.pv-seite .wrap{max-width:none}.pv-seite .layout .side{flex:0 1 230px;min-width:200px}
.layout .main.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:1rem;align-items:start}
.layout .main.split .sp-r{position:sticky;top:8px;display:flex;flex-direction:column;gap:.5rem;order:2}
.layout .main.split .sp-r .pmodes{align-self:flex-end}
.layout .main.split .sp-r .plan{max-height:calc(100vh - 70px)}
.layout .main.split .sp-l{min-width:0;display:flex;flex-direction:column;gap:1rem;order:1}
.pwin{position:fixed;z-index:40;display:flex;flex-direction:column;background:var(--card,#fff);border:1px solid var(--line);border-radius:calc(12px*var(--rk,1));box-shadow:var(--sh0,0 18px 50px #0006);resize:both;overflow:hidden;min-width:280px;min-height:200px}
.pwh{display:flex;align-items:center;gap:.5rem;padding:.35rem .5rem .35rem .8rem;cursor:move;user-select:none;border-bottom:1px solid var(--line);touch-action:none}
.pwh b{flex:1;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwx{background:transparent;border:0;color:inherit;font-size:1rem;width:28px;height:28px;border-radius:50%;cursor:pointer}
.pwx:hover{background:var(--hov)}
.pwin .plan{flex:1;border-radius:0 0 calc(12px*var(--rk,1)) calc(12px*var(--rk,1));margin:0;border:0}
@media (max-width:900px){.layout .main.split{grid-template-columns:1fr}.layout .main.split .sp-r{position:static;order:0}}
.layout{display:flex;flex-wrap:wrap;gap:1.2rem;align-items:flex-start}
.layout .side{flex:0 1 300px;min-width:260px;display:flex;flex-direction:column;gap:.8rem}
.layout .main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:1rem}
.tbl input,.tbl select{padding:.35rem .5rem;font-size:.92rem}
.tbl input.n{width:96px;text-align:right;font-family:ui-monospace,monospace}
.tbl input.w{width:100%;min-width:140px}
.tbl tr.sel td{background:var(--hov)}
.tbl select.set{border-color:var(--y);font-weight:600}.tbl input.nz{min-width:150px}
.alle{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:-.2rem 0 .6rem}.alle select{padding:.3rem .5rem;font-size:.88rem}.alle span{flex:1 1 260px}
.tbl tr.warn td:first-child{background:color-mix(in srgb,#e07b3a 10%,transparent)}
.tbl tfoot td{font-weight:600;border-top:1px solid var(--line)}
.okb{border:1px solid var(--line);border-radius:calc(6px*var(--rk,1));padding:.3rem .7rem;font-size:.85rem;color:var(--mute);min-height:34px;white-space:nowrap}
.okb.on{border-color:var(--ok);color:var(--ok)}
.hint{font-size:.85rem;color:var(--mute)}
.wn{display:block;font-size:.78rem;color:#e07b3a}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.row label{display:flex;flex-direction:column;gap:.2rem;font-size:.85rem;color:var(--mute)}
.row label select,.row label input{color:var(--ink);font-size:.95rem;min-width:220px}
.h{display:flex;gap:1rem;align-items:flex-start}
.h .d{flex:0 0 10px;width:10px;height:10px;border-radius:50%;margin-top:.45rem;background:var(--mute)}
.h .d.hoch{background:#e5533d}.h .d.mittel{background:#e0a030}.h .d.info{background:#4da3ff}
.h b{display:block}
.h p{margin:.2rem 0 0;color:var(--mute);font-size:.92rem}
.h .src{margin-left:auto;font-size:.75rem;color:var(--mute);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.list{display:flex;flex-direction:column;gap:.6rem}
.empty{color:var(--mute);padding:2.5rem 1rem;text-align:center}
.nk{display:flex;flex-direction:column;gap:.35rem}
.nk input,.nk select{width:100%;color:var(--ink);font-size:1rem;padding:.6rem .75rem}
.nkl{font-size:.85rem;color:var(--mute);margin-top:.55rem}
.nkFix{padding:.55rem .75rem;border:1px solid var(--line);border-radius:calc(8px*var(--rk,1));background:var(--hov);margin-bottom:.8rem}
.nkList{border:1px solid var(--line);border-radius:calc(10px*var(--rk,1));max-height:min(240px,32vh);overflow:auto;display:flex;flex-direction:column;padding:.25rem;background:var(--card)}
.nkGrp{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);padding:.55rem .6rem .25rem}
.nkOpt{display:flex;flex-wrap:wrap;align-items:center;gap:.1rem .6rem;text-align:left;color:var(--ink);border:1px solid transparent;border-radius:calc(8px*var(--rk,1));padding:.5rem .65rem;width:100%}
.nkOpt b{font-weight:600}
.nkOpt small{flex-basis:100%;color:var(--mute);font-size:.8rem}
.nkOpt:hover{background:var(--hov)}
.nkOpt.on{border-color:var(--y);background:var(--hov)}
.nkRow{display:grid;grid-template-columns:1fr 190px;gap:.8rem}
@media (max-width:560px){.nkRow{grid-template-columns:1fr}}
input[data-own]{border-color:var(--y)}
.gbar{position:relative;height:22px;background:var(--hov);border-radius:calc(4px*var(--rk,1));min-width:120px}
.gbar i{position:absolute;top:3px;bottom:3px;border-radius:calc(3px*var(--rk,1));background:var(--y)}
.acc{display:flex;flex-direction:column;gap:.6rem}
.band{position:relative;height:14px;border-radius:calc(7px*var(--rk,1));background:var(--hov);margin:.4rem 0 .2rem}
.band i{position:absolute;top:0;bottom:0;border-radius:calc(7px*var(--rk,1));background:linear-gradient(90deg,transparent,var(--y) 30%,var(--y) 45%,transparent)}
.band b{position:absolute;top:-4px;width:3px;height:22px;background:var(--ink);border-radius:calc(2px*var(--rk,1))}
.fx{display:flex;gap:.8rem;justify-content:space-between;font-size:.9rem;padding:.35rem 0;border-bottom:1px solid var(--line)}
.fx:last-child{border-bottom:0}
.fx small{display:block;color:var(--mute);font-size:.8rem}
.est{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.8rem}
.ec{display:flex;flex-direction:column;gap:.35rem}
.ec .v{font-size:1.25rem;font-weight:600}
.ec .sp{font-size:.82rem;color:var(--mute)}
.ec .src{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--y);font-weight:600}
.badge{display:inline-block;font-size:.72rem;border:1px solid var(--y);color:var(--y);border-radius:calc(999px*var(--rkp,1));padding:0 .45rem;margin-left:.3rem;white-space:nowrap}
.sich{font-size:.72rem;border-radius:calc(999px*var(--rkp,1));padding:.05rem .5rem;border:1px solid var(--line);color:var(--mute)}
.sich.hoch{border-color:var(--ok);color:var(--ok)}.sich.mittel{border-color:#e0a030;color:#e0a030}.sich.gering{border-color:#e07b3a;color:#e07b3a}
#asst{position:fixed;right:16px;bottom:16px;width:min(380px,calc(100vw - 32px));max-height:min(72vh,640px);display:flex;flex-direction:column;z-index:45;
  background:var(--card2);border:1px solid var(--y);border-radius:calc(14px*var(--rk,1));box-shadow:var(--sh0,0 14px 40px rgba(0,0,0,.45))}
#asst .ah{display:flex;align-items:center;gap:.5rem;padding:.7rem .9rem;border-bottom:1px solid var(--line);cursor:move;user-select:none;touch-action:none}
#asst .ah .grip{color:var(--mute);font-size:.9rem;letter-spacing:-2px}
#asst .ah b{flex:1}
#asst .ab{overflow:auto;padding:.8rem .9rem;display:flex;flex-direction:column;gap:.7rem}
#asst .steps{display:flex;gap:4px}
#asst .steps button{flex:1;height:6px;border-radius:calc(3px*var(--rk,1));padding:0;background:var(--line)}
#asst .steps button.ok{background:var(--ok)}
#asst .steps button.cur{background:var(--y)}
#asst h3{margin:0;font-size:1.05rem}
#asst p{margin:0;color:var(--mute);font-size:.92rem;line-height:1.45}
#asst .st{font-size:.85rem;padding:.5rem .7rem;border-radius:calc(8px*var(--rk,1));background:var(--hov)}
#asst .st.ok{color:var(--ok)}
#asst .acts{display:flex;gap:.45rem;flex-wrap:wrap}
#asst .af{display:flex;gap:.45rem;padding:.6rem .9rem;border-top:1px solid var(--line);align-items:center}
#asst .af .fill{flex:1;font-size:.8rem;color:var(--mute)}
#asstFab{position:fixed;right:16px;bottom:16px;z-index:44;box-shadow:var(--sh0,0 8px 24px rgba(0,0,0,.35))}
body.as-open .wrap{padding-bottom:45vh}
@media (max-width:640px){#asst{right:0;bottom:0;width:100vw;border-radius:calc(14px*var(--rk,1)) calc(14px*var(--rk,1)) 0 0;max-height:58vh}.wrap{padding-bottom:8rem}}
@media (max-width:640px){.tabs{margin:0 -.8rem 1rem}.kpi b{font-size:1.3rem}}
/* Wasserzeichen „Betaversion“ – blass, liegt über allem, fängt aber keine Klicks ab; in Dialogen und im Druck nicht */

.beta-wz span{font:800 clamp(64px,14vw,220px)/1 Ubuntu,"Segoe UI",system-ui,sans-serif;letter-spacing:.04em;color:var(--ink);opacity:.07;transform:rotate(-24deg);white-space:nowrap;user-select:none}

</style>

<body>
<div class="beta-wz" aria-hidden="true"><span>Betaversion</span></div>
<main class="wrap">
  <div class="top" hidden>   <!-- wandern in die Versionsleiste unter der Kopfleiste -->
    <button class="btn sm pri" id="pdfBtn" title="Kostenermittlung für den Bauherrn drucken oder als PDF – die Stufe nach DIN 276 wählst du dort">🖨 Drucken / PDF …</button>
    <button class="btn sm" id="ansBtn" title="Kostenansätze (Kennwerte, Prozente, Pauschalen, Bauteile mit Einheitspreisen) aus einer anderen Kostenermittlung übernehmen">↪ Ansätze übernehmen …</button>
    <button class="btn sm" id="verlBtn" title="Frühere Stände dieser Kostenermittlung ansehen, vergleichen und wiederherstellen">🕘 Verlauf</button>
    <span class="save" id="save" role="status"></span>
  </div>
  <nav class="tabs" id="tabs" aria-label="Bereiche"></nav>
  <div id="view"></div>
</main>
<input type="file" id="pdfIn" accept="application/pdf,.pdf,.ifc,.dxf" multiple class="hidden">
<script src="static/bp.js"></script>
<script src="static/pdbwahl.js"></script>
<script>
const TABS = [['uebersicht', 'Übersicht'], ['plaene', 'Pläne & Raumbuch'], ['bauteile', 'Bauteile & Kostengruppen'], ['kosten', 'Kosten'], ['mittel', 'Mittelabfluss'], ['pruefung', 'Prüfung']];
// Was die Stufe bedeutet und bewirkt (Genauigkeit, Gliederungstiefe im PDF, zusätzliche Prüfregeln)
const STUFE_INFO = {
  rahmen: { lph: 'LPH 1 · Grundlagen', ebene: 1, genau: 35, txt: 'Gesamtkosten aus Fläche × Kennwert, Gliederung nach der 1. Ebene.' },
  schaetzung: { lph: 'LPH 2 · Vorplanung', ebene: 2, genau: 25, txt: 'Gliederung mindestens bis zur 2. Ebene (z. B. 330 Außenwände).' },
  berechnung: { lph: 'LPH 3 · Entwurf', ebene: 3, genau: 15, txt: 'Gliederung bis zur 3. Ebene; alle Räume bestätigt, Aufteilung auf die 2. Ebene nötig.' },
  voranschlag: { lph: 'LPH 6 · Vorbereitung der Vergabe', ebene: 3, genau: 10, txt: 'Bepreiste Leistungsverzeichnisse statt Kennwerte, gegliedert bis zur 3. Ebene bzw. nach Vergabeeinheiten.' },
  anschlag: { lph: 'LPH 7 · Vergabe', ebene: 3, genau: 8, txt: 'Angebots- und Auftragspreise statt Kennwerte – geschätzte Positionen werden in der Prüfung gemeldet.' },
  feststellung: { lph: 'LPH 8 · Abrechnung', ebene: 3, genau: 2, txt: 'Abgerechnete Kosten aus den Schlussrechnungen – geschätzte Positionen werden in der Prüfung gemeldet.' },
};
const STUFEN = [['rahmen', 'Kostenrahmen'], ['schaetzung', 'Kostenschätzung'], ['berechnung', 'Kostenberechnung'], ['voranschlag', 'Kostenvoranschlag'], ['anschlag', 'Kostenanschlag'], ['feststellung', 'Kostenfeststellung']];
let VG = null;   // eigene Vergleichsobjekte und importierte Kennwerte
const vgOf = (label) => VG && VG.auswertung[(label || '').toLowerCase().replace(/[^a-z0-9äöüß]+/g, ' ').trim()];
const vgHint = (t) => { const v = vgOf(t.label); return v ? `<div class="hint" style="font-size:.72rem;white-space:nowrap" title="${esc(v.werte.map((w) => `${w.obj}: ${Math.round(w.kw).toLocaleString('de-DE')} €`).join('\n'))}">Vergleich Ø ${Math.round(v.mittel).toLocaleString('de-DE')} € (${v.n}${v.n > 1 ? `, ${Math.round(v.min).toLocaleString('de-DE')}–${Math.round(v.max).toLocaleString('de-DE')}` : ''})</div>` : ''; };
let LIST = [], B = null, FLOW = null, CHECK = null, SRC = null, tab = (location.hash || '').slice(1) || 'uebersicht', selFile = null, selRoom = null, saveT = 0, saving = false;
const eur = (v) => (v == null ? '–' : Math.round(v).toLocaleString('de-DE') + ' €');
const m2 = (v) => (+v || 0).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (v) => (+v || 0).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' %';

let ZM = { key: '', s: 1, x: 0, y: 0 };

    <div class="acts"><button type="button" class="btn" data-bph-verlauf="bk:dienste" style="margin-right:auto">🕘 Verlauf</button><button class="btn" data-m="x">${D.admin ? 'Abbrechen' : 'Schließen'}</button>${D.admin ? '<button class="btn pri" data-m="ok">Speichern</button>' : ''}</div>`, async (m, bg, close) => {
    if (m === 'x') { close(); return; }
    const b = {}; bg.querySelectorAll('[data-dk]').forEach((el) => { const o = b[el.dataset.dk] ||= {}; o[el.dataset.df] = el.type === 'checkbox' ? el.checked : el.value; });
    try { await api('api/dienste', 'PUT', b); if (!host) close(); toast('Zugänge gespeichert.'); } catch (e) { toast(e.message, true); }
  });
}
/* ---------- Hinweis beim Öffnen (abschaltbar) ---------- */
async function hinweis() {
  let K = null; try { K = await api('api/bp/konto'); } catch { return; }
  if ((K.hinweise_aus || []).includes('baukosten')) return;
  modalBox(`<h3>Baukosten – bitte kurz lesen</h3>
    <p>Die App ermittelt Kosten nach <b>DIN 276:2018-12</b> (Stufen Kostenrahmen bis Kostenfeststellung, Gliederung bis zur 3. Ebene, Kostenstand und Kostenrisiken gesondert ausgewiesen). Unter „Prüfung“ steht, was für die gewählte Stufe nach der Norm noch fehlt.</p>
    <p><b>Die Kennwerte sind Annahmen</b>: vorgegebene Beispielwerte, eigene Werte des Büros, Vergleichsobjekte oder importierte Werte aus Kostendatenbanken. Die Ergebnisse sind nur so gut wie diese Kennwerte, die Flächen und die eingetragenen Mengen – bitte jede Ermittlung fachlich prüfen, bevor sie den Bauherrn erreicht. Vorschläge der KI sind Hilfen, keine Kalkulation.</p>
    <p><b>Besser werden</b>: abgerechnete Projekte unter „Kosten → Vergleichsobjekte“ speichern, Kennwerte aus BKI & Co. importieren (Zugänge unter „Kostendatenbanken“), Kennwerte mit Region und Preisstand justieren.</p>
    <label class="chk" style="margin-top:.6rem"><input type="checkbox" id="hwAus"> nicht mehr anzeigen</label>
    <div class="acts"><button class="btn pri" data-m="ok">Verstanden</button></div>`, async (m, bg, close) => {
    if ($('#hwAus', bg).checked) { try { await api('api/bp/konto', 'PUT', { hinweise_aus: [...(K.hinweise_aus || []), 'baukosten'] }); } catch { /* egal */ } }
    close();
  });
}
(async () => {
  const me = await api('api/me'); applyLook(me);
  const conf = await api('api/platform');
  await header('Baukosten', me, conf);
  BPHead.appEinstellungen([{ key: 'raumtypen', label: 'Raumtypen & Kennwerte', render: (h) => typesDialog(h) },
    { key: 'dienste', label: 'Kostendatenbanken', render: (h) => diensteDialog(h) }]);
  BPHead.onKi(() => { CHECK = null; if (tab === 'pruefung') render(); });
  const hb = /^#bk=(\d+)/.exec(location.hash);   // Link aus der Verwaltung: diese Kostenermittlung öffnen
  if (!TABS.some((t) => t[0] === tab)) tab = 'uebersicht';
  if (hb) history.replaceState(null, '', location.pathname + '#' + tab);
  await loadList(hb ? +hb[1] : undefined);
  api('api/vergleich').then((v) => { VG = v; if (B && tab === 'kosten') render(); }).catch(() => {});
  hinweis();
})().catch((e) => toast(e.message, true));
async function verlauf() {
  if (!B || !window.BPHead) return;
  clearTimeout(saveT); if (saveEl().textContent.startsWith('Nicht')) await saveNow();
  BPHead.verlauf({ bereich: 'bkp:' + B.id, nach: () => openBk(B.id) });
}
window.bpNachVerlauf = () => (B ? openBk(B.id) : location.reload());
document.addEventListener('click', (e) => { if (e.target.closest('#verlBtn')) verlauf(); });
/* Kostenansätze aus einer anderen Kostenermittlung übernehmen – wie jede Änderung mit ↶ Rückgängig umkehrbar */
$('#ansBtn').onclick = () => {
  if (!B) return;
  const L = LIST.filter((x) => x.id !== B.id).sort((a, b) => (!!a.archived - !!b.archived) || String(b.updated || '').localeCompare(String(a.updated || '')));
  let Q = null;
  const TEILE = [
    ['kw', 'Kennwerte der Raumtypen', 'Kosten je m² für jeden Raumtyp (auch eigene Raumtypen jenes Projekts)'],
    ['proz', 'Prozente und Justage', 'Aufteilung KG 300/400 und der Gruppen, Baunebenkosten, Preissteigerung, Risikozuschlag, Regionalfaktor und Preisstand'],
    ['pausch', 'Pauschale Positionen', 'KG 200, Abbruch, Außenanlagen usw. mit Beträgen – ersetzt die Positionen hier'],
    ['bt', 'Bauteile mit Einheitspreisen', 'werden angehängt; Mengen nur auf Wunsch (sonst hier neu ermitteln)'],
  ];
  const info = (k) => {
    if (!Q) return '';
    const d = Q.data || {};
    if (k === 'kw') return `${Object.keys(d.types || {}).length} Raumtypen`;
    if (k === 'proz') return `KG 300 ${d.kg ? d.kg['300'] : '–'} % · Nebenkosten ${d.nk ?? '–'} % · Steigerung ${d.rate ?? '–'} %/Jahr${d.risiko ? ` · Risiko ${d.risiko} %` : ''}`;
    if (k === 'pausch') { const it = (d.items || []).filter((x) => x.amount != null); return `${(d.items || []).length} Positionen${it.length ? `, ${it.length} mit Betrag (${eur(it.reduce((a, x) => a + x.amount, 0))})` : ''}`; }
    if (k === 'bt') return `${(d.bauteile || []).length} Bauteile`;
    return '';
  };
  const html = () => `<h3>Kostenansätze übernehmen</h3>
    <p class="hint" style="margin:0 0 .6rem">Aus einer anderen Kostenermittlung in „${esc(B.name)}“. Räume und Pläne bleiben, wie sie sind. ↶ Rückgängig nimmt die Übernahme wieder zurück.</p>
    <div class="row"><label for="ansQ">Aus</label><select id="ansQ"><option value="">– Kostenermittlung wählen –</option>
      <optgroup label="Kostenermittlungen">${L.filter((x) => !x.archived).map((x) => `<option value="${x.id}"${Q && Q.id === x.id ? ' selected' : ''}>${esc(x.name)}${x.total ? ' · ' + eur(x.total) : ''}</option>`).join('')}</optgroup>
      ${L.some((x) => x.archived) ? `<optgroup label="Archiv">${L.filter((x) => x.archived).map((x) => `<option value="${x.id}"${Q && Q.id === x.id ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}</optgroup>` : ''}</select></div>
    ${Q ? `<p class="hint" style="margin:.2rem 0 .5rem">${esc(bkSub(Q))}${Q.calc && Q.calc.total ? ' · gesamt ' + eur(Q.calc.total) : ''}</p>` : ''}
    <div style="display:flex;flex-direction:column;gap:.45rem;margin:.4rem 0">${TEILE.map(([k, l, t]) => `<label class="chk" style="align-items:flex-start;gap:.5rem"><input type="checkbox" style="flex:none" data-ans="${k}"${k !== 'pausch' ? ' checked' : ''}${Q ? '' : ' disabled'}><span><b>${l}</b>${Q ? ` <small class="pill">${esc(info(k))}</small>` : ''}<small class="hint" style="display:block">${t}</small></span></label>`).join('')}
      <label class="chk" style="margin-left:1.7rem"><input type="checkbox" id="ansMenge"${Q ? '' : ' disabled'}> Mengen der Bauteile mit übernehmen</label></div>
    <div class="acts"><button class="btn" data-m="x">Abbrechen</button><button class="btn pri" data-m="ok"${Q ? '' : ' disabled'}>Übernehmen</button></div>`;
  const bg = modalBox(html(), (m, bg, close) => {
    if (m === 'x') { close(); return; }
    if (m !== 'ok' || !Q) return;
    const w = new Set([...bg.querySelectorAll('[data-ans]:checked')].map((x) => x.dataset.ans));
    if (!w.size) { toast('Bitte mindestens einen Teil wählen.', true); return; }
    const d = B.data, q = JSON.parse(JSON.stringify(Q.data || {})), done = [];
    histTrack();
    if (w.has('kw')) {
      Object.entries(q.types || {}).forEach(([k, v]) => { if (d.types[k]) d.types[k].kw = v.kw; else d.types[k] = { label: v.label, kw: v.kw, eigen: true }; });
      done.push('Kennwerte');
    }
    if (w.has('proz')) {
      ['kg', 'nk', 'rate', 'kg2', 'risiko', 'risiko_text', 'justage'].forEach((k) => { if (q[k] !== undefined) d[k] = q[k]; });
      done.push('Prozente');
    }
    if (w.has('pausch')) { d.items = q.items || []; done.push('Pauschalen'); }
    if (w.has('bt')) {
      const mit = bg.querySelector('#ansMenge').checked, t0 = Date.now();
      const neu = (q.bauteile || []).map((b, k) => ({ ...b, id: 'u' + t0 + '_' + k, src: '', menge: mit ? b.menge : 0, formel: mit ? b.formel : '', geschoss: mit ? b.geschoss : '',
        notiz: [b.notiz, `aus „${Q.name}“`].filter(Boolean).join(' · ').slice(0, 500) }));
      d.bauteile = (d.bauteile || []).concat(neu); done.push(`${neu.length} Bauteile`);
    }
    close(); CHECK = null; HIST.next = 'Ansätze übernommen'; histTrack();
    changed();
    toast(`Aus „${Q.name}“ übernommen: ${done.join(', ')}. ↶ Rückgängig nimmt es zurück.`);
  });
  bg.addEventListener('change', async (e) => {
    if (e.target.id !== 'ansQ') return;
    const id = +e.target.value; Q = null;
    if (id) { try { Q = await api('api/bk/' + id); } catch (er) { toast(er.message, true); } }
    bg.querySelector('.modal').innerHTML = html();
  });
};
</script>
