<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1a">
<title>Baukosten</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/static/bp.css">
<style>
.wrap{max-width:1240px}
.num{white-space:nowrap;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
.r{text-align:right}
.top{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.9rem}
.top select{flex:1 1 280px;max-width:520px;font-weight:600}
.top .fill{flex:1}
.save{color:var(--mute);font-size:.85rem}
.stufen{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;margin:0 0 1rem}
.stufen .lbl{font-size:.8rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin-right:.3rem}
.pills button{border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:.35rem .85rem;font-size:.88rem;min-height:36px}
.pills button.on{border-color:var(--y);color:var(--ink);background:var(--hov);font-weight:600}
.tabs{margin:0 -1rem 1.2rem;padding:0 1rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;margin-bottom:1.2rem}
.kpi{display:flex;flex-direction:column;gap:.3rem}
.kpi .lbl{font-size:.78rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.kpi b{font-size:1.6rem;font-weight:600}
.kpi span{font-size:.85rem;color:var(--mute)}
.two{display:flex;flex-wrap:wrap;gap:1.2rem}
.two>*{flex:1 1 440px;min-width:0}
.card h2{margin:0 0 .2rem;font-size:1.05rem}
.card .sub{margin:0 0 1rem;font-size:.85rem;color:var(--mute)}
.bars{display:flex;flex-direction:column;gap:.7rem}
.bar .t{display:flex;justify-content:space-between;gap:1rem;font-size:.92rem}
.bar .tr{height:8px;background:var(--hov);border-radius:4px;margin-top:.25rem}
.bar .f{height:8px;border-radius:4px;background:var(--y)}
.cols{display:flex;align-items:flex-end;gap:4px;height:180px;border-bottom:1px solid var(--line);padding-top:1rem}
.cols>div{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;position:relative}
.cols .c{width:100%;max-width:42px;background:var(--y);border-radius:3px 3px 0 0;opacity:.9}
.cols .c.i{position:absolute;bottom:0;background:transparent;border:2px solid var(--ink);border-bottom:0;opacity:.55}
.axis{display:flex;gap:4px;margin-top:.3rem}
.axis span{flex:1 1 0;text-align:center;font-size:.7rem;color:var(--mute);min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;gap:1.2rem;font-size:.82rem;color:var(--mute);margin-top:.6rem;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:.35rem}
.alert{border-left:4px solid var(--y);display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-top:1.2rem}
.alert .fill{flex:1 1 280px;color:var(--mute);font-size:.92rem}
.files{display:flex;flex-direction:column;gap:.6rem}
.fc{display:flex;flex-direction:column;gap:.25rem;cursor:pointer;text-align:left;color:var(--ink)}
.fc.on{border-color:var(--y);box-shadow:0 0 0 1px var(--y)}
.fc small{color:var(--mute)}
.fc .acts{display:flex;gap:.4rem;margin-top:.3rem}
.drop{border:1px dashed var(--line);border-radius:10px;padding:1rem;text-align:center;color:var(--mute);cursor:pointer}
.drop:hover,.drop.on{border-color:var(--y);color:var(--ink)}
.plan{position:relative;background:#fff;border-radius:8px;overflow:hidden}
.plan img{width:100%;height:auto;display:block}
.plan .mk{position:absolute;transform:translate(-30%,-60%);min-width:22px;height:22px;padding:0 5px;border-radius:11px;font:600 11px/22px ui-monospace,monospace;text-align:center;color:#fff;background:#2c5876;border:2px solid #fff;box-shadow:0 1px 4px #0006}
.plan .mk.ok{background:#2e7d4f}
.plan .mk.warn{background:#b3541e}
.plan .mk.sel{outline:3px solid var(--y)}
.layout{display:flex;flex-wrap:wrap;gap:1.2rem;align-items:flex-start}
.layout .side{flex:0 1 300px;min-width:260px;display:flex;flex-direction:column;gap:.8rem}
.layout .main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:1rem}
.tbl input,.tbl select{padding:.35rem .5rem;font-size:.92rem}
.tbl input.n{width:96px;text-align:right;font-family:ui-monospace,monospace}
.tbl input.w{width:100%;min-width:140px}
.tbl tr.sel td{background:var(--hov)}
.tbl tr.warn td:first-child{box-shadow:inset 3px 0 0 #e07b3a}
.tbl tfoot td{font-weight:600;border-top:1px solid var(--line)}
.okb{border:1px solid var(--line);border-radius:6px;padding:.3rem .7rem;font-size:.85rem;color:var(--mute);min-height:34px;white-space:nowrap}
.okb.on{border-color:var(--ok);color:var(--ok)}
.hint{font-size:.85rem;color:var(--mute)}
.wn{display:block;font-size:.78rem;color:#e07b3a}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.row label{display:flex;flex-direction:column;gap:.2rem;font-size:.85rem;color:var(--mute)}
.row label select,.row label input{color:var(--ink);font-size:.95rem;min-width:220px}
.h{display:flex;gap:1rem;align-items:flex-start}
.h .d{flex:0 0 10px;width:10px;height:10px;border-radius:50%;margin-top:.45rem;background:var(--mute)}
.h .d.hoch{background:#e5533d}.h .d.mittel{background:#e0a030}.h .d.info{background:#4da3ff}
.h b{display:block}
.h p{margin:.2rem 0 0;color:var(--mute);font-size:.92rem}
.h .src{margin-left:auto;font-size:.75rem;color:var(--mute);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.list{display:flex;flex-direction:column;gap:.6rem}
.empty{color:var(--mute);padding:2.5rem 1rem;text-align:center}
input[data-own]{border-color:var(--y)}
.gbar{position:relative;height:22px;background:var(--hov);border-radius:4px;min-width:120px}
.gbar i{position:absolute;top:3px;bottom:3px;border-radius:3px;background:var(--y)}
@media (max-width:640px){.tabs{margin:0 -.8rem 1rem}.kpi b{font-size:1.3rem}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <label for="sel" class="hidden">Kostenermittlung</label>
    <select id="sel" aria-label="Kostenermittlung wählen"></select>
    <button class="btn sm" id="newBtn">+ Neue Kostenermittlung</button>
    <button class="btn sm pri" id="pdfBtn">PDF für den Bauherrn …</button>
    <span class="fill"></span>
    <span class="save" id="save" role="status"></span>
  </div>
  <div class="stufen"><span class="lbl">Stufe DIN 276</span><div class="pills" id="stufen" style="display:flex;gap:.35rem;flex-wrap:wrap"></div></div>
  <nav class="tabs" id="tabs" aria-label="Bereiche"></nav>
  <div id="view"></div>
</main>
<input type="file" id="pdfIn" accept="application/pdf,.pdf" multiple class="hidden">
<script src="/static/bp.js"></script>
<script>
const TABS = [['uebersicht', 'Übersicht'], ['plaene', 'Pläne & Mengen'], ['kosten', 'Kosten'], ['mittel', 'Mittelabfluss'], ['pruefung', 'Prüfung']];
const STUFEN = [['rahmen', 'Kostenrahmen'], ['schaetzung', 'Kostenschätzung'], ['berechnung', 'Kostenberechnung'], ['anschlag', 'Kostenanschlag'], ['feststellung', 'Kostenfeststellung']];
let LIST = [], B = null, FLOW = null, CHECK = null, SRC = null, tab = (location.hash || '').slice(1) || 'uebersicht', selFile = null, selRoom = null, saveT = 0, saving = false;
const eur = (v) => (v == null ? '–' : Math.round(v).toLocaleString('de-DE') + ' €');
const m2 = (v) => (+v || 0).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (v) => (+v || 0).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' %';
const pnum = (s) => { const v = parseFloat(String(s).replace(/\./g, '').replace(',', '.')); return isFinite(v) ? v : 0; };
const ym = (s) => { const [y, m] = s.split('-'); return ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'][+m - 1] + ' ' + y.slice(2); };

/* ---------- Rechnen (wie auf dem Server, damit Eingaben sofort wirken) ---------- */
function calc(d) {
  const by = {}; d.rooms.forEach((r) => { const t = by[r.typ] ||= { area: 0, n: 0 }; t.area += +r.area || 0; t.n++; });
  let bau = 0; const types = Object.entries(d.types).map(([k, t]) => { const a = by[k] || { area: 0, n: 0 }; const s = a.area * t.kw; bau += s; return { typ: k, label: t.label, n: a.n, area: a.area, kw: t.kw, sum: s }; });
  const extra = d.items.reduce((s, i) => s + (i.kg !== '700' && i.amount != null ? +i.amount : 0), 0);
  const nk = (bau + extra) * d.nk / 100, area = d.rooms.reduce((s, r) => s + (+r.area || 0), 0);
  return { types, bauwerk: bau, kg300: bau * d.kg['300'] / 100, kg400: bau * d.kg['400'] / 100, extra, nk, total: bau + extra + nk, area, kw: area ? bau / area : 0 };
}

/* ---------- Laden / Speichern ---------- */
async function loadList(keep) {
  LIST = await api('/api/bk');
  const want = keep || +localStorage.getItem('bk.cur') || (LIST[0] && LIST[0].id);
  $('#sel').innerHTML = LIST.length ? LIST.map((x) => `<option value="${x.id}"${x.id === want ? ' selected' : ''}>${esc(x.name)}${x.project ? ' · ' + esc(x.project.name) : ''}${x.archived ? ' (archiviert)' : ''}</option>`).join('') : '<option value="">– noch keine Kostenermittlung –</option>';
  if (LIST.some((x) => x.id === want)) await open(want); else { B = null; render(); }
}
async function open(id) {
  B = await api('/api/bk/' + id); FLOW = null; CHECK = null; selFile = B.files[0] ? B.files[0].id : null;
  try { localStorage.setItem('bk.cur', id); } catch { /* egal */ }
  head(); render();
}
function head() {
  if (!window.BPHead) return;
  BPHead.setProject(B ? { sub: B.project ? [B.project.client, B.project.address].filter(Boolean).join(' · ') || 'Bautagebuch-Projekt' : 'Baukosten', title: B.name } : { sub: '', title: '' });
}
function changed(redraw = true) {
  B.calc = calc(B.data); FLOW = null;
  $('#save').textContent = 'Nicht gespeichert …';
  clearTimeout(saveT); saveT = setTimeout(saveNow, 700);
  if (redraw) setTimeout(render, 0);   // erst nach dem Fokuswechsel neu zeichnen, damit Tab weiterspringt
}
function sigOf(el) {   // Selektor für das Eingabefeld, um den Fokus nach dem Neuzeichnen wiederherzustellen
  if (!el || el === document.body || !$('#view').contains(el)) return null;
  const at = [...el.attributes].filter((a) => a.name.startsWith('data-') && a.name !== 'data-own').map((a) => `[${a.name}="${CSS.escape(a.value)}"]`).join('');
  if (!at) return null;
  const row = el.closest('[data-row]');
  return (row ? `[data-row="${row.dataset.row}"] ` : '') + el.tagName.toLowerCase() + at;
}
async function saveNow(extra = {}) {
  if (!B || saving) return; saving = true;
  try {
    const r = await api('/api/bk/' + B.id, 'PUT', { rev: B.rev, data: B.data, ...extra });
    B.rev = r.rev; B.updated_by = r.updated_by; if (extra.stufe || extra.gantt_id !== undefined || extra.project_id !== undefined || extra.name) { Object.assign(B, r); head(); }
    const d = new Date(); $('#save').textContent = `Gespeichert ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  } catch (e) {
    $('#save').textContent = 'Nicht gespeichert';
    if (/geändert/.test(e.message)) { toast(e.message + ' Der neue Stand wird geladen.', true); await open(B.id); }
    else toast('Speichern fehlgeschlagen: ' + e.message, true);
  } finally { saving = false; }
}

/* ---------- Oberfläche ---------- */
function render() {
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab ${k === tab ? 'on' : ''}" data-tab="${k}"${k === tab ? ' aria-current="page"' : ''}>${l}${k === 'pruefung' && CHECK ? ` <span class="pill y">${CHECK.hinweise.length}</span>` : ''}</button>`).join('');
  $('#stufen').innerHTML = STUFEN.map(([k, l]) => `<button type="button" data-stufe="${k}" class="${B && B.stufe === k ? 'on' : ''}" aria-pressed="${B && B.stufe === k}"${B ? '' : ' disabled'}>${l}</button>`).join('');
  const v = $('#view'), sig = sigOf(document.activeElement);
  if (!B) { v.innerHTML = `<div class="card empty"><p>Noch keine Kostenermittlung.</p><button class="btn pri" data-act="new">Erste Kostenermittlung anlegen</button></div>`; return; }
  v.innerHTML = { uebersicht: vUebersicht, plaene: vPlaene, kosten: vKosten, mittel: vMittel, pruefung: vPruefung }[tab]();
  if (sig) { const n = document.querySelector(sig); if (n) n.focus(); }
  if (tab === 'mittel' || tab === 'uebersicht') ensureFlow();
}
function vUebersicht() {
  const c = B.calc, max = Math.max(1, ...c.types.map((t) => t.sum));
  return `<div class="kpis">
    <div class="card kpi"><span class="lbl">Bauwerk KG 300 + 400</span><b class="num">${eur(c.bauwerk)}</b><span>${B.data.rooms.length} Räume × Kennwerte</span></div>
    <div class="card kpi"><span class="lbl">Gesamt netto</span><b class="num">${eur(c.total)}</b><span>inkl. Positionen und ${pct(B.data.nk)} Nebenkosten</span></div>
    <div class="card kpi"><span class="lbl">Raumfläche</span><b class="num">${m2(c.area)} m²</b><span>${B.files.length} Pläne</span></div>
    <div class="card kpi"><span class="lbl">Kennwert</span><b class="num">${eur(c.kw)}</b><span>je m² Raumfläche, KG 300 + 400</span></div></div>
  <div class="two">
    <section class="card"><h2>Kosten nach Raumtyp</h2><p class="sub">Fläche × Kennwert</p><div class="bars">${c.types.filter((t) => t.n).map((t) => `
      <div class="bar"><div class="t"><span>${esc(t.label)} <span class="mute">· ${m2(t.area)} m²</span></span><span class="num">${eur(t.sum)}</span></div><div class="tr"><div class="f" style="width:${(t.sum / max * 100).toFixed(1)}%"></div></div></div>`).join('') || '<p class="hint">Noch keine Räume – unter „Pläne & Mengen“ einen Grundriss hochladen.</p>'}</div></section>
    <section class="card"><h2>Mittelabfluss je Monat</h2><p class="sub">${B.gantt ? 'aus dem Bauzeitenplan „' + esc(B.gantt.name) + '“' : 'kein Bauzeitenplan verknüpft'}</p><div id="miniFlow">${flowCols(true)}</div></section>
  </div>
  <section class="card alert"><b>Plausibilitätsprüfung</b><span class="fill">${CHECK ? CHECK.hinweise.length + ' Hinweise' : 'Regeln und – je nach KI-Auswahl oben – Hinweise der KI'}</span><button class="btn" data-act="goCheck">Prüfen</button></section>`;
}
function flowCols(mini) {
  if (!B.gantt_id) return '<p class="hint">Unter „Mittelabfluss“ einen Bauzeitenplan wählen.</p>';
  if (!FLOW) return '<p class="hint">Lade …</p>';
  if (!FLOW.ok) return `<p class="hint">${esc(FLOW.why)}</p>`;
  const M = FLOW.months, max = Math.max(1, ...M.map((m) => Math.max(m.amount, m.idx))), H = mini ? 140 : 180;
  return `<div class="cols" style="height:${H + 16}px">${M.map((m) => `<div title="${ym(m.ym)}: ${eur(m.amount)} · mit Index ${eur(m.idx)}"><div class="c" style="height:${Math.round(m.amount / max * H)}px"></div><div class="c i" style="height:${Math.round(m.idx / max * H)}px"></div></div>`).join('')}</div>
    <div class="axis">${M.map((m, i) => `<span>${M.length > 14 && i % 2 ? '' : ym(m.ym)}</span>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--y)"></i>ohne Preissteigerung</span><span><i style="border:2px solid var(--ink);opacity:.6"></i>mit Baupreisindex ${pct(B.data.rate)} p. a.</span></div>`;
}
async function ensureFlow() {
  if (FLOW || !B.gantt_id) return;
  try { FLOW = await api(`/api/bk/${B.id}/flow`); } catch (e) { FLOW = { ok: false, why: e.message }; }
  if (tab === 'uebersicht') { const el = $('#miniFlow'); if (el) el.innerHTML = flowCols(true); } else if (tab === 'mittel') render();
}
function vPlaene() {
  const f = B.files.find((x) => x.id === selFile), rooms = B.data.rooms;
  const dup = {}; rooms.forEach((r) => { if (r.nr) { const k = r.floor + '|' + r.nr; dup[k] = (dup[k] || 0) + 1; } });
  const typeOpts = (sel) => Object.entries(B.data.types).map(([k, t]) => `<option value="${k}"${k === sel ? ' selected' : ''}>${esc(t.label)}</option>`).join('');
  const open = rooms.filter((r) => !r.ok).length;
  return `<div class="layout"><aside class="side"><span class="hint" style="text-transform:uppercase;letter-spacing:.04em">Pläne</span><div class="files">${B.files.map((x) => `
    <div class="card fc ${x.id === selFile ? 'on' : ''}" data-file="${x.id}" tabindex="0" role="button" aria-pressed="${x.id === selFile}"><b>${esc(x.meta.kind ? x.meta.kind + ' · ' : '')}${esc(x.name)}</b><small>${esc(x.meta.note || '')}</small>
      <div class="acts"><a class="btn sm" href="/api/bk/${B.id}/files/${x.id}" target="_blank" rel="noopener">PDF</a><button class="btn sm danger" data-delfile="${x.id}">Entfernen</button></div></div>`).join('')}
    <div class="drop" id="drop" role="button" tabindex="0">+ PDF hinzufügen<br><small>Grundrisse, Ansichten, Schnitte – Vektor-PDF aus dem CAD</small></div></div>
    <p class="hint">Raumstempel (Nummer, Name, m²) werden aus Vektor-PDFs exakt gelesen. Der Raumtyp ist ein Vorschlag – bitte jeden Raum bestätigen.</p></aside>
  <div class="main">${f ? `<div class="plan card" style="padding:0"><img src="/api/bk/${B.id}/files/${f.id}/preview.png" alt="Vorschau ${esc(f.name)}">${rooms.filter((r) => r.src === 'pdf:' + f.id && r.pos).map((r) => `<span class="mk ${dup[r.floor + '|' + r.nr] > 1 ? 'warn' : r.ok ? 'ok' : ''} ${r.id === selRoom ? 'sel' : ''}" style="left:${r.pos[0] * 100}%;top:${r.pos[1] * 100}%" title="${esc(r.nr + ' ' + r.name)}" data-mk="${r.id}">${esc(r.nr)}</span>`).join('')}</div>` : ''}
    <div class="row"><b>Raumbuch</b><span class="hint">${rooms.length} Räume · ${m2(B.calc.area)} m²${open ? ` · ${open} offen` : ''}</span><span style="flex:1"></span>${open ? '<button class="btn sm" data-act="okAll">Alle bestätigen</button>' : ''}<button class="btn sm" data-act="addRoom">+ Raum</button></div>
    <div class="tbl"><table><thead><tr><th>Nr.</th><th>Raum</th><th>Raumtyp</th><th class="r">Fläche m²</th><th>Status</th><th></th></tr></thead><tbody>${rooms.map((r, i) => `
      <tr data-row="${i}" class="${r.id === selRoom ? 'sel' : ''} ${dup[r.floor + '|' + r.nr] > 1 ? 'warn' : ''}"><td><input class="n" style="width:64px;text-align:left" value="${esc(r.nr)}" data-f="nr" aria-label="Nummer"></td>
      <td><input class="w" value="${esc(r.name)}" data-f="name" aria-label="Raumname">${dup[r.floor + '|' + r.nr] > 1 ? '<span class="wn">Raumnummer doppelt</span>' : ''}${r.floor ? `<span class="hint" style="font-size:.75rem">${esc(r.floor)}</span>` : ''}</td>
      <td><select data-f="typ" aria-label="Raumtyp">${typeOpts(r.typ)}</select></td>
      <td class="r"><input class="n" value="${m2(r.area)}" data-f="area" inputmode="decimal" aria-label="Fläche"></td>
      <td><button class="okb ${r.ok ? 'on' : ''}" data-ok="${i}">${r.ok ? '✓ Bestätigt' : 'Prüfen'}</button></td>
      <td><button class="btn sm" data-delroom="${i}" aria-label="Raum löschen" title="Raum löschen">✕</button></td></tr>`).join('') || '<tr><td colspan="6" class="empty">Noch keine Räume.</td></tr>'}</tbody>
      <tfoot><tr><td></td><td>Summe</td><td></td><td class="r num">${m2(B.calc.area)}</td><td colspan="2"></td></tr></tfoot></table></div></div></div>`;
}
const KG2 = [['310', 'Baugrube / Erdbau'], ['320', 'Gründung, Unterbau'], ['330', 'Außenwände / Vertikale Baukonstruktionen, außen'], ['340', 'Innenwände / Vertikale Baukonstruktionen, innen'],
  ['350', 'Decken / Horizontale Baukonstruktionen'], ['360', 'Dächer'], ['370', 'Infrastrukturanlagen'], ['380', 'Baukonstruktive Einbauten'], ['390', 'Sonstige Maßnahmen für Baukonstruktionen'],
  ['410', 'Abwasser-, Wasser-, Gasanlagen'], ['420', 'Wärmeversorgungsanlagen'], ['430', 'Raumlufttechnische Anlagen'], ['440', 'Elektrische Anlagen'],
  ['450', 'Kommunikations-, sicherheits- und informationstechnische Anlagen'], ['460', 'Förderanlagen'], ['470', 'Nutzungsspezifische und verfahrenstechnische Anlagen'],
  ['480', 'Gebäude- und Anlagenautomation'], ['490', 'Sonstige Maßnahmen für technische Anlagen']];
const sum2 = (g) => Object.entries(B.data.kg2 || {}).filter(([k]) => k[0] === g).reduce((a, [, v]) => a + (+v || 0), 0);
function vKosten() {
  const c = B.calc, d = B.data;
  const kgRows = [['300', 'Bauwerk – Baukonstruktionen', `${pct(d.kg['300'])} der Raumtyp-Summe`, c.kg300], ['400', 'Bauwerk – Technische Anlagen', `${pct(d.kg['400'])} der Raumtyp-Summe`, c.kg400]]
    .concat(d.items.map((i) => [i.kg, i.name, 'eigene Position', i.amount])).concat([['700', 'Baunebenkosten', `${pct(d.nk)} auf alle Kosten`, c.nk]]).sort((a, b) => a[0].localeCompare(b[0]));
  return `<section class="card" style="margin-bottom:1.2rem"><h2>Raumtypen und Kennwerte</h2><p class="sub">Kennwerte in € je m² Raumfläche (KG 300 + 400, netto). Die vorgegebenen Werte sind Beispiele – eigene Werte aus abgerechneten Projekten eintragen.</p>
    <div class="tbl"><table><thead><tr><th>Raumtyp</th><th class="r">Räume</th><th class="r">Fläche m²</th><th class="r">€ / m²</th><th class="r">Summe</th></tr></thead><tbody>${c.types.map((t) => `
      <tr><td>${esc(t.label)}</td><td class="r num">${t.n}</td><td class="r num">${m2(t.area)}</td><td class="r"><input class="n" value="${Math.round(t.kw)}" data-kw="${t.typ}" inputmode="numeric" aria-label="Kennwert ${esc(t.label)}"></td><td class="r num">${eur(t.sum)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Summe</td><td></td><td class="r num">${m2(c.area)}</td><td class="r num">${eur(c.kw)}</td><td class="r num">${eur(c.bauwerk)}</td></tr></tfoot></table></div>
    <div class="row" style="margin-top:.8rem"><button class="btn sm" data-act="saveKw">Als eigene Kennwerte für neue Kostenermittlungen speichern</button></div></section>
  <div class="two"><section class="card"><h2>Ansätze</h2><p class="sub">Aufteilung und Zuschläge</p><div class="row">
      <label>Anteil KG 300 (Rest KG 400) in %<input class="n" style="width:120px" value="${d.kg['300']}" data-set="kg300" inputmode="decimal"></label>
      <label>Baunebenkosten KG 700 in %<input class="n" style="width:120px" value="${d.nk}" data-set="nk" inputmode="decimal"></label></div>
    <h2 style="margin-top:1.4rem">Eigene Positionen</h2><p class="sub">z. B. KG 200, Rückbau (394), Fassade aus den Ansichten, Außenanlagen (500). Leer = noch offen.</p>
    <div class="tbl"><table><thead><tr><th>KG</th><th>Bezeichnung</th><th class="r">Betrag €</th><th></th></tr></thead><tbody>${d.items.map((i, k) => `
      <tr><td><input class="n" style="width:70px;text-align:left" value="${esc(i.kg)}" data-it="${k}" data-f="kg" aria-label="Kostengruppe"></td><td><input class="w" value="${esc(i.name)}" data-it="${k}" data-f="name" aria-label="Bezeichnung"></td>
      <td class="r"><input class="n" style="width:130px" value="${i.amount == null ? '' : Math.round(i.amount)}" placeholder="offen" data-it="${k}" data-f="amount" inputmode="numeric" aria-label="Betrag"></td><td><button class="btn sm" data-delit="${k}" aria-label="Position löschen">✕</button></td></tr>`).join('')}</tbody></table></div>
    <div class="row" style="margin-top:.6rem"><button class="btn sm" data-act="addItem">+ Position</button></div>
    <h2 style="margin-top:1.4rem">Aufteilung auf die 2. Ebene (für das PDF)</h2><p class="sub">Anteil der Raumtyp-Kosten in % von KG 300 bzw. 400. Leer = nicht aufgeteilt; der Rest erscheint als „nicht zugeordnet“.</p>
    <div class="tbl"><table><thead><tr><th>KG</th><th>Bezeichnung</th><th class="r">%</th></tr></thead><tbody>${KG2.map(([k, n]) => `${k === '410' ? `<tr><td colspan="3" class="hint">Summe KG 300: ${pct(sum2('3'))}</td></tr>` : ''}
      <tr><td class="num">${k}</td><td>${esc(n)}</td><td class="r"><input class="n" style="width:80px" value="${d.kg2[k] ?? ''}" data-kg2="${k}" inputmode="decimal" aria-label="Anteil KG ${k}"></td></tr>`).join('')}
      <tr><td colspan="3" class="hint">Summe KG 400: ${pct(sum2('4'))}</td></tr></tbody></table></div>
    <h2 style="margin-top:1.4rem">Erläuterungen für den Bauherrn</h2><p class="sub">Erscheint im PDF unter „Erläuterungen und Annahmen“. Leerzeile = neuer Absatz.</p>
    <textarea data-notes="1" rows="5" style="width:100%;resize:vertical" aria-label="Erläuterungen">${esc(d.notes || '')}</textarea></section>
  <section class="card"><h2>Kostengruppen nach DIN 276</h2><p class="sub">netto</p><div class="tbl"><table><thead><tr><th>KG</th><th>Bezeichnung</th><th>Ansatz</th><th class="r">Betrag</th></tr></thead><tbody>${kgRows.map(([kg, n, a, v]) => `
      <tr><td class="num">${esc(kg)}</td><td>${esc(n)}</td><td class="hint">${esc(a)}</td><td class="r num" style="${v == null ? 'color:#e07b3a' : ''}">${v == null ? 'offen' : eur(v)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td></td><td>Gesamt netto</td><td></td><td class="r num">${eur(c.total)}</td></tr></tfoot></table></div></section></div>`;
}
function vMittel() {
  const S = SRC || { projects: [], plans: [] };
  if (!SRC) loadSources();
  const F = FLOW && FLOW.ok ? FLOW : null;
  return `<section class="card" style="margin-bottom:1.2rem"><h2>Verknüpfung</h2><p class="sub">Der Bauzeitenplan liefert die Termine; die Kosten werden über seine Leistungen verteilt.</p><div class="row">
    <label>Projekt (Bautagebuch)<select data-link="project_id"><option value="">– keines –</option>${S.projects.map((p) => `<option value="${p.id}"${p.id === B.project_id ? ' selected' : ''}>${esc(p.name)}${p.archived ? ' (archiviert)' : ''}</option>`).join('')}</select></label>
    <label>Bauzeitenplan<select data-link="gantt_id"><option value="">– keiner –</option>${S.plans.map((p) => `<option value="${esc(p.id)}"${p.id === B.gantt_id ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>
    <label>Baupreisindex % p. a.<input class="n" style="width:110px" value="${B.data.rate}" data-set="rate" inputmode="decimal"></label></div></section>
  <section class="card" style="margin-bottom:1.2rem"><h2>Mittelabfluss je Monat</h2>${F ? `<p class="sub">${esc(F.plan)} · ${new Date(F.start).toLocaleDateString('de-DE')} bis ${new Date(F.end).toLocaleDateString('de-DE')} · verteilt: ${eur(F.base)} (KG 300+400 und Positionen, ohne KG 700)</p>` : ''}${flowCols(false)}
    ${F ? `<div class="tbl" style="margin-top:1rem"><table><thead><tr><th>Monat</th><th class="r">Betrag</th><th class="r">mit Index</th><th class="r">kumuliert mit Index</th></tr></thead><tbody>${F.months.map((m) => `<tr><td>${ym(m.ym)}</td><td class="r num">${eur(m.amount)}</td><td class="r num">${eur(m.idx)}</td><td class="r num">${eur(m.cum_idx)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td>Summe</td><td class="r num">${eur(F.base)}</td><td class="r num">${eur(F.total_idx)}</td><td class="r num" style="color:#e07b3a">+ ${eur(F.total_idx - F.base)}</td></tr></tfoot></table></div>` : ''}</section>
  ${F ? `<section class="card"><h2>Leistungen</h2><p class="sub">Gewicht je Leistung: Standard = Dauer in Kalendertagen. Für teure Gewerke höher setzen (z. B. Haustechnik).</p><div class="tbl"><table><thead><tr><th>Leistung</th><th>Gewerk</th><th>Zeitraum</th><th style="width:30%"></th><th class="r">Gewicht</th><th class="r">Anteil</th><th class="r">Betrag</th></tr></thead><tbody>${(() => {
      const t0 = new Date(F.start).getTime(), span = Math.max(1, new Date(F.end).getTime() - t0 + 864e5);
      return F.tasks.map((t) => `<tr><td>${esc(t.name)}</td><td class="hint">${esc(t.gw)}</td><td class="num" style="white-space:nowrap;font-size:.85rem">${new Date(t.s).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })}–${new Date(t.f).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' })}</td>
        <td><div class="gbar"><i style="left:${((new Date(t.s) - t0) / span * 100).toFixed(2)}%;width:${Math.max(0.6, t.days * 864e5 / span * 100).toFixed(2)}%"></i></div></td>
        <td class="r"><input class="n" style="width:80px" value="${Math.round(t.w * 10) / 10}" data-share="${t.uid}" inputmode="decimal" aria-label="Gewicht ${esc(t.name)}"${t.own ? ' data-own="1"' : ''}></td><td class="r num">${pct(t.pct)}</td><td class="r num">${eur(t.amount)}</td></tr>`).join('');
    })()}</tbody></table></div></section>` : ''}`;
}
function vPruefung() {
  const ki = window.BPHead ? BPHead.provider() : { label: 'Intern' };
  return `<div class="row" style="margin-bottom:1rem"><div style="flex:1"><h2 style="margin:0">Plausibilitätsprüfung</h2><p class="hint" style="margin:.2rem 0 0">Feste Regeln${ki.key && ki.key !== 'intern' ? ' und ' + esc(ki.label) : ''} · KI oben in der Kopfleiste wählen</p></div><button class="btn pri" data-act="check">${CHECK ? 'Erneut prüfen' : 'Jetzt prüfen'}</button></div>
    ${CHECK && CHECK.note ? `<p class="hint" style="color:#e07b3a">${esc(CHECK.note)}</p>` : ''}
    <div class="list">${CHECK ? CHECK.hinweise.map((h) => `<div class="card h"><span class="d ${h.lvl}" aria-label="${h.lvl}"></span><div><b>${esc(h.title)}</b><p>${esc(h.text)}</p></div><span class="src">${esc(h.src)}</span></div>`).join('') || '<div class="card empty">Keine Auffälligkeiten.</div>' : '<div class="card empty">Noch nicht geprüft.</div>'}</div>`;
}
async function loadSources() { try { SRC = await api('/api/sources'); } catch { SRC = { projects: [], plans: [] }; } if (tab === 'mittel') render(); }
async function runCheck() {
  const b = document.querySelector('[data-act="check"]'); if (b) { b.disabled = true; b.textContent = 'Prüfe …'; }
  try { clearTimeout(saveT); await saveNow(); CHECK = await api(`/api/bk/${B.id}/check`, 'POST', {}); } catch (e) { toast(e.message, true); }
  render();
}
async function upload(files) {
  for (const f of files) {
    const fd = new FormData(); fd.append('file', f);
    toast(`„${f.name}“ wird gelesen …`);
    try {
      clearTimeout(saveT); await saveNow();
      const r = await fetch(`/api/bk/${B.id}/files`, { method: 'POST', body: fd }); const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || r.statusText);
      B = d.bk; selFile = B.files[B.files.length - 1].id; CHECK = null;
      toast(`${f.name}: ${d.note}${d.added ? ` – ${d.added} Räume übernommen` : ''}`);
    } catch (e) { toast(`${f.name}: ${e.message}`, true); }
  }
  render();
}

/* ---------- Bedienung ---------- */
document.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; history.replaceState(null, '', '#' + tab); render(); return; }
  const s = e.target.closest('[data-stufe]'); if (s && B) { B.stufe = s.dataset.stufe; render(); clearTimeout(saveT); saveNow({ stufe: B.stufe }); return; }
  const a = e.target.closest('[data-act]');
  if (a) {
    const act = a.dataset.act;
    if (act === 'new') newDialog();
    else if (act === 'goCheck') { tab = 'pruefung'; history.replaceState(null, '', '#pruefung'); render(); runCheck(); }
    else if (act === 'check') runCheck();
    else if (act === 'okAll') { B.data.rooms.forEach((r) => { r.ok = true; }); changed(); }
    else if (act === 'addRoom') { B.data.rooms.push({ id: 'h' + Date.now(), nr: '', name: '', area: 0, typ: 'sonst', ok: true, src: 'hand', floor: '', pos: null }); changed(); }
    else if (act === 'addItem') { B.data.items.push({ kg: '', name: '', amount: null }); changed(); }
    else if (act === 'saveKw') { try { const o = {}; Object.entries(B.data.types).forEach(([k, v]) => { o[k] = v.kw; }); await api('/api/kennwerte', 'PUT', o); toast('Eigene Kennwerte gespeichert – gelten für neue Kostenermittlungen.'); } catch (er) { toast(er.message, true); } }
    return;
  }
  const ok = e.target.closest('[data-ok]'); if (ok) { const r = B.data.rooms[+ok.dataset.ok]; r.ok = !r.ok; changed(); return; }
  const dr = e.target.closest('[data-delroom]'); if (dr) { B.data.rooms.splice(+dr.dataset.delroom, 1); changed(); return; }
  const di = e.target.closest('[data-delit]'); if (di) { B.data.items.splice(+di.dataset.delit, 1); changed(); return; }
  const df = e.target.closest('[data-delfile]');
  if (df) {
    e.stopPropagation();
    const fid = +df.dataset.delfile, f = B.files.find((x) => x.id === fid), n = B.data.rooms.filter((r) => r.src === 'pdf:' + fid).length;
    modalBox(`<h3>Plan entfernen</h3><p>„${esc(f.name)}“ entfernen?${n ? ` Aus diesem Plan stammen ${n} Räume.` : ''}</p><div class="acts">${n ? '<button class="btn" data-m="keep">Plan entfernen, Räume behalten</button>' : ''}<button class="btn danger" data-m="all">${n ? 'Plan und Räume entfernen' : 'Entfernen'}</button><button class="btn" data-m="x">Abbrechen</button></div>`,
      async (m, bg, close) => { close(); if (m === 'x') return; try { clearTimeout(saveT); await saveNow(); B = await api(`/api/bk/${B.id}/files/${fid}${m === 'keep' ? '?keep=1' : ''}`, 'DELETE'); selFile = B.files[0] ? B.files[0].id : null; render(); } catch (er) { toast(er.message, true); } });
    return;
  }
  const fc = e.target.closest('[data-file]'); if (fc && !e.target.closest('a')) { selFile = +fc.dataset.file; render(); return; }
  const mk = e.target.closest('[data-mk]'); if (mk) { selRoom = mk.dataset.mk; render(); const row = document.querySelector('tr.sel'); if (row) row.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
  if (e.target.closest('#drop')) $('#pdfIn').click();
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.id === 'pdfIn') { if (el.files.length) upload([...el.files]); el.value = ''; return; }
  if (el.id === 'sel') { if (el.value) { clearTimeout(saveT); saveNow().then(() => open(+el.value)); } return; }
  const row = el.closest('[data-row]');
  if (row && el.dataset.f) { const r = B.data.rooms[+row.dataset.row]; r[el.dataset.f] = el.dataset.f === 'area' ? pnum(el.value) : el.value; changed(); return; }
  if (el.dataset.kw) { B.data.types[el.dataset.kw].kw = pnum(el.value); changed(); return; }
  if (el.dataset.it) { const it = B.data.items[+el.dataset.it]; it[el.dataset.f] = el.dataset.f === 'amount' ? (el.value.trim() === '' ? null : pnum(el.value)) : el.value; changed(); return; }
  if (el.dataset.kg2) { B.data.kg2 ||= {}; if (el.value.trim() === '') delete B.data.kg2[el.dataset.kg2]; else B.data.kg2[el.dataset.kg2] = pnum(el.value); changed(); return; }
  if (el.dataset.notes) { B.data.notes = el.value; changed(false); return; }
  if (el.dataset.share) { B.data.shares[el.dataset.share] = pnum(el.value); changed(); return; }
  if (el.dataset.set) {
    const v = pnum(el.value);
    if (el.dataset.set === 'kg300') { B.data.kg['300'] = Math.max(0, Math.min(100, v)); B.data.kg['400'] = 100 - B.data.kg['300']; }
    else B.data[el.dataset.set] = Math.max(0, v);
    changed(); return;
  }
  if (el.dataset.link) {
    const k = el.dataset.link, v = el.value ? (k === 'project_id' ? +el.value : el.value) : null;
    B[k] = v; FLOW = null; clearTimeout(saveT);
    const extra = { [k]: v };
    if (k === 'project_id' && v && !B.gantt_id && SRC) { const pl = SRC.plans.find((p) => p.project_id === v); if (pl) { extra.gantt_id = pl.id; B.gantt_id = pl.id; toast(`Bauzeitenplan „${pl.name}“ des Projekts übernommen.`); } }
    saveNow(extra).then(() => render());
  }
});
['dragover', 'dragleave', 'drop'].forEach((ev) => document.addEventListener(ev, (e) => {
  const d = e.target.closest && e.target.closest('#drop'); if (!d) return;
  e.preventDefault(); d.classList.toggle('on', ev === 'dragover');
  if (ev === 'drop' && e.dataTransfer.files.length) upload([...e.dataTransfer.files]);
}));
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-file],#drop')) { e.preventDefault(); e.target.click(); } });
$('#newBtn').onclick = () => newDialog();
$('#pdfBtn').onclick = () => pdfDialog();
const PARTS = [['deckblatt', 'Deckblatt', 'Projekt, Bauherr, Stand, Gesamtkosten'], ['zusammenfassung', 'Zusammenfassung', 'Bauwerk, weitere KG, Nebenkosten, MwSt.'],
  ['kosten', 'Kosten nach DIN 276', 'in der gewählten Gliederungstiefe'], ['raumtypen', 'Kosten nach Nutzung', 'Raumtypen mit Fläche und Kennwert'],
  ['raumbuch', 'Raumbuch', 'alle Räume mit Nutzung und Fläche'], ['mittelabfluss', 'Mittelabfluss', 'Diagramm und Monatstabelle aus dem Bauzeitenplan'],
  ['erlaeuterungen', 'Erläuterungen und Annahmen', 'eigener Text und offene Positionen'], ['plaene', 'Planunterlagen', 'hochgeladene Pläne als Anlage']];
function pdfDialog() {
  if (!B) return;
  let o; try { o = JSON.parse(localStorage.getItem('bk.pdf')) || {}; } catch { o = {}; }
  o = { teile: o.teile || ['deckblatt', 'zusammenfassung', 'kosten', 'mittelabfluss', 'erlaeuterungen'], tiefe: o.tiefe || 2, brutto: o.brutto ?? true, mwst: o.mwst ?? 19, runden: o.runden ?? 100 };
  modalBox(`<h3>PDF für den Bauherrn</h3><p class="hint" style="margin-top:0">Was soll ins PDF-Paket? Die Auswahl wird gemerkt.</p>
    <div style="display:flex;flex-direction:column;gap:.15rem;margin-bottom:.9rem">${PARTS.map(([k, n, h]) => `<label class="chk"><input type="checkbox" data-part="${k}"${o.teile.includes(k) ? ' checked' : ''}><span><b>${n}</b> <span class="hint">– ${h}</span></span></label>`).join('')}</div>
    <div class="row" style="flex-direction:column;align-items:stretch;gap:.6rem">
      <label>Gliederungstiefe der Kosten<select id="pTiefe"><option value="1"${o.tiefe == 1 ? ' selected' : ''}>1. Ebene – Kostengruppen 100 … 800</option><option value="2"${o.tiefe == 2 ? ' selected' : ''}>2. Ebene – z. B. 330 Außenwände, 440 Elektro</option><option value="3"${o.tiefe == 3 ? ' selected' : ''}>3. Ebene – mit Einzelpositionen</option></select></label>
      <label>Beträge<select id="pBrutto"><option value="1"${o.brutto ? ' selected' : ''}>brutto inkl. MwSt.</option><option value="0"${o.brutto ? '' : ' selected'}>netto</option></select></label>
      <label>MwSt. in %<input id="pMwst" value="${o.mwst}" inputmode="decimal"></label>
      <label>Rundung<select id="pRund"><option value="0"${o.runden == 0 ? ' selected' : ''}>auf volle Euro</option><option value="100"${o.runden == 100 ? ' selected' : ''}>auf 100 €</option><option value="1000"${o.runden == 1000 ? ' selected' : ''}>auf 1.000 €</option></select></label></div>
    <div class="acts"><button class="btn" data-m="x">Abbrechen</button><button class="btn pri" data-m="ok">PDF erstellen</button></div>`,
  async (m, bg, close) => {
    if (m !== 'ok') { close(); return; }
    const n = { teile: [...bg.querySelectorAll('[data-part]:checked')].map((x) => x.dataset.part), tiefe: +bg.querySelector('#pTiefe').value, brutto: bg.querySelector('#pBrutto').value === '1', mwst: pnum(bg.querySelector('#pMwst').value), runden: +bg.querySelector('#pRund').value };
    if (!n.teile.length) { toast('Bitte mindestens einen Teil wählen.', true); return; }
    try { localStorage.setItem('bk.pdf', JSON.stringify(n)); } catch { /* egal */ }
    close(); clearTimeout(saveT); await saveNow();
    window.open(`/api/bk/${B.id}/bericht.pdf?teile=${n.teile.join(',')}&tiefe=${n.tiefe}&brutto=${n.brutto ? 1 : 0}&mwst=${n.mwst}&runden=${n.runden}`, '_blank', 'noopener');
  });
}
async function newDialog() {
  if (!SRC) await loadSources();
  modalBox(`<h3>Neue Kostenermittlung</h3>
    <div class="row" style="flex-direction:column;align-items:stretch"><label>Projekt (Bautagebuch)<select id="nProj"><option value="">– ohne Projekt –</option>${SRC.projects.filter((p) => !p.archived).map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label>
    <label>Name<input id="nName" placeholder="z. B. A526 Tierheim – Kostenschätzung"></label>
    <label>Bauzeitenplan<select id="nPlan"><option value="">– später wählen –</option>${SRC.plans.map((p) => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></label></div>
    <div class="acts"><button class="btn" data-m="x">Abbrechen</button><button class="btn pri" data-m="ok">Anlegen</button></div>`,
  async (m, bg, close) => {
    if (m !== 'ok') { close(); return; }
    const pid = +bg.querySelector('#nProj').value || null;
    try { const r = await api('/api/bk', 'POST', { name: bg.querySelector('#nName').value, project_id: pid, gantt_id: bg.querySelector('#nPlan').value || null }); close(); tab = 'plaene'; await loadList(r.id); }
    catch (er) { toast(er.message, true); }
  });
  const ps = document.querySelector('#nProj');
  ps.onchange = () => { const v = +ps.value, pl = SRC.plans.find((p) => p.project_id === v); if (pl) document.querySelector('#nPlan').value = pl.id; const nm = document.querySelector('#nName'); if (!nm.value && v) nm.value = SRC.projects.find((p) => p.id === v).name + ' – Kostenschätzung'; };
}
(async () => {
  const me = await api('/api/me'); applyLook(me);
  const conf = await api('/api/platform');
  await header('Baukosten', me, conf);
  BPHead.onKi(() => { CHECK = null; if (tab === 'pruefung') render(); });
  if (!TABS.some((t) => t[0] === tab)) tab = 'uebersicht';
  await loadList();
})().catch((e) => toast(e.message, true));
</script>
