services:
  hello:
    # Die Versionsnummer hinter dem Doppelpunkt setzt GitHub Actions nach jedem Build
    # automatisch. Portainer bemerkt die Änderung und spielt die neue Version ein.
    image: ghcr.io/matthiasknauff/bauplattform/hello:454953e
    container_name: bauplattform-hello
    restart: unless-stopped
    ports:
      - "8099:80"
