<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- PDF-Druck des Bauzeitenplans: Browser-Schriften (Segoe UI, system-ui …) durch Lato ersetzen, Zeichen, die Lato nicht hat
     (z. B. ◢ vor Leistungsgruppen), aus DejaVu Sans. -->
<fontconfig>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Lato</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>system-ui</family><prefer><family>Lato</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>-apple-system</family><prefer><family>Lato</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Roboto</family><prefer><family>Lato</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Arial</family><prefer><family>Lato</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>sans-serif</family><prefer><family>Lato</family><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
