<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Aufgaben & Mängel</title>
<link rel="icon" href="logo.png">

<style>
.wrap{max-width:1180px}
.top{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:0 0 1rem}
.top .fill{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:calc(999px*var(--rkp,1));padding:3px;gap:2px;background:var(--card)}
.seg button{border-radius:calc(999px*var(--rkp,1));padding:.4rem .95rem;color:var(--mute);font-size:.92rem;white-space:nowrap}
.seg button.on{background:var(--y);color:var(--on);font-weight:600}
.tabs{margin:0 -.2rem 1rem;border-radius:calc(10px*var(--rk,1)) calc(10px*var(--rk,1)) 0 0}
.tab small{margin-left:.35rem;font-size:.75rem;border-radius:calc(999px*var(--rkp,1));padding:.05rem .45rem;background:var(--hov);color:var(--mute)}
.tab small.bad{background:var(--red);color:#fff}
.kpi{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem}
.kpi button{border:1px solid var(--line);border-radius:calc(999px*var(--rkp,1));padding:.35rem .85rem;color:var(--mute);font-size:.9rem;background:var(--card)}
.kpi button b{color:var(--ink);margin-left:.3rem}
.kpi button.on{border-color:var(--y);color:var(--y)}
.kpi button.on b{color:var(--y)}
.flt{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.flt input[type=search]{flex:1 1 220px}
.flt select{flex:0 1 220px}
.grp{margin:1.1rem 0 .5rem;display:flex;align-items:baseline;gap:.6rem;font-weight:600}
.grp small{color:var(--mute);font-weight:400}
.grp a{font-weight:400;font-size:.85rem;margin-left:auto}
.ml{display:flex;flex-direction:column;gap:.45rem}
.mr.hl,.er.hl{outline:3px solid var(--y);outline-offset:2px;transition:outline-color 1s}
.mr{display:grid;grid-template-columns:auto 64px 1fr auto;gap:.4rem .9rem;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:calc(12px*var(--rk,1));padding:.7rem .9rem}
.mr.done{opacity:.6}
.mr.ueberfaellig{border-color:color-mix(in srgb,var(--red) 55%,var(--line))}
.mr .ck{width:26px;height:26px;margin-top:.15rem;accent-color:var(--ok);cursor:pointer}
.mr .th{width:64px;height:64px;border-radius:calc(8px*var(--rk,1));background:var(--hov) center/cover no-repeat;display:grid;place-items:center;color:var(--mute);font-size:.75rem}
.mr .tx{min-width:0}
.mr .tx p{margin:0;white-space:pre-wrap;line-height:1.35}
.mr .tx small{display:block;color:var(--mute);font-size:.8rem;margin-top:.3rem}
.mr .tx small a{color:inherit}
.mr .ed{display:flex;flex-direction:column;gap:.35rem;align-items:stretch;min-width:220px}
.mr .ed label{display:flex;gap:.4rem;align-items:center;font-size:.8rem;color:var(--mute)}
.mr .ed label span{width:42px}
.mr .ed input{flex:1;padding:.3rem .45rem;font-size:.9rem;min-width:0}
.st{font-size:.75rem;border-radius:calc(999px*var(--rkp,1));padding:.05rem .5rem;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.st.ueberfaellig,.st.abgelaufen{border-color:var(--red);color:var(--red)}
.st.erledigt{border-color:var(--ok);color:var(--ok)}
.st.heute{border-color:var(--y);color:var(--y)}
.er{display:grid;grid-template-columns:36px 1fr auto;gap:.3rem .9rem;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:calc(12px*var(--rk,1));padding:.7rem .9rem}
.er.ueberfaellig,.er.abgelaufen{border-color:color-mix(in srgb,var(--red) 55%,var(--line))}
.er.erledigt{opacity:.6}
.er .ic{font-size:1.35rem;text-align:center;line-height:1.3}
.er .tx b{display:block}
.er .wer{display:block;color:var(--muted,#667);margin-top:.1rem}.er .wer b{display:inline;font-weight:600}
.er .tx p{margin:.15rem 0 0;color:var(--mute);font-size:.86rem;white-space:pre-wrap}
.er .tx small{display:block;color:var(--mute);font-size:.8rem;margin-top:.3rem}
.er .ac{display:flex;flex-direction:column;align-items:flex-end;gap:.35rem}
.er .ac .dt{font-weight:600;white-space:nowrap}
.er .ac .bt{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}
.er{cursor:pointer}.er:not(.auf):hover{border-color:var(--y)}.er:not(.auf) .tx b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.er:not(.auf){padding:.5rem .9rem}
.er.auf{cursor:default;box-shadow:var(--sh0,0 4px 16px rgba(0,0,0,.08))}.er .tx{min-width:0}
.e-ed{display:grid;gap:.35rem;margin:.4rem 0 .2rem}.e-ed label{display:grid;gap:.1rem;font-size:.8rem;color:var(--mute)}.e-ed input,.e-ed textarea{width:100%;box-sizing:border-box;font:inherit;font-size:.92rem}
.resch{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;margin-top:.5rem;padding:.5rem;border:1px dashed var(--y);border-radius:calc(8px*var(--rk,1));grid-column:2/-1}
.resch input{padding:.3rem .45rem}
details.done-l>summary{cursor:pointer;color:var(--mute);margin:1rem 0 .5rem}
.empty{color:var(--mute);padding:1.2rem;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:calc(12px*var(--rk,1))}
.note{background:var(--hov);border:1px solid var(--line);border-radius:calc(10px*var(--rk,1));padding:.7rem 1rem;color:var(--mute);font-size:.9rem;margin-bottom:1rem}
.tgrp{background:var(--card);border:1px solid var(--line);border-radius:calc(12px*var(--rk,1));padding:.7rem .9rem;margin-bottom:.7rem}
.trow{display:grid;grid-template-columns:110px 1fr auto auto;gap:.4rem .8rem;align-items:center;padding:.45rem 0;border-top:1px solid var(--line);margin-top:.45rem}
.trow .tdat{font-weight:600;white-space:nowrap}.trow .tl{color:var(--mute);font-size:.86rem;min-width:0}
.trow .tact{display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end}
.vzh{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap;margin:.2rem 0 .5rem}.vzh h3{margin:0;font-size:1rem}
.vzh select{width:auto;padding:.2rem .4rem}
.vzrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.3rem .8rem;align-items:center;padding:.45rem 0;border-top:1px solid var(--line);margin-top:.45rem}
.vzrow .vb{height:6px;border-radius:calc(3px*var(--rk,1));background:var(--line);position:relative;margin-top:.3rem;max-width:320px}
.vzrow .vb i{position:absolute;left:0;top:0;bottom:0;border-radius:calc(3px*var(--rk,1));background:var(--y)}
.vzrow .vb s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);text-decoration:none}
.vzrow .vt{font-weight:700;color:var(--red);white-space:nowrap}
@media (max-width:760px){.trow{grid-template-columns:1fr auto}.trow .tl{grid-column:1/-1;grid-row:2}.trow .tact{grid-column:1/-1}}
.fm{display:grid;grid-template-columns:150px 1fr;gap:.55rem .8rem;align-items:center}
.fm label{color:var(--mute);font-size:.88rem}
.fm .w{grid-column:1/-1}
.fm textarea{min-height:70px}
.uchk{display:flex;flex-wrap:wrap;gap:.3rem .9rem;max-height:150px;overflow:auto;border:1px solid var(--line);border-radius:calc(8px*var(--rk,1));padding:.5rem .7rem}
.uchk label{display:flex;gap:.35rem;align-items:center;color:var(--ink)}
@media (max-width:760px){.mr{grid-template-columns:auto 1fr}.mr .th{display:none}.mr .ed{grid-column:1/-1;min-width:0}.er{grid-template-columns:30px 1fr}.er .ac{grid-column:1/-1;align-items:flex-start}.er .ac .bt{justify-content:flex-start}.fm{grid-template-columns:1fr}}
.sm-steps{margin:.2rem 0 .8rem;padding-left:1.3rem;display:flex;flex-direction:column;gap:.8rem;line-height:1.45}
.sm-steps .btn{margin-top:.35rem}
.sm-drop{display:flex;align-items:center;justify-content:center;margin-top:.4rem;padding:1rem;border:2px dashed var(--line);border-radius:calc(10px*var(--rk,1));cursor:pointer;color:var(--mute);text-align:center}
.sm-drop.on,.sm-drop:hover{border-color:var(--accent,#e33);color:var(--ink)}
.sm-ok,.sm-bad{margin-top:.5rem;padding:.6rem .75rem;border-radius:calc(8px*var(--rk,1));font-size:.9rem;line-height:1.45}
.sm-ok{background:#e5f4e4;color:#1d4d1a}.sm-bad{background:#fbebeb;color:#7a1c1c}
.briefe{margin:.2rem 0 .9rem;padding:.6rem .85rem;border:1px solid var(--line);border-radius:calc(10px*var(--rk,1));background:var(--card)}
.briefe .bf{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.35rem 0;border-top:1px solid var(--line);margin-top:.35rem}
.briefe .bf span:last-child{display:flex;gap:.35rem}
.bed{position:fixed;inset:0;z-index:1000;background:#3b3f45;display:flex;flex-direction:column}
.bed-bar{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;padding:.55rem .9rem;background:var(--card,#fff);color:var(--ink);box-shadow:var(--sh0,0 2px 8px rgba(0,0,0,.25))}
.bed-bar .mute{font-size:.85rem}
.bed-s{flex:1;overflow:auto;padding:1rem .75rem 3rem;display:flex;flex-direction:column;align-items:center;gap:1rem}
.bed-p{position:relative;background:#fff;box-shadow:var(--sh0,0 4px 18px rgba(0,0,0,.35));flex:none}
.bed-p canvas{width:100%;height:100%;display:block}
.bed-f{position:absolute;box-sizing:border-box;margin:0;border:0;border-radius:calc(2px*var(--rk,1));background:rgba(255,226,120,.28);color:#1e1e1e;font-family:Helvetica,Arial,sans-serif;line-height:1.2;resize:none;outline:none;overflow:auto;scrollbar-width:thin}
.bed-f:hover{background:rgba(255,214,90,.4)}.bed-f:focus{background:rgba(255,236,160,.55);box-shadow:0 0 0 1.5px #e0a800}
.bed-f.gr{background:rgba(255,226,120,.12)}
.bed-l{color:#ddd;padding:3rem}
.nw{display:grid;grid-template-columns:repeat(auto-fill,minmax(14rem,1fr));gap:.6rem;margin:.4rem 0 .2rem}
.nw button{display:grid;grid-template-columns:2.2rem 1fr;gap:.15rem .6rem;align-items:start;text-align:left;padding:.75rem .8rem;border:1px solid var(--line);border-radius:calc(12px*var(--rk,1));background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.nw button:hover,.nw button:focus-visible{border-color:var(--y);box-shadow:0 0 0 3px color-mix(in srgb,var(--y) 18%,transparent);outline:none}
.nw .i{grid-row:span 2;font-size:1.5rem;line-height:1.2;text-align:center}.nw b{font-size:.98rem}.nw small{color:var(--mute);font-size:.8rem;line-height:1.3}
.nw h4{grid-column:1/-1;margin:.5rem 0 0;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}

/* Einfache Ansicht */
.einq,.einkopf{display:none}
html[data-modus="einfach"] .einq{display:flex;gap:.4rem;flex-wrap:wrap}
.einq button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:calc(999px*var(--rkp,1));padding:.35rem .85rem;font:inherit;font-size:.88rem;cursor:pointer}.einq button:hover{border-color:var(--y)}
html[data-modus="einfach"] .einkopf{display:block;margin:.2rem 0 1rem}.einkopf h1{margin:0;font-size:1.8rem;letter-spacing:-.02em}.einkopf p{margin:.3rem 0 0;color:var(--mute)}
html[data-modus="einfach"] #scope{display:none!important}
html[data-modus="einfach"] .top{order:-1}

.ferr{color:var(--red,#c8372a);font-weight:600;font-size:.88rem;margin:.25rem 0 0}
.feld-fehler,.feld-fehler .bph-pa input{outline:2px solid var(--red,#c8372a);outline-offset:2px;border-radius:calc(8px*var(--rk,1))}
</style>

<body>
<main class="wrap">
  <div class="top">
    <div class="seg" id="scope" role="group" aria-label="Welche Projekte"><button data-scope="mine">Meine Projekte</button><button data-scope="all">Alle Projekte</button></div>
    <span class="fill"></span>
    <div class="einq" aria-label="Schnell anlegen"><button type="button" data-einq="m4">⚠ Mangel rügen</button><button type="button" data-einq="termin">⏱ Terminrüge</button><button type="button" data-einq="erinnerung">⏰ Erinnerung</button></div>
    <button class="btn sm pri" id="neuBtn">＋ Neu</button>
  </div>
  <div class="einkopf"><h1>Meine Aufgaben</h1><p>Was du erledigen musst – und was andere dir schulden.</p></div>
  <nav class="tabs" id="tabs"></nav>
  <div id="briefe" class="briefe" hidden></div>
  <div id="view"><p class="mute">Lade …</p></div>
</main>
<script src="bp/baukasten.js"></script>
<script src="static/todo.js"></script>
<script>
const LS = { get(k, d) { try { const v = localStorage.getItem('auf.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('auf.' + k, JSON.stringify(v)); } catch { /* egal */ } } };
const HASH = new URLSearchParams((location.hash || '').slice(1).split('&').slice(1).join('&'));   // z. B. #termine&ruege=12|firma oder &gid=…&uid=…
let tab = (location.hash || '').slice(1).split('&')[0] || LS.get('tab', 'uebersicht'), scope = LS.get('scope', 'mine');
TDNURMANUELL = true;   // unter „To-dos“ nur selbst angelegte Aufgaben; die automatischen Hinweise stehen in der Übersicht je Rubrik
let VZ = null;
let M = null, E = null, T = null, CONF = null, ME = null, F = LS.get('filter', { q: '', projekt: '', firma: '', art: 'maengel', status: 'offen' }), OPEN = null;
const de = (d) => (d && d.length >= 10 ? `${d.slice(8, 10)}.${d.slice(5, 7)}.${d.slice(0, 4)}` : '');
const WD = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
const deW = (d) => (d ? WD[new Date(d + 'T12:00').getDay()] + ' ' + de(d) : '');
const iso = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
const plus = (n, from) => { const d = from ? new Date(from + 'T12:00') : new Date(); d.setDate(d.getDate() + n); return iso(d); };
const nextMon = () => { const d = new Date(); d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7)); return iso(d); };
const appLink = (k, frag) => { const a = (CONF.apps || []).find((x) => x.key === k && x.allowed); return a ? appUrl(a) + '/' + frag : ''; };

/* ---------- Rückgängig (letzte Änderung: Erledigt, Frist, Termin, Löschen) ---------- */
function undoable(label, fn) {   // Rückgängig-Verlauf der Plattform (bp.js): mehrere Schritte, Strg+Z
  rueckgaengig(label, async () => { await fn(); toast('Rückgängig gemacht.'); await reload(); }, 20000);
}

/* ---------- Direkt zu einem Eintrag (Link aus der E-Mail) ---------- */
function zeige(art, id) {
  if (art === 'mangel' && M) {
    const m = M.find((x) => String(x.id) === id);
    if (!m) { toast('Dieser Eintrag ist nicht (mehr) vorhanden.', true); return; }
    F = { q: '', projekt: '', firma: '', art: m.art, status: 'alle' }; render();
  } else if (E) { render(); }
  const el = document.querySelector(art === 'mangel' ? `[data-m="${id}"]` : `[data-e="r${id}"]`);
  if (!el) { toast('Dieser Eintrag ist nicht (mehr) vorhanden.', true); return; }
  el.scrollIntoView({ block: 'center' }); el.classList.add('hl'); setTimeout(() => el.classList.remove('hl'), 4000);
}
document.addEventListener('click', (e) => { if (e.target.closest('#mverl') && window.BPHead && BPHead.verlaufAlle) BPHead.verlaufAlle({ teil: 'mangel', titel: 'Verlauf der Mängel und Aufgaben' }); });
window.bpNachVerlauf = () => reload();   // nach „Wiederherstellen“ die Liste neu laden
/* ---------- Laden ---------- */
async function reload(first) {
  try {
    if (tab === 'todos') { await tdRef(); await tdLaden(); renderTabs(); return; }
    if (tab === 'uebersicht') {   // sofort zeichnen, jeder Block füllt sich, sobald seine Daten da sind (nicht auf alles warten)
      render(); await tdRef();
      const nach = () => { if (tab === 'uebersicht') render(); };
      await Promise.all([
        tdLaden().then(nach),
        api('api/maengel?scope=' + scope).then((m) => { M = m; nach(); }).catch(() => {}),
        api('api/termine?scope=' + scope).then((t) => { T = t; nach(); }).catch(() => {}),
        api('api/verzug?scope=' + scope).then((vz) => { VZ = vz; nach(); }).catch(() => {}),
        api('api/erinnerungen?scope=' + scope + (first ? '&abgleich=1' : '')).then((e) => { E = e; nach(); }).catch(() => {})]);
      return;
    }
    if (tab === 'maengel') M = await api('api/maengel?scope=' + scope);
    else if (tab === 'termine') [T, VZ] = await Promise.all([api('api/termine?scope=' + scope), api('api/verzug?scope=' + scope).catch(() => null)]);
    else E = await api('api/erinnerungen?scope=' + scope + (first ? '&abgleich=1' : ''));
  } catch (e) { $('#view').innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  render();
}
function renderTabs() {
  const nM = M ? M.filter((m) => m.status === 'ueberfaellig').length : 0, nE = E ? E.items.filter((x) => ['ueberfaellig', 'abgelaufen', 'heute'].includes(x.lage)).length : 0;
  const nT = (T ? T.filter((x) => x.status === 'offen').length : 0) + (VZ ? new Set(VZ.vorgaenge.map((x) => x.pid + '|' + x.key)).size : 0);
  const nTd = TD ? tdAlle().offen.filter((x) => x.f && x.f <= tdHeute()).length : 0;
  $('#scope').style.visibility = tab === 'todos' ? 'hidden' : '';   // gelten nur für Übersicht, Mängel, Termine, Erinnerungen – „＋ Neu“ bleibt überall
  const nUe = (TD ? (TD.auto || []).filter((x) => !x.spaeter).length : 0) + nTd;
  $('#tabs').innerHTML = [['uebersicht', 'Übersicht', nUe], ['todos', 'To-dos', nTd], ['maengel', 'Mängel', nM], ['termine', 'Termine', nT], ['erinnerungen', 'Erinnerungen', nE]].map(([k, l, n]) => `<button class="tab ${k === tab ? 'on' : ''}" data-tab="${k}">${l}${n ? `<small class="bad" title="überfällig / fällig">${n}</small>` : ''}</button>`).join('');
  $('#scope').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.scope === scope));
}
function render() {
  renderTabs();
  if (tab === 'todos') { window.TDMAX = undefined; if (!$('#todo')) $('#view').innerHTML = '<section class="todo voll" id="todo"></section>'; tdZeigen(); return; }
  if (tab === 'uebersicht') { renderUe(); return; }
  if (tab === 'maengel') renderM(); else if (tab === 'termine') renderT(); else renderE(); }

/* ---------- Übersicht: ein Schreibtisch aus Blöcken (je Rubrik einer), verschiebbar wie das Nextcloud-Dashboard, Reihenfolge/Ausblenden je Benutzer gemerkt ---------- */
ueInit('aufgaben', () => render());
function ueBloecke() {
  const h = tdHeute(), B = [];
  const auto = tdAutoGruppen();
  B.push({ k: 'todos', name: 'Meine To-dos', breit: true, html: TD ? '<div id="todo"></div>' : '<p class="mute ue-leer">Lade …</p>', n: TD ? tdAlle().offen.length : 0 });
  const zeile = (x) => tdZeile(x);
  auto.forEach((g) => {
    const items = [...g.offen.sort((a, b) => (b.prio || 0) - (a.prio || 0) || (a.f || '9').localeCompare(b.f || '9')), ...(UE.alle ? g.spaeter : [])];
    B.push({ k: g.key, name: g.name, n: g.offen.length, items: items.map(zeile), rot: g.offen.some((x) => x.f && x.f < h), mehr: g.spaeter.length ? `${g.spaeter.length} zurückgestellt` : '' });
  });
  if (M) {   // Mängel: offene mit Frist zuerst, erledigte nur mit „alle anzeigen“
    const L = M.filter((m) => UE.alle || !m.done).sort((a, b) => (a.done - b.done) || (a.frist || '9').localeCompare(b.frist || '9'));
    B.push({ k: 'mfrist', name: 'Mängel & Weisungen', n: M.filter((m) => !m.done).length, rot: M.some((m) => m.status === 'ueberfaellig'), ziel: 'maengel',
      items: L.map((m) => `<div class="ue-r${m.done ? ' aus' : ''}" data-ue="maengel:${m.id}"><span class="ue-t">${esc(m.text || '')}<small>${esc([m.projekt, m.firma].filter(Boolean).join(' · '))}</small></span><span class="ue-d${m.status === 'ueberfaellig' ? ' rot' : ''}">${m.done ? 'erledigt' : m.frist ? tdDatum(m.frist) : ''}</span></div>`) });
  }
  if (T || VZ) {
    const off = (T || []).filter((x) => x.status === 'offen'), vz = VZ ? Object.values(VZ.vorgaenge.reduce((a, x) => { (a[x.pid + '|' + x.key] ||= []).push(x); return a; }, {})) : [];
    const items = [...vz.map((rows) => `<div class="ue-r" data-ue="termine:"><span class="ue-t">${esc(rows[0].firma)}<small>${esc([rows[0].projekt, rows[0].gw].filter(Boolean).join(' · '))} · ${rows.length} Vorgang${rows.length === 1 ? '' : 'änge'} im Verzug</small></span><span class="ue-d rot">Terminrüge ›</span></div>`),

async function pdfHolen(url, body, titel, w, datei) {   // PDF erzeugen, im vorab geöffneten Fenster zeigen, Ergebnis des Mailversands melden
  let opt = { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) };
  if (datei) { const fd = new FormData(); fd.append('body', JSON.stringify(body)); fd.append('signiert', datei); opt = { method: 'POST', body: fd }; }   // mit sign-me unterschrieben
  const r = await fetch(url, opt);
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || 'Fehler ' + r.status); }
  const ok = r.headers.get('X-Mail'), err = r.headers.get('X-Mail-Fehler');
  const neu = r.headers.get('X-Neue-Adresse');
  const href = URL.createObjectURL(await r.blob());
  if (w && !w.closed) w.location.href = href; else { const a = document.createElement('a'); a.href = href; a.download = titel + '.pdf'; document.body.appendChild(a); a.click(); a.remove(); }
  if (err) toast(`${titel} erstellt, aber nicht verschickt: ${decodeURIComponent(err)}`, true);
  else toast(`${titel} erstellt${ok ? ' und ' + decodeURIComponent(ok) + ' verschickt' : ''}.`);
  if (neu && window.BPHead && BPHead.kontaktAnlegen) BPHead.kontaktAnlegen([decodeURIComponent(neu)], { name: (body.empfaenger || {}).name || '' });
}

}
const B64 = (b) => Uint8Array.from(atob(b), (ch) => ch.charCodeAt(0));
async function briefStart(url, body, titel, close) {   // aus dem Dialog: Entwurf holen und im Editor öffnen
  if (window.BPHead && BPHead.druckWahl && !body.layout) {   // mehrere Druck-Layouts für Rügen: erst wählen (bei nur einem ohne Rückfrage)

    if (w.layout) body.layout = w.layout;

async function briefEditor(url, body, titel, E, bid) {
  const lib = await pdfjs().catch((e) => { toast(e.message, true); return null; }); if (!lib) return;
  const ov = document.createElement('div'); ov.className = 'bed'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', titel + ' bearbeiten');
  ov.innerHTML = `<div class="bed-bar"><b>${esc(titel)} bearbeiten</b><span class="mute">Text anklicken und ändern – gelb hinterlegt sind die änderbaren Felder.</span><span style="flex:1"></span>
    <button class="btn" data-b="x">Abbrechen</button><button class="btn pri" data-b="ok">Speichern &amp; schließen</button></div><div class="bed-s"><div class="bed-l">Lade …</div></div>`;
  document.body.appendChild(ov); document.body.style.overflow = 'hidden';
  const S = ov.querySelector('.bed-s'), F = {};
  try {
    const pdf = await lib.getDocument({ isEvalSupported: false, data: B64(E.pdf) }).promise;
    S.innerHTML = '';
    const breite = Math.min(S.clientWidth - 24, 900);
    for (let n = 1; n <= pdf.numPages; n++) {
      const pg = await pdf.getPage(n), v0 = pg.getViewport({ scale: 1 }), sc = breite / v0.width, v = pg.getViewport({ scale: sc });
      const dpr = Math.min(2, Math.max(window.devicePixelRatio || 1, pdf.numPages <= 12 ? 2 : 1)), vv = pg.getViewport({ scale: sc * dpr });
      const box = document.createElement('div'); box.className = 'bed-p'; box.style.width = v.width + 'px'; box.style.height = v.height + 'px';
      const cvs = document.createElement('canvas'); cvs.width = vv.width; cvs.height = vv.height; box.appendChild(cvs); S.appendChild(box);
      await pg.render({ canvasContext: cvs.getContext('2d'), viewport: vv, annotationMode: lib.AnnotationMode.DISABLE }).promise;
      for (const a of await pg.getAnnotations()) {

function fehlerAm(bg, el, msg) {
  bg.querySelectorAll('.ferr').forEach((x) => x.remove()); bg.querySelectorAll('.feld-fehler').forEach((x) => x.classList.remove('feld-fehler'));
  if (el) { el.classList.add('feld-fehler'); el.insertAdjacentHTML('afterend', `<p class="ferr w" role="alert">⚠ ${esc(msg)}</p>`); el.scrollIntoView({ block: 'center', behavior: 'smooth' }); const f = el.matches('input,textarea,select') ? el : el.querySelector('input,textarea,select'); if (f) setTimeout(() => f.focus(), 250); }
  toast(msg, true);
}
/* Rüge ohne Ausgangspunkt: Projekt und Firma wählen – Firmen mit offenen Mängeln oben, dann Beteiligte, dann alle Adressen */
async function ruegeNeu(grund) {
  let LA, P, T0 = [], KN = [];
  try { [LA, P, T0, KN] = await Promise.all([api('api/maengel?scope=all'), api('api/projekte'), api('api/termine?scope=all').catch(() => []), kontaktNamen()]); } catch (e) { toast(e.message, true); return; }
  const L = LA.filter((m) => !m.done && !m.archiviert && m.art === 'maengel');
  const pid0 = +F.projekt || (window.BPHead && BPHead.projektId && BPHead.projektId()) || (L[0] || {}).pid || (P[0] || {}).id;
  const gruppen = (pid) => {
    const offen = [...new Set(L.filter((m) => m.pid === pid && m.firma).map((m) => m.firma))].sort((a, b) => a.localeCompare(b, 'de')).map((f) => [f, `${f} (${L.filter((m) => m.pid === pid && m.firma === f).length} offen)`]);
    const bet = [...new Set([...LA.filter((m) => m.pid === pid && m.firma).map((m) => m.firma), ...(T0 || []).filter((x) => x.pid === pid).map((x) => x.firma)])].sort((a, b) => a.localeCompare(b, 'de')).map((f) => [f]);
    return [['Mit offenen Mängeln', offen], ['Im Projekt beteiligt', bet], ['Weitere Firmen aus den Adressen', (KN || []).map((k) => [k.name, k.trade ? `${k.name} · ${k.trade}` : k.name])]];
  };
  const bg = modalBox(`<h3>${grund === 'vob4' ? 'Mängelrüge vor Abnahme' : 'Mängelrüge nach Abnahme'}</h3><div class="fm">
    <label for="nrP">Projekt</label><select id="nrP" data-bp-projekte>${P.map((p) => `<option value="${p.id}"${p.id === pid0 ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
    <label for="nrF_pa">Firma</label><span id="nrFw">${firmaSelect('nrF', gruppen(pid0))}</span>
    <p class="w mute" style="font-size:.82rem;margin:0">Oben Firmen mit offenen Mängeln (Anzahl), dann die am Projekt Beteiligten, darunter alle anderen aus den Adressen. Im nächsten Schritt wählst du die Mängel – oder trägst sie selbst ein – und die Frist.</p></div>
    <div class="acts"><button class="btn" data-m="x">Abbrechen</button><button class="btn pri" data-m="ok">Weiter</button></div>`, async (m, bg, close) => {
    if (m === 'x') { close(); return; }
    if (m !== 'ok') return;
    const pid = +bg.querySelector('#nrP').value, f = bg.querySelector('#nrF').value;
    if (!f) { fehlerAm(bg, bg.querySelector('#nrFw'), 'Bitte eine Firma wählen.'); return; }
    const x = L.find((y) => y.pid === pid && y.firma === f);
    close(); await ruegeDialog(x ? x.id : null, { pid, firma: f });
    const rg = [...document.querySelectorAll('#rG')].pop(); if (rg) { rg.value = grund; rg.dispatchEvent(new Event('change')); }
  });
  bg.querySelector('#nrP').addEventListener('change', (e) => { bg.querySelector('#nrFw').innerHTML = firmaSelect('nrF', gruppen(+e.target.value)); });
}
async function terminNeu() {
  let P, K = [], VZ0 = null, T0 = [];
  try { [P, VZ0, T0, K] = await Promise.all([api('api/projekte'), api('api/verzug?scope=all').catch(() => null), api('api/termine?scope=all').catch(() => []), kontaktNamen()]); } catch (e) { toast(e.message, true); return; }
  const pid0 = +F.projekt || (window.BPHead && BPHead.projektId && BPHead.projektId()) || (P[0] || {}).id;
  const vorschlag = (pid) => [...new Set([...((VZ0 && VZ0.vorgaenge) || []).filter((x) => x.pid === pid).map((x) => x.firma), ...(T0 || []).filter((x) => x.pid === pid).map((x) => x.firma)])];
  const bg = modalBox(`<h3>Terminrüge</h3><div class="fm">
    <label>Projekt</label><select id="ntP" data-bp-projekte>${P.map((p) => `<option value="${p.id}"${p.id === pid0 ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
    <label for="ntF_pa">Firma</label><span id="ntFw"></span>
    <p class="w mute" style="font-size:.82rem;margin:0" id="ntH"></p></div>
    <div class="acts"><button class="btn" data-m="x">Abbrechen</button><button class="btn pri" data-m="ok">Weiter</button></div>`, async (m, bg, close) => {
    if (m === 'x') { close(); return; }
    if (m !== 'ok') return;
    const pid = +bg.querySelector('#ntP').value, f = bg.querySelector('#ntF').value.trim();
    if (!f) { fehlerAm(bg, bg.querySelector('#ntFw'), 'Bitte eine Firma wählen.'); return; }
    close(); truegeDialog(pid + '|' + f.toLowerCase());
  });
  const liste = () => { const pid = +bg.querySelector('#ntP').value, v = vorschlag(pid);
    const bet = [...new Set((T0 || []).filter((x) => x.pid === pid).map((x) => x.firma))].filter((n) => !v.includes(n));
    bg.querySelector('#ntFw').innerHTML = firmaSelect('ntF', [['Laut Bauzeitenplan im Rückstand / nicht da', v.map((n) => [n])], ['Im Projekt beteiligt', bet.map((n) => [n])], ['Weitere Firmen aus den Adressen', (K || []).map((k) => [k.name, k.trade ? `${k.name} · ${k.trade}` : k.name])]], v[0] || '');
    bg.querySelector('#ntH').textContent = v.length ? 'Laut Bauzeitenplan im Rückstand oder nicht anwesend: ' + v.join(', ') : 'Für dieses Projekt meldet der Bauzeitenplan keinen Rückstand – den Rückstand beschreibst du im nächsten Schritt selbst.'; };
  bg.querySelector('#ntP').addEventListener('change', liste); liste();

}
$('#neuBtn').onclick = neuWahl;

/* ---------- Neue Erinnerung ---------- */
let PRJ = null, USERS = null, CFG = null;
async function neueErinnerung() {
  try { PRJ = PRJ || await api('api/projekte'); USERS = USERS || await api('api/benutzer'); } catch (e) { toast(e.message, true); return; }
  modalBox(`<h3>Neue Erinnerung</h3><div class="fm">
    <label for="nT">Woran erinnern?</label><input id="nT" placeholder="z. B. Fliesenleger Termin bestätigen lassen">
    <label for="nX">Notiz</label><textarea id="nX" placeholder="optional"></textarea>
    <label for="nP">Projekt</label><select id="nP" data-bp-projekte><option value="">– ohne Projekt –</option>${PRJ.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
    <label for="nD">Wann?</label><div style="display:flex;gap:.4rem;flex-wrap:wrap"><input type="date" id="nD" value="${plus(7)}"><input type="time" id="nZ" value="08:00">${[[1, 'morgen'], [7, '+1 Woche'], [14, '+2 Wochen']].map(([d, l]) => `<button class="btn sm" data-m="d${d}">${l}</button>`).join('')}</div>
    <label>An wen (E-Mail)?</label><div class="uchk">${USERS.map((u) => `<label><input type="checkbox" data-u="${u.id}"${u.id === ME.id ? ' checked' : ''}> ${esc(u.name)}</label>`).join('')}</div></div>
    <div class="acts"><button class="btn" data-m="x">Abbrechen</button><button class="btn pri" data-m="ok">OK</button></div>`, async (m, bg, close) => {
    if (m === 'x') { close(); return; }
    if (m.startsWith('d')) { bg.querySelector('#nD').value = plus(+m.slice(1)); return; }
    if (m === 'ok') {
      const b = { titel: bg.querySelector('#nT').value, text: bg.querySelector('#nX').value, termin: bg.querySelector('#nD').value, uhrzeit: bg.querySelector('#nZ').value,
        pid: +bg.querySelector('#nP').value || null, an: [...bg.querySelectorAll('[data-u]:checked')].map((x) => +x.dataset.u) };
      try { const rr = await api('api/erinnerungen', 'POST', b); close(); toast('Erinnerung gespeichert.' + (rr.hinweis ? ' ' + rr.hinweis : '')); tab = 'erinnerungen'; history.replaceState(null, '', '#erinnerungen'); await reload(); } catch (e) { toast(e.message, true); }
    }
  });
}

/* ---------- Einstellungen (nur diese App) ---------- */
async function setDialog(host) {
  try { CFG = await api('api/einstellungen'); } catch (e) { toast(e.message, true); return; }
  boxIn(host)(`<h3>Einstellungen – Erinnerungen</h3><div class="fm">
    <label for="sV">Vorlauf</label><div><input id="sV" type="number" min="0" max="60" value="${CFG.vorlauf}" style="width:80px"> Tage vor dem Einsatz einer Firma erinnern</div>
    <label for="sU">Uhrzeit</label><div><input id="sU" type="time" value="${esc(CFG.uhrzeit)}"> an diesem Tag</div>
    <label for="sL">„Wieder“ ab</label><div><input id="sL" type="number" min="1" max="90" value="${CFG.luecke}" style="width:80px"> Tagen Pause – kürzere Pausen zählen als ein Einsatz</div>
    <label>E-Mail</label><label class="chk" style="color:var(--ink)"><input type="checkbox" id="sM"${CFG.mail_plan ? ' checked' : ''}> Erinnerungen aus den Bauzeitenplänen per E-Mail verschicken</label>
    <p class="w mute" style="font-size:.85rem;margin:0">Empfänger: die Zuständigen des verknüpften Projekts, sonst wer den Plan zuletzt gespeichert hat. Den Mailserver stellst du in der Verwaltung ein. Erinnerungen aus dem Bautagebuch verschickt das Bautagebuch am Fälligkeitstag selbst.</p></div>
    <p class="w mute" style="font-size:.85rem;margin:.3rem 0 0">Unterschrift, Signatur und Versand der Rügen: ⚙ → Für mich. Texte der Mails: ⚙ → Büro → E-Mail-Vorlagen.</p>
    <div class="acts"><button class="btn" data-m="test">Testmail an mich</button><button type="button" class="btn" data-bph-verlauf="bp:aufgaben" style="margin-right:auto" title="Frühere Stände ansehen und wiederherstellen">🕘 Verlauf</button><button class="btn" data-m="x">Abbrechen</button><button class="btn pri" data-m="ok">OK</button></div>`, async (m, bg, close) => {
    if (m === 'x') { close(); return; }
    if (m === 'test') { try { const r = await api('api/erinnerungen/test', 'POST', {}); toast('Testmail an ' + r.to + ' verschickt.'); } catch (e) { toast(e.message, true); } return; }
    if (m === 'ok') {
      try { CFG = await api('api/einstellungen', 'PUT', { vorlauf: +bg.querySelector('#sV').value, luecke: +bg.querySelector('#sL').value, uhrzeit: bg.querySelector('#sU').value, mail_plan: bg.querySelector('#sM').checked }); if (!host) close(); toast('Gespeichert – Termine der Erinnerungen angepasst.'); E = null; if (tab === 'erinnerungen') reload(true); } catch (e) { toast(e.message, true); }
    }
  });
}

(async () => {
  ME = await api('api/me'); applyLook(ME);
  CONF = await api('api/platform');
  await header('Aufgaben & Mängel', ME, CONF);
  BPHead.appEinstellungen([{ key: 'todo', label: 'To-dos', render: (h) => tdEinstellungen(h) }, { key: 'erinnerungen', label: 'Erinnerungen', render: (h) => setDialog(h) }]
    .concat(ME.is_admin ? [{ key: 'druck', label: 'Druck-Layouts der Rügen', text: 'Wo steht was auf Mängel- und Terminrüge – Editor mit Raster und Versionen', open: () => BPHead.einstellungen({ bereich: 'buero', teil: 'druck' }) }] : []));
  try { CFG = await api('api/einstellungen'); } catch { /* egal */ }
  const deep = /^(mangel|erinnerung)-(\d+)$/.exec(tab);   // Link aus einer E-Mail: direkt zum Eintrag
  if (deep) { tab = deep[1] === 'mangel' ? 'maengel' : 'erinnerungen'; scope = 'all'; history.replaceState(null, '', '#' + tab); }
  const tdDeep = /^todos&t=(\d+)$/.exec(tab);   // von der Startseite: eine eigene Aufgabe gleich zum Bearbeiten öffnen
  if (tdDeep) { tab = 'todos'; history.replaceState(null, '', '#todos'); }
  if (!['uebersicht', 'todos', 'maengel', 'termine', 'erinnerungen'].includes(tab)) tab = 'uebersicht';
  const gp = !deep && BPHead.projektId();   // Projekt aus der zuletzt benutzten App: Mängel dieses Projekts (Filter „Alle Projekte“ hebt das auf)
  if (gp) F.projekt = String(gp);
  renderTabs(); ladeBriefe(); if (tab === 'todos') render(); await reload(tab === 'erinnerungen' || tab === 'uebersicht');
  if (tdDeep && TD) { const x = (TD.manuell || []).find((y) => String(y.id) === tdDeep[1]); if (x) { TDOFFEN = x.key; tdZeigen(); const el = $('#todo .te'); if (el) el.scrollIntoView({ block: 'center' }); } }
  if (tab !== 'todos' && tab !== 'uebersicht') tdRef().then(tdLaden).then(renderTabs).catch(() => {});
  if (gp && M && !M.some((m) => m.pid === gp)) { F.projekt = ''; if (tab === 'maengel') renderM(); }
  if (deep) zeige(deep[1], deep[2]);
  if (HASH.get('mruege')) {   // aus „Adressen“ → E-Mail → Mängelrüge an diese Firma
    const [mp, ...mf] = HASH.get('mruege').split('|'); history.replaceState(null, '', '#maengel');
    ruegeDialog(null, { pid: +mp, firma: mf.join('|') });
  }
  if (HASH.get('neu')) {   // aus der Kommunikation → ＋ → Mängel- oder Terminrüge: derselbe Ablauf wie hier unter „＋ Neu“
    const n = HASH.get('neu'); history.replaceState(null, '', '#' + tab);
    if (n === 'm4' || n === 'm13') ruegeNeu(n === 'm4' ? 'vob4' : 'vob13'); else if (n === 'termin') terminNeu();
  }
  if (tab === 'termine' && (HASH.get('ruege') || HASH.get('gid'))) {   // aus To-do oder Bauzeitenplan: Terminrüge gleich öffnen
    history.replaceState(null, '', '#termine');
    if (HASH.get('ruege')) truegeDialog(HASH.get('ruege'));
    else {
      try {
        const r = await api(`api/verzug?gid=${encodeURIComponent(HASH.get('gid'))}&uid=${encodeURIComponent(HASH.get('uid') || '')}`), x = r.vorgaenge[0];
        if (x) truegeDialog(x.pid + '|' + x.key, x.id);
        else toast(HASH.get('firma') ? 'Für diesen Vorgang ist kein Rückstand gemeldet – der Arbeitsfortschritt wird im Tagesbericht eingetragen.' : 'Für diesen Vorgang ist kein Rückstand gemeldet.', true);
      } catch (er) { toast(er.message, true); }
    }
  }
  if (tab !== 'erinnerungen') api('api/erinnerungen?scope=' + scope + '&abgleich=1').then((r) => { E = r; renderTabs(); }).catch(() => {});
  if (tab !== 'maengel') api('api/maengel?scope=' + scope).then((r) => { M = r; renderTabs(); }).catch(() => {});
  if (tab !== 'termine') api('api/termine?scope=' + scope).then((r) => { T = r; renderTabs(); }).catch(() => {});
})().catch((e) => toast(e.message, true));
</script>
