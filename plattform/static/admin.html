<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#84827c">
<title>Verwaltung – Bauplattform</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="bp/bp.css">
<style>
.bar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.9rem}
.bar .fill{flex:1}
.bar input[type=search]{min-width:220px}
td .acts{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:flex-end}
td.r{text-align:right}
tr.off td{opacity:.55}
tr.off td:last-child{opacity:1}
.appchk{display:flex;gap:.4rem;flex-wrap:wrap}
.uapps{display:flex;flex-wrap:wrap;gap:.2rem .25rem;align-items:center;max-width:34rem}.uapps .pill{font-size:.72rem;padding:.05rem .45rem;margin:0}.uapps small{font-size:.75rem;flex-basis:100%}
/* Apps, Administrator, gesperrt: Knöpfe zum Antippen wie unter Einstellungen → Apps (Häkchen unsichtbar, der ganze Knopf schaltet) */
.appchk label,.chk.pil{display:inline-flex;gap:.35rem;align-items:center;white-space:nowrap;border:1px solid var(--line);border-radius:calc(999px*var(--rkp,1));padding:.32rem .9rem;cursor:pointer;color:var(--mute);font-size:.88rem;user-select:none}
.appchk label:hover,.chk.pil:hover{border-color:var(--mute)}
.appchk input,.chk.pil input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.appchk label:has(input:checked),.chk.pil:has(input:checked){background:var(--y);border-color:var(--y);color:var(--on);font-weight:600}
.chk.pil.rot:has(input:checked){background:var(--red);border-color:var(--red);color:#fff}
.chk.pil:has(input:disabled){opacity:.55;cursor:default}
.ro-t th small,.ro-t td small{display:block;font-weight:400;font-size:.75rem}.ro-t td.c,.ro-t th.c{text-align:center}.ro-t tr.grp td{background:var(--hov);font-weight:600}
.ro-n{border:0;background:none;font:inherit;font-weight:600;color:inherit;cursor:pointer;padding:0}.ro-n:hover{text-decoration:underline}.ro-x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:.75rem}
.ro-ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;padding:0;vertical-align:middle;position:relative}
.ro-ck.an{background:var(--ink);border-color:var(--ink)}.ro-ck.an::after{content:"";position:absolute;left:5px;top:1.5px;width:4px;height:9px;border:solid var(--card);border-width:0 2px 2px 0;transform:rotate(45deg)}
.ro-a{font-style:normal;font-weight:700;margin-left:.2rem}.ro-a.plus{color:var(--ok)}.ro-a.minus{color:var(--red)}.ro-e{max-width:36ch;white-space:normal}
.appchk label:has(input:focus-visible),.chk.pil:has(input:focus-visible){outline:2px solid var(--y);outline-offset:2px}
.pils{display:flex;gap:.4rem;flex-wrap:wrap;margin:.3rem 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.8rem}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.35rem 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600;text-align:right}
.kv small{text-align:right;white-space:nowrap}
.svc{display:flex;align-items:center;gap:.2rem}
.dot{flex:none}
.svc small{color:var(--mute)}
.note{background:var(--hov);border:1px solid var(--line);border-radius:calc(10px*var(--rk,1));padding:.8rem 1rem;color:var(--mute);margin-top:1rem;font-size:.92rem}
.lk{display:flex;flex-direction:column;gap:.4rem;margin:.4rem 0}
.lk a,.lk button{justify-content:flex-start}
.dl{display:flex;flex-direction:column;gap:.5rem;margin:.6rem 0}
.dl label{display:flex;gap:.6rem;align-items:flex-start;border:1px solid var(--line);border-radius:calc(8px*var(--rk,1));padding:.55rem .7rem;cursor:pointer}
.dl label small{display:block;color:var(--mute)}
.st{margin-bottom:1rem}
.st h2{margin:0 0 .3rem}
.st>p.mute{margin:0 0 .9rem;font-size:.9rem}
.st-row{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.45rem 0}
.st-row>span{min-width:220px;font-weight:500}
.sw{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.sw button,.sw label{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:0 0 0 1px var(--line);position:relative;overflow:hidden;cursor:pointer}
.sw .on{border-color:var(--ink)}
.sw label{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.st-k{border:1px solid var(--line);border-radius:calc(10px*var(--rk,1));padding:.8rem 1rem;margin-top:.7rem}
.st-kh{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.st-kh .pill{margin-left:auto}.st-sw{flex:none}.st-sw button{padding:.25rem .8rem}
.st-off{background:color-mix(in srgb,var(--line) 25%,transparent)}.st-off>:not(.st-kh){opacity:.45}.st-off .st-kh b{opacity:.6}
.st-g{display:grid;grid-template-columns:1.4fr 1fr;gap:.6rem 1rem;margin-top:.6rem}
.st-g label{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem;color:var(--mute)}
.st-g input,.st-g select{color:var(--ink);font-size:.95rem}
.st-a{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.6rem}
.st-r{font-size:.85rem}
@media (max-width:640px){.st-g{grid-template-columns:1fr}.st-row>span{min-width:0}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:calc(999px*var(--rkp,1));padding:3px;gap:2px;background:var(--card)}
.seg button{border-radius:calc(999px*var(--rkp,1));padding:.35rem .9rem;color:var(--mute);font-size:.9rem;white-space:nowrap}
.seg button.on{background:var(--y);color:var(--on);font-weight:600}
.plist{display:flex;flex-direction:column;gap:.5rem}
.prow{display:grid;grid-template-columns:minmax(220px,1.3fr) minmax(200px,1.5fr) auto;gap:.6rem 1rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:calc(12px*var(--rk,1));padding:.8rem 1rem}
.prow:hover{border-color:color-mix(in srgb,var(--y) 45%,var(--line))}
.prow.arch{opacity:.7}
.pmain b{font-size:1rem}
.pmain small{display:block;color:var(--mute);font-size:.84rem;margin-top:.1rem}
.pmain small.who{font-size:.78rem}
.papps{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:calc(999px*var(--rkp,1));padding:.15rem .6rem;font-size:.8rem;color:var(--ink);background:var(--hov);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.bt{border-color:color-mix(in srgb,var(--ok) 60%,var(--line))}
.chip.no{border-style:dashed;border-color:var(--red);color:var(--red);background:transparent;cursor:pointer}
.pact{display:flex;gap:.4rem;justify-content:flex-end}
.btn.ic{padding:.3rem .6rem;font-size:1.05rem;line-height:1}
.pmenu{position:fixed;z-index:95;background:var(--card2);border:1px solid var(--line);border-radius:calc(10px*var(--rk,1));box-shadow:var(--sh0,0 10px 30px rgba(0,0,0,.3));display:flex;flex-direction:column;padding:.25rem 0;min-width:220px}
.pmenu button{text-align:left;color:var(--ink);padding:.6rem 1rem;border-radius:0}
.pmenu button:hover{background:var(--hov)}
.pmenu .dn{color:var(--red)}
.pf-h{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.9rem;flex-wrap:wrap}
.pf{display:grid;grid-template-columns:140px 1fr;gap:.55rem .8rem}
.pf label{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem;color:var(--mute)}
.pf label.w{grid-column:1/-1}
.mtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.6rem;margin-bottom:1rem}
.mtile{display:grid;grid-template-columns:40px minmax(0,1fr);grid-template-rows:auto auto;column-gap:.7rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:calc(10px*var(--rk,1));padding:.6rem .75rem;color:var(--ink);text-decoration:none;transition:border-color .15s,transform .15s}
.mtile:hover{border-color:var(--y);transform:translateY(-1px)}
.mtile .ic{grid-row:1/3;width:40px;height:40px;border-radius:calc(10px*var(--rk,1));display:grid;place-items:center;background:var(--hov);color:var(--y)}
.mtile .ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mtile b{font-size:1rem;line-height:1.2}
.mtile .d{color:var(--mute);font-size:.8rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtile.ok .d{color:#2f9e5a}
details.hilfe{margin-top:.7rem;font-size:.85rem;color:var(--mute)}
details.hilfe summary{cursor:pointer;color:var(--ink);font-weight:600}
details.hilfe p{margin:.4rem 0 0}
.sf{display:grid;grid-template-columns:1fr 1fr;gap:.6rem 1rem}
.sf label{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem;color:var(--mute)}
.sf label.w{grid-column:1/-1}
.sf input,.sf select{color:var(--ink);font-size:.95rem}
@media (max-width:640px){.sf{grid-template-columns:1fr}}
.pf input{color:var(--ink);font-size:1rem}
.pf-sec{margin:1rem 0 .4rem;font-weight:600;font-size:.92rem}
.pf-sec .mute{font-weight:400;font-size:.82rem}
.pf-users{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.3rem .8rem;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:calc(10px*var(--rk,1));padding:.6rem .8rem}
.pf-users label{display:flex;gap:.45rem;align-items:center;font-size:.92rem}
.pf-users label.off{opacity:.55}
.pf-users small{color:var(--mute);font-size:.72rem;white-space:nowrap}
@media (max-width:820px){.prow{grid-template-columns:minmax(0,1fr)}.pmain,.papps{min-width:0}.pmain b,.pmain small{overflow-wrap:anywhere}.papps .chip{max-width:100%;white-space:normal;overflow-wrap:anywhere}.pact{justify-content:flex-start}}
@media (max-width:760px){.hide-s{display:none}}
/* eingebettet im Einstellungsfenster (Verwaltung → Einstellungen): nur die Einstellungen, ohne Kopfleiste, Reiter und Unternavigation */
html.embed .bph,html.embed #navL,html.embed .stnav{display:none!important}
.ke-key{background:color-mix(in srgb,var(--warn,#b7791f) 10%,var(--card));border:1px solid color-mix(in srgb,var(--warn,#b7791f) 35%,transparent);border-radius:calc(8px*var(--rk,1));padding:.6rem .8rem;margin:.4rem 0 .8rem}
.ke-g{display:grid;gap:.8rem}.ke-g.ke-aus{opacity:.55}.ke-k h3{margin:0 0 .2rem;font-size:1rem}.ke-k .bar{flex-wrap:wrap}.ke-k input{min-width:14rem}
.ke-erg{border-top:1px solid var(--line);margin-top:1rem;padding-top:.8rem}.ke-erg h3{margin:0 0 .5rem}
.ke-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.5rem 1rem}.ke-2 label{display:grid;gap:.2rem}.ke-2 textarea{width:100%;box-sizing:border-box;font:inherit}
.ke-alt{white-space:pre-wrap;font:inherit;font-size:.86rem;color:var(--mute);max-height:22rem;overflow:auto;margin:.2rem 0 0}
.ke-s{border:1px solid var(--line);border-radius:calc(8px*var(--rk,1));padding:.4rem .6rem;margin:.4rem 0}.ke-o{display:flex;gap:.5rem;align-items:flex-start;padding:.2rem 0}.ke-o small{display:block;color:var(--mute);font-size:.8rem}
.ke-t td small{display:block;color:var(--mute);font-size:.82rem;white-space:normal}.ke-t td{vertical-align:top}
@media (max-width:760px){.ke-2{grid-template-columns:minmax(0,1fr)}}
iframe.adm-app{width:100%;height:calc(100vh - 13rem);min-height:420px;border:1px solid var(--line);border-radius:calc(10px*var(--rk,1));background:var(--bg)}
html.embed .wrap{padding:.6rem .2rem 2rem;max-width:none}
#main.breit{max-width:1700px}
html.embed body{background:transparent}
.ap-r{display:grid;grid-template-columns:auto 1fr auto;gap:.6rem;align-items:center;padding:.4rem .2rem;border-bottom:1px solid var(--line);font-size:.86rem}.ap-r span{display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere}.ap-r small{color:var(--mute)}
.ord-l{display:flex;gap:.5rem;align-items:center;font-weight:600}.ord-l select{min-width:18rem;font-weight:400}
.ord-ps{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:.2rem .8rem;max-height:14rem;overflow:auto;border:1px solid var(--line);border-radius:calc(8px*var(--rk,1));padding:.5rem .7rem}
.ord-p,.ord-s{display:flex;gap:.45rem;align-items:flex-start;font-size:.88rem;padding:.12rem 0;cursor:pointer}.ord-p input,.ord-s input{margin-top:.2rem;accent-color:var(--y)}
.ord-k{max-width:1100px;margin-top:1rem}.ord-k h4{margin:.8rem 0 .2rem;font-size:.9rem}
.ord-vn{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:.9rem;border-top:1px solid var(--line);padding-top:.6rem}.ord-vn h4{margin:0 0 .3rem}
.ord-z{font-size:.84rem;padding:.08rem 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ord-z.neu{color:var(--ok,#1e8a4c);font-weight:600}.ord-z.umb{color:var(--y);font-weight:600}.ord-z.hoch{font-style:italic;color:var(--ok,#1e8a4c);font-weight:600}.ord-z.alt{color:#c0392b;font-weight:600;text-decoration:line-through;text-decoration-thickness:1px}
.ord-test{border:1px solid var(--y);border-radius:calc(8px*var(--rk,1));padding:.5rem .8rem}
.ord-fuss{position:sticky;bottom:0;background:var(--bg);padding:.7rem 0;max-width:1100px;margin-top:1rem;border-top:1px solid var(--line)}
@media (max-width:760px){.ord-vn{grid-template-columns:1fr}}
.ap-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(19rem,1fr));gap:0 1.5rem}.ap-a{grid-template-columns:1fr auto auto}
.ap-r span.ap-sw{display:inline-flex;flex-direction:row;border:1px solid var(--line);border-radius:calc(999px*var(--rkp,1));padding:2px;gap:2px}.ap-sw button{border:0;background:none;padding:.22rem .8rem;border-radius:calc(999px*var(--rkp,1));color:var(--mute);cursor:pointer;font:inherit;font-size:.85rem}.ap-sw button.on{background:var(--y);color:var(--on);font-weight:600}
.stp{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.8rem}.stp-k{display:grid;gap:.35rem;border:1px solid var(--line);border-radius:calc(10px*var(--rk,1));padding:.7rem}
.stp-b{min-height:90px;display:grid;place-items:center;background:#fff;border-radius:calc(8px*var(--rk,1))}.stp-b img{max-width:100%;max-height:110px;transform:rotate(-3deg)}
</style>
</head>
<body>
<main class="bp-app">
  <aside class="bp-nav" id="navL" aria-label="Verwaltung"></aside>
  <section class="pane wrap" id="main"></section>
</main>
<script src="bp/baukasten.js"></script>
<script src="static/admin-ordner.js"></script>
<script src="static/admin-rollen.js"></script>
<script src="static/kataloge.js"></script>
<script src="static/admin-kataloge.js"></script>
<script>
// Büro-Einstellungen: jetzt unter Verwaltung → Einstellungen in jeder App (hier eingebettet über ?einbetten=1); die Adressen #einstellungen… gelten weiter
const EMBED = new URLSearchParams(location.search).has('einbetten');
if (EMBED) document.documentElement.classList.add('embed');
const TABS = [['projekte', 'Projekte'], ['users', 'Benutzer:innen'], ['rollen', 'Rollen & Rechte'], ['sessions', 'Angemeldet'], ['ordner', 'Projektordner'], ['system', 'System']];
let tab = (location.hash || (EMBED ? '#einstellungen' : '#projekte')).slice(1), me = null, data = {};
if (tab.startsWith('einstellungen-')) { data.stab = tab.slice(14); tab = 'einstellungen'; }
if (tab === 'status' || tab === 'audit') { data.sys = tab === 'audit' ? 'protokoll' : 'health'; tab = 'system'; }   // alte Lesezeichen
const SYS = [['health', 'Server-Status'], ['bugs', 'Bug-Meldungen'], ['hilfe', 'Hilfe-Anfragen'], ['fehler', 'Fehlermeldungen'], ['protokoll', 'Protokoll'], ['altpdf', 'Alte PDFs aufräumen']];
const sysNav = () => '';   // die Bereiche von „System“ stehen links in der Navigation
const ago = (t) => { if (!t) return '–'; const s = Date.now() / 1000 - t; return s < 90 ? 'gerade eben' : s < 3600 ? `vor ${Math.round(s / 60)} Min.` : s < 86400 ? `vor ${Math.round(s / 3600)} Std.` : new Date(t * 1000).toLocaleDateString('de-DE'); };
/* Links (bpNav) statt Reiter oben: Büro, Menschen, Einstellungen, System mit seinen Bereichen */
const ADM_IC = { rollen: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>', projekte: '<path d="M3 11l9-7 9 7M5 10v10h14V10"/>', ordner: '<path d="M3 6h7l2 2h9v11H3z"/>', users: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  sessions: '<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M17 11a3 3 0 1 0 0-6M21 20a5 5 0 0 0-4-5"/>', ich: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', buero: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
  health: '<path d="M3 12h4l3-7 4 14 3-7h4"/>', bugs: '<path d="M8 8a4 4 0 0 1 8 0v8a4 4 0 0 1-8 0zM4 12h4M16 12h4M5 6l3 2M19 6l-3 2M5 18l3-2M19 18l-3-2"/>', hilfe: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.7M12 17h.01"/>',
  fehler: '<path d="M12 3l10 18H2zM12 10v5M12 18v.5"/>', protokoll: '<path d="M5 4h14v16H5zM8 9h8M8 13h8M8 17h4"/>', altpdf: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>' };
/* Register (besprochen am 13.11.2026): Büro · Einstellungen · System – die Büro-Einstellungen stehen direkt hier, je Register mit Reitern;
   dieselben Teile zeigt Verwaltung → Einstellungen in jeder App. Persönliches bleibt unter ⚙ → Persönlich. */
const REGS = [['ich', 'Persönlich', 'ich', 'var(--c-t)', [['ich:konto', 'Mein Konto'], ['ich:look', 'Darstellung'], ['ich:ki', 'KI']]],
  ['buero', 'Büro & Standort', 'buero', 'var(--c-b)', [['firma', 'Firma, Logo & Bundesland'], ['darstellung', 'Darstellung']]],
  ['ablage', 'Ablage & Server', 'ordner', 'var(--c-o)', [['ablage', 'Ablage'], ['sicherung', 'Datensicherung']]],
  ['mail', 'Mail & Kalender', 'protokoll', 'var(--c-g)', [['mail', 'Mailserver']]],
  ['apps', 'Apps', 'projekte', 'var(--c-r)', [['apps', 'Apps im Büro']]],   // dazu je App ihre Einstellungen (appRegs, sobald die Apps bekannt sind)
  ['druck', 'Druck & Vorlagen', 'protokoll', 'var(--c-t)', [['druck', 'Druck-Layouts'], ['vorlagen', 'E-Mail-Vorlagen']]],
  ['ki', 'KI', 'buero', 'var(--c-v)', [['allgemein', 'KI']]],
  ['kataloge', 'Kataloge erzeugen', 'projekte', 'var(--c-g)', [['kataloge', 'Kataloge erzeugen']]],   // admin-kataloge.js
  ['verlauf', 'Verlauf aller Änderungen', 'protokoll', '', [['verlauf', 'Verlauf']]]];
const regVon = (st) => REGS.find((r) => r[4].some(([k]) => k === String(st).split('~')[0])) || REGS.find((r) => r[0] === (ADMIN() ? 'ki' : 'ich'));
const ADMIN = () => !!(me && me.is_admin);   // ohne Verwaltungsrecht: nur „Persönlich“ und die Seiten der eigenen Apps (Server prüft genauso)
function appRegs() {   // je App, die diese:r benutzen darf, eine Seite mit ihren Einstellungen (⚙ in der App springt hierher)
  const A = (data.conf.apps || []).filter((a) => a.allowed && !a.teil && a.key !== 'admin').map((a) => ['app:' + a.key, a.key === 'portal' ? 'Startseite' : a.name]);
  REGS.find((r) => r[0] === 'apps')[4] = (ADMIN() ? [['apps', 'Apps im Büro']] : []).concat(A);
}
const MENSCHEN = [['users', 'Benutzer:innen'], ['rollen', 'Rollen & Rechte'], ['sessions', 'Angemeldet']];
const menNav = () => (EMBED ? '' : `<div class="bar stnav" style="margin-bottom:1rem">${MENSCHEN.map(([k, l]) => `<button class="btn sm ${k === tab ? 'pri' : ''}" data-men="${k}">${l}</button>`).join('')}</div>`);
function admNav() {
  const P = (id, text, ic, farbe) => ({ id, text, icon: ADM_IC[ic], farbe });
  const akt = tab === 'system' ? 's:' + (data.sys || 'health') : tab === 'einstellungen' ? 'e:' + regVon(data.stab || 'allgemein')[0] : MENSCHEN.some(([k]) => k === tab) ? 'menschen' : tab;
  bpNav($('#navL'), { kopf: { titel: 'Verwaltung', klein: '' }, lage: true, attr: 'adm', aktiv: akt,

        load();
      } else if (m === 'pw') {
        if (!btn.dataset.sure) { btn.dataset.sure = 1; btn.textContent = 'Wirklich zurücksetzen?'; return; }
        const r = await api(`api/users/${u.id}/password`, 'POST'); close(); showPw(u.name, r.password, false); load();
      } else if (m === 'out') { await api(`api/users/${u.id}/logout`, 'POST'); close(); toast(`${u.name} ist überall abgemeldet.`); load(); }
      else if (m === 'del') {
        if (!btn.dataset.sure) { btn.dataset.sure = 1; btn.textContent = 'Wirklich löschen?'; return; }
        await api('api/users/' + u.id, 'DELETE'); close(); toast(`${u.name} gelöscht.`); load();
      }
    } catch (e) { err(e); }
  });
}
function showPw(name, pw, isNew) {
  modalBox(`<h3>${isNew ? 'Benutzer:in angelegt' : 'Kennwort zurückgesetzt'}</h3>
    <p>Startkennwort für <b>${esc(name)}</b> – wird nur jetzt angezeigt. ${esc(name)} vergibt beim ersten Anmelden ein eigenes Kennwort.</p>
    <div class="secret">${esc(pw)}</div>
    <div class="acts"><button class="btn" data-m="copy">Kopieren</button><button class="btn pri" data-m="x">Fertig</button></div>`,
  async (m, bg, close) => { if (m === 'copy') { try { await navigator.clipboard.writeText(pw); toast('Kopiert.'); } catch { toast('Bitte markieren und kopieren.', true); } } else close(); });
}
$('#main').addEventListener('click', (e) => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  if (b.dataset.a === 'new') userForm(null);
  else if (b.dataset.a === 'edit') userForm(data.u.users.find(u => u.id === +b.closest('tr').dataset.id));
  else if (b.dataset.a === 'end') api('api/sessions/' + b.dataset.id, 'DELETE').then(() => { toast('Sitzung beendet.'); load(); }).catch(e => toast(e.message, true));
  else if (b.dataset.a === 'cat') { data.cat = b.dataset.cat; load(); }
  else if (b.dataset.a === 'reload') load();
  else if (b.dataset.a === 'sys') { data.sys = b.dataset.sys; load(); }

  else if (b.dataset.a === 'popen') openDlg(projOf(b));
  else if (b.dataset.a === 'pdel') delDlg(projOf(b));
  else if (b.dataset.a === 'pnew') { if (window.BPHead && BPHead.projektBearbeiten) BPHead.projektBearbeiten(null, { onSaved: () => load() }); else projForm(null); }
  else if (b.dataset.a === 'pedit') { const p = projOf(b); if (window.BPHead && BPHead.projektBearbeiten) BPHead.projektBearbeiten(p.bt.id, { archiv: true, onSaved: () => load(), onDelete: () => delDlg(p) }); else projForm(p); }
  else if (b.dataset.a === 'pmore') moreMenu(projOf(b), b);
  else if (b.dataset.a === 'mkbt') mkBt(projOf(b));
});
