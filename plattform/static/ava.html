<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#84827c">
<title>Ausschreibung & Abrechnung</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="bp/bp.css">
<link rel="stylesheet" href="static/ava.css">
</head>
<body>
<main class="ava">
  <div class="rib" role="toolbar" aria-label="Werkzeuge">
    <select id="proj" aria-label="Projekt" hidden></select>
    <div class="rg"><div class="rr">
      <button class="rb" id="newBtn" title="Neues Leistungsverzeichnis / neuer Auftrag"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M12 11v6M9 14h6" class="ac"/></svg>Neu</button>
      <button class="rb" data-act="pos" data-need="lv" title="Position anhängen"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h12"/><path d="M19 15v6M16 18h6" class="ac"/></svg>Position</button>
      <button class="rb" data-act="glied" data-need="lv" title="Gliederungspunkt eine Ebene unter der markierten Zeile"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/><path d="M17 12v5M14.5 14.5h5" class="ac"/></svg>Gliederung</button>
    </div><div class="rl">Neu</div></div>
    <div class="rg"><div class="rr">
      <button class="rb" id="tlBtn" title="Türliste des Projekts: alle Türen mit Raum, Maßen, Anschlag, Brand- und Schallschutz, Ausstattung – später als Positionen ins LV"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="11" height="18" rx="1"/><circle cx="13" cy="12" r=".9"/><path d="M19 8h3M19 12h3M19 16h3" class="ac"/></svg>Türliste</button>
    </div><div class="rl">Listen</div></div>
    <div class="rg"><div class="rr">
      <button class="rb" id="quBtn" title="Ein LV aus einem anderen (alten) Projekt daneben anzeigen – schreibgeschützt – und Positionen herüberkopieren"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="16" rx="1"/><rect x="13" y="4" width="8" height="16" rx="1"/><path d="M8 12h8M13 9l3 3-3 3"/></svg>Kopierquelle</button>
      <button class="rb" id="moreBtn" title="Archivieren oder löschen"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Archiv / Löschen</button>
    </div><div class="rl">Bearbeiten</div></div>
    <div class="rg"><div class="rr">
      <button class="rb" id="impBtn" title="GAEB-Datei (X81–X86) oder ausgefülltes Excel einlesen"><svg viewBox="0 0 24 24"><path d="M5 14v6h14v-6"/><path d="M12 3v11M8 10l4 4 4-4" class="ac"/></svg>Import …</button>
      <button class="rb" id="expBtn" title="Als Datei speichern: GAEB X83/X86 oder Excel zum Ausfüllen"><svg viewBox="0 0 24 24"><path d="M5 14v6h14v-6"/><path d="M12 15V4M8 8l4-4 4 4" class="ac"/></svg>Export …</button>
      <button class="rb" id="druBtn" data-need="lv" title="LV drucken oder als PDF – Layout wählen, Deckblatt und Texte bearbeiten; Preisspiegel, Massenermittlung"><svg viewBox="0 0 24 24"><path d="M7 8V3h10v5"/><rect x="3" y="8" width="18" height="9" rx="1.5"/><path d="M7 14h10v7H7z" class="ac"/></svg>Drucken / PDF</button>
    </div><div class="rl">Datenaustausch</div></div>
    <div class="rg"><div class="rr"><div class="vqb"><input type="search" id="vq" placeholder="Volltext: Text, OZ, Firma, Raum …" autocomplete="off" title="Volltextsuche in allen LVs, Angeboten, Aufmaß und Türliste (Strg+Umschalt+F)" aria-label="Volltextsuche"><span class="seg sm vq-wo" role="radiogroup" aria-label="Suchen in"><button type="button" data-vqwo="lv" title="nur im geöffneten LV – mit seinen Angeboten, Aufmaß und Rechnungen">dieses LV</button><button type="button" data-vqwo="projekt" title="in allen LVs dieses Projekts">Projekt</button><button type="button" data-vqwo="alle" title="in allen Projekten">alle Projekte</button></span></div></div><div class="rl">Suchen</div></div>
    </div>
  <nav class="stp" id="stp" aria-label="Arbeitsschritte"></nav>
  <section class="einu" id="einu" aria-label="Leistungsverzeichnisse im Überblick"></section>
  <div class="body">
    <aside class="nav bp-nav" id="navL" aria-label="Projekt"><div class="nsuche" id="nsuche"></div><div id="tabs"></div></aside>
    <section class="pane">
      <div class="utb" id="utb" role="tablist" aria-label="Bereiche des Schritts"></div>
      <div class="ph"><b id="phT"></b><button type="button" id="sel" aria-label="Leistungsverzeichnis wählen"></button><span class="stat" id="stat"></span><span class="ph-r"><span class="save" id="save" role="status"></span><span id="phFirma" class="ph-firma"></span><button type="button" class="btn sm" id="phLvD" title="Angaben zur Ausschreibung (Vergabeart, Abgabe, Zuschlag, Ausführung) und zum Auftrag">📋 LV- &amp; Auftragsdaten</button><button type="button" class="btn sm" id="phPrD" title="Bauherr, Projektbeschreibung, Termine – dieselbe Maske wie in der Verwaltung">🏗 Projektdaten</button></span><div class="kz"><div class="kpi" id="kpi"></div></div></div>
      <div class="bfl" id="bfl"></div>
      <div id="view"><p class="mute">Lade …</p></div>
    </section>
    <aside class="qu" id="quelle" hidden aria-label="Kopierquelle"></aside>
    <div class="rand-griff" data-seite="l" title="Breite der Navigation ziehen (Doppelklick: Standard)"></div><div class="rand-griff" data-seite="r" hidden title="Breite der Kopierquelle ziehen (Doppelklick: Standard)"></div>
  </div>
</main>
<div id="mView" aria-label="Handy-Ansicht"></div>
<input type="file" id="fileIn" accept=".x81,.x82,.x83,.x84,.x85,.x86,.xml,.xlsx,.pdf,image/*,.docx" hidden>
<datalist id="lbList"></datalist>
<datalist id="gwList"></datalist>
<script src="bp/baukasten.js"></script>
<script src="static/kataloge.js"></script>
<script src="static/ava-kern.js"></script>
<script src="static/ava-baum.js"></script>
<script src="static/ava-lv.js"></script>
<script src="static/ava-aufmass.js"></script>
<script src="static/ava-rechnungen.js"></script>
<script src="static/ava-werkzeuge.js"></script>
<script src="static/ava-bearbeiten.js"></script>
<script src="static/ava-auftraege.js"></script>
<script src="static/ava-tueren.js"></script>
<script src="static/ava-start.js"></script>
<script src="static/tlimport.js"></script>
<script src="static/pdbwahl.js"></script>
</body>
</html>
