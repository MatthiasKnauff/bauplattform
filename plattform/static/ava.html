<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#84827c">
<title>Ausschreibung & Abrechnung</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="static/bp.css">
<style>
.wrap{max-width:1320px;padding-bottom:6rem}
.top{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:0 0 .7rem}
.top .fill{flex:1}
.top select#proj{min-width:15rem;max-width:100%}
#sel{min-width:18rem}
.save{font-size:.82rem;color:var(--mute)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;margin:.2rem 0 1rem}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.55rem .8rem}
.kpi small{display:block;color:var(--mute);font-size:.76rem}
.kpi b{font-size:1.08rem;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:.75rem;color:var(--mute)}
.stat{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center;margin:-.2rem 0 .8rem;font-size:.85rem}
.stat button{border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;color:var(--mute);font-size:.82rem}
.stat button.on{border-color:var(--y);color:var(--ink);font-weight:600}
.tabs{margin:0 -.2rem 1rem;border-radius:10px 10px 0 0}
.tab small{margin-left:.35rem;font-size:.75rem;border-radius:999px;padding:.05rem .45rem;background:var(--hov);color:var(--mute)}
.bar{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center;margin-bottom:.7rem}
.bar .fill{flex:1}
table.lv{width:100%;border-collapse:collapse;font-size:.9rem}
table.lv th{text-align:left;font-size:.75rem;color:var(--mute);font-weight:600;padding:.4rem .35rem;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--card);z-index:2}
table.lv td{padding:.22rem .35rem;border-bottom:1px solid var(--line);vertical-align:top}
table.lv td.r,table.lv th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.lv input,table.lv select,table.lv textarea{font:inherit;font-size:.88rem;padding:.25rem .35rem;border-radius:6px;border:1px solid transparent;background:transparent;color:inherit;width:100%;box-sizing:border-box}
table.lv input:hover,table.lv select:hover,table.lv textarea:hover{border-color:var(--line)}
table.lv input:focus,table.lv select:focus,table.lv textarea:focus{border-color:var(--y);background:var(--inp);outline:0}
table.lv input.n{text-align:right;font-variant-numeric:tabular-nums}
table.lv tr.ti td{background:var(--hov);font-weight:700}
table.lv tr.ti input{font-weight:700}
table.lv tr.ti.l2 td{background:transparent}
table.lv tr.txt td{color:var(--mute);font-style:italic}
table.lv tr.nt td:first-child{box-shadow:inset 3px 0 0 #e07b3a}
table.lv tr.lang td{border-bottom:1px solid var(--line);padding-top:0}
table.lv textarea{min-height:5.5rem;resize:vertical;border-color:var(--line)}
.oz{font-variant-numeric:tabular-nums;color:var(--mute);white-space:nowrap;font-size:.82rem;padding-top:.45rem!important}
.ib{background:transparent;border:0;color:var(--mute);cursor:pointer;padding:.15rem .3rem;border-radius:6px;font-size:.92rem;line-height:1}
.ib:hover{color:var(--ink);background:var(--hov)}
.ib.on{color:var(--y)}
.acts-c{white-space:nowrap;text-align:right}
.badge{display:inline-block;font-size:.7rem;border-radius:999px;padding:.02rem .4rem;border:1px solid var(--line);color:var(--mute);margin-left:.25rem;vertical-align:1px;font-style:normal;font-weight:500}
.badge.nt{border-color:#e07b3a;color:#e07b3a}
.tblw{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:calc(100vh - 230px)}
.ps td.bp{min-width:8.5rem}
.ps input.ep{width:6.5rem}
.ps .min input{color:var(--ok);font-weight:700}
.ps .aus input{text-decoration:underline wavy #e07b3a}
.ps .gp{display:block;font-size:.72rem;color:var(--mute);text-align:right;padding-right:.4rem}
.ps tfoot td{font-weight:600;background:var(--hov)}
.ps th.bh{min-width:9rem;white-space:normal}
.ps th.bh .bn{display:flex;gap:.3rem;align-items:center;justify-content:space-between}
.ps th.win{box-shadow:inset 0 -3px 0 var(--ok)}
.empty{padding:2rem;text-align:center;color:var(--mute)}
.am td{font-size:.88rem}
.am tr.ph td{background:var(--hov);font-weight:600}
.am tr.ph .ok{color:var(--ok)}
.am tr.ph .ueb{color:#e07b3a}
.re{display:grid;gap:1rem}
.re .card h3{margin:0 0 .3rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.re .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem .8rem;margin:.6rem 0}
.re .g label{display:flex;flex-direction:column;font-size:.78rem;color:var(--mute);gap:.15rem}
.re table{width:100%;border-collapse:collapse;font-size:.9rem;max-width:620px}
.re table td{padding:.25rem .3rem;border-bottom:1px solid var(--line)}
.re table td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.re table tr.s td{font-weight:700;background:var(--hov)}
.re .abz{display:flex;gap:.4rem;margin:.2rem 0}
.re .abz input{padding:.25rem .4rem}
.ue td,.ue th{padding:.45rem .5rem}
.ue tr:hover td{background:var(--hov);cursor:pointer}
.modal.wide{width:min(860px,96vw)}
.fm{display:grid;grid-template-columns:9rem 1fr;gap:.5rem .8rem;align-items:center}
.fm .w{grid-column:1/-1}
.fm input,.fm select,.fm textarea{width:100%;box-sizing:border-box}
.src{display:grid;gap:.35rem;margin:.6rem 0}
.src label{display:flex;gap:.5rem;align-items:baseline}
.kgs[hidden]{display:none}
.kgs{display:flex;flex-wrap:wrap;gap:.3rem .8rem;margin:.3rem 0 0 1.6rem;font-size:.88rem}
.hint{color:var(--mute);font-size:.85rem}
.vb{border:1px solid var(--ok);border-radius:10px;padding:.55rem .8rem;margin-bottom:.8rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.menu{position:fixed;z-index:95;background:var(--card2);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.35);padding:.3rem;min-width:15rem}
.menu button{display:block;width:100%;text-align:left;padding:.45rem .7rem;border-radius:7px;color:var(--ink)}
.menu button:hover{background:var(--hov)}
.menu small{display:block;color:var(--mute);font-size:.75rem}
.menu hr{border:0;border-top:1px solid var(--line);margin:.25rem 0}
@media (max-width:760px){.top select#proj,#sel{min-width:0;flex:1 1 100%;width:100%}.top .fill{display:none}.fm{grid-template-columns:1fr}.hide-m{display:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <select id="proj" aria-label="Projekt"></select>
    <button type="button" id="sel" aria-label="Leistungsverzeichnis wählen"></button>
    <button class="btn sm" id="newBtn">+ Neues LV</button>
    <button class="btn sm" id="impBtn" title="GAEB-Datei (X81–X86) oder ausgefülltes Excel einlesen">⇣ Einlesen …</button>
    <button class="btn sm" id="expBtn" title="GAEB, Excel und PDF">⇡ Ausgeben …</button>
    <button class="btn sm" id="verBtn" title="Frühere Stände dieses LV ansehen und wiederherstellen">↶ Verlauf</button>
    <button class="btn sm" id="moreBtn">Archivieren / Löschen …</button>
    <span class="fill"></span><span class="save" id="save" role="status"></span>
  </div>
  <div class="stat" id="stat"></div>
  <div class="kpi" id="kpi"></div>
  <nav class="tabs" id="tabs"></nav>
  <div id="view"><p class="mute">Lade …</p></div>
</main>
<input type="file" id="fileIn" accept=".x81,.x82,.x83,.x84,.x85,.x86,.xml,.xlsx" hidden>
<datalist id="ehList"><option>m</option><option>m2</option><option>m3</option><option>St</option><option>psch</option><option>kg</option><option>t</option><option>h</option><option>lfm</option></datalist>
<datalist id="gwList"></datalist>
<script src="static/bp.js"></script>
<script>
const LS = { get(k, d) { try { const v = localStorage.getItem('ava.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('ava.' + k, JSON.stringify(v)); } catch { /* egal */ } } };
const TABS = [['lv', 'Leistungsverzeichnis'], ['angebote', 'Angebote & Vergabe'], ['aufmass', 'Aufmaß'], ['rechnungen', 'Rechnungen'], ['uebersicht', 'Übersicht Projekt']];
const ARTEN = { N: 'Normal', E: 'Bedarf (ohne GB)', A: 'Wahl (ohne GB)', P: 'Pauschal', T: 'Hinweistext' };
const STATUS = [['entwurf', 'Entwurf'], ['versendet', 'An Bieter versendet'], ['vergeben', 'Vergeben'], ['abgerechnet', 'Abgerechnet']];
let PROJ = [], pid = null, LIST = [], L = null, tab = LS.get('tab', 'lv'), saveT = 0, saving = false, KONT = null, OPEN = new Set(), amPos = LS.get('amPos', null), amNur = LS.get('amNur', false);
if (!TABS.some((t) => t[0] === tab)) tab = 'lv';
const eur = (v) => (v == null || isNaN(v) ? '–' : (Math.abs(v) < 0.005 ? 0 : v).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €');
const eur0 = (v) => (v == null || isNaN(v) ? '–' : Math.round(v).toLocaleString('de-DE') + ' €');
const nf2 = (v) => (v == null || v === '' || isNaN(v) ? '' : (+v).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const nf = (v, n = 3) => (v == null || v === '' || isNaN(v) ? '' : (+v).toLocaleString('de-DE', { maximumFractionDigits: n }));
const pf = (s) => { if (s == null) return null; s = String(s).trim(); if (!s) return null; const v = parseFloat(s.replace(/\./g, (m, i, a) => (/\.\d{3}(\D|$)/.test(a.slice(i)) ? '' : '.')).replace(',', '.')); return isNaN(v) ? null : v; };
const de = (s) => { if (!s) return ''; const d = new Date(s); return isNaN(d) ? s : d.toLocaleDateString('de-DE'); };
const uid = () => Math.random().toString(36).slice(2, 12);
const zaehlt = (p) => p.typ === 'pos' && (p.art === 'N' || p.art === 'P') && !p.nt;
const items = () => (L && L.data && L.data.items) || [];
const posOf = () => items().filter((x) => x.typ === 'pos' && x.art !== 'T');
/* Rechenweg wie auf dem Server: „2 × 3,5 × 2,75 – 0,885 × 2,135“ */
function formel(s) {
  let t = String(s || '').trim(); if (!t) return null;
  t = t.replace(/[×·xX]/g, '*').replace(/÷|:/g, '/').replace(/[–−]/g, '-').replace(/(\d)\.(?=\d{3}(\D|$))/g, '$1').replace(/,/g, '.');
  if (!/^[\d\s.+\-*/()]+$/.test(t)) return null;
  try { const v = Function('"use strict";return (' + t + ')')(); return typeof v === 'number' && isFinite(v) ? Math.round(v * 10000) / 10000 : null; } catch { return null; }
}

/* ---------- Laden / Speichern ---------- */
async function loadProj() {
  PROJ = await api('api/projekte');
  const gp = window.BPHead && BPHead.projektId();
  pid = PROJ.some((p) => p.id === gp) ? gp : PROJ.some((p) => p.id === LS.get('pid')) ? LS.get('pid') : (PROJ.find((p) => !p.archived) || {}).id || null;
  $('#proj').innerHTML = `<optgroup label="Projekte">${PROJ.filter((p) => !p.archived).map((p) => `<option value="${p.id}"${p.id === pid ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</optgroup>`
    + (PROJ.some((p) => p.archived) ? `<optgroup label="Archiv">${PROJ.filter((p) => p.archived).map((p) => `<option value="${p.id}"${p.id === pid ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</optgroup>` : '');
}
async function loadList(want) {
  LIST = pid ? await api('api/lv?project_id=' + pid) : [];
  want = want || LS.get('lv:' + pid);
  const pick = LIST.find((x) => x.id === want) || LIST.find((x) => !x.archived) || LIST[0];
  if (pick) await openLv(pick.id); else { L = null; render(); }
}
async function openLv(id) {
  L = await api('api/lv/' + id); LS.set('lv:' + pid, id); render();
}
function changed(draw = false) {
  $('#save').textContent = 'Nicht gespeichert …';
  clearTimeout(saveT); saveT = setTimeout(saveNow, 800);
  if (draw) render(); else { kpis(); sums(); }
}
async function saveNow(extra = {}) {
  if (!L) return;
  if (saving) { clearTimeout(saveT); saveT = setTimeout(() => saveNow(extra), 400); return; }
  saving = true; saveT = 0;
  try {
    const r = await api('api/lv/' + L.id, 'PUT', { rev: L.rev, data: L.data, ...extra });
    const struct = !!extra.nummerieren;
    L.rev = r.rev; L.calc = r.calc; L.vergabe = r.vergabe; L.status = r.status; L.name = r.name; L.nr = r.nr; L.gewerk = r.gewerk; L.archived = r.archived;
    if (struct) { L.data = r.data; render(); } else { kpis(); selBtn(); }
    const d = new Date(); $('#save').textContent = `Gespeichert ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  } catch (e) {
    $('#save').textContent = 'Nicht gespeichert';
    if (e.data && e.data.conflict) { toast(e.message + ' Der neue Stand wird geladen.', true); await openLv(L.id); } else toast('Speichern fehlgeschlagen: ' + e.message, true);
  } finally { saving = false; }
}
async function flush() { if (saveT) { clearTimeout(saveT); saveT = 0; if ($('#save').textContent.startsWith('Nicht')) await saveNow(); } }
async function call(url, m, body) {   // Aktion auf dem Server, Antwort ist das ganze LV
  await flush();
  const r = await api(url, m, body); L = r; render(); if (r.hinweis) toast(r.hinweis); refreshList(); return r;
}
async function refreshList() { try { LIST = await api('api/lv?project_id=' + pid); selBtn(); } catch { /* egal */ } }

/* ---------- Kopf ---------- */
function selBtn() {
  const x = L && LIST.find((y) => y.id === L.id);
  pickButton($('#sel'), L ? { title: `${L.nr ? L.nr + ' · ' : ''}${L.name}`, sub: [L.gewerk, STATUS.find((s) => s[0] === L.status)[1], L.vergabe.bieter ? 'an ' + L.vergabe.bieter : '', L.archived ? 'archiviert' : ''].filter(Boolean).join(' · ') }
    : { title: LIST.length ? 'LV wählen' : 'Noch kein Leistungsverzeichnis', sub: LIST.length ? `${LIST.length} im Projekt` : 'Mit „+ Neues LV“ anlegen' });
  ['impBtn', 'expBtn', 'verBtn', 'moreBtn'].forEach((k) => { $('#' + k).hidden = !L; });
  if (window.BPHead) BPHead.setProject({ title: L ? `LV ${L.nr} ${L.name}` : '', sub: L ? L.projekt : '' });
}
$('#sel').addEventListener('click', () => pickMenu($('#sel'), {
  search: LIST.length > 6 ? 'LV suchen …' : '', empty: 'Noch kein LV in diesem Projekt.',
  items: LIST.map((x) => ({ group: x.archived ? 'Archiv' : 'Leistungsverzeichnisse', title: `${x.nr ? x.nr + ' · ' : ''}${x.name}`, sub: [x.gewerk, STATUS.find((s) => s[0] === x.status)[1], x.auftragnehmer, x.auftrag ? eur0(x.auftrag) : x.schaetzung ? 'Schätzung ' + eur0(x.schaetzung) : ''].filter(Boolean).join(' · '), value: x.id, on: L && L.id === x.id })),
  footer: '<button class="btn sm" data-new>+ Neues LV</button>', onPick: (x) => openLv(x.value), onFooter: (e) => { if (e.target.closest('[data-new]')) newDialog(); },
}));
function kpis() {
  if (!L) { $('#kpi').innerHTML = ''; $('#stat').innerHTML = ''; return; }
  const K = L.calc, best = K.angebote.filter((a) => a.summe).sort((a, b) => a.netto - b.netto)[0], bA = best && L.angebote.find((a) => a.id === best.id);
  const nt = K.nachtraege, ges = K.auftrag + nt.beauftragt;
  $('#kpi').innerHTML = `<div><small>Kostenschätzung (LV)</small><b>${eur0(K.schaetzung)}</b>${K.ohne_schaetzung ? `<span class="sub"> · ${K.ohne_schaetzung} Pos. ohne Preis</span>` : ''}</div>
    <div><small>Bestes Angebot</small><b>${best ? eur0(best.netto) : '–'}</b><span class="sub">${bA ? ' · ' + esc(bA.bieter) : L.angebote.length ? '' : ' · noch keine'}</span></div>
    <div><small>Auftrag${L.vergabe.bieter ? ' · ' + esc(L.vergabe.bieter) : ''}</small><b>${L.vergabe.preise ? eur0(K.auftrag) : '–'}</b>${L.vergabe.preise && K.schaetzung ? `<span class="sub"> · ${Math.round((K.auftrag / K.schaetzung - 1) * 100)} % zur Schätzung</span>` : ''}</div>
    <div><small>Nachträge beauftragt</small><b>${nt.beauftragt ? eur0(nt.beauftragt) : '–'}</b>${nt.angemeldet ? `<span class="sub"> · angemeldet ${eur0(nt.angemeldet)}</span>` : ''}</div>
    <div><small>Leistungsstand (Aufmaß)</small><b>${K.leistung ? eur0(K.leistung) : '–'}</b>${ges && K.leistung ? `<span class="sub"> · ${Math.round(K.leistung / ges * 100)} %</span>` : ''}</div>
    <div><small>Abgerechnet (anerkannt)</small><b>${K.abgerechnet ? eur0(K.abgerechnet) : '–'}</b></div>`;
  $('#stat').innerHTML = '<span class="hint">Stand:</span>' + STATUS.map(([k, l]) => `<button type="button" data-status="${k}" class="${L.status === k ? 'on' : ''}">${l}</button>`).join('');
}
function render() {
  selBtn(); kpis();
  const n = { lv: posOf().length, angebote: L ? L.angebote.length : 0, aufmass: L ? new Set(L.aufmass.map((a) => a.pos_id)).size : 0, rechnungen: L ? L.rechnungen.length : 0, uebersicht: LIST.length };
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab ${tab === k ? 'on' : ''}" data-tab="${k}">${l}${n[k] ? `<small>${n[k]}</small>` : ''}</button>`).join('');
  const v = $('#view');
  if (tab === 'uebersicht') { v.innerHTML = vUebersicht(); return; }
  if (!L) { v.innerHTML = `<div class="card empty"><p>${pid ? 'Für dieses Projekt gibt es noch kein Leistungsverzeichnis.' : 'Bitte oben ein Projekt wählen.'}</p>${pid ? '<button class="btn pri" data-act="new">Erstes LV anlegen</button>' : ''}</div>`; return; }
  v.innerHTML = { lv: vLv, angebote: vAngebote, aufmass: vAufmass, rechnungen: vRechnungen }[tab]();
  sums();
}

/* ---------- Leistungsverzeichnis ---------- */
const vergeben = () => !!(L && L.vergabe && L.vergabe.preise);
function vLv() {
  const I = items(), V = vergeben(), VP = (L.vergabe && L.vergabe.preise) || {};
  const rows = I.map((x, i) => {
    if (x.typ === 'titel') return `<tr class="ti l${x.lvl || 1}" data-i="${i}"><td class="oz">${esc(x.oz)}</td><td colspan="${V ? 7 : 6}"><input data-f="kurz" value="${esc(x.kurz)}" placeholder="Titel, z. B. Erdarbeiten" style="padding-left:${((x.lvl || 1) - 1) * 1.2 + .35}rem"></td>
      <td class="r" data-tsum="${i}"></td><td class="acts-c"><button class="ib" data-a="lvl" title="${(x.lvl || 1) > 1 ? 'zum Titel machen' : 'zum Untertitel machen'}">${(x.lvl || 1) > 1 ? '⇤' : '⇥'}</button><button class="ib" data-a="up" title="nach oben">↑</button><button class="ib" data-a="down" title="nach unten">↓</button><button class="ib" data-a="del" title="löschen">✕</button></td></tr>`;
    const open = OPEN.has(x.id), t = x.art === 'T';
    const ep = V ? VP[x.id] : x.ep_s, gp = ep != null && !t ? (x.art === 'E' || x.art === 'A' ? null : (x.menge || 0) * ep) : null;
    let h = `<tr class="${t ? 'txt' : ''}${x.nt ? ' nt' : ''}" data-i="${i}"><td class="oz">${esc(x.oz)}${x.nt ? `<br><span class="badge nt">${esc(x.nt)}</span>` : ''}</td>
      <td><input data-f="kurz" value="${esc(x.kurz)}" placeholder="${t ? 'Hinweistext' : 'Kurztext der Leistung'}">${x.nt ? `<select data-f="nt_status" style="width:auto;font-size:.78rem">${['angemeldet', 'beauftragt', 'abgelehnt'].map((s) => `<option${x.nt_status === s ? ' selected' : ''}>${s}</option>`).join('')}</select>` : ''}</td>
      <td>${t ? '' : `<input class="n" data-f="menge" value="${nf(x.menge)}" inputmode="decimal" style="width:5.5rem">`}</td>
      <td>${t ? '' : `<input data-f="einheit" value="${esc(x.einheit)}" list="ehList" style="width:3.8rem">`}</td>
      <td><select data-f="art" title="${esc(ARTEN[x.art])}" style="width:4.2rem">${Object.entries(ARTEN).map(([k, l]) => `<option value="${k}"${x.art === k ? ' selected' : ''} title="${l}">${k}</option>`).join('')}</select></td>
      <td class="hide-m"><input data-f="kg" value="${esc(x.kg || '')}" placeholder="KG" style="width:3.4rem" inputmode="numeric" title="Kostengruppe DIN 276"></td>
      <td>${t ? '' : V ? `<input class="n" data-vp="${x.id}" value="${ep != null ? nf2(ep) : ''}" inputmode="decimal" style="width:6.5rem" title="Einheitspreis des Auftrags${x.nt ? ' (Nachtragspreis)' : ''}">` : `<input class="n" data-f="ep_s" value="${x.ep_s != null ? nf2(x.ep_s) : ''}" inputmode="decimal" style="width:6.5rem" placeholder="EP" title="geschätzter Einheitspreis (Kostenanschlag)">`}</td>
      ${V ? `<td class="r hint" title="geschätzter EP">${x.ep_s != null ? nf2(x.ep_s) : ''}</td>` : ''}

  const K = L.calc, RC = Object.fromEntries(K.rechnungen.map((r) => [r.id, r]));

  const cards = [...L.rechnungen].reverse().map((r) => {
    const c = RC[r.id], g = r.status === 'geprueft', last = r.nr === Math.max(...L.rechnungen.map((x) => x.nr)), ab = r.data.abzuege || [];
    const L1 = c.leistung - c.nachlass;
    return `<div class="card"><h3>${r.nr}. ${r.art === 'schluss' ? 'Schlussrechnung' : 'Abschlagsrechnung'}${r.re_nr ? ` <span class="hint">Nr. ${esc(r.re_nr)}</span>` : ''}
        <span class="pill ${g ? 'ok' : 'y'}">${g ? 'geprüft ' + de(r.data.geprueft_am) : 'in Prüfung – Aufmaß von heute'}</span></h3>
      <div class="g"><label>Rechnungsnr. der Firma<input data-re="re_nr" data-id="${r.id}" value="${esc(r.re_nr)}"${g ? ' disabled' : ''}></label>
        <label>Rechnungsdatum<input type="date" data-re="datum" data-id="${r.id}" value="${esc(r.datum)}"${g ? ' disabled' : ''}></label>
        <label>Eingang<input type="date" data-re="eingang" data-id="${r.id}" value="${esc(r.eingang)}"${g ? ' disabled' : ''}></label>
        <label>gefordert (kumuliert, netto)<input data-re="gefordert" data-id="${r.id}" value="${r.gefordert ? nf(r.gefordert, 2) : ''}" inputmode="decimal"${g ? ' disabled' : ''}></label>
        <label>Einbehalt %<input data-re="einbehalt" data-id="${r.id}" value="${nf(c.einbehalt_pct, 2)}" inputmode="decimal"${g ? ' disabled' : ''}></label></div>
      <table><tbody>
        <tr><td>Leistungsstand netto (Aufmaß × Auftrags-EP)</td><td class="r">${eur(c.leistung)}</td></tr>
        ${c.nachlass ? `<tr><td>– Nachlass ${nf(L.vergabe.nachlass, 2)} %</td><td class="r">${eur(-c.nachlass)}</td></tr>` : ''}
        ${ab.map((z, k) => `<tr><td><div class="abz"><span>–</span><input data-re="abz-text" data-id="${r.id}" data-k="${k}" value="${esc(z.text || '')}" placeholder="z. B. Bauwasser/Strom" style="flex:1"${g ? ' disabled' : ''}>
          <input data-re="abz-pct" data-id="${r.id}" data-k="${k}" value="${z.pct != null ? nf(z.pct, 2) : ''}" placeholder="%" style="width:4rem" inputmode="decimal"${g ? ' disabled' : ''}>
          <input data-re="abz-betrag" data-id="${r.id}" data-k="${k}" value="${z.betrag != null ? nf(z.betrag, 2) : ''}" placeholder="oder €" style="width:6rem" inputmode="decimal"${g ? ' disabled' : ''}>${g ? '' : `<button class="ib" data-reb="abzdel" data-id="${r.id}" data-k="${k}">✕</button>`}</div></td>
          <td class="r">${eur(-(z.pct != null ? L1 * z.pct / 100 : (z.betrag || 0)))}</td></tr>`).join('')}
        ${g ? '' : `<tr><td colspan="2"><button class="ib" data-reb="abzneu" data-id="${r.id}">+ Abzug (Umlage Bauwasser/Strom, Bauleistungsversicherung, Schadensersatz …)</button></td></tr>`}
        <tr><td>– Sicherheitseinbehalt ${nf(c.einbehalt_pct, 2)} %</td><td class="r">${eur(-c.einbehalt)}</td></tr>
        <tr class="s"><td>= anerkannt (kumuliert)</td><td class="r">${eur(c.anerkannt)}</td></tr>
        <tr><td>– bisher anerkannt</td><td class="r">${eur(-c.vorher)}</td></tr>
        <tr class="s"><td>= Zahlbetrag netto</td><td class="r">${eur(c.zahlung)}</td></tr>
        <tr><td>+ Umsatzsteuer 19 %</td><td class="r">${eur(c.mwst)}</td></tr>
        <tr class="s"><td>= Zahlbetrag brutto</td><td class="r">${eur(c.brutto)}</td></tr>
        ${r.gefordert ? `<tr><td>gefordert ${eur(r.gefordert)} · Differenz zum geprüften Leistungsstand</td><td class="r" style="color:${c.differenz > 0.5 ? 'var(--red)' : 'inherit'}">${eur(c.differenz)}</td></tr>` : ''}
      </tbody></table>
      <label class="hint" style="display:block;margin-top:.6rem">Bemerkung zur Prüfung<textarea data-re="notiz" data-id="${r.id}" style="width:100%;min-height:3rem;font:inherit">${esc(r.notiz || '')}</textarea></label>
      <div class="bar" style="margin:.5rem 0 0"><button class="btn sm" data-reb="pdf" data-id="${r.id}">Prüfblatt PDF</button>
        ${g ? (last ? `<button class="btn sm" data-reb="zurueck" data-id="${r.id}">Prüfung zurücknehmen</button>` : '') : `<button class="btn sm pri" data-reb="pruefen" data-id="${r.id}" title="Aufmaßstand festhalten – spätere Aufmaße zählen erst in der nächsten Rechnung">✓ Prüfung abschließen</button>`}
        ${last ? `<button class="btn sm danger" data-reb="del" data-id="${r.id}">Löschen</button>` : ''}</div></div>`;
  }).join('');
  return `<div class="bar"><button class="btn sm pri" data-act="reNeu"${offen || schluss ? ' disabled' : ''} title="${offen ? 'Erst die offene Rechnung prüfen' : schluss ? 'Schlussrechnung ist erfasst' : ''}">+ Rechnung erfassen</button>
    <span class="hint">Auftrag ${eur(K.auftrag)}${K.nachtraege.beauftragt ? ` + Nachträge ${eur(K.nachtraege.beauftragt)}` : ''} · Leistungsstand ${eur(K.leistung)} · anerkannt ${eur(K.abgerechnet)}</span></div>
    <div class="re">${cards || '<div class="card empty">Noch keine Rechnung. Abschlagsrechnungen werden kumuliert geprüft: Aufmaß × Auftragspreis, abzüglich Nachlass, Abzügen, Einbehalt und bisheriger Zahlungen.</div>'}</div>`;
}
function reDialog() {
  const n = L.rechnungen.length + 1;
  modalBox(`<h3>${n}. Rechnung erfassen</h3><div class="fm">
      <label>Art</label><select id="reArt"><option value="abschlag">${n}. Abschlagsrechnung</option><option value="schluss">Schlussrechnung</option></select>
      <label>Rechnungsnr.</label><input id="reNr">
      <label>Rechnungsdatum</label><input type="date" id="reD">
      <label>Eingang</label><input type="date" id="reE" value="${new Date().toISOString().slice(0, 10)}">
      <label>gefordert netto</label><input id="reG" placeholder="kumulierter Betrag laut Rechnung" inputmode="decimal"></div>
    <p class="hint">Geprüft wird mit dem Aufmaß unter „Aufmaß“ – bitte dort die Mengen der Firma prüfen und eintragen.</p>
    <div class="acts"><button class="btn" data-m="x">Abbrechen</button><button class="btn pri" data-m="ok">Anlegen</button></div>`, async (m, bg, close) => {
    if (m === 'x') { close(); return; }
    if (m !== 'ok') return;
    try { await call(`api/lv/${L.id}/rechnungen`, 'POST', { art: $('#reArt').value, re_nr: $('#reNr').value, datum: $('#reD').value, eingang: $('#reE').value, gefordert: pf($('#reG').value) || 0 }); close(); } catch (e) { toast(e.message, true); }
  });
}
async function reSave(el) {
  const r = L.rechnungen.find((x) => x.id === +el.dataset.id); if (!r) return;
  const f = el.dataset.re, body = {};
  if (f.startsWith('abz-')) { const ab = (r.data.abzuege || []).map((z) => ({ ...z })), k = +el.dataset.k, key = f.slice(4); ab[k][key] = key === 'text' ? el.value : pf(el.value); if (key === 'pct' && ab[k].pct != null) ab[k].betrag = null; if (key === 'betrag' && ab[k].betrag != null) ab[k].pct = null; body.abzuege = ab; }
  else body[f] = ['gefordert', 'einbehalt'].includes(f) ? pf(el.value) : el.value;
  try { await call('api/rechnungen/' + r.id, 'PUT', body); } catch (e) { toast(e.message, true); }
}
async function reAktion(b) {
  const r = L.rechnungen.find((x) => x.id === +b.dataset.id); if (!r) return;
  const a = b.dataset.reb;
  try {
    if (a === 'pdf') return window.open(`api/lv/${L.id}/pdf?art=rechnung&rid=${r.id}`, '_blank');
    if (a === 'abzneu') return call('api/rechnungen/' + r.id, 'PUT', { abzuege: [...(r.data.abzuege || []), { text: '', pct: null, betrag: null }] });
    if (a === 'abzdel') { const ab = (r.data.abzuege || []).filter((_, k) => k !== +b.dataset.k); return call('api/rechnungen/' + r.id, 'PUT', { abzuege: ab }); }
    if (a === 'pruefen') { await call('api/rechnungen/' + r.id, 'PUT', { status: 'geprueft' }); toast('Prüfung abgeschlossen – der Aufmaßstand ist festgehalten.'); return; }
    if (a === 'zurueck') return call('api/rechnungen/' + r.id, 'PUT', { status: 'offen' });
    if (a === 'del') { if (!confirm(`${r.nr}. Rechnung löschen?`)) return; return call('api/rechnungen/' + r.id, 'DELETE'); }
  } catch (e) { toast(e.message, true); }
}

/* ---------- Übersicht Projekt (Kostenkontrolle) ---------- */
function vUebersicht() {
  if (!LIST.length) return '<div class="card empty">Noch keine Leistungsverzeichnisse in diesem Projekt.</div>';
  const S = { s: 0, a: 0, au: 0, nt: 0, ab: 0 };
  const rows = LIST.filter((x) => !x.archived).map((x) => {
    const auf = x.auftrag + x.nachtraege; S.s += x.schaetzung; S.a += x.min_angebot; S.au += x.auftrag; S.nt += x.nachtraege; S.ab += x.abgerechnet;
    return `<tr data-ue="${x.id}"><td>${esc(x.nr)}</td><td><b>${esc(x.name)}</b><br><span class="hint">${esc([x.gewerk, x.auftragnehmer].filter(Boolean).join(' · '))}</span></td><td>${esc(STATUS.find((s) => s[0] === x.status)[1])}</td>
      <td class="r">${x.schaetzung ? eur0(x.schaetzung) : '–'}</td><td class="r">${x.min_angebot ? eur0(x.min_angebot) : '–'}${x.n_angebote ? `<br><span class="hint">${x.n_angebote} Angebote</span>` : ''}</td>
      <td class="r">${x.auftrag ? eur0(x.auftrag) : '–'}</td><td class="r">${x.nachtraege ? eur0(x.nachtraege) : '–'}</td><td class="r">${x.abgerechnet ? eur0(x.abgerechnet) : '–'}</td>
      <td class="r">${auf ? eur0(auf - x.abgerechnet) : '–'}</td><td class="r" style="${auf && x.schaetzung && auf > x.schaetzung * 1.05 ? 'color:var(--red);font-weight:600' : ''}">${auf && x.schaetzung ? (auf >= x.schaetzung ? '+' : '') + Math.round((auf / x.schaetzung - 1) * 100) + ' %' : ''}</td></tr>`;
  }).join('');
  const ges = S.au + S.nt;
  return `<p class="hint" style="margin:0 0 .6rem">Alle Vergabeeinheiten des Projekts: Schätzung im LV, bestes Angebot, Auftrag und beauftragte Nachträge, anerkannte Abrechnung. Klick öffnet das LV.</p>
    <div class="tblw"><table class="lv ue"><thead><tr><th>Nr.</th><th>LV</th><th>Stand</th><th class="r">Schätzung</th><th class="r">bestes Angebot</th><th class="r">Auftrag</th><th class="r">Nachträge</th><th class="r">abgerechnet</th><th class="r">noch offen</th><th class="r">Abw. zur Schätzung</th></tr></thead>
      <tbody>${rows}</tbody><tfoot><tr><td></td><td><b>Summe netto</b></td><td></td><td class="r"><b>${eur0(S.s)}</b></td><td class="r">${eur0(S.a)}</td><td class="r"><b>${eur0(S.au)}</b></td><td class="r">${eur0(S.nt)}</td><td class="r"><b>${eur0(S.ab)}</b></td><td class="r">${eur0(ges - S.ab)}</td>
      <td class="r">${ges && S.s ? (ges >= S.s ? '+' : '') + Math.round((ges / S.s - 1) * 100) + ' %' : ''}</td></tr></tfoot></table></div>`;
}

/* ---------- Start ---------- */
(async () => {
  const me = await api('api/me'); applyLook(me);
  const conf = await api('api/platform');
  await header('Ausschreibung & Abrechnung', me, conf);
  api('api/kontakte').then((k) => { KONT = k; }).catch(() => { KONT = []; });
  await loadProj();
  await loadList();
})().catch((e) => toast(e.message, true));
addEventListener('beforeunload', () => { if (saveT && L) navigator.sendBeacon && fetch('api/lv/' + L.id, { method: 'PUT', keepalive: true, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rev: L.rev, data: L.data }) }); });
</script>
</body>
</html>
