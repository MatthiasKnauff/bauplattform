<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#84827c">
<title>Bautagebuch</title>
<link rel="icon" type="image/png" href="api/favicon">
<link rel="apple-touch-icon" href="api/favicon?s=180">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="bp/bp.css">   <!-- Baukasten zuerst: die Regeln des Bautagebuchs gehen vor -->
<link rel="stylesheet" href="bt.css">
<link rel="stylesheet" href="bp/head.css">
<script src="bp/head.js"></script>
<link rel="stylesheet" href="rahmen.css">
<script src="bp/baukasten.js"></script>   <!-- Baukasten: Grundhilfen, Rückgängig, Navigation, Befehlsleiste, Bereich rechts … -->
</head>
<body>
<section id="login" class="hidden"></section>

<div id="app" class="hidden">
  <div id="leiste">
  <header id="hdr">
    <button id="projBtn" data-act="projPicker" aria-haspopup="dialog" title="Projekt wählen"><span class="t"><b id="pname"></b><small id="paddr"></small></span><span id="chev"></span></button>
    <button id="repBtn" data-act="repPicker" aria-haspopup="dialog" title="Tagesbericht wählen"><span class="t"><b id="rname"></b><small id="rdate"></small></span><span id="rchev"></span></button>
    <div class="htools">
    <input id="btq" type="search" placeholder="Im Bautagebuch suchen …" autocomplete="off" enterkeyhint="search" aria-label="Im Bautagebuch suchen" title="Durchsucht Projekte, Berichte, Mängel, Notizen, Anwesende, Weisungen, Fotobeschreibungen und Kontakte">
    <button data-act="nearest" id="i-n" class="hb" title="Projekt nach Standort wählen"></button>
    <button data-act="print" id="i-pdf" class="hb" title="PDF des Tagesberichts erstellen"></button>
    <button data-act="menu" id="i-g" class="hb hidden" title="Einstellungen und weitere Apps" aria-haspopup="menu"></button>
    </div>
    <div class="menu hidden" id="menu"></div>
  </header>
  <nav id="tabs" aria-label="Bereiche"></nav>
  </div>
  <main id="detail"></main>
  <button id="fab" class="hidden" data-act="qOpen" aria-label="Hinzufügen" title="Foto, Notiz, Mangel … hinzufügen"></button>
  <div id="qs" class="hidden"></div>
  <input type="file" id="acam" class="vh" accept="image/*" capture="environment">
  <input type="file" id="alib" class="vh" accept="image/*,.heic,.heif" multiple>
  <input type="file" id="qcam" class="vh" accept="image/*" capture="environment">
  <input type="file" id="qlib" class="vh" accept="image/*,.heic,.heif" multiple>
  <input type="file" id="kopfbildDatei" class="vh" accept="image/*,.heic,.heif">
</div>

<div id="sheet" class="hidden">
  <div class="panel" role="dialog" aria-label="Projekt wählen">
    <div class="ph"><input id="sq" type="search" placeholder="Projekt suchen (Name oder Adresse)" autocomplete="off"><button data-act="closeSheet" title="Schließen">✕</button></div>
    <div class="pl" id="pl"></div>
    <div class="pf" id="pfp"><button class="bd" data-act="newProject">＋ Neues Projekt</button><button class="bd" data-act="nearest" id="i-n2">Nach Standort wählen</button><button class="bd" data-act="editProject">Projekt bearbeiten</button></div>
    <div class="pf hidden" id="pfr"><button class="bd" data-act="addReport">＋ Neuer Tagesbericht</button><button class="bd" data-act="druck">Mehrere drucken …</button></div>
  </div>
</div>

<script src="bt-kern.js"></script>
<script src="bt-projekt.js"></script>
<script src="bt-bericht.js"></script>
<script src="bt-assistent.js"></script>
<script src="bt-suche.js"></script>
<script src="bt-projektdaten.js"></script>
<script src="bt-kontakte.js"></script>
<script src="bt-konto.js"></script>
<script src="bt-start.js"></script>
<script src="rahmen.js"></script>   <!-- breite Bildschirme: Navigation, Befehlsleiste, Bereich rechts -->
</body>
</html>
