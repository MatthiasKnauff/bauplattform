<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#84827c">
<title>Adressen</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="static/bp.css">
<style>
.wrap{max-width:1100px}
.bar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.8rem}
.bar h1{margin:0}
.bar .fill{flex:1}
.flt{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.flt input[type=search]{flex:1 1 240px;padding:.65rem .8rem}
.flt select{flex:0 1 200px}
.chips{display:flex;gap:.35rem;flex-wrap:wrap}
.sugbox .sugh{font-size:.8rem;color:var(--mute);margin:.2rem 0 .3rem}
.sugbox .sugo{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:.45rem .6rem;margin:.25rem 0;background:transparent;color:var(--ink)}
.sugbox .sugo:hover{border-color:var(--y)}.sugbox .sugo small{display:block;color:var(--mute);font-size:.8rem}
.bnv{margin:.6rem 0 .2rem;border:1px solid var(--line);border-radius:10px;padding:.45rem .7rem}
.bnv summary{cursor:pointer;font-weight:600}
.bnv summary small{font-weight:400;margin-left:.3rem}
.bnv #bnHost{margin-top:.5rem}
.mapb{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:.2rem 0 .8rem}.mapb iframe{display:block;width:100%;height:190px;border:0;background:#2a2c30}.mapr{display:block;color:var(--y);text-decoration:none;padding:.5rem .9rem;font-weight:700;border-top:1px solid var(--line)}@media(max-width:640px){.mapb iframe{height:140px}}
.wo{margin-top:.5rem;font-size:.9rem}.wo .btn{margin-left:.3rem}
#mErr .orte{display:flex;flex-direction:column;gap:.25rem;margin-top:.45rem}
#mErr .orte a{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:.35rem .6rem}
#mErr .orte a:hover{border-color:var(--y)}
.chips button{border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:.35rem .8rem;font-size:.9rem}
.chips button.on{border-color:var(--y);color:var(--y);font-weight:600}
.chips small{opacity:.75;margin-left:.25rem}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.7rem}
.ct{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.8rem .9rem;display:flex;flex-direction:column;gap:.35rem;cursor:pointer;text-align:left;color:var(--ink);min-width:0}
.ct:hover,.ct:focus-visible{border-color:var(--y)}
.ct .hd{display:flex;gap:.5rem;align-items:flex-start}
.ct b{font-size:1.02rem;flex:1;min-width:0;overflow-wrap:anywhere}
.ct .sub{color:var(--mute);font-size:.88rem;overflow-wrap:anywhere}
.ct .acts{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.2rem}
.ct .acts a{font-size:.88rem;border:1px solid var(--line);border-radius:6px;padding:.25rem .55rem;text-decoration:none;color:var(--ink);white-space:nowrap}
.ct .acts a:hover{border-color:var(--y);color:var(--y)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--card)}
.seg button{border-radius:999px;padding:.3rem .85rem;color:var(--mute);font-size:.88rem}
.seg button.on{background:var(--y);color:var(--on);font-weight:600}
.wrap.wide{max-width:none}
.list[hidden],.tw[hidden],#cols[hidden]{display:none!important}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);max-height:calc(100vh - 240px)}
.tt{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:.9rem}
.tt th,.tt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;vertical-align:middle}
.tt thead th{position:sticky;z-index:2;background:var(--card2);text-align:left}
.tt thead tr.h th{top:0;padding:.5rem .6rem;position:sticky;overflow:hidden;text-overflow:ellipsis;font-size:.8rem;color:var(--mute);white-space:nowrap;cursor:pointer;user-select:none}
.tt thead tr.h th:hover{color:var(--ink)}
.tt thead tr.h th .ar{color:var(--y);margin-left:.25rem}
.tt thead tr.f th{top:33px;padding:.25rem}
.tt thead tr.f input,.tt thead tr.f select{width:100%;padding:.25rem .4rem;font-size:.82rem;border-radius:4px}
.tt td input{width:100%;border:0;border-radius:0;background:transparent;padding:.42rem .55rem;font-size:.9rem;color:var(--ink);min-width:0}
.tt td input:focus{outline:2px solid var(--y);outline-offset:-2px;background:var(--inp)}
.tt td input.saving{background:color-mix(in srgb,var(--y) 12%,transparent)}
.tt td.ro{padding:.42rem .55rem;white-space:nowrap;color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.tt .rz{position:absolute;top:0;right:-4px;width:9px;height:100%;cursor:col-resize;z-index:3}
.tt .rz::after{content:"";position:absolute;left:4px;top:25%;bottom:25%;border-left:2px solid transparent}
.tt th:hover .rz::after,.tt .rz.on::after{border-color:var(--y)}
.tt td.act,.tt thead th:last-child{position:sticky;right:0;background:var(--card);box-shadow:-1px 0 0 var(--line);z-index:1}
.tt thead th:last-child{background:var(--card2);z-index:3}
.tt tbody tr:hover td.act{background:var(--hov)}
.tw{scrollbar-gutter:stable}
.tw::-webkit-scrollbar{height:12px;width:12px}
.tw::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--mute) 55%,transparent);border-radius:6px;border:2px solid var(--card)}
.tw::-webkit-scrollbar-track{background:var(--hov)}
.tt td.act{padding:.2rem .3rem;white-space:nowrap}
.tt td.act a,.tt td.act button{padding:.2rem .4rem;font-size:.85rem;text-decoration:none}
.tt tbody tr:hover td{background:var(--hov)}
.tt tbody tr.cur td{background:color-mix(in srgb,var(--y) 8%,transparent)}
.colmenu{position:fixed;z-index:95;background:var(--card2);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:.5rem .7rem;display:flex;flex-direction:column;gap:.15rem;max-height:70vh;overflow:auto}
.colmenu label{display:flex;gap:.5rem;align-items:center;padding:.25rem 0;white-space:nowrap}
.colmenu .cm-a{display:flex;gap:.4rem;border-top:1px solid var(--line);margin-top:.3rem;padding-top:.5rem}
.empty{color:var(--mute);padding:2rem 0;text-align:center}
.cnt{color:var(--mute);font-size:.88rem;margin:-.4rem 0 .8rem}
.af{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;margin:-.4rem 0 .8rem}
.af[hidden]{display:none}
.af .fc{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--y);color:var(--ink);border-radius:999px;padding:.2rem .35rem .2rem .7rem;font-size:.85rem;background:var(--hov)}
.af .fc b{font-weight:600;color:var(--mute)}
.af .fc span{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;background:var(--line)}
.af .fc:hover span{background:var(--red);color:#fff}
.kb{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:-.3rem 0 .8rem}
.kb[hidden]{display:none}
.kb select{width:auto}
.kf{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.5rem .8rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;margin:-.2rem 0 1rem}
.kf[hidden]{display:none}
.kf label{display:flex;flex-direction:column;gap:.2rem;font-size:.82rem;color:var(--mute)}
.fx{position:relative;display:block}
.fx input,.fx select{width:100%;padding-right:1.6rem}
.fx button{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;padding:0;font-size:.72rem;line-height:1;color:var(--mute);background:var(--hov)}
.fx button:hover{background:var(--red);color:#fff}
.modal{width:min(640px,100%);max-height:92vh;overflow:auto}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:.55rem .7rem}
.fm label{display:flex;flex-direction:column;gap:.2rem;font-size:.85rem;color:var(--mute)}
.fm label input,.fm label textarea{color:var(--ink);font-size:1rem}
.fm .w{grid-column:1/-1}
.fm textarea{min-height:80px;resize:vertical}
.wt{grid-column:1/-1;display:grid;gap:.4rem}.wt-z{display:grid;grid-template-columns:7.5rem 1fr auto;gap:.4rem;align-items:start;padding:.4rem;border:1px solid var(--line);border-radius:8px}
.wt-z .wt-f{display:grid;gap:.35rem;grid-template-columns:1fr 1fr}.wt-z .wt-f .w2{grid-column:1/-1}.wt-z input{width:100%;box-sizing:border-box;min-width:0}
.wt-z .wt-t{font-size:.8rem;color:var(--mute);padding-top:.45rem}.wt-z .wt-t input{margin-top:.2rem;font-size:.85rem}.wt-x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:1.1rem;padding:.2rem .3rem}.wt-x:hover{color:#c0392b}
.wt-add{display:flex;gap:.35rem;flex-wrap:wrap}.wt-add .btn{font-size:.82rem}
@media (max-width:560px){.wt-z{grid-template-columns:1fr auto}.wt-z .wt-t{grid-column:1/-1;padding:0}}
.zc{display:grid;grid-template-columns:90px 1fr;gap:.7rem}
.mh{display:flex;gap:.5rem;align-items:center;margin-bottom:.8rem}
table.dup{border-collapse:collapse;width:100%;font-size:.88rem}table.dup th,table.dup td{border-bottom:1px solid var(--line);padding:.35rem .5rem;text-align:left;vertical-align:top}
table.dup thead th{vertical-align:bottom}table.dup tbody th{color:var(--mute);font-weight:500;white-space:nowrap}
table.dup td.w{cursor:pointer;border-radius:6px}table.dup td.w:hover{background:color-mix(in srgb,var(--y) 12%,transparent)}table.dup td.on{background:color-mix(in srgb,var(--y) 20%,transparent);font-weight:600}
table.dup td input,table.dup td textarea{width:100%;min-width:12rem;box-sizing:border-box}.dup-z,.dup-m{display:flex;gap:.3rem;align-items:center;white-space:nowrap;font-weight:500}.dup-m{font-size:.8rem;font-weight:400}
.mh h3{margin:0;flex:1}
.mh .x{color:var(--mute);font-size:1.3rem;padding:.2rem .5rem}
.quick{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.9rem}
.info{color:var(--mute);font-size:.86rem;margin-top:.8rem}
.mf{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem;align-items:center}
.mf .fill{flex:1}
/* PDF-Ansicht wie im Bautagebuch: Schließen, Zoom, Drucken, Teilen */
#pv{position:fixed;inset:0;z-index:200;background:#2b2c30;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.pvb{display:flex;gap:.5rem;align-items:center;padding:.5rem .7rem;background:#17181a;border-bottom:1px solid #3b3e42}
.pvb span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#9a9c9e;font-size:.8rem}
.pvb button{border:1px solid #3b3e42;border-radius:10px;padding:.45rem .8rem;color:var(--y);font-weight:600;white-space:nowrap}
.pvb .pvc{background:var(--y);color:var(--on);border-color:var(--y)}
.pvs{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:.6rem .6rem calc(.6rem + env(safe-area-inset-bottom))}
.pvw{width:max-content;min-width:100%}.pvw canvas{display:block;margin:0 auto .6rem;background:#fff;box-shadow:0 2px 10px #0008}
@media (max-width:560px){.pvb{flex-wrap:wrap}.pvb span{order:9;flex-basis:100%}}
@media (max-width:560px){
  .wrap{padding:1rem .75rem 3rem}
  .fm{grid-template-columns:1fr}
  .list{grid-template-columns:1fr}
  .modal-bg{padding:0;place-items:end stretch}
  .modal{border-radius:14px 14px 0 0;max-height:94vh;width:100%}
}
.gsbox{margin:.6rem 0;padding:.6rem .7rem;border:1px solid var(--line,#ddd);border-radius:8px}.gsbox .fm{margin-top:.3rem}
</style>
</head>
<body>
<main class="wrap">
  <div class="bar"><h1>Adressen</h1><span class="fill"></span>
    <div class="seg" id="view" role="group" aria-label="Ansicht"><button data-v="karten">Karten</button><button data-v="tabelle">Tabelle</button></div>
    <button class="btn sm" id="cols" aria-haspopup="true" hidden>Spalten</button>
    <button class="btn sm" id="pdf" title="Gefilterte Liste drucken oder als PDF">🖨 Drucken / PDF</button>
    <button class="btn sm" id="xlsx" title="Gefilterte Liste als Excel-Datei speichern">⤓ Speichern unter …</button>
    <button class="btn sm" id="dup" title="Doppelte und ähnliche Adressen finden und zusammenführen">🔍 Duplikate</button>
    <button class="btn sm" id="verl" title="Geänderte und gelöschte Adressen ansehen und wiederherstellen">🕘 Verlauf</button>
    <button class="btn pri" id="neu">+ Neu</button></div>
  <div class="flt">
    <input type="search" id="q" placeholder="Suchen: Name, Gewerk, Person, Ort, Telefon …" autocomplete="off">
    <select id="gw"><option value="">Alle Gewerke</option></select>
  </div>
  <div class="chips" id="kinds" style="margin:-.3rem 0 1rem"></div>
  <div class="cnt" id="cnt"></div>
  <div class="af" id="af" hidden></div>
  <div class="kb" id="kb" hidden><label for="ksort" class="mute" style="font-size:.88rem">Sortieren</label><select id="ksort"></select><button class="btn sm" id="kdir" title="Reihenfolge umkehren"></button><button class="btn sm" id="kflt" aria-expanded="false">Filter je Feld ▾</button></div>
  <div class="kf" id="kf" hidden></div>
  <div class="list" id="list"></div>
  <div class="tw" id="tw" hidden></div>
</main>
<script src="static/bp.js"></script>
<script>
const KINDS0 = [['', 'Alle'], ['firma', 'Firmen'], ['bauherr', 'Bauherren'], ['baustelle', 'Baustellen']];
let KINDS = KINDS0;   // + eigene Arten aus den Kontakten (Feld „Art“), automatisch als Filterknopf
const eigeneArten = () => [...new Set(ALL.map((c) => c.kind).filter((k) => k && !KINDN[k]))].sort((a, b) => a.localeCompare(b, 'de'));
const artenNeu = () => { KINDS = [...KINDS0, ...eigeneArten().map((k) => [k, k])]; if (kind && !KINDS.some((x) => x[0] === kind)) kind = ''; };
const F = [['name', 'Firma / Name', 'w'], ['trade', 'Gewerk', ''], ['role', 'Funktion', ''], ['contact_person', 'Ansprechpartner', 'w'],
  ['phone', 'Telefon', '', 'tel'], ['mobile', 'Mobil', '', 'tel'], ['email', 'E-Mail', '', 'email'], ['website', 'Internet', '', 'url']];
let conf0 = {};   // Plattform (Adressen der anderen Apps für „verwendet in …“)
let ALL = [], kind = '', gw = '', q = '', bet = '', betN = '';   // bet: nur Beteiligte des aktuellen Projekts (aus der zuletzt benutzten App)
const istBet = (c) => c.projects.includes(betN) || c.site_of === betN;
const betChip = () => (betN ? `<button class="${bet ? 'on' : ''}" data-bet title="Firmen und Personen, die im Bautagebuch dieses Projekts vorkommen">Beteiligte ${esc(betN)}<small>${ALL.filter(istBet).length}</small></button>` : '');
try { kind = sessionStorage.getItem('adrKind') || ''; } catch { /* egal */ }
const tel = (n) => String(n || '').replace(/[^\d+]/g, '');
const addr = (c) => [c.street, [c.zip, c.city].filter(Boolean).join(' ')].filter(Boolean).join(', ');
/* Weitere Nummern, E-Mail-Adressen, Anschriften und Ansprechpartner (beliebig viele) */
const WT = { tel: ['☎', 'Telefon', 'z. B. Zentrale, Büro, privat'], mail: ['✉', 'E-Mail', 'z. B. Rechnungen, Buchhaltung'], adr: ['📍', 'Anschrift', 'z. B. Rechnungsanschrift, Lager'], person: ['👤', 'Ansprechpartner', 'Funktion, z. B. Bauleiter'] };
const wtMails = (c) => [c.email, ...(c.weitere || []).flatMap((x) => (x.typ === 'mail' ? [x.wert] : x.typ === 'person' ? [x.mail] : []))].filter(Boolean);
const wtTel = (c) => (c.weitere || []).flatMap((x) => (x.typ === 'tel' ? [[x.bez, x.wert]] : x.typ === 'person' && x.tel ? [[x.wert, x.tel]] : [])).filter((x) => x[1]);
const wtText = (c) => (c.weitere || []).map((x) => [x.bez, x.wert, x.street, x.zip, x.city, x.tel, x.mail].filter(Boolean).join(' ')).join(' ');
function wtZeile(x, i) {
  const v = (k) => esc(x[k] || ''), [ic, t, ph] = WT[x.typ] || WT.tel;
  const f = x.typ === 'adr' ? `<input data-wt="${i}" data-wk="street" class="w2" value="${v('street')}" placeholder="Straße" autocomplete="off"><input data-wt="${i}" data-wk="zip" value="${v('zip')}" placeholder="PLZ" inputmode="numeric" autocomplete="off"><input data-wt="${i}" data-wk="city" value="${v('city')}" placeholder="Ort" autocomplete="off">`
    : x.typ === 'person' ? `<input data-wt="${i}" data-wk="wert" value="${v('wert')}" placeholder="Name" autocomplete="off"><input data-wt="${i}" data-wk="bez" value="${v('bez')}" placeholder="${ph}" autocomplete="off"><input data-wt="${i}" data-wk="tel" type="tel" value="${v('tel')}" placeholder="Telefon" autocomplete="off"><input data-wt="${i}" data-wk="mail" type="email" value="${v('mail')}" placeholder="E-Mail" autocomplete="off">`
    : `<input data-wt="${i}" data-wk="wert" class="w2" type="${x.typ === 'mail' ? 'email' : 'tel'}" value="${v('wert')}" placeholder="${t}" autocomplete="off">`;
  return `<div class="wt-z"><div class="wt-t">${ic} ${t}${x.typ === 'person' ? '' : `<input data-wt="${i}" data-wk="bez" value="${v('bez')}" placeholder="${ph}" autocomplete="off" aria-label="Bezeichnung">`}</div><div class="wt-f">${f}</div><button type="button" class="wt-x" data-wtx="${i}" title="Entfernen" aria-label="Entfernen">✕</button></div>`;
}
const trades = (c) => String(c.trade || '').split(/[,;]/).map((x) => x.trim()).filter(Boolean);

async function load() {
  ALL = await api('api/contacts');
  const all = [...new Set(ALL.filter((c) => c.kind === 'firma').flatMap(trades))].sort((a, b) => a.localeCompare(b, 'de'));
  $('#gw').innerHTML = '<option value="">Alle Gewerke</option>' + all.map((t) => `<option${t === gw ? ' selected' : ''}>${esc(t)}</option>`).join('');
  render();
}
function shown() {
  const s = q.trim();
  return ALL.filter((c) => (!bet || istBet(c)) && (!kind || c.kind === kind) && (!gw || trades(c).includes(gw)) && (!s || sucht(c, s)));
}
const sucht = (c, s) => passt([c.name, c.trade, c.contact_person, c.role, c.city, c.zip, c.street, c.phone, c.mobile, c.email, c.website, c.notes, wtText(c)].join(' '), s);
/* nichts gefunden, aber in anderen Arten / ohne Beteiligten- oder Gewerk-Filter schon? */
function woanders() {
  const s = q.trim(); if (!s || (!kind && !bet && !gw)) return 0;
  return ALL.filter((c) => sucht(c, s)).length;
}
function render() {
  if (typeof TV !== 'undefined' && TV.view === 'tabelle') { const n2 = {}; ALL.forEach((c) => { n2[c.kind] = (n2[c.kind] || 0) + 1; });
    $('#kinds').innerHTML = (artenNeu(), KINDS).map(([k, l]) => `<button class="${kind === k ? 'on' : ''}" data-k="${esc(k)}">${l}<small>${k ? n2[k] || 0 : ALL.length}</small></button>`).join('') + betChip();
    renderTable(); return; }
  const n = {}; ALL.forEach((c) => { n[c.kind] = (n[c.kind] || 0) + 1; });
  $('#kinds').innerHTML = (artenNeu(), KINDS).map(([k, l]) => `<button class="${kind === k ? 'on' : ''}" data-k="${esc(k)}">${l}<small>${k ? n[k] || 0 : ALL.length}</small></button>`).join('') + betChip();
  const rows = tableRows();
  $('#cnt').textContent = rows.length === ALL.length ? `${ALL.length} Kontakte` : `${rows.length} von ${ALL.length} Kontakten`;
  renderActive(); renderKbar();
  $('#list').innerHTML = rows.map((c) => `<div class="ct" tabindex="0" data-id="${c.id}">
      <div class="hd"><b>${esc(c.name)}</b>${c.kind !== 'firma' ? `<span class="pill">${esc(KINDN[c.kind] || c.kind)}</span>` : ''}</div>
      ${c.trade ? `<div class="sub">${esc(c.trade)}</div>` : ''}
      ${c.contact_person ? `<div class="sub">${esc(c.contact_person)}${c.role ? ' · ' + esc(c.role) : ''}</div>` : ''}
      ${addr(c) ? `<div class="sub">${esc(addr(c))}</div>` : ''}
      <div class="acts">${c.phone ? `<a href="tel:${esc(tel(c.phone))}">☎ ${esc(c.phone)}</a>` : ''}${c.mobile ? `<a href="tel:${esc(tel(c.mobile))}">📱 ${esc(c.mobile)}</a>` : ''}${c.email ? `<a href="mailto:${esc(c.email)}">✉ E-Mail</a>` : ''}${wtTel(c).length + wtMails(c).length - (c.email ? 1 : 0) > 0 ? `<span class="mu" title="${esc(wtText(c))}">+${wtTel(c).length + wtMails(c).length - (c.email ? 1 : 0)} weitere</span>` : ''}</div>
    </div>`).join('') || `<div class="empty">${ALL.length ? 'Keine Treffer.' + `${(() => { const n = woanders(); return n ? `<div class="wo">${n} Treffer ohne die Auswahl ${[kind && (KINDS.find((x) => x[0] === kind) || [0, kind])[1], gw && 'Gewerk ' + gw, bet && 'Beteiligte'].filter(Boolean).join(', ')} – <button class="btn sm" data-clr="nurq">überall suchen</button></div>` : ''; })()}` : 'Noch keine Kontakte – mit „+ Neu“ anlegen.'}</div>`;
}

/* Neuer Kontakt: Firmenvorschläge aus dem Netz (OpenStreetMap, wie im Bautagebuch) – antippen übernimmt Adresse, Telefon, E-Mail */
let sugT = 0, sugL = [];
function nkSuggest(bg, q) {
  clearTimeout(sugT); const box = bg.querySelector('#nkSug'); if (!box) return;
  q = q.trim(); if (q.length < 3) { box.innerHTML = ''; sugL = []; return; }

    let r = { items: [] }; try { r = await api('api/contacts/suggest?q=' + encodeURIComponent(q)); } catch { /* ohne Vorschläge */ }
    sugL = Array.isArray(r.items) ? r.items : [];
    box.innerHTML = sugL.length ? '<div class="sugh">Vorschläge aus dem Netz – antippen zum Übernehmen</div>' + sugL.map((x, i) => `<button type="button" class="sugo" data-sug="${i}"><b>${esc(x.name)}</b><small>${esc([x.trade, [x.street, [x.zip, x.city].filter(Boolean).join(' ')].filter(Boolean).join(', '), x.phone].filter(Boolean).join(' · '))}</small></button>`).join('') : '';
  }, 350);
}
async function nkTake(bg, i) {
  let x = sugL[i]; if (!x) return;
  if (x.osm_id) { try { x = { ...x, ...(await api(`api/contacts/suggest/detail?type=${encodeURIComponent(x.osm_type)}&id=${x.osm_id}`)) }; } catch { /* egal */ } }
  const set = (k, v) => { const el = bg.querySelector(`[data-f="${k}"]`); if (el && v && !el.value.trim()) el.value = v; };
  const n = bg.querySelector('[data-f="name"]'); if (n && x.name) n.value = x.name;
  set('trade', x.trade); set('street', x.street); set('zip', x.zip); set('city', x.city); set('phone', x.phone); set('email', x.email); set('website', x.website);
  bg.querySelector('#nkSug').innerHTML = '<div class="sugh">Übernommen – bitte prüfen und speichern.</div>';
}

// Tabelle reicht bis zum Fensterrand – so ist der waagerechte Rollbalken immer sichtbar

function setView(v) {
  TV.view = v; tvSave();
  document.querySelectorAll('#view button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
  $('#list').hidden = v === 'tabelle'; $('#tw').hidden = v !== 'tabelle'; $('#cols').hidden = v !== 'tabelle'; $('#kb').hidden = v === 'tabelle'; if (v === 'tabelle') $('#kf').hidden = true;
  document.querySelector('main.wrap').classList.toggle('wide', v === 'tabelle');
  if (v === 'tabelle') renderTable(); else render();
}
$('#view').addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (b) setView(b.dataset.v); });
$('#tw').addEventListener('click', (e) => {
  if (e.target.closest('[data-rz]') || Date.now() - (TV.rzT || 0) < 300) return;   // Ziehen an der Spaltenbreite ist kein Sortierklick
  const th = e.target.closest('[data-sort]');
  if (th) { const k = th.dataset.sort; TV.sort = TV.sort.k !== k ? { k, d: 1 } : TV.sort.d > 0 ? { k, d: -1 } : { k: '', d: 1 }; tvSave(); renderTable(); return; }
  const o = e.target.closest('[data-open]'); if (o) edit(ALL.find((c) => c.id === +o.dataset.open));
});
$('#tw').addEventListener('input', (e) => { const f = e.target.dataset.flt; if (f == null) return; TV.flt[f] = e.target.value; const pos = e.target.selectionStart; renderTable(); const n = document.querySelector(`[data-flt="${f}"]`); if (n && n.setSelectionRange) { n.focus(); n.setSelectionRange(pos, pos); } });
$('#tw').addEventListener('change', async (e) => {
  const el = e.target;
  if (el.dataset.flt === 'kind') { TV.flt.kind = el.value; renderTable(); return; }
  if (!el.dataset.fk) return;
  const [id, k] = el.dataset.fk.split(':'), c = ALL.find((x) => x.id === +id); if (!c) return;
  const v = el.value.trim(); if ((c[k] || '') === v) return;
  el.classList.add('saving');
  try { await api('api/contacts/' + id, 'PUT', { [k]: v }); c[k] = k === 'website' && v && !/^https?:\/\//i.test(v) ? 'https://' + v : v; el.value = c[k]; toast(`${COLS.find((x) => x[0] === k)[1]} gespeichert.`); }
  catch (er) { el.value = c[k] || ''; toast(er.message, true); }
  el.classList.remove('saving');
});
$('#tw').addEventListener('keydown', (e) => {
  const el = e.target; if (!el.dataset || !el.dataset.fk) return;
  const [id, k] = el.dataset.fk.split(':');
  if (e.key === 'Escape') { const c = ALL.find((x) => x.id === +id); el.value = c ? c[k] || '' : el.value; el.blur(); }
  else if (e.key === 'Enter' || ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !e.altKey)) {   // Zeile wechseln wie in Excel
    e.preventDefault();
    const tr = el.closest('tr'), nx = (e.key === 'ArrowUp' || (e.key === 'Enter' && e.shiftKey)) ? tr.previousElementSibling : tr.nextElementSibling;
    const t = nx && nx.querySelector(`[data-fk$=":${k}"]`); el.blur(); if (t) { t.focus(); t.select(); }
  }
});
$('#cols').addEventListener('click', (e) => {
  e.stopPropagation(); let m = document.querySelector('.colmenu'); if (m) { m.remove(); return; }
  m = document.createElement('div'); m.className = 'colmenu';
  m.innerHTML = COLS.map(([k, l]) => `<label><input type="checkbox" data-col="${k}"${TV.hide.includes(k) ? '' : ' checked'}${k === 'name' ? ' disabled' : ''}>${l}</label>`).join('')
    + '<div class="cm-a"><button class="btn sm" data-cm="all">Alle</button><button class="btn sm" data-cm="std">Standard</button></div>';
  document.body.appendChild(m);
  const r = $('#cols').getBoundingClientRect(); Object.assign(m.style, { top: r.bottom + 4 + 'px', left: Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8)) + 'px' });
  m.addEventListener('change', (ev) => { const k = ev.target.dataset.col; TV.hide = ev.target.checked ? TV.hide.filter((x) => x !== k) : [...TV.hide, k]; tvSave(); renderTable(); });
  m.addEventListener('click', (ev) => { const b = ev.target.closest('[data-cm]'); if (!b) return; TV.hide = b.dataset.cm === 'all' ? [] : ['role', 'website', 'notes', 'used']; tvSave(); m.querySelectorAll('[data-col]').forEach((c) => { c.checked = !TV.hide.includes(c.dataset.col); }); renderTable(); });
  setTimeout(() => document.addEventListener('click', function off(ev) { if (!m.contains(ev.target)) { m.remove(); document.removeEventListener('click', off); } }), 0);
});
$('#q').addEventListener('input', (e) => { q = e.target.value; render(); });
$('#gw').addEventListener('change', (e) => { gw = e.target.value; render(); });
$('#kinds').addEventListener('click', (e) => { if (e.target.closest('[data-bet]')) { bet = bet ? '' : betN; render(); return; } const b = e.target.closest('[data-k]'); if (!b) return; kind = b.dataset.k; try { sessionStorage.setItem('adrKind', kind); } catch { /* egal */ } render(); });
$('#list').addEventListener('click', (e) => { if (e.target.closest('a')) return; const el = e.target.closest('.ct'); if (el) edit(ALL.find((c) => c.id === +el.dataset.id)); });
$('#list').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.classList.contains('ct')) edit(ALL.find((c) => c.id === +e.target.dataset.id)); });
$('#neu').onclick = () => edit(null);
// Export wie in der Liste gefiltert; die Beschreibung des Filters steht im Ausdruck oben
function exportQS() {
  const r = tableRows(), p = new URLSearchParams();
  if (r.length !== ALL.length || TV.sort.k) p.set('ids', r.map((c) => c.id).join(','));
  const f = activeFilters().map(([, l, v]) => `${l}: ${v}`).join(', ');
  if (f) p.set('filter', f);
  const s = p.toString(); return s ? '?' + s : '';
}
$('#pdf').onclick = () => { if (!tableRows().length) return toast('Keine Kontakte in der Liste.', true); openPdf('api/contacts/export.pdf' + exportQS()); };

/* ---------- PDF-Ansicht (wie im Bautagebuch): funktioniert auch auf dem Handy und als Startbildschirm-App ---------- */
let pv = null;
const loadScript = (src) => new Promise((ok, no) => { const e = document.createElement('script'); e.src = src; e.onload = ok; e.onerror = no; document.head.appendChild(e); });
async function pvRender() {
  const box = pv.el.querySelector('.pvw'), W = pv.el.querySelector('.pvs').clientWidth - 20, dpr = Math.min(window.devicePixelRatio || 1, 2);
  box.innerHTML = '';
  for (let n = 1; n <= pv.doc.numPages; n++) {
    const pg = await pv.doc.getPage(n), v1 = pg.getViewport({ scale: 1 }), cssW = Math.min(W, 1100) * pv.zoom, sc = cssW / v1.width, vp = pg.getViewport({ scale: sc * dpr });
    const c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    c.style.width = cssW + 'px'; c.style.height = (cssW * v1.height / v1.width) + 'px'; box.appendChild(c);
    await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    if (!pv) return;
  }
}
async function openPdf(url) {
  toast('PDF wird erzeugt …');
  let name = 'Adressen.pdf';
  try {
    const r = await fetch(url);
    if (r.status === 401) { const j = await r.json().catch(() => ({})); if (j.login) location.href = j.login; return; }
    if (!r.ok) { const j = await r.json().catch(() => ({})); toast(j.error || 'Das PDF konnte nicht erzeugt werden.', true); return; }
    const m = /filename\*?=(?:UTF-8'')?"?([^";]+)/i.exec(r.headers.get('Content-Disposition') || ''); if (m) name = decodeURIComponent(m[1]);
    const blob = await r.blob();
    if (!window.pdfjsLib) { await loadScript('static/vendor/pdfjs/pdf.js'); pdfjsLib.GlobalWorkerOptions.workerSrc = 'static/vendor/pdfjs/pdf.worker.js'; }
    const doc = await pdfjsLib.getDocument({ isEvalSupported: false, data: await blob.arrayBuffer() }).promise;
    const el = document.createElement('div'); el.id = 'pv';
    el.innerHTML = `<div class="pvb"><button class="pvc" data-pv="close">✕ Schließen</button><span>${esc(name)}</span><button data-pv="zoom" data-d="-1" aria-label="Verkleinern">−</button><button data-pv="zoom" data-d="1" aria-label="Vergrößern">+</button><button data-pv="print">Drucken</button><button data-pv="share">Teilen</button></div><div class="pvs"><div class="pvw"></div></div>`;
    document.body.appendChild(el); pv = { el, doc, blob, name, zoom: 1 };
    el.addEventListener('click', pvClick);
    history.pushState({ pv: 1 }, '');   // Wischgeste „zurück“ schließt die Ansicht ebenfalls
    await pvRender();
  } catch (e) { toast('Das PDF konnte nicht angezeigt werden.', true); closePv(); }
}
function closePv() { if (pv) { if (pv.url) URL.revokeObjectURL(pv.url); pv.el.remove(); pv = null; } }
window.addEventListener('popstate', closePv);
async function pvShare() {
  const f = new File([pv.blob], pv.name, { type: 'application/pdf' });
  try { if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f] }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(pv.blob); a.download = pv.name; document.body.appendChild(a); a.click(); a.remove();
}
function pvPrint() {   // Rechner: Druckdialog des Browsers; Handy: über „Teilen“ → Drucken
  if (matchMedia('(pointer:coarse)').matches) { pvShare(); return; }
  pv.url = pv.url || URL.createObjectURL(pv.blob);
  let fr = document.getElementById('pvFrame');
  if (!fr) { fr = document.createElement('iframe'); fr.id = 'pvFrame'; fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0'; document.body.appendChild(fr); }
  fr.onload = () => { try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch { window.open(pv.url, '_blank'); } };
  fr.src = pv.url;
}
function pvClick(e) {
  const b = e.target.closest('[data-pv]'); if (!b || !pv) return;
  if (b.dataset.pv === 'close') { if (history.state && history.state.pv) history.back(); else closePv(); }
  else if (b.dataset.pv === 'zoom') { pv.zoom = Math.min(2.6, Math.max(1, +(pv.zoom + (+b.dataset.d) * 0.6).toFixed(1))); pvRender(); }
  else if (b.dataset.pv === 'print') pvPrint();
  else if (b.dataset.pv === 'share') pvShare();
}
addEventListener('keydown', (e) => { if (e.key === 'Escape' && pv) { if (history.state && history.state.pv) history.back(); else closePv(); } });
$('#xlsx').onclick = () => { if (!tableRows().length) return toast('Keine Kontakte in der Liste.', true); location.assign('api/contacts/export.xlsx' + exportQS()); toast('Excel-Datei wird geladen …'); };

(async () => {
  const me = await api('api/me'); applyLook(me);
  const conf = await api('api/platform'); conf0 = conf;
  await header('Adressen', me, conf);
  if (BPHead.projekt) betN = BPHead.projekt.name;
  await load();
  if (betN && ALL.some(istBet)) { bet = betN; render(); }
  const hk = /^#kontakt=(\d+)/.exec(location.hash);   // aus dem Bautagebuch: „In Adressen bearbeiten“
  if (hk) { const vl = /[#&]verlauf\b/.test(location.hash); history.replaceState(null, '', location.pathname); const c = ALL.find((x) => x.id === +hk[1]); if (c) edit(c, vl); }
  setView(TV.view);
  if (matchMedia('(pointer:fine)').matches) $('#q').focus({ preventScroll: true });
})().catch((e) => toast(e.message, true));
/* ---------- Duplikate: ähnliche Adressen finden, Werte wählen, zusammenführen (Verweise in Bautagebuch, Bauzeitenplan, AVA werden umgehängt) ---------- */
const DF = [['name', 'Firma / Name'], ['trade', 'Gewerk'], ['contact_person', 'Ansprechpartner'], ['role', 'Funktion'], ['phone', 'Telefon'], ['mobile', 'Mobil'],
  ['email', 'E-Mail'], ['website', 'Internet'], ['street', 'Straße'], ['zip', 'PLZ'], ['city', 'Ort'], ['art', 'Art'], ['notes', 'Notizen']];
async function duplikate() {
  let G; try { G = await api('api/contacts/duplikate'); } catch (e) { toast(e.message, true); return; }
  if (!G.length) { toast('Keine doppelten oder sehr ähnlichen Adressen gefunden.'); return; }
  let k = 0, ziel = null, wahl = {};
  const bg = modalBox('<div id="dupIn"></div>', async (m, bg, close) => {
    if (m === 'x') { close(); load(); return; }
    const g = G[k];
    if (m === 'weiter') { k++; if (k >= G.length) { close(); load(); toast('Alle Vorschläge durchgesehen.'); return; } zeichne(true); return; }
    if (m === 'keine') { try { await api('api/contacts/keine-duplikate', 'POST', { ids: g.ids }); } catch (e) { toast(e.message, true); return; } G.splice(k, 1); if (k >= G.length) { close(); load(); toast('Alle Vorschläge durchgesehen.'); return; } zeichne(true); return; }
    if (m === 'ok') {
      const quellen = g.kontakte.filter((c) => c.id !== ziel && bg.querySelector(`[data-mit="${c.id}"]`).checked).map((c) => c.id);
      if (!quellen.length) { toast('Mindestens einen weiteren Kontakt zum Zusammenführen anhaken.', true); return; }
      const felder = {}; DF.forEach(([f]) => { felder[f] = wahl[f] ?? ''; });
      try { const r = await api('api/contacts/zusammenfuehren', 'POST', { ziel, quellen, felder }); toast(`${r.n + 1} Adressen zu „${felder.name}“ zusammengeführt – alle Verweise hängen jetzt dort. Zurückholen unter 🕘 Verlauf.`); }
      catch (e) { toast(e.message, true); return; }
      G.splice(k, 1); if (k >= G.length) { close(); load(); return; } zeichne(true);
    }
  });
  bg.querySelector('.modal').style.width = 'min(1100px,100%)';
  function vorbelegen() {
    const g = G[k], K = g.kontakte, voll = (c) => DF.filter(([f]) => (c[f] || '').trim()).length;
    ziel = [...K].sort((a, b) => (b.used - a.used) || (voll(b) - voll(a)) || (a.id - b.id))[0].id;
    wahl = {}; const z = K.find((c) => c.id === ziel);
    DF.forEach(([f]) => {
      if (f === 'trade' || f === 'notes') { const t = [...new Set(K.flatMap((c) => String(c[f] || '').split(f === 'trade' ? /[,;]\s*/ : /\n+/).map((x) => x.trim()).filter(Boolean)))]; wahl[f] = t.join(f === 'trade' ? ', ' : '\n'); }
      else wahl[f] = (z[f] || '').trim() || (K.map((c) => (c[f] || '').trim()).find(Boolean) || '');
    });
  }
  function zeichne(neu) {
    if (neu) vorbelegen();
    const g = G[k], K = g.kontakte;
    bg.querySelector('#dupIn').innerHTML = `<div class="mh"><h3 style="margin:0">Mögliche Duplikate <span class="mute" style="font-weight:400;font-size:.9rem">· ${k + 1} von ${G.length}</span></h3><button class="x" data-m="x" aria-label="Schließen">✕</button></div>
      <p class="mute" style="margin:0 0 .6rem">${esc(g.grund)}. Werte je Zeile anklicken, die bleiben sollen; der Kontakt „bleibt“ übernimmt alle Verweise (Bautagebuch, Baustellenadresse, Bauzeitenpläne, AVA), die anderen werden gelöscht.</p>
      <div style="overflow:auto"><table class="dup"><thead><tr><th></th>${K.map((c) => `<th><label class="dup-z"><input type="radio" name="dupZ" value="${c.id}"${c.id === ziel ? ' checked' : ''}> bleibt</label>
        <label class="dup-m"><input type="checkbox" data-mit="${c.id}" checked${c.id === ziel ? ' disabled' : ''}> zusammenführen</label><div class="mute" style="font-weight:400;font-size:.78rem">${c.used ? `in ${c.used} Einträgen` : 'nicht verwendet'}${c.site_of ? ' · Baustelle ' + esc(c.site_of) : ''}</div></th>`).join('')}<th>Ergebnis</th></tr></thead>
      <tbody>${DF.map(([f, l]) => { const vs = K.map((c) => (c[f] || '').trim()); if (!vs.some(Boolean)) return '';
        const gleich = vs.every((v) => v === vs[0]);
        return `<tr><th>${l}</th>${K.map((c, i) => `<td class="${vs[i] && vs[i] === wahl[f] ? 'on' : ''}${vs[i] && !gleich ? ' w' : ''}" ${vs[i] && !gleich ? `data-w="${f}" data-i="${i}" title="diesen Wert nehmen"` : ''}>${esc(vs[i]) || '<span class="mute">–</span>'}</td>`).join('')}
          <td>${f === 'notes' ? `<textarea data-e="${f}" rows="2">${esc(wahl[f])}</textarea>` : `<input data-e="${f}" value="${esc(wahl[f])}">`}</td></tr>`; }).join('')}</tbody></table></div>
      <div class="acts" style="margin-top:.8rem;display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn" data-m="keine" title="Diese Adressen sind verschieden – nicht mehr vorschlagen">Keine Duplikate</button><button class="btn" data-m="weiter">Überspringen</button><span style="flex:1"></span><button class="btn" data-m="x">Schließen</button><button class="btn pri" data-m="ok">Zusammenführen</button></div>`;
  }
  bg.addEventListener('click', (e) => { const w = e.target.closest('[data-w]'); if (!w) return; const g = G[k]; wahl[w.dataset.w] = (g.kontakte[+w.dataset.i][w.dataset.w] || '').trim(); zeichne(); });
  bg.addEventListener('input', (e) => { if (e.target.dataset.e) wahl[e.target.dataset.e] = e.target.value; });
  bg.addEventListener('change', (e) => { if (e.target.name === 'dupZ') { ziel = +e.target.value; zeichne(); } });
  zeichne(true);
}
$('#dup').onclick = duplikate;
$('#verl').onclick = () => { if (window.BPHead && BPHead.verlaufAlle) BPHead.verlaufAlle({ teil: 'kontakt', titel: 'Verlauf der Adressen' }); };
window.bpNachVerlauf = () => load();
