<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#84827c">
<title>Adressen</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="bp/bp.css">
<style>
.wrap{max-width:1100px}
.bar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.8rem}
.bar h1{margin:0}
.bar .fill{flex:1}
.flt{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.flt input[type=search]{flex:1 1 240px;padding:.65rem .8rem}
.flt select{flex:0 1 200px}
.chips{display:flex;gap:.35rem;flex-wrap:wrap}
.wo{margin-top:.5rem;font-size:.9rem}.wo .btn{margin-left:.3rem}
#mErr .orte{display:flex;flex-direction:column;gap:.25rem;margin-top:.45rem}
#mErr .orte a{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:calc(8px*var(--rk,1));padding:.35rem .6rem}
#mErr .orte a:hover{border-color:var(--y)}
.chips button{border:1px solid var(--line);color:var(--mute);border-radius:calc(999px*var(--rkp,1));padding:.35rem .8rem;font-size:.9rem}
.chips button.on{border-color:var(--y);color:var(--y);font-weight:600}
.chips small{opacity:.75;margin-left:.25rem}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.7rem}
.ct{background:var(--card);border:1px solid var(--line);border-radius:calc(10px*var(--rk,1));padding:.8rem .9rem;display:flex;flex-direction:column;gap:.35rem;cursor:pointer;text-align:left;color:var(--ink);min-width:0}
.ct:hover,.ct:focus-visible{border-color:var(--y)}
.ct .hd{display:flex;gap:.5rem;align-items:flex-start}
.ct b{font-size:1.02rem;flex:1;min-width:0;overflow-wrap:anywhere}
.ct .sub{color:var(--mute);font-size:.88rem;overflow-wrap:anywhere}
.ct .acts{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.2rem}
.ct .acts a{font-size:.88rem;border:1px solid var(--line);border-radius:calc(6px*var(--rk,1));padding:.25rem .55rem;text-decoration:none;color:var(--ink);white-space:nowrap}
.ct .acts a:hover{border-color:var(--y);color:var(--y)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:calc(999px*var(--rkp,1));padding:3px;gap:2px;background:var(--card)}
.seg button{border-radius:calc(999px*var(--rkp,1));padding:.3rem .85rem;color:var(--mute);font-size:.88rem}
.seg button.on{background:var(--y);color:var(--on);font-weight:600}
.wrap.wide{max-width:none}
.list[hidden],.tw[hidden],#cols[hidden]{display:none!important}
.tw{overflow:auto;border:1px solid var(--line);border-radius:calc(10px*var(--rk,1));background:var(--card);max-height:calc(100vh - 240px)}
.tt{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:.9rem}
.tt th,.tt td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;vertical-align:middle}
.tt thead th{position:sticky;z-index:2;background:var(--card2);text-align:left}
.tt thead tr.h th{top:0;padding:.5rem .6rem;position:sticky;overflow:hidden;text-overflow:ellipsis;font-size:.8rem;color:var(--mute);white-space:nowrap;cursor:pointer;user-select:none}
.tt thead tr.h th:hover{color:var(--ink)}
.tt thead tr.h th .ar{color:var(--y);margin-left:.25rem}
.tt thead tr.f th{top:33px;padding:.25rem}
.tt thead tr.f input,.tt thead tr.f select{width:100%;padding:.25rem .4rem;font-size:.82rem;border-radius:calc(4px*var(--rk,1))}
.tt td input{width:100%;border:0;border-radius:0;background:transparent;padding:.42rem .55rem;font-size:.9rem;color:var(--ink);min-width:0}
.tt td input:focus{outline:2px solid var(--y);outline-offset:-2px;background:var(--inp)}
.tt td input.saving{background:color-mix(in srgb,var(--y) 12%,transparent)}
.tt td.ro{padding:.42rem .55rem;white-space:nowrap;color:var(--mute);overflow:hidden;text-overflow:ellipsis}
.tt .rz{position:absolute;top:0;right:-4px;width:9px;height:100%;cursor:col-resize;z-index:3}
.tt .rz::after{content:"";position:absolute;left:4px;top:25%;bottom:25%;border-left:2px solid transparent}
.tt th:hover .rz::after,.tt .rz.on::after{border-color:var(--y)}
.tt td.act,.tt thead th:last-child{position:sticky;right:0;background:var(--card);box-shadow:-1px 0 0 var(--line);z-index:1}
.tt thead th:last-child{background:var(--card2);z-index:3}
.tt tbody tr:hover td.act{background:var(--hov)}
.tw{scrollbar-gutter:stable}
.tw::-webkit-scrollbar{height:12px;width:12px}
.tw::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--mute) 55%,transparent);border-radius:calc(6px*var(--rk,1));border:2px solid var(--card)}
.tw::-webkit-scrollbar-track{background:var(--hov)}
.tt td.act{padding:.2rem .3rem;white-space:nowrap}
.tt td.act a,.tt td.act button{padding:.2rem .4rem;font-size:.85rem;text-decoration:none}
.tt tbody tr:hover td{background:var(--hov)}
.tt tbody tr.cur td{background:color-mix(in srgb,var(--y) 8%,transparent)}
.empty{color:var(--mute);padding:2rem 0;text-align:center}
.cnt{color:var(--mute);font-size:.88rem;margin:-.4rem 0 .8rem}
.af{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;margin:-.4rem 0 .8rem}
.af[hidden]{display:none}
.af .fc{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--y);color:var(--ink);border-radius:calc(999px*var(--rkp,1));padding:.2rem .35rem .2rem .7rem;font-size:.85rem;background:var(--hov)}
.af .fc b{font-weight:600;color:var(--mute)}
.af .fc span{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;background:var(--line)}
.af .fc:hover span{background:var(--red);color:#fff}
.kb{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:-.3rem 0 .8rem}
.kb[hidden]{display:none}
.kb select{width:auto}
.kf{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.5rem .8rem;background:var(--card);border:1px solid var(--line);border-radius:calc(12px*var(--rk,1));padding:.8rem 1rem;margin:-.2rem 0 1rem}
.kf[hidden]{display:none}
.kf label{display:flex;flex-direction:column;gap:.2rem;font-size:.82rem;color:var(--mute)}
.fx{position:relative;display:block}
.fx input,.fx select{width:100%;padding-right:1.6rem}
.fx button{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;padding:0;font-size:.72rem;line-height:1;color:var(--mute);background:var(--hov)}
.fx button:hover{background:var(--red);color:#fff}
.modal{width:min(640px,100%);max-height:92vh;overflow:auto}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:.55rem .7rem}
.fm label{display:flex;flex-direction:column;gap:.2rem;font-size:.85rem;color:var(--mute)}
.fm label input,.fm label textarea{color:var(--ink);font-size:1rem}
.fm .w{grid-column:1/-1}
.fm textarea{min-height:80px;resize:vertical}
.zc{display:grid;grid-template-columns:90px 1fr;gap:.7rem}
.mh{display:flex;gap:.5rem;align-items:center;margin-bottom:.8rem}
table.dup{border-collapse:collapse;width:100%;font-size:.88rem}table.dup th,table.dup td{border-bottom:1px solid var(--line);padding:.35rem .5rem;text-align:left;vertical-align:top}
table.dup thead th{vertical-align:bottom}table.dup tbody th{color:var(--mute);font-weight:500;white-space:nowrap}
table.dup td.w{cursor:pointer;border-radius:calc(6px*var(--rk,1))}table.dup td.w:hover{background:color-mix(in srgb,var(--y) 12%,transparent)}table.dup td.on{background:color-mix(in srgb,var(--y) 20%,transparent);font-weight:600}
table.dup td input,table.dup td textarea{width:100%;min-width:12rem;box-sizing:border-box}.dup-z,.dup-m{display:flex;gap:.3rem;align-items:center;white-space:nowrap;font-weight:500}.dup-m{font-size:.8rem;font-weight:400}
.mh h3{margin:0;flex:1}
.mh .x{color:var(--mute);font-size:1.3rem;padding:.2rem .5rem}
.info{color:var(--mute);font-size:.86rem;margin-top:.8rem}
.mf{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem;align-items:center}
.mf .fill{flex:1}
@media (max-width:560px){
  .wrap{padding:1rem .75rem 3rem}
  .fm{grid-template-columns:1fr}
  .list{grid-template-columns:1fr}
  .modal-bg{padding:0;place-items:end stretch}
  .modal{border-radius:calc(14px*var(--rk,1)) calc(14px*var(--rk,1)) 0 0;max-height:94vh;width:100%}
}
.von-bt{display:inline-flex;align-items:center;gap:.3rem;margin:0 0 .8rem;font-size:1rem;padding:.55rem 1.1rem;position:sticky;top:.5rem;z-index:5;box-shadow:var(--sh0,0 4px 14px rgba(0,0,0,.15))}
</style>
</head>
<body>
<main class="bp-app">
  <aside class="bp-nav" id="navL" aria-label="Adressen"></aside>
  <section class="pane wrap" id="pane">
  <div class="bar"><span class="fill"></span>
    <div class="seg" id="view" role="group" aria-label="Ansicht"><button data-v="karten">Karten</button><button data-v="tabelle">Tabelle</button></div>
    <button class="btn sm" id="cols" aria-haspopup="true" data-spw="adressen" title="Spalten wählen und ordnen – auch mit der rechten Maustaste auf den Spaltenkopf" hidden>Spalten</button>
    <button class="btn sm" id="pdf" title="Gefilterte Liste drucken oder als PDF">🖨 Drucken / PDF</button>
    <button class="btn sm" id="xlsx" title="Gefilterte Liste als Excel-Datei speichern">⤓ Speichern unter …</button>
    <button class="btn sm" id="dup" title="Doppelte und ähnliche Adressen finden und zusammenführen">🔍 Duplikate</button>
    <button class="btn sm" id="verl" title="Geänderte und gelöschte Adressen ansehen und wiederherstellen">🕘 Verlauf</button>
    <button class="btn pri" id="neu">+ Neu</button></div>
  <div class="cnt" id="cnt"></div>
  <div class="kb" id="kb" hidden><label for="ksort" class="mute" style="font-size:.88rem">Sortieren</label><select id="ksort"></select><button class="btn sm" id="kdir" title="Reihenfolge umkehren"></button><button class="btn sm" id="kflt" aria-expanded="false">Filter je Feld ▾</button></div>
  <div class="kf" id="kf" hidden></div>
  <div class="list" id="list"></div>
  <div class="tw" id="tw" hidden></div>
  </section>
</main>
<script src="bp/baukasten.js"></script>
<script src="bp/filter.js"></script>
<script src="bp/kontakt.js"></script>
<script>
const KINDS0 = [['', 'Alle'], ['firma', 'Firmen'], ['bauherr', 'Bauherr:innen'], ['baustelle', 'Baustellen']];
let KINDS = KINDS0;   // + eigene Arten aus den Kontakten (Feld „Art“), automatisch als Filterknopf
const eigeneArten = () => [...new Set(ALL.map((c) => c.kind).filter((k) => k && !KINDN[k]))].sort((a, b) => a.localeCompare(b, 'de'));
const artenNeu = () => { KINDS = [...KINDS0, ...eigeneArten().map((k) => [k, k])]; if (kind && !KINDS.some((x) => x[0] === kind)) kind = ''; };
let conf0 = {};   // Plattform (Adressen der anderen Apps für „verwendet in …“)
let ALL = [], kind = '', gw = '', bet = '', betN = '';   // bet: nur Beteiligte des aktuellen Projekts (aus der zuletzt benutzten App); kind/gw/bet folgen dem Filter (AF)
const istBet = (c) => c.projects.includes(betN) || c.site_of === betN;
const tel = (n) => String(n || '').replace(/[^\d+]/g, '');
const addr = (c) => [c.street, [c.zip, c.city].filter(Boolean).join(' ')].filter(Boolean).join(', ');
/* Weitere Nummern, E-Mail-Adressen, Anschriften und Ansprechpartner (beliebig viele) */
const wtMails = (c) => [c.email, ...(c.weitere || []).flatMap((x) => (x.typ === 'mail' ? [x.wert] : x.typ === 'person' ? [x.mail] : []))].filter(Boolean);
const wtTel = (c) => (c.weitere || []).flatMap((x) => (x.typ === 'tel' ? [[x.bez, x.wert]] : x.typ === 'person' && x.tel ? [[x.wert, x.tel]] : [])).filter((x) => x[1]);
const wtText = (c) => (c.weitere || []).map((x) => [x.bez, x.wert, x.street, x.zip, x.city, x.tel, x.mail].filter(Boolean).join(' ')).join(' ');
const trades = (c) => String(c.trade || '').split(/[,;]/).map((x) => x.trim()).filter(Boolean);

async function load() {
  ALL = await api('api/contacts');
  render();
}
/* Suchfeld mit Filtern links (bp/filter.js): alles filterbar – Art, Gewerk, Funktion, Name, Ort, Projekt – mit UND/ODER/NICHT */
const liste = (v) => String(v || '').split(/[,;]/).map((x) => x.trim()).filter(Boolean);
const AF = bpFilter({ key: 'adressen', items: () => ALL, aendern: () => render(),
  text: (c) => [c.name, c.trade, c.contact_person, c.role, c.city, c.zip, c.street, c.phone, c.mobile, c.email, c.website, c.notes, wtText(c)].join(' '),
  arten: [{ key: 'art', name: 'Art', farbe: 'var(--c-gb)', werte: (c) => [KINDN[c.kind] || c.kind] },
    { key: 'gewerk', name: 'Gewerk', farbe: 'var(--c-b)', werte: (c) => trades(c) },
    { key: 'funktion', name: 'Funktion', farbe: 'var(--c-v)', werte: (c) => liste(c.role) },
    { key: 'name', name: 'Name', farbe: 'var(--c-g)', werte: (c) => [c.name, c.contact_person].filter(Boolean) },
    { key: 'ort', name: 'Ort', farbe: 'var(--c-o)', werte: (c) => (c.city ? [c.city] : []) },
    { key: 'projekt', name: 'Projekt', farbe: 'var(--c-t)', werte: (c) => [...c.projects, c.site_of].filter(Boolean) }] });
function ableiten() {   // Navigation links und Vorgaben für „+ Neu“ aus dem Filter
  const a = AF.wert('art'); kind = a ? (Object.entries(KINDN).find(([, n]) => n === a) || [a])[0] : '';
  gw = AF.wert('gewerk'); bet = betN && AF.wert('projekt') === betN ? betN : '';
}
const shown = () => ALL.filter(AF.pruefe);
/* Links: Arten, Beteiligte des Projekts, Gewerke (statt Chips und Auswahlliste oben) */
const ADR_IC = { '': '<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M17 11a3 3 0 1 0 0-6M21 20a5 5 0 0 0-4-5"/>', firma: '<path d="M4 21V8l6-4v17M10 21V10h10v11M13 13h4M13 17h4"/>', bauherr: '<path d="M3 11l9-7 9 7M5 10v10h14V10"/>',
  baustelle: '<path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>', art: '<path d="M4 7h16M4 12h16M4 17h10"/>', gw: '<path d="M14 6l4 4-9 9H5v-4z"/>' };
const ADR_F = { firma: 'var(--c-b)', bauherr: 'var(--c-g)', baustelle: 'var(--c-o)' };
function adrNav() {
  const n = {}; ALL.forEach((c) => { n[c.kind] = (n[c.kind] || 0) + 1; });
  const G = {}; ALL.filter((c) => c.kind === 'firma').forEach((c) => trades(c).forEach((t) => { G[t] = (G[t] || 0) + 1; }));
  artenNeu();
  bpNav($('#navL'), { kopf: { titel: 'Adressen', klein: '' }, lage: true, attr: 'adr', aktiv: gw ? 'g:' + gw : bet ? 'b' : 'k:' + kind,
    davor: '<div class="adr-flt"></div>', nachher: (x) => AF.einhaengen(x.querySelector('.adr-flt')),
    gruppen: [{ titel: 'Kontakte', punkte: KINDS.map(([k, l]) => ({ id: 'k:' + k, text: l, icon: ADR_IC[k] || ADR_IC.art, farbe: ADR_F[k] || '', zahl: String(k ? n[k] || 0 : ALL.length) })) }]
      .concat(betN ? [{ titel: 'Projekt', punkte: [{ id: 'b', text: 'Beteiligte ' + betN, icon: ADR_IC[''], farbe: 'var(--c-v)', zahl: String(ALL.filter(istBet).length) }] }] : [])
      .concat(Object.keys(G).length ? [{ titel: 'Gewerke', punkte: Object.keys(G).sort((a, b) => a.localeCompare(b, 'de')).map((t) => ({ id: 'g:' + t, text: t, icon: ADR_IC.gw, zahl: String(G[t]) })) }] : []) });
  bpNav.breite($('#navL'), { key: 'adressen' });
}
$('#navL').addEventListener('click', (e) => { const b = e.target.closest('[data-adr]'); if (!b) return; const v = b.dataset.adr;
  if (v === 'b') { if (bet) AF.weg('projekt'); else AF.setzen('projekt', betN); }   // links: Abkürzung – setzt bzw. nimmt den Filter
  else if (v.startsWith('g:')) { if (gw === v.slice(2)) AF.weg('gewerk'); else AF.setzen('gewerk', v.slice(2)); }
  else if (v.slice(2)) AF.setzen('art', (KINDS.find((x) => x[0] === v.slice(2)) || [0, v.slice(2)])[1]); else AF.weg('art'); });
function render() {
  ableiten(); adrNav();
  if (typeof TV !== 'undefined' && TV.view === 'tabelle') { renderTable(); return; }
  const rows = tableRows();
  $('#cnt').textContent = rows.length === ALL.length ? `${ALL.length} Kontakte` : `${rows.length} von ${ALL.length} Kontakten`;
  renderKbar();
  $('#list').innerHTML = rows.map((c) => `<div class="ct" tabindex="0" data-id="${c.id}">
      <div class="hd"><b>${esc(c.name)}</b>${c.kind !== 'firma' ? `<span class="pill">${esc(KINDN[c.kind] || c.kind)}</span>` : ''}</div>
      ${c.trade ? `<div class="sub">${esc(c.trade)}</div>` : ''}
      ${c.contact_person ? `<div class="sub">${esc(c.contact_person)}${c.role ? ' · ' + esc(c.role) : ''}</div>` : ''}
      ${addr(c) ? `<div class="sub">${esc(addr(c))}</div>` : ''}
      <div class="acts">${c.phone ? `<a href="tel:${esc(tel(c.phone))}">☎ ${esc(c.phone)}</a>` : ''}${c.mobile ? `<a href="tel:${esc(tel(c.mobile))}">📱 ${esc(c.mobile)}</a>` : ''}${c.email ? `<a href="mailto:${esc(c.email)}">✉ E-Mail</a>` : ''}${wtTel(c).length + wtMails(c).length - (c.email ? 1 : 0) > 0 ? `<span class="mu" title="${esc(wtText(c))}">+${wtTel(c).length + wtMails(c).length - (c.email ? 1 : 0)} weitere</span>` : ''}</div>
    </div>`).join('') || `<div class="empty">${ALL.length ? 'Keine Treffer – links Filter entfernen (✕).' : 'Noch keine Kontakte – mit „+ Neu“ anlegen.'}</div>`;
}

/* Kontakt öffnen: dieselbe Maske wie in allen Apps (bp/kontakt.js) – hier mit Löschen, „verwendet in …“ und Grundstück */
async function edit(c, verlaufAuf) {
  const isNew = !c; c = c || { kind: kind || 'firma', trade: gw || (kind === 'bauherr' ? 'Bauherr' : ''), art: kind && !KINDN[kind] ? kind : '' };
  const use = isNew ? '' : [c.site_of && `Baustellenadresse des Projekts „${esc(c.site_of)}“.`,
    c.used ? `Kommt in ${c.used} ${c.used === 1 ? 'Eintrag' : 'Einträgen'} des Bautagebuchs vor${c.projects.length ? ' (' + c.projects.map(esc).join(', ') + ')' : ''}.` : ''].filter(Boolean).join(' ');
  const k = await BPHead.kontaktMaske(isNew ? c : { ...c }, { voll: !isNew, info: use, grundstueck: c.kind === 'baustelle', verlaufAuf, vorschlag: 'api/contacts/suggest',
    speichern: async (d, neu) => { const r = neu ? await api('api/contacts', 'POST', d) : await api('api/contacts/' + c.id, 'PUT', d); return (r && (r.kontakt || r.contact)) || { ...c, ...d }; },
    loeschen: async () => {
      const rr = await api('api/contacts/' + c.id, 'DELETE'); load();
      if (rr && rr.papierkorb) { rueckgaengig(`„${c.name}“ liegt im Papierkorb`, async () => { await api(`api/bp/papierkorb/${rr.papierkorb}/zurueck`, 'POST'); load(); }); return; }
      const alt = Object.fromEntries(['name', 'trade', 'contact_person', 'role', 'phone', 'mobile', 'email', 'website', 'street', 'zip', 'city', 'notes', 'art'].map((x) => [x, c[x] || ''])); alt.weitere = c.weitere || [];
      rueckgaengig(`„${c.name}“ gelöscht`, async () => { await api('api/contacts', 'POST', alt); load(); });
    } });
  if (k) load();
}


/* ---------- Tabellenansicht: direkt bearbeiten, sortieren, Spalten ein-/ausblenden, je Spalte filtern ---------- */
const COLS = [
  ['name', 'Firma / Name', 220], ['kind', 'Art', 100, 'ro'], ['trade', 'Gewerk', 160], ['contact_person', 'Ansprechpartner:in', 170], ['role', 'Funktion', 130],
  ['phone', 'Telefon', 140], ['mobile', 'Mobil', 140], ['email', 'E-Mail', 210], ['website', 'Internet', 180],
  ['street', 'Straße', 190], ['zip', 'PLZ', 70], ['city', 'Ort', 140], ['notes', 'Notizen', 240], ['used', 'Im Bautagebuch', 200, 'ro']];
const KINDN = { firma: 'Firma', bauherr: 'Bauherr:in', baustelle: 'Baustelle' };
let TV;
try { TV = JSON.parse(localStorage.getItem('adr.tabelle')) || {}; } catch { TV = {}; }
const TVW = TV.w || {};
/* Spalten wählen und ordnen: gemeinsamer Baustein (/bp/spalten.js, Schlüssel „adressen“). Im Standard ausgeblendet: */
const SP_AUS = ['role', 'website', 'notes', 'used'];
try { if (Array.isArray(TV.hide) && localStorage.getItem('bp.sp.adressen') == null)   // bisherige eigene Auswahl einmal übernehmen
  localStorage.setItem('bp.sp.adressen', JSON.stringify({ aus: TV.hide.map((k) => COLS.findIndex((c) => c[0] === k)).filter((n) => n > 0) })); } catch { /* egal */ }
TV = { w: TVW, view: TV.view || (matchMedia('(pointer:fine)').matches && innerWidth > 900 ? 'tabelle' : 'karten'), sort: TV.sort || { k: 'name', d: 1 }, flt: {} };
