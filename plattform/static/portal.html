<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#84827c">
<title>Bauplattform</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="static/bp.css">
<style>
.hello{margin:.4rem 0 1.4rem}
.hello h1{margin:0}
.hello p{margin:.3rem 0 0;color:var(--mute)}
.pickm .pm-x a:hover{border-color:var(--y);color:var(--y)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.6rem;margin-bottom:1.4rem}
.tile{display:grid;grid-template-columns:40px minmax(0,1fr);grid-template-rows:auto auto;column-gap:.7rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.6rem .75rem;color:var(--ink);text-decoration:none;transition:border-color .15s,transform .15s}
.tile:hover,.tile:focus-visible{border-color:var(--y);transform:translateY(-1px)}
.tile .ic{grid-row:1/3;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--hov);color:var(--y)}
.tile .ic svg{width:24px;height:24px}
.tile b{font-size:1rem;line-height:1.2}
/* Kacheln anordnen (✎) */
.hello{position:relative}
.ordnen{position:absolute;right:0;top:.2rem;border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:999px;width:34px;height:34px;cursor:pointer;font-size:.95rem}
.ordnen:hover,.ordnen.on{color:var(--y);border-color:var(--y)}
.ordnen.on{background:var(--y);color:var(--on)}
.tiles.edit .tile{cursor:grab;border-style:dashed;user-select:none;-webkit-user-select:none;touch-action:none}
.tiles.edit .tile:hover{transform:none}
.tiles.edit .tile.zieh{opacity:.35}
.tiles.edit .tile.ziel{border-color:var(--y);border-style:solid}
.ordnen-h{grid-column:1/-1;color:var(--mute);font-size:.85rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.ordnen-h button{border:0;background:none;color:var(--y);cursor:pointer;font:inherit;padding:0;text-decoration:underline}
.tile span.d{color:var(--mute);font-size:.8rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* unten: links Post, rechts To-dos – zusammen so breit wie die Kacheln */
.unten{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.8rem;align-items:start}
.unten>.post[hidden]+.todo{grid-column:1/-1}
@media (max-width:980px){.unten{grid-template-columns:1fr}}
/* To-dos */
.todo .tq{display:flex;gap:.4rem;margin:.1rem 0 .4rem}
.todo .tq input{flex:1;min-width:0;font:inherit;padding:.45rem .7rem;border-radius:10px;border:1px solid var(--line);background:var(--inp);color:var(--ink)}
.todo .tq input:focus{border-color:var(--y);outline:none}
.todo .tg{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:.75rem 0 .1rem;display:flex;gap:.4rem;align-items:center}
.todo .tg.rot{color:var(--red,#d33)}
.todo .tg button{border:0;background:none;color:var(--mute);font:inherit;cursor:pointer;padding:0;text-transform:none;letter-spacing:0;text-decoration:underline}
.tr{display:grid;grid-template-columns:1.5rem minmax(0,1fr) auto;gap:.1rem .5rem;padding:.38rem .15rem;border-bottom:1px dashed var(--line);align-items:start}
.tr:last-child{border-bottom:0}
.tr .ck{width:1.05rem;height:1.05rem;margin:.2rem 0 0;accent-color:var(--y);cursor:pointer}
.tr .tt{min-width:0;cursor:pointer}
.tr .tt b{font-weight:600}.tr .tt .x{display:block;color:var(--mute);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .tt .rg{font-size:.7rem;border:1px solid var(--line);border-radius:999px;padding:0 .4rem;color:var(--mute);margin-right:.3rem;white-space:nowrap}
.tr .tt .pr{color:#e07b3a}
.tr .tz{font-size:.8rem;color:var(--mute);white-space:nowrap;text-align:right}
.tr .tz.rot{color:var(--red,#d33);font-weight:600}
.tr .ta{display:flex;gap:.2rem;justify-content:flex-end;margin-top:.15rem}
.tr .ta button,.tr .ta a{border:0;background:none;cursor:pointer;font:inherit;font-size:.8rem;color:var(--mute);padding:.05rem .25rem;text-decoration:none;border-radius:6px}
.tr .ta button:hover,.tr .ta a:hover{color:var(--y);background:var(--hov)}
.tr.fertig .tt b{text-decoration:line-through;color:var(--mute)}
.te{grid-column:1/-1;background:var(--hov);border-radius:10px;padding:.6rem .7rem;margin:.3rem 0 .2rem;display:grid;gap:.45rem}
.te label{font-size:.8rem;color:var(--mute);display:grid;gap:.15rem}
.te input,.te select,.te textarea{font:inherit;font-size:.92rem;padding:.35rem .5rem;border-radius:8px;border:1px solid var(--line);background:var(--inp);color:var(--ink)}
.te .row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:end}.te .row>label{flex:1;min-width:9rem}
.te .ck2{display:flex;gap:.35rem;align-items:center;font-size:.85rem;color:var(--ink)}
.te .btns{display:flex;gap:.4rem;flex-wrap:wrap}
.tdp{flex:1;min-width:0;text-align:left;font:inherit;font-size:.92rem;padding:.35rem .5rem;border-radius:8px;border:1px solid var(--line);background:var(--inp);color:var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdf{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:.25rem}
.tdd{position:relative;display:inline-flex}
.tdd img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}
.tdn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:.3rem .55rem;font:inherit;font-size:.82rem;cursor:pointer;max-width:14rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.tdx{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:#c33;color:#fff;font-size:13px;line-height:20px;padding:0;cursor:pointer}
.tdf label.btn{cursor:pointer}
.sp{position:absolute;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:.3rem;display:grid;min-width:12rem}
.sp button{border:0;background:none;text-align:left;font:inherit;padding:.4rem .6rem;border-radius:6px;cursor:pointer;color:var(--ink)}
.sp button:hover{background:var(--hov)}
.sp input{font:inherit;margin:.2rem .4rem .4rem;padding:.2rem .3rem}
/* Post zu meinen Projekten */
.post{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem 1rem}
.post-h{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem}
.post-h h2{margin:0;font-size:1.1rem}.post-h .mute{font-size:.85rem}
.pg{margin-top:.8rem}.pg-h{display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:.25rem;margin-bottom:.2rem}
.pg-h b{font-size:.98rem}.pg-h small{color:var(--mute)}
.pm{display:grid;grid-template-columns:1.6rem minmax(0,1fr) auto;gap:.15rem .55rem;padding:.4rem .2rem;border-bottom:1px dashed var(--line);align-items:start}
.pm:last-child{border-bottom:0}.pm .ic2{font-size:1.05rem;line-height:1.3}
.pm .t{min-width:0}.pm .t b{font-weight:600}.pm .t .s{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm .t .v{display:block;color:var(--mute);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm .t .g{color:var(--mute);font-size:.76rem}
.pm .z{color:var(--mute);font-size:.8rem;white-space:nowrap;text-align:right}
.pm .z .ib2{border:0;background:none;cursor:pointer;font-size:1rem;padding:.15rem .2rem;opacity:.55}.pm .z .ib2:hover{opacity:1}
.vs .vst{flex:1;min-width:12rem;font:inherit;font-weight:600}
.pm .z .pf{display:inline-block;max-width:14rem;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
@media (max-width:640px){.pm .z .pf{max-width:7rem}}
.pm .z .erl{font-size:.78rem;color:var(--y);white-space:nowrap}
.pm .z .app{font-size:.78rem;text-decoration:none}
.pm a.s{color:var(--ink);text-decoration:none}.pm a.s:hover{text-decoration:underline}
.art{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:0 .45rem;margin-right:.3rem;color:var(--mute)}
.art.w{border-color:#e07b3a;color:#b35a1f}
.vs{grid-column:2/4;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;background:var(--hov);border-radius:8px;padding:.3rem .5rem;font-size:.86rem;margin-top:.2rem}
.vs input[type=date]{font:inherit;font-size:.85rem;padding:.1rem .3rem}
.post .fehler{color:#b33;font-size:.82rem;margin-top:.5rem}
.tile.off{opacity:.45;pointer-events:none}
.th{display:flex;gap:.35rem;flex-wrap:wrap}
.th label{border:1px solid var(--line);border-radius:999px;padding:.2rem .7rem;cursor:pointer;color:var(--mute);background:transparent}
.th label:hover{color:var(--ink)}
.th label.on{border-color:var(--y);color:var(--ink)}
.th input{position:absolute;opacity:0;pointer-events:none}
.foot{margin-top:2.4rem;color:var(--mute);font-size:.82rem;display:flex;gap:1rem;flex-wrap:wrap}
</style>
</head>
<body>
<main class="wrap">
  <div class="hello"><h1 id="hi">Willkommen</h1><p>Wähle eine App – du bist in allen Apps angemeldet.</p><button type="button" class="ordnen" id="ordnen" title="Kacheln anordnen (ziehen und ablegen)" aria-pressed="false">✎</button></div>
  <div class="tiles" id="tiles"></div>
  <div class="unten"><section class="post" id="post" hidden aria-label="Post zu meinen Projekten"></section><section class="post todo" id="todo" aria-label="To-dos"></section></div>
  <div class="foot"><span id="ver"></span></div>
</main>
<script src="static/bp.js"></script>
<script>
const DESC = {
  bautagebuch: ['Bautagebuch', 'Tagesberichte, Wetter, Anwesende, Fotos, Mängel und Weisungen – mit PDF.'],
  gantt: ['Bauzeitenplan', 'Terminplanung mit Gewerken, Firmen, kritischem Weg und Versionen.'],
  adressen: ['Adressen', 'Firmen, Bauherren und Baustellen – dieselben Kontakte wie im Bautagebuch und Bauzeitenplan.'],
  aufgaben: ['Mängel & Erinnerungen', 'Mängel aus allen Bautagesberichten verfolgen, Erinnerungen an Termine und Firmen aus den Bauzeitenplänen.'],
  plaene: ['Planstand & Versand', 'Pläne im Projektordner mit dem neuesten Index, Gewerk erkennen, Pläne mit CAD-Dateien an die Firmen schicken, Planversandliste.'],
  kommunikation: ['Kommunikation', 'Was an wen verschickt wurde – Pläne, Mängel- und Terminrügen je Projekt und je Kontakt.'],
  ava: ['Ausschreibung & Abrechnung', 'Leistungsverzeichnisse, Angebote mit Preisspiegel, Aufmaß und Rechnungsprüfung – GAEB-Austausch mit den Firmen.'],
  baukosten: ['Baukosten', 'Kosten nach DIN 276 aus Plänen (PDF) und Bauzeitenplan – mit Mittelabfluss und KI-Prüfung.'],
  admin: ['Verwaltung', 'Benutzer und Rechte, angemeldete Sitzungen, Zustand der Dienste.'],
};
/* ---------- Kacheln: eigene Reihenfolge (✎ – ziehen und ablegen, auch mit dem Finger) ---------- */
let APPS = [], REIHE = [], ORDNEN = false;
function kachelnZeigen() {
  const pos = (k) => { const i = REIHE.indexOf(k); return i < 0 ? 1000 + APPS.findIndex((a) => a.key === k) : i; };
  const L = [...APPS].sort((a, b) => pos(a.key) - pos(b.key));
  $('#tiles').innerHTML = L.map(a => `
    <a class="tile ${a.allowed ? '' : 'off'}" data-key="${esc(a.key)}" href="${esc(appUrl(a))}/"${a.allowed ? '' : ' aria-disabled="true" tabindex="-1"'} draggable="false">
      <span class="ic">${ICONS[a.key]}</span><b>${esc(DESC[a.key][0])}</b><span class="d" title="${esc(a.allowed ? DESC[a.key][1] : '')}">${esc(a.allowed ? DESC[a.key][1] : 'Für dein Konto nicht freigeschaltet.')}</span></a>`).join('')
    + (ORDNEN ? '<div class="ordnen-h">Kacheln an die gewünschte Stelle ziehen. <button type="button" data-ord="fertig">Fertig</button><button type="button" data-ord="zurueck">Ursprüngliche Reihenfolge</button></div>' : '');
  $('#tiles').classList.toggle('edit', ORDNEN);
}
async function reiheSpeichern(r) { REIHE = r; try { await api('api/bp/kacheln', 'PUT', { reihenfolge: r }); } catch (e) { toast(e.message, true); } }
function ordnen(an) { ORDNEN = an; const b = $('#ordnen'); b.classList.toggle('on', an); b.setAttribute('aria-pressed', an); b.textContent = an ? '✓' : '✎'; b.title = an ? 'Anordnen beenden' : 'Kacheln anordnen (ziehen und ablegen)'; kachelnZeigen(); }
$('#ordnen').addEventListener('click', () => ordnen(!ORDNEN));
$('#tiles').addEventListener('click', async (e) => {
  const o = e.target.closest('[data-ord]'); if (o) { if (o.dataset.ord === 'fertig') ordnen(false); else { await reiheSpeichern([]); kachelnZeigen(); } return; }
  if (ORDNEN && e.target.closest('.tile')) e.preventDefault();   // beim Anordnen nicht in die App springen
});
(() => {   // Ziehen mit Maus, Stift und Finger (Pointer-Events – geht auch auf dem iPhone)
  let zieh = null, geist = null, dx = 0, dy = 0;
  const T = $('#tiles');
  T.addEventListener('pointerdown', (e) => {
    const t = ORDNEN && e.target.closest('.tile'); if (!t || e.button > 0) return;
    e.preventDefault(); zieh = t; const r = t.getBoundingClientRect(); dx = e.clientX - r.left; dy = e.clientY - r.top;
    geist = t.cloneNode(true); Object.assign(geist.style, { position: 'fixed', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', pointerEvents: 'none', zIndex: 60, boxShadow: '0 10px 30px rgba(0,0,0,.3)', opacity: '.95' });
    document.body.appendChild(geist); t.classList.add('zieh'); T.setPointerCapture(e.pointerId);
  });
  T.addEventListener('pointermove', (e) => {
    if (!zieh) return;
    geist.style.left = (e.clientX - dx) + 'px'; geist.style.top = (e.clientY - dy) + 'px';
    const unter = document.elementsFromPoint(e.clientX, e.clientY).find((x) => x.classList && x.classList.contains('tile') && x !== zieh && x !== geist);
    T.querySelectorAll('.ziel').forEach((x) => x.classList.remove('ziel'));
    if (unter) { const r = unter.getBoundingClientRect(), nach = e.clientX > r.left + r.width / 2; unter.classList.add('ziel'); if (nach ? unter.nextElementSibling !== zieh : unter.previousElementSibling !== zieh) unter.parentNode.insertBefore(zieh, nach ? unter.nextElementSibling : unter); }
  });
  const ende = () => {
    if (!zieh) return; zieh.classList.remove('zieh'); geist.remove(); T.querySelectorAll('.ziel').forEach((x) => x.classList.remove('ziel')); zieh = null;
    reiheSpeichern([...T.querySelectorAll('.tile')].map((x) => x.dataset.key));
  };
  T.addEventListener('pointerup', ende); T.addEventListener('pointercancel', ende);
})();
/* ---------- To-dos: automatisch aus den Daten der Apps + eigene Aufgaben (rechts neben der Post) ---------- */
let TD = null, TDREF = null, TDOFFEN = null, TDZEIG = { spaeter: false, erledigt: false };
const tdHeute = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const tdPlus = (n) => { const d = new Date(Date.now() + n * 864e5); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const tdDatum = (iso) => { if (!iso) return ''; const d = new Date(iso + 'T12:00'), h = tdHeute(); if (iso === h) return 'heute'; if (iso === tdPlus(1)) return 'morgen'; if (iso === tdPlus(-1)) return 'gestern'; return d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' }); };
function tdDatumAus(t) {   // „Statik nachfordern bis Fr“ → Titel + Datum
  const WT = { mo: 1, di: 2, mi: 3, do: 4, fr: 5, sa: 6, so: 0, montag: 1, dienstag: 2, mittwoch: 3, donnerstag: 4, freitag: 5, samstag: 6, sonntag: 0 };
  let d = '', m;
  const weg = (re) => { t = t.replace(re, ' ').replace(/\s+/g, ' ').trim(); };
  if ((m = /\b(?:bis\s+|am\s+)?(heute|morgen|übermorgen)\b/i.exec(t))) { d = tdPlus({ heute: 0, morgen: 1, 'übermorgen': 2 }[m[1].toLowerCase()]); weg(m[0]); }
  else if ((m = /\b(?:bis\s+|am\s+)?(\d{1,2})\.(\d{1,2})\.(\d{2,4})?/i.exec(t))) { const j = m[3] ? (m[3].length === 2 ? '20' + m[3] : m[3]) : String(new Date().getFullYear()); d = `${j}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`; if (!m[3] && d < tdHeute()) d = `${+j + 1}${d.slice(4)}`; weg(m[0]); }
  else if ((m = /\b(?:bis\s+|am\s+)?(montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag|mo|di|mi|do|fr|sa|so)\b\.?/i.exec(t))) { const z = WT[m[1].toLowerCase()]; let n = (z - new Date().getDay() + 7) % 7; if (!n) n = 7; d = tdPlus(n); weg(m[0]); }
  else if ((m = /\bin\s+(\d{1,3})\s+tag(?:en)?\b/i.exec(t))) { d = tdPlus(+m[1]); weg(m[0]); }
  else if ((m = /\b(?:in\s+)?(\d{1,2})\s+woche[n]?\b|\bnächste\s+woche\b/i.exec(t))) { d = tdPlus(7 * (+m[1] || 1)); weg(m[0]); }
  return { titel: t.replace(/\s+(bis|am)$/i, '').trim(), faellig: d };
}
async function tdLaden() {
  try { TD = await api('api/bp/todo'); } catch (e) { TD = { auto: [], manuell: [], fehler: [e.message] }; }
  tdZeigen();
}
async function tdRef() { if (!TDREF) TDREF = await api('api/bp/todo-regeln').catch(() => ({ regeln: [], projekte: [], benutzer: [], ich: null })); return TDREF; }
function tdAlle() {
  const h = tdHeute();
  const A = (TD.auto || []).map((x) => ({ ...x, f: x.faellig || '' }));
  const M = (TD.manuell || []).map((x) => ({ ...x, f: x.faellig || '', projekt: x.pid && TDREF ? ((TDREF.projekte || []).find((p) => p.id === x.pid) || {}).name || '' : '' }));
  return { offen: [...A.filter((x) => !x.spaeter), ...M.filter((x) => x.status === 'offen')], spaeter: A.filter((x) => x.spaeter), erledigt: M.filter((x) => x.status === 'erledigt'), h };
}
function tdZeile(x) {
  const h = tdHeute(), rot = x.f && x.f < h;
  const unter = [x.auto ? `<span class="rg" title="automatisch erkannt">⚙ ${esc(x.regel_name)}</span>` : '', x.projekt, x.text, !x.auto && x.personen_namen && x.personen_namen.length ? '👥 ' + x.personen_namen.join(', ') : '', !x.auto && (x.dateien || []).length ? '📎 ' + x.dateien.length : '',
    !x.auto && x.erstellt_name && TDREF && x.erstellt_von !== TDREF.ich ? 'von ' + x.erstellt_name : '', x.spaeter ? 'zurückgestellt bis ' + tdDatum(x.spaeter) : '', x.status === 'erledigt' ? `erledigt ${x.erledigt_name ? 'von ' + x.erledigt_name : ''}` : ''].filter(Boolean);
  return `<div class="tr${x.status === 'erledigt' ? ' fertig' : ''}" data-tk="${esc(x.key)}">
    <input type="checkbox" class="ck" data-td="fertig"${x.status === 'erledigt' ? ' checked' : ''} title="${x.auto ? 'Erledigt – ausblenden (kommt nicht wieder)' : 'Erledigt'}" aria-label="erledigt">
    <span class="tt" data-td="${x.auto ? 'oeffnen' : 'bearbeiten'}" title="${x.auto ? 'Zur Stelle in der App' : 'Bearbeiten'}"><b>${x.prio ? '<span class="pr">❗</span>' : ''}${esc(x.titel)}</b><span class="x">${unter.map((u, i) => i === 0 && x.auto ? u : esc(u)).join(' · ')}</span></span>
    <span><span class="tz${rot ? ' rot' : ''}">${esc(tdDatum(x.f))}</span><span class="ta">${x.auto ? `${x.spaeter ? '<button data-td="jetzt" title="Wieder anzeigen">↺</button>' : '<button data-td="spaeter" title="Zurückstellen">⏱ später</button>'}${x.link ? '<button data-td="oeffnen" title="Öffnen">↗</button>' : ''}` : `<button data-td="spaeterm" title="Fälligkeit verschieben">⏱</button>`}</span></span>
    ${TDOFFEN === x.key ? tdEditor(x) : ''}</div>`;
}
function tdEditor(x) {
  const R = TDREF || { projekte: [], benutzer: [] }, pers = new Set(x.personen || []);
  return `<div class="te" data-te="${x.id || ''}">
    <label>Aufgabe<input data-tf="titel" value="${esc(x.titel || '')}"></label>
    <div class="row"><label>fällig am<input type="date" data-tf="faellig" value="${esc(x.faellig || '')}"></label>
      <label>Projekt<span style="display:flex;gap:.3rem"><input type="hidden" data-tf="pid" value="${x.pid || ''}"><button type="button" class="tdp" data-td="projekt">${x.pid ? esc(((R.projekte.find((p) => p.id === x.pid)) || {}).name || 'Projekt') : '– ohne Projekt –'} ▾</button>${x.pid ? '<button type="button" class="tdp" data-td="ohneprojekt" title="Ohne Projekt" style="flex:none">✕</button>' : ''}</span></label></div>

  if (!D.eingerichtet) { box.innerHTML = kopf + `<p class="mute" style="margin:.2rem 0 0">Hier stehen jeden Morgen um 8 Uhr die Mails der letzten Tage (beides einstellbar) zu deinen Projekten – Rechnungen, Nachträge, Termine – mit Vorschlägen für Erinnerungen. Dazu einmal unter <a href="#" data-post="pf">⚙ → Startseite → Posteingang</a> dein Büro-Postfach einschalten oder eigene Postfächer eintragen.</p>`; return; }
  const M = D.mails || [];
  const grp = {}; M.forEach((m) => { (grp[m.pid] ||= { name: m.projekt, mails: [] }).mails.push(m); });
  const G = Object.values(grp).sort((a, b) => b.mails.filter((m) => WICHTIG.has(m.art)).length - a.mails.filter((m) => WICHTIG.has(m.art)).length || b.mails.length - a.mails.length);
  const zeile = (m) => `<div class="pm"><span class="ic2" title="${esc(m.art)}">${ARTIC[m.art] || '✉️'}</span>
      <span class="t">${m.link ? `<a class="s" href="${esc(m.link)}" target="bp-outlook" title="In Outlook öffnen (immer dieselbe Registerkarte)">` : '<span class="s">'}<span class="art${WICHTIG.has(m.art) ? ' w' : ''}">${esc(m.art)}</span><b>${esc(m.von_name || m.von)}</b> – ${esc(m.betreff || '(ohne Betreff)')}${m.link ? '</a>' : '</span>'}
        <span class="v">${esc(m.vorschau || '')}${m.anhaenge && m.anhaenge.length ? ' · 📎 ' + esc(m.anhaenge.join(', ')) : ''}</span><span class="g">${esc(m.grund || '')}</span></span>
      <span class="z">${m.quelle ? `<span class="pf" title="Postfach: ${esc(m.quelle)}">📥 ${esc(m.quelle)}</span> · ` : ''}${esc(zeitTxt(m.zeit))}${m.erinnerung ? `<br><span class="erl" title="Bleibt hier, bis die Erinnerung erledigt ist">⏰ ${esc(new Date(m.erinnerung).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }))}</span>` : m.vorschlag ? '' : `<br><button class="ib2" data-post="erinnern" data-mid="${esc(m.id)}" title="Erinnerung zu dieser Mail anlegen">⏰</button>`}<button class="ib2" data-post="aufgabe" data-mid="${esc(m.id)}" title="Aufgabe in den To-dos anlegen">☑</button>${m.link && HANDY ? '<br><a class="app" href="ms-outlook://" title="Outlook-App öffnen">📱 App</a>' : ''}</span>
      ${m.vorschlag ? `<div class="vs" data-vs="${esc(m.id)}">⏰ <span>Erinnerung:</span><input class="vst" value="${esc(m.vorschlag.titel)}" aria-label="Text der Erinnerung"><span>am</span><input type="date" value="${esc(m.vorschlag.termin)}" aria-label="Datum der Erinnerung"><button class="btn sm pri" data-post="anlegen">Anlegen</button><button class="btn sm" data-post="nein" title="Vorschlag verwerfen">✕</button></div>` : ''}</div>`;
  const body = G.length ? G.map((g) => { const w = g.mails.filter((m) => WICHTIG.has(m.art)).length, zeig = POSTALLE ? g.mails : g.mails.slice(0, 4);
    return `<div class="pg"><div class="pg-h"><b>${esc(g.name)}</b><small>${g.mails.length} Mail${g.mails.length > 1 ? 's' : ''}${w ? ` · ${w} wichtig` : ''}</small></div>${zeig.map(zeile).join('')}${zeig.length < g.mails.length ? `<button class="btn sm" data-post="alle" style="margin-top:.3rem">+ ${g.mails.length - zeig.length} weitere</button>` : ''}</div>`; }).join('')
    : `<p class="mute" style="margin:.2rem 0 0">${D.stand ? `Keine Mails zu deinen Projekten${D.gelesen ? ` (${D.gelesen} Mails gelesen)` : ''}.${D.projekte === 0 ? ' Du bist im Bautagebuch bei keinem Projekt als zuständig eingetragen.' : ''}` : 'Noch nicht abgerufen.'}</p>`;
  box.innerHTML = kopf + body + ((D.fehler || []).length ? `<div class="fehler">${D.fehler.map(esc).join('<br>')}</div>` : '') + (G.length && !POSTALLE && M.length > 4 ? '<div style="margin-top:.6rem"><button class="btn sm" data-post="alle">Alle anzeigen</button></div>' : '');
}
async function postLaden(arg) {
  if (arg) { POSTLAEUFT = true; postZeigen(); }
  try { POST = await api('api/bp/post' + (arg || '')); } catch (e) { POST = { ...(POST || {}), fehler: [e.message] }; }
  POSTLAEUFT = false; postZeigen();
}
async function postStart() { await postLaden(''); if (POST && POST.eingerichtet) postLaden('?auto=1'); }
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-post]'); if (!b) return; e.preventDefault();
  const a = b.dataset.post;
  if (a === 'neu') return postLaden('?neu=1');
  if (a === 'pf') { if (window.BPHead && BPHead.einstellungen) BPHead.einstellungen({ bereich: 'app', teil: 'post' }); return; }
  if (a === 'alle') { POSTALLE = true; postZeigen(); return; }
  if (a === 'aufgabe') {   // Mail → To-do (mit Link zur Mail in der Notiz)
    const m = (POST.mails || []).find((x) => x.id === b.dataset.mid); if (!m) return;
    try {
      const r = await api('api/bp/todo', 'POST', { titel: `${m.art && m.art !== 'Nachricht' ? m.art + ' ' : 'Mail '}von ${m.von_name || m.von}: ${m.betreff || ''}`.slice(0, 280), pid: m.pid || null, faellig: tdPlus(2), notiz: [m.betreff, m.link].filter(Boolean).join('\n') });
      TD.manuell.unshift(r.aufgabe); await tdRef(); TDOFFEN = r.aufgabe.key; tdZeigen(); toast('Aufgabe angelegt – rechts in den To-dos.');
    } catch (er) { toast(er.message, true); }
    return;
  }
  if (a === 'erinnern') {   // Erinnerung zu jeder Mail – Vorschlag mit Text und Datum, beides änderbar
    const m = (POST.mails || []).find((x) => x.id === b.dataset.mid); if (!m) return;
    const d = new Date(Date.now() + 3 * 864e5), wer = m.von_name || m.von || 'Absender';
    m.vorschlag = { titel: `Mail von ${wer}: ${m.betreff || ''}`.slice(0, 200), termin: new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10), text: `${m.betreff || ''}\nvon ${wer} (${m.von || ''})` };
    postZeigen(); const inp = document.querySelector(`[data-vs="${CSS.escape(m.id)}"] .vst`); if (inp) { inp.focus(); inp.select(); } return;
  }
  const vs = b.closest('[data-vs]'); if (!vs) return;
  const m = (POST.mails || []).find((x) => x.id === vs.dataset.vs); if (!m) return;
  if (a === 'nein') { await api('api/bp/post', 'POST', { id: m.id, wie: 'verworfen' }).catch(() => {}); delete m.vorschlag; postZeigen(); return; }
  if (a === 'anlegen') {
    try {
      await api('api/bp/post/erinnerung', 'POST', { id: m.id, titel: (vs.querySelector('.vst') || {}).value || m.vorschlag.titel, termin: vs.querySelector('input[type=date]').value, text: m.vorschlag.text, pid: m.pid });
      m.erinnerung = vs.querySelector('input[type=date]').value; delete m.vorschlag; postZeigen(); toast('Erinnerung angelegt – sie steht unter „Mängel & Erinnerungen“ und kommt am Tag per Mail.');
    } catch (er) { toast(er.message, true); }
  }
});
(async () => {
  const me = await api('api/me'); if (!me.ok) { location.href = '/login'; return; }
  applyLook(me);
  const conf = await api('api/platform');
  await header('Startseite', me, conf);
  const h = new Date().getHours();
  $('#hi').textContent = `${h < 11 ? 'Guten Morgen' : h < 18 ? 'Hallo' : 'Guten Abend'}, ${me.vorname || me.name}`;
  if (window.BPHead && BPHead.beiProjektWahl) BPHead.beiProjektWahl(() => { postZeigen && POST && postZeigen(); });   // Startseite: Projekt gilt danach in allen Apps
  APPS = conf.apps.filter(a => DESC[a.key] && a.key !== 'admin');
  REIHE = await api('api/bp/kacheln').then((r) => r.reihenfolge || []).catch(() => []);
  kachelnZeigen();
  if (window.BPHead && BPHead.appEinstellungen) BPHead.appEinstellungen([
    { key: 'post', label: 'Posteingang', render: (host) => { BPHead.postfaecher({ into: host, nachSpeichern: () => postStart() }); } },
    { key: 'todo', label: 'To-dos', render: (host) => { tdEinstellungen(host); } },
    { key: 'kacheln', label: 'Kacheln', render: (host) => {
      host.innerHTML = `<p class="bph-mu">Die Reihenfolge der App-Kacheln stellst du direkt auf der Startseite ein: rechts oben auf <b>✎</b> klicken und die Kacheln an die gewünschte Stelle ziehen. Sie gilt auf allen deinen Geräten.</p>
        <div class="bph-row"><button type="button" class="bph-btn pri" data-k1>✎ Jetzt anordnen</button><button type="button" class="bph-btn" data-k2${REIHE.length ? '' : ' disabled'}>Ursprüngliche Reihenfolge</button></div>`;
      host.querySelector('[data-k1]').onclick = () => { BPHead.einstellungenSchliessen(); ordnen(true); };
      host.querySelector('[data-k2]').onclick = async () => { await reiheSpeichern([]); kachelnZeigen(); BPHead.einstellungenSchliessen(); toast('Ursprüngliche Reihenfolge wiederhergestellt.'); };
    } },
  ]);
  postStart();
  tdZeigen(); tdRef().then(() => tdLaden());
  setInterval(() => { if (document.visibilityState === 'visible' && !TDOFFEN && !(document.activeElement && document.activeElement.id === 'tdNeu')) tdLaden(); }, 5 * 60 * 1000);
  setInterval(() => { if (document.visibilityState === 'visible' && POST && POST.eingerichtet && !POSTLAEUFT) postLaden('?auto=1'); }, 10 * 60 * 1000);   // Seite bleibt offen: zur eingestellten Zeit nachladen
  $('#ver').textContent = 'Version ' + conf.version;
  if (/^#(darstellung|look)$/.test(location.hash) && window.BPHead && BPHead.look) BPHead.ready.then(() => BPHead.look());   // alte Lesezeichen
})().catch(e => toast(e.message, true));
</script>
