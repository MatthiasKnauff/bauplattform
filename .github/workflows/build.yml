name: Build & Publish

# Push auf main -> alle Images bauen, Stand in server/test.yml eintragen (Testserver)
# Release v…    -> Images bauen, Version in server/docker-compose.yml eintragen (Produktiv)
#                  (auf GitHub: Releases → Draft a new release → Tag v… → Publish release)
#                  Portainer (Polling) erkennt die Änderung und spielt sie ein.
on:
  release:
    types: [published]
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'server/**'
      - '**.md'
      - 'tools/chronik/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/matthiasknauff/bauplattform

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app: [bautagebuch, gantt, plattform]
    steps:
      - uses: actions/checkout@v4

      # Versionsanzeige (Verwaltung, Fußzeilen): bei einer Freigabe immer der Tag, sonst „<VERSION>-test (abc1234)“
      - name: Version setzen
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then echo "${GITHUB_REF_NAME#v}" > VERSION
          else echo "$(tr -d '[:space:]' < VERSION)-test (${GITHUB_SHA::7})" > VERSION; fi
          cat VERSION

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags bestimmen
        id: meta
        run: |
          IMAGE="${REGISTRY}/${{ matrix.app }}"
          SHORT="${GITHUB_SHA::7}"
          TAGS="${IMAGE}:${SHORT}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAGS="${TAGS},${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:stable"
          else
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Rauchtest: die eben gebauten Images mit frischer Datenbank und Testdaten starten, anmelden, jede App aufrufen.
  # Schlägt er fehl, wird KEINE Version eingetragen – Test- bzw. Produktivserver laufen mit dem alten Stand weiter.
  rauchtest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_PASSWORD: rauchtest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose-Datei für den Test vorbereiten
        run: |
          # genau die Datei, die der Server bekommt: bei Freigabe die Produktiv-Fassung, sonst die des Testservers
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            SRC=server/docker-compose.yml; [ -f server/produktiv-naechste.yml ] && SRC=server/produktiv-naechste.yml
          else
            SRC=server/test.yml
          fi
          echo "Vorlage: $SRC"
          cp "$SRC" rauchtest.yml
          sed -i -E "s#(image: ${REGISTRY}/(bautagebuch|gantt|plattform)):[A-Za-z0-9._-]+#\1:${GITHUB_SHA::7}#" rauchtest.yml
          sed -i '/^\s*external: true/d' rauchtest.yml     # frische, leere Volumes statt der vorhandenen Serverdaten
          grep -n "image: ${REGISTRY}" rauchtest.yml
          # Ollama (eigene KI) braucht mehrere GB Modelle – im Rauchtest nicht nötig
          docker compose -p rauchtest -f rauchtest.yml config --services | grep -v '^ollama' | tr '\n' ' ' > dienste.txt
          echo "Dienste: $(cat dienste.txt)"

      - name: Plattform starten
        run: docker compose -p rauchtest -f rauchtest.yml up -d --wait --wait-timeout 300 $(cat dienste.txt)

      - name: Testdaten anlegen
        run: docker compose -p rauchtest -f rauchtest.yml exec -T bautagebuch python tools/testdaten.py

      - name: Rauchtest
        run: python3 tools/rauchtest.py http://localhost:${PORTAL_PUBLISH:-8090}

      - name: Fehlermeldungen in den Protokollen
        if: always()
        run: |
          docker compose -p rauchtest -f rauchtest.yml ps -a
          if docker compose -p rauchtest -f rauchtest.yml logs --no-color 2>&1 | grep -n -B2 -A12 "Traceback"; then
            echo "::warning::In den Protokollen stehen Python-Fehlermeldungen (siehe oben)."
          fi

      - name: Protokolle bei Fehler
        if: failure()
        run: docker compose -p rauchtest -f rauchtest.yml logs --no-color --tail 150

  # Push auf main  -> server/test.yml (Testserver) bekommt den neuen Stand
  # Tag v…         -> server/docker-compose.yml (Produktiv, Docker 2) bekommt die freigegebene Version
  version-eintragen:
    needs: [build, rauchtest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Version eintragen
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            FILE=server/docker-compose.yml; TAG="${GITHUB_REF_NAME}"; MSG="Produktiv: Bauplattform ${TAG} freigegeben"
            # neue Dienste (z. B. Baukosten, Ollama) kommen erst mit der Freigabe auf den Produktivserver
            if [ -f server/produktiv-naechste.yml ]; then
              git mv -f server/produktiv-naechste.yml "$FILE"
              sed -i '/^# NÄCHSTE PRODUKTIV-FASSUNG/,/^# Neu: /d' "$FILE"
              sed -i '1{/^# =\+$/d}' "$FILE"
            fi
          else
            FILE=server/test.yml; TAG="${GITHUB_SHA::7}"; MSG="Testserver: Bauplattform auf ${TAG}"
          fi
          sed -i -E "s#(image: ${REGISTRY}/(bautagebuch|gantt|plattform)):[A-Za-z0-9._-]+#\1:${TAG}#" "$FILE"
          grep -n "image: ${REGISTRY}" "$FILE"
          if git diff --quiet && git diff --cached --quiet; then echo "Keine Änderung"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "$MSG"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && break; sleep 3; done
