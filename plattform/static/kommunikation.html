<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#84827c">
<title>Kommunikation</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="static/bp.css">
<style>
.wrap{max-width:1240px;padding-bottom:5rem}
.top{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:0 0 .7rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--card)}
.seg button{border:0;background:none;cursor:pointer;font:inherit;border-radius:999px;padding:.35rem .9rem;color:var(--mute);font-size:.9rem;white-space:nowrap;max-width:22rem;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--y);color:var(--on);font-weight:600}
.top input[type=search]{flex:1 1 220px;min-width:0;font:inherit;padding:.45rem .7rem;border-radius:999px;border:1px solid var(--line);background:var(--inp);color:var(--ink)}
.chips{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;margin:0 0 .9rem}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:.25rem .7rem;font:inherit;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--y);border-color:var(--y);color:var(--on);font-weight:600}
.chip small{opacity:.7}
.ck{display:inline-flex;gap:.35rem;align-items:center;font-size:.88rem;color:var(--mute);margin-left:.4rem;cursor:pointer}
.kb{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;background:var(--card);border:1px solid var(--y);border-radius:12px;padding:.6rem .9rem;margin:0 0 .8rem}
.kb b{font-size:1.05rem}.kb .mute{font-size:.88rem}
.kb .x{margin-left:auto}
.btn.zur{border-color:var(--red);color:var(--red);font-weight:600}.btn.zur:hover{background:color-mix(in srgb,var(--red) 12%,transparent)}
.grid{display:grid;grid-template-columns:290px minmax(0,1fr);gap:1rem;align-items:start}
.side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.5rem 0;position:sticky;top:60px;max-height:calc(100vh - 80px);overflow:auto}
.side h3{margin:.3rem .9rem .4rem;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600}
.si{display:flex;gap:.6rem;align-items:center;width:100%;text-align:left;border:0;background:none;color:inherit;font:inherit;padding:.5rem .9rem;cursor:pointer}
.si:hover{background:var(--hov)}
.si.on{background:var(--hov)}
.si span{flex:1;min-width:0;display:flex;flex-direction:column}
.si b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
.si small{color:var(--mute);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si i{font-style:normal;font-size:.8rem;color:var(--mute);background:var(--hov);border-radius:999px;padding:.05rem .5rem}
.tag{margin:1rem 0 .35rem;font-size:.82rem;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.tag:first-child{margin-top:0}
.e{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:.45rem}
.e.f{border-color:var(--red)}
.e summary{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:.1rem .6rem;padding:.6rem .8rem;cursor:pointer;list-style:none;align-items:start}
.e summary::-webkit-details-marker{display:none}
.e .ic{font-size:1.2rem;line-height:1.4;grid-row:1/3}
.e .h{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e .h b{font-weight:600}
.e .s{grid-column:2;color:var(--mute);font-size:.84rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e .z{color:var(--mute);font-size:.8rem;white-space:nowrap;text-align:right}
.e .art{display:inline-block;font-size:.75rem;border:1px solid var(--line);border-radius:999px;padding:0 .45rem;margin-right:.35rem;color:var(--mute);vertical-align:1px}
.e .art.mr{border-color:var(--red);color:var(--red)}.e .art.tr{border-color:var(--y);color:var(--y)}
.e .d{padding:0 .8rem .7rem 3.4rem;font-size:.9rem}
.e .d pre{white-space:pre-wrap;font:inherit;margin:.3rem 0;color:var(--ink);opacity:.9}
.e .d .mute{font-size:.84rem}
.e .d a{color:var(--y)}
.leer{padding:2rem 1rem;text-align:center;color:var(--mute)}
.mehr{margin:.6rem 0}
.e .art.vg{border-color:var(--y);color:var(--y)}.vg-f{display:flex;gap:.4rem;flex-wrap:wrap;margin:.4rem 0}.vg-f img{height:84px;border-radius:8px;display:block}
/* Neue Nachricht / Vorgang */
.modal.kv [hidden]{display:none!important}.kv-seg button{white-space:nowrap}
.modal.kv{width:min(860px,100%);max-width:none;padding:0;display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.kv-k{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;border-bottom:1px solid var(--line)}.kv-t{font-size:1.05rem}.kv-x{margin-left:auto}
.kv-seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px}.kv-seg button{border:0;background:none;color:var(--ink);font:inherit;font-size:.88rem;padding:.25rem .8rem;border-radius:999px;cursor:pointer}.kv-seg button.on{background:var(--ink);color:var(--card)}
.kv-b{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:1rem;padding:.8rem 1rem;overflow:auto;min-height:0}
.kv-lb{display:flex;flex-direction:column;gap:.2rem;font-size:.8rem;color:var(--mute);margin-bottom:.6rem}
.kv-lb input,.kv-lb textarea{font:inherit;font-size:.95rem;color:var(--ink);background:var(--inp);border:1px solid var(--line);border-radius:8px;padding:.45rem .6rem;width:100%;box-sizing:border-box}
.kv-lb textarea{resize:vertical;min-height:7rem}.kv-2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.kv-bt{display:flex;align-items:center;gap:.35rem}.kv-bt em{font-style:normal;color:var(--mute);font-size:.9rem}
.kv-arten{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.35rem;margin-bottom:.7rem}.kv-arten button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:.45rem .5rem;font:inherit;font-size:.84rem;text-align:left;cursor:pointer}.kv-arten button.on{border:2px solid var(--y);background:color-mix(in srgb,var(--y) 10%,var(--card));padding:calc(.45rem - 1px) calc(.5rem - 1px)}
.kv-an{margin-bottom:.6rem}.kv-chips{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;border:1px solid var(--line);border-radius:8px;padding:.3rem;background:var(--inp);margin-top:.2rem}
.kv-chip{display:inline-flex;align-items:center;gap:.25rem;border:1px solid var(--y);color:var(--y);border-radius:999px;padding:.05rem .2rem .05rem .6rem;font-size:.86rem}.kv-chip button{border:0;background:none;color:inherit;cursor:pointer;font-size:.75rem}
.kv-plus{border:1px dashed var(--line);background:transparent;color:var(--mute);border-radius:999px;padding:.1rem .6rem;font:inherit;font-size:.84rem;cursor:pointer}.kv-plus:hover{border-color:var(--y);color:var(--y)}
.kv-mail{flex:1 1 9rem;min-width:7rem;border:0;background:transparent;color:var(--ink);font:inherit;font-size:.88rem;padding:.2rem .3rem;outline:0}
.kv-ck{display:flex;gap:.4rem;align-items:center;font-size:.88rem;color:var(--mute)}
.kv-r{border:2px dashed transparent;border-radius:10px;padding:.2rem}.kv-r.over{border-color:var(--y);background:color-mix(in srgb,var(--y) 8%,transparent)}
.kv-dz{display:grid;grid-template-columns:1fr 1fr;gap:.4rem}.kv-fs{display:contents}
.kv-f{position:relative;height:84px;border-radius:9px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card);text-align:center}.kv-f img{width:100%;height:100%;object-fit:cover}.kv-f i{font-style:normal;font-size:1.4rem}.kv-f small{font-size:.7rem;padding:0 .3rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.kv-f button{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:.7rem;cursor:pointer}
.kv-add{height:84px;border:2px dashed var(--line);border-radius:9px;display:grid;place-items:center;color:var(--mute);cursor:pointer;font-size:1.1rem}.kv-add:hover{border-color:var(--y);color:var(--y)}
.kv-hint{font-size:.8rem;color:var(--mute);margin:.6rem 0 0}
.modal.kv .acts{padding:.7rem 1rem;border-top:1px solid var(--line);margin:0}
.kv-fab{display:none}
@media (max-width:760px){.kv-top{display:none}
  .kv-fab{display:block;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60}
  .kv-fb{width:56px;height:56px;border-radius:50%;border:0;background:var(--y);color:var(--on);font-size:1.9rem;box-shadow:0 6px 18px rgba(0,0,0,.35);cursor:pointer}
  .kv-fm{position:absolute;right:0;bottom:66px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);padding:.3rem;width:max-content}.kv-fm button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;padding:.6rem .8rem;border-radius:8px;cursor:pointer}.kv-fm button:hover{background:var(--hov)}
  .modal-bg:has(.modal.kv){padding:0}.modal.kv{width:100%;height:100%;max-height:none;border-radius:0}
  .kv-k{flex-wrap:wrap;gap:.5rem;padding:.6rem .8rem}.kv-t{flex:1 1 100%;order:0}.kv-x{position:absolute;right:.6rem;top:.55rem}.modal.kv{position:relative}.kv-seg button{font-size:.82rem;padding:.25rem .6rem}
  .kv-b{grid-template-columns:1fr}.kv-arten{grid-template-columns:1fr 1fr}.kv-2{grid-template-columns:1fr}.kv-dz{grid-template-columns:repeat(3,1fr)}}
@media (max-width:820px){.grid{grid-template-columns:1fr}.side{position:static;max-height:240px}.e .d{padding-left:.8rem}}
@media print{.top,.chips,.side,.bph,.kb .x,.mehr{display:none!important}.grid{display:block}.e{break-inside:avoid;border-color:#bbb}.e details>*:not(summary){display:block}.wrap{max-width:none}}
.e.ant{margin-left:1.6rem;border-style:dashed}.art.an{background:color-mix(in srgb,#3b6fa8 16%,transparent);color:#3b6fa8}
.kv-vl{display:flex;gap:.4rem;flex-wrap:wrap}.vl-l{display:flex;flex-direction:column;gap:.35rem;margin:.4rem 0}.vl-z{display:flex;gap:.4rem;align-items:center}.vl-z[hidden]{display:none}.vl-z input{flex:1;font:inherit}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div class="seg" id="scope" role="group" aria-label="Umfang"></div>
    <input type="search" id="q" placeholder="Suchen – Betreff, Firma, Plan, Mangel …" autocomplete="off">
    <button class="btn sm pri kv-top" data-kvneu="n" title="Mail an Beteiligte des Projekts – mit Fotos">✉ Neue Nachricht</button><button class="btn sm kv-top" data-kvneu="v" title="Telefonnotiz, Anordnung, Behinderung … festhalten oder als PDF schicken">📝 Vorgang</button>
    <button class="btn sm" id="kBtn" title="Einen Kontakt wählen und alles sehen, was ihm geschickt wurde">👤 Kontakt …</button>
    <button class="btn sm" id="csvBtn" title="Die gezeigten Sendungen als Excel-Tabelle (CSV) speichern">⤓ Speichern unter …</button>
    <button class="btn sm" id="drBtn" title="Als Nachweis drucken oder als PDF speichern">🖨 Drucken / PDF</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="kbox"></div>
  <div class="grid" data-bph-trenn-ab="821" data-bph-trenn="kom" data-bph-trenn-min="200" data-bph-trenn-max="0.5"><aside class="side" id="side" aria-label="Übersicht"></aside><section id="list" aria-live="polite"></section></div>
</main>
<div class="kv-fab"><div class="kv-fm" hidden><button type="button" data-kvneu="n">✉ Nachricht</button><button type="button" data-kvneu="v">📝 Vorgang dokumentieren</button></div><button type="button" class="kv-fb" data-kvfab aria-label="Neu: Nachricht oder Vorgang">＋</button></div>
<script src="static/bp.js"></script>
<script>
const LS = { get(k, d) { try { const v = localStorage.getItem('kom.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('kom.' + k, JSON.stringify(v)); } catch { /* egal */ } } };
const F = { alle: LS.get('alle', false), arten: new Set(LS.get('arten', [])), q: '', ich: LS.get('ich', false) };
let K = null;          // gewählter Kontakt {contact_id|email, name, …} – dann alles mit ihm, über alle Projekte
let KP = null;         // im Kontakt: auf ein Projekt eingeschränkt
let D = null, N = 300, tok = 0, ME = null, ANT = {};   // ANT: Antworten aus dem Posteingang je Sendung
const IC = { planversand: '📐', maengelruege: '⚠️', terminruege: '⏱', lvversand: '📋', brief: '✉️', nachricht: '✉️', vorgang: '📝' };
const projekt = () => (window.BPHead && BPHead.projekt) || null;
const dt = (t) => { const d = new Date(t); return isNaN(d) ? t : d; };
const uhr = (t) => { const d = dt(t); return d instanceof Date ? d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : ''; };
const tagName = (t) => {
  const d = dt(t); if (!(d instanceof Date)) return t; const h = new Date(); const g = new Date(h - 864e5);
  if (d.toDateString() === h.toDateString()) return 'Heute'; if (d.toDateString() === g.toDateString()) return 'Gestern';
  return d.toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
};
const kurzDatum = (t) => { const d = dt(t); return d instanceof Date ? d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' }) : ''; };

function params(ohne = {}) {
  const p = new URLSearchParams();
  if (K) { if (K.contact_id) p.set('cid', K.contact_id); else p.set('email', K.email); if (KP) p.set('pid', KP); }
  else if (!F.alle && projekt()) p.set('pid', projekt().id);
  if (F.arten.size) p.set('art', [...F.arten].join(','));
  if (F.q) p.set('q', F.q);
  if (F.ich) p.set('ich', '1');
  if (!ohne.n) p.set('n', N);
  return p.toString();
}
async function laden() {
  const my = ++tok;
  try {
    const vp = !K && (F.alle || projekt()) && (!F.arten.size || F.arten.has('vorgang')) && !F.ich ? api('api/vorgaenge' + (F.alle ? '' : '?pid=' + projekt().id)).catch(() => []) : Promise.resolve([]);
    const [r, v, an] = await Promise.all([api('api/kom?' + params()), vp, api('api/antworten?' + params()).catch(() => ({ antworten: [] }))]); if (my !== tok) return; D = r;
    ANT = {}; (an.antworten || []).forEach((a) => { (ANT[a.bid] = ANT[a.bid] || []).push(a); });
    const q = (F.q || '').toLowerCase();
    VG = (v || []).filter((x) => !x.gesendet && (!q || [x.titel, x.text, x.beteiligte, x.art_name].join(' ').toLowerCase().includes(q)));
    zeichnen();
  }
  catch (e) { if (my === tok) $('#list').innerHTML = `<div class="leer">${esc(e.message)}</div>`; }
}
function zeichnen() {
  const p = projekt();
  $('#scope').style.display = K ? 'none' : '';
  $('#scope').innerHTML = `<button type="button" data-sc="p" class="${!F.alle ? 'on' : ''}" title="${esc(p ? p.name : '')}">${p ? esc(p.name) : 'Projekt oben wählen'}</button><button type="button" data-sc="a" class="${F.alle ? 'on' : ''}">Alle Projekte</button>`;
  $('#chips').innerHTML = (D.arten || []).map((a) => `<button type="button" class="chip${F.arten.has(a.key) ? ' on' : ''}" data-art="${esc(a.key)}">${IC[a.key] || '✉️'} ${esc(a.name)} <small>${a.n}</small></button>`).join('')
    + `<label class="ck"><input type="checkbox" id="ich"${F.ich ? ' checked' : ''}> nur von mir</label>`;
  $('#kbox').innerHTML = K ? `<div class="kb"><span style="font-size:1.4rem">👤</span><span><b>${esc(K.name)}</b><br><span class="mute">${esc([K.ansprech, K.gewerk, K.email].filter(Boolean).join(' · '))}</span></span>
    <span class="mute">${D.gesamt} Sendung${D.gesamt === 1 ? '' : 'en'}${KP ? ' in diesem Projekt' : ' in allen Projekten'}</span><button type="button" class="btn sm x zur" data-kx title="Zurück zur Übersicht aller Sendungen">← Zurück zur Übersicht</button></div>` : '';
  // links: mit wem (Projekt/alle) bzw. in welchen Projekten (Kontakt)
  const side = $('#side');
  if (K) {
    const L = D.projekte || [], ges = L.reduce((s, x) => s + x.n, 0);
    side.innerHTML = `<h3>Projekte</h3><button type="button" class="si${!KP ? ' on' : ''}" data-kp=""><span><b>Alle Projekte</b></span><i>${ges}</i></button>`
      + L.map((x) => `<button type="button" class="si${KP === x.project_id ? ' on' : ''}" data-kp="${x.project_id || ''}"${x.project_id ? '' : ' disabled'}><span><b>${esc(x.name)}</b><small>zuletzt ${kurzDatum(x.letzte)}</small></span><i>${x.n}</i></button>`).join('');
  } else {
    const L = D.kontakte || [];
    side.innerHTML = `<h3>Mit wem${F.alle ? '' : ' in diesem Projekt'}</h3>` + (L.length ? L.map((x, k) => `<button type="button" class="si" data-ki="${k}"><span><b>${esc(x.name)}</b><small>${esc([x.gewerk, x.ansprech].filter(Boolean).join(' · ') || x.email || '')} · zuletzt ${kurzDatum(x.letzte)}</small></span><i>${x.n}</i></button>`).join('')
      : '<p class="mute" style="padding:0 .9rem;font-size:.88rem">Noch niemand.</p>');
  }
  // rechts: Verlauf nach Tagen
  const E = [...(D.eintraege || []), ...VG.map((v) => ({ ...v, ts: v.zeit, _vg: 1 }))].sort((a, b) => String(b.ts).localeCompare(String(a.ts)));
  if (!E.length) {
    $('#list').innerHTML = `<div class="leer">${F.q || F.arten.size || F.ich ? 'Nichts gefunden – Filter oder Suche ändern.' : K ? `An ${esc(K.name)} wurde noch nichts verschickt.` : !F.alle && p ? `In ${esc(p.name)} wurde noch nichts verschickt.<br><small>Hier erscheinen Planversand, Mängel- und Terminrügen – sobald sie aus den Apps verschickt werden.</small>` : 'Noch nichts verschickt.'}</div>`;
    return;
  }
  let h = '', tag = '';
  for (const x of E) {
    const t = tagName(x.ts); if (t !== tag) { tag = t; h += `<div class="tag">${esc(t)}</div>`; }
    if (x._vg) { h += vgEintrag(x); continue; }
    const wer = x.kontakt || x.name || x.email, cls = x.art === 'maengelruege' ? ' mr' : x.art === 'terminruege' ? ' tr' : '';
    h += `<details class="e${x.status === 'fehler' ? ' f' : ''}"><summary><span class="ic">${IC[x.art] || '✉️'}</span>
      <span class="h"><span class="art${cls}">${esc(x.art_name)}</span><b>${esc(wer)}</b>${x.betreff ? ' – ' + esc(x.betreff) : ''}</span>
      <span class="z">${uhr(x.ts)}</span>
      <span class="s">${esc([K || !F.alle ? '' : x.projekt, x.weg_name, x.von ? 'von ' + x.von : '', x.email && x.email !== wer ? x.email : ''].filter(Boolean).join(' · '))}${x.status === 'fehler' ? ' · <b style="color:var(--red)">nicht zugestellt</b>' : ''}</span></summary>
      <div class="d">${x.ansprech || x.gewerk ? `<div class="mute">${esc([x.ansprech, x.gewerk].filter(Boolean).join(' · '))}</div>` : ''}${x.inhalt ? `<pre>${esc(x.inhalt)}</pre>` : ''}${x.fehler ? `<div class="mute">Fehler: ${esc(x.fehler)}</div>` : ''}
        <div class="mute">${esc(new Date(x.ts).toLocaleString('de-DE'))}${x.projekt ? ' · ' + esc(x.projekt) : ''}</div>
        ${quelle(x) ? `<a href="${esc(quelle(x))}" data-qp="${x.project_id || ''}">↗ ${x.art === 'planversand' ? 'Planversandliste' : x.art.endsWith('ruege') ? 'Aufgaben & Mängel' : 'Quelle'} öffnen</a>` : ''}
        ${x.contact_id && !K ? ` · <a href="#" data-kc="${x.contact_id}">alles mit ${esc(x.kontakt)}</a>` : ''}</div></details>`;
    for (const a of (ANT[x.id] || []).sort((p, q) => String(p.zeit).localeCompare(String(q.zeit)))) {
      h += `<details class="e ant"><summary><span class="ic">↩</span><span class="h"><span class="art an">Antwort</span><b>${esc(a.von_name || a.von)}</b> – ${esc(a.betreff)}</span><span class="z">${uhr(a.zeit)}</span>
        <span class="s">${esc(a.vorschau.slice(0, 140))}${a.anhaenge && a.anhaenge.length ? ` · 📎 ${a.anhaenge.length}` : ''}</span></summary>
        <div class="d"><pre>${esc(a.vorschau)}</pre>${a.anhaenge && a.anhaenge.length ? `<div class="mute">📎 ${esc(a.anhaenge.join(', '))}</div>` : ''}
          <div class="mute">${esc(new Date(a.zeit).toLocaleString('de-DE'))} · ${esc(a.von)}</div>${a.link ? `<a href="${esc(a.link)}" target="_blank" rel="noopener">↗ Im Postfach öffnen</a>` : ''}</div></details>`;
    }
  }
  if (D.gesamt > (D.eintraege || []).length) h += `<button type="button" class="btn sm mehr" data-mehr>+ ältere anzeigen (${D.gesamt - (D.eintraege || []).length} weitere)</button>`;
  $('#list').innerHTML = h;
}

/* ---------- Vorlagen für Nachrichten (fürs ganze Büro): {firma} {projekt} {frist} {ich} ---------- */

document.addEventListener('click', async (e) => {

        const be = document.querySelector('#kvBetreff'), tx = document.querySelector('#kvText'), alt = [be.value, tx.value];
        if (v.betreff) be.value = vlEinsetzen(v.betreff); tx.value = vlEinsetzen(v.text); tx.dispatchEvent(new Event('input')); tx.focus();
        rueckgaengig(`Vorlage „${v.name}“ eingesetzt`, () => { be.value = alt[0]; tx.value = alt[1]; }); } });
    return; }
  const sv = e.target.closest && e.target.closest('[data-kvvs]');

    const L = await vorlagen(); VL = (await api('api/vorlagen', 'PUT', { vorlagen: [...L, { id: 'v' + Date.now().toString(36), name, betreff: allg(be), text: allg(tx) }] })).vorlagen;
    toast(`Als Vorlage „${name}“ gespeichert – der Projektname wird beim Einsetzen ersetzt.`); }
});
function vlVerwalten() {

/* ---------- Neue Nachricht und Vorgang dokumentieren (Desktop: Fenster mit zwei Spalten, Handy: Vollbild über ＋ unten rechts) ---------- */
let VA = null, BET = { pid: null, L: [] }, VG = [];   // VA: Arten der Vorgänge · BET: Beteiligte des Projekts · VG: Vorgänge (nur festgehaltene) im Verlauf
const KURZ = (n) => (((n || '').split(' ')[0] || '').match(/^[A-Za-z]{1,4}\d{2,6}$/) || [''])[0];
async function beteiligte(pid) { if (BET.pid !== pid) { BET = { pid, L: await api('api/beteiligte?pid=' + pid).catch(() => []) }; } return BET.L; }
function verfassen(modus) {

    <div class="kv-b"><div class="kv-l">

        <label class="kv-lb">Kurz (Überschrift, optional)<input id="kvTitel" maxlength="200" autocomplete="off"></label></div>

      <label class="kv-ck"><input type="checkbox" id="kvKopie"> Kopie an mich</label>
    </div><div class="kv-r"><span class="kv-lb">Fotos / Dateien <small>hierher ziehen oder</small></span>
      <div class="kv-dz"><div class="kv-fs"></div><label class="kv-add" title="Fotos aufnehmen oder Dateien wählen">📷 ＋<input type="file" id="kvDatei" multiple accept="image/*,application/pdf,.pdf,.doc,.docx,.xls,.xlsx,.txt" hidden></label></div>

      fd.append('an', JSON.stringify(S.an)); fd.append('betreff', v('kvBetreff')); fd.append('text', v('kvText')); fd.append('kopie', bg.querySelector('#kvKopie').checked ? '1' : '');
    } else {
      if (!v('kvText').trim() && !v('kvTitel').trim()) return toast('Bitte festhalten, was passiert ist.', true);
      if (S.senden && !S.an.length) return toast('Bitte einen Empfänger wählen – oder „nur festhalten“.', true);
      Object.entries({ art: S.art, titel: v('kvTitel'), text: v('kvText'), beteiligte: v('kvWer'), zeit: v('kvZeit'), ort: v('kvOrt'), frist: v('kvFrist'), senden: S.senden ? '1' : '', an: JSON.stringify(S.an), kopie: bg.querySelector('#kvKopie').checked ? '1' : '' }).forEach(([a, b]) => fd.append(a, b));
    }
    btn.disabled = true; btn.textContent = 'Wird gesendet …';
    try {
      const r = await fetch(S.modus === 'n' ? 'api/nachricht' : 'api/vorgang', { method: 'POST', body: fd, credentials: 'same-origin' }); const j = await r.json().catch(() => ({}));
      if (!r.ok || j.error) throw new Error(j.error || 'Fehler ' + r.status);
      close();
      toast(S.modus === 'n' ? `Gesendet: „${j.betreff}“${j.weg === 'm365' ? ' – steht in Outlook unter „Gesendete Elemente“' : ''}` : `${VA.find((x) => x.key === S.art).name} festgehalten${j.hinweis ? ' und ' + j.hinweis + ' geschickt' : ''}${j.todo ? ' · Frist als To-do' : ''}`);
      laden();
    } catch (er) { toast(er.message, true); btn.disabled = false; zeichne(); }
  });
  bg.querySelector('.modal').classList.add('kv');
  const $b = (s) => bg.querySelector(s);
  const zeichne = () => {
    const n = S.modus === 'n';
    $b('.kv-t').textContent = n ? 'Neue Nachricht' : 'Vorgang dokumentieren';

    $b('.kv-an').hidden = !n && !S.senden; $b('.kv-ck').hidden = !n && !S.senden;
    $b('.kv-txtl').textContent = n ? 'Text' : 'Was ist passiert?';
    $b('.kv-arten').innerHTML = (VA || []).map((a) => `<button type="button" data-kva="${a.key}" class="${S.art === a.key ? 'on' : ''}">${a.ic} ${esc(a.name)}</button>`).join('');
    bg.querySelectorAll('[data-kvs]').forEach((x) => x.classList.toggle('on', (x.dataset.kvs === '1') === S.senden));
    $b('[data-m="ok"]').textContent = n ? 'Senden' : S.senden ? 'Speichern & senden' : 'Festhalten';
    $b('.kv-chips').innerHTML = S.an.map((x, i) => `<span class="kv-chip" title="${esc(x.email)}">${esc(x.name || x.email)}<button type="button" data-kvweg="${i}" aria-label="entfernen">✕</button></span>`).join('')
      + `<button type="button" class="kv-plus" data-kvan>＋ Firma, Person</button><input class="kv-mail" placeholder="oder E-Mail eintippen, Enter" autocomplete="off" inputmode="email">`;
    $b('.kv-fs').innerHTML = S.dateien.map((f, i) => `<span class="kv-f" title="${esc(f.name)}">${f.type.startsWith('image/') ? `<img src="${f._url || (f._url = URL.createObjectURL(f))}" alt="">` : `<i>📄</i><small>${esc(f.name)}</small>`}<button type="button" data-kvfweg="${i}" aria-label="entfernen">✕</button></span>`).join('');
    const mb = S.dateien.reduce((a, f) => a + f.size, 0) / 1048576;
    $b('.kv-hint').textContent = (n ? 'Signatur wird angehängt.' : S.senden ? 'Das PDF des Vorgangs (auf dem Briefbogen, mit den Fotos) geht an die Firma.' : 'Steht danach im Verlauf des Projekts.') + (mb ? ` · ${mb.toFixed(1).replace('.', ',')} MB` : '');
  };
  const neuDatei = (fs) => { for (const f of fs) { if (S.dateien.length >= 12) { toast('Höchstens 12 Dateien.', true); break; } S.dateien.push(f); } zeichne(); };
  bg.addEventListener('click', (e) => {
    const t = e.target;
    const mm = t.closest('[data-kvm]'); if (mm) { S.modus = mm.dataset.kvm; zeichne(); return; }
    const a = t.closest('[data-kva]'); if (a) { S.art = a.dataset.kva; zeichne(); return; }
    const sd = t.closest('[data-kvs]'); if (sd) { S.senden = sd.dataset.kvs === '1'; zeichne(); return; }
    const w = t.closest('[data-kvweg]'); if (w) { S.an.splice(+w.dataset.kvweg, 1); zeichne(); return; }
    const fw = t.closest('[data-kvfweg]'); if (fw) { const f = S.dateien.splice(+fw.dataset.kvfweg, 1)[0]; if (f && f._url) URL.revokeObjectURL(f._url); zeichne(); return; }
    const pl = t.closest('[data-kvan]'); if (pl) { (async () => { const B = await beteiligte(p.id), K = await api('api/kontakte?q=').catch(() => []);
      const da = new Set(S.an.map((x) => x.email.toLowerCase())), bid = new Set(B.map((x) => x.id));
      pickMenu(pl, { search: 'Firma, Person oder E-Mail …', empty: 'Niemand gefunden – E-Mail-Adresse direkt eintippen.',

          .map((x) => ({ group: x.g, title: x.name, sub: [x.gewerk, x.ansprech, x.email].filter(Boolean).join(' · '), value: x.id, find: [x.ansprech, x.email, x.gewerk].join(' '), x })),
        onPick: (id, it) => { S.an.push({ email: it.x.email, name: it.x.name, contact_id: it.x.id }); zeichne(); } }); })(); return; }
  });
  bg.addEventListener('keydown', (e) => { const i = e.target.closest && e.target.closest('.kv-mail'); if (!i || e.key !== 'Enter') return; e.preventDefault();
    const a = i.value.trim(); if (!/^[^@\s<>,;]+@[^@\s<>,;]+\.[A-Za-z]{2,}$/.test(a)) return toast('Bitte eine gültige E-Mail-Adresse eintippen.', true);
    if (!S.an.some((x) => x.email.toLowerCase() === a.toLowerCase())) S.an.push({ email: a, name: '' }); zeichne(); setTimeout(() => { const n = bg.querySelector('.kv-mail'); if (n) n.focus(); }, 0); });

  dz.addEventListener('dragleave', () => dz.classList.remove('over'));

}

document.addEventListener('click', async (e) => {

document.addEventListener('change', (e) => { if (e.target.id === 'ich') { F.ich = e.target.checked; LS.set('ich', F.ich); laden(); } });
let qT = 0;
$('#q').addEventListener('input', (e) => { clearTimeout(qT); qT = setTimeout(() => { F.q = e.target.value.trim(); laden(); }, 300); });

(async () => {
