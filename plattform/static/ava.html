/* Wird die App gerade neu gestartet (Update eingespielt), antwortet der Verteiler sofort mit 502 „… nicht erreichbar (ConnectionRefusedError)“ –
   die Anfrage ist dann nicht angekommen und wird nach ein paar Sekunden still wiederholt (bis zu einer Minute). */
(() => {
  const roh = window.fetch.bind(window);
  window.fetch = async (url, opt) => {
    for (let k = 0; ; k++) {
      const r = await roh(url, opt);
      if (r.status !== 502 || k >= 12) return r;
      const t = await r.clone().text().catch(() => '');
      if (!/nicht erreichbar \((ConnectionRefusedError|ConnectionResetError|RemoteDisconnected)/.test(t) || (/RemoteDisconnected|Reset/.test(t) && opt && opt.method && opt.method !== 'GET')) return r;
      if (k === 0 && window.toast) toast('Die AVA startet gerade neu (Update) – die Anfrage wird gleich wiederholt …');
      await new Promise((ok) => setTimeout(ok, 5000));
    }
  };
})();
const LS = { get(k, d) { try { const v = localStorage.getItem('ava.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('ava.' + k, JSON.stringify(v)); } catch { /* egal */ } } };

  ['Vergabe', [['angebote', 'Angebote & Preisspiegel', '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>']]],
  ['Vergabe und Abrechnung', [['auftraege', 'Aufträge', '<path d="M3 7h6l2 2h10v10H3z"/>'], ['aufmass', 'Aufmaßprüfung', '<path d="M3 17l14-14 4 4-14 14H3z"/><path d="M13 7l4 4"/>'], ['rechnungen', 'Rechnungen', '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>']]],
  ['Kostenübersicht', [['uebersicht', 'Kostenkontrolle', '<path d="M4 19h16M7 16V9M12 16V5M17 16v-4"/>']]],

const IC = {
  proj: '<svg class="ico" viewBox="0 0 24 24" fill="#d9a520" stroke="#a57a0c"><path d="M3 6h6l2 2h10v11H3z"/></svg>',
  lv: '<svg class="ico" viewBox="0 0 24 24" fill="#e9c46a" stroke="#b08a2e"><path d="M3 6h6l2 2h10v11H3z"/></svg>',
  ti: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#4a7fb5" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/></svg>',
  pos: '<svg class="ico" viewBox="0 0 24 24" fill="#fff" stroke="#7a8a99"><path d="M6 3h9l4 4v14H6z"/></svg>',
};
const jn = (b) => (b ? 'Ja' : 'Nein');
function lvBaum(lv) {   // Titel/Positionen eines LV mit Summen
  const I = (lv.data && lv.data.items) || [], V = lv.vergabe || {}, VP = V.preise || null, nl = (V.nachlass || 0) / 100;
  const ep = (x) => (VP ? (VP[x.id] ?? null) : (x.ep_s ?? null));
  const gp = (x) => (ep(x) != null ? (x.menge || 0) * ep(x) * (VP ? 1 - nl : 1) : null);
  const rows = []; const st = [];
  I.forEach((x) => {
    if (x.typ === 'titel') {
      const lvl = x.lvl || 1; while (st.length && st[st.length - 1].lvl >= lvl) st.pop();
      const r = { k: `l${lv.id}:${x.id}`, typ: 'ti', x, lvl, par: st.length ? st[st.length - 1].k : `l${lv.id}`, g: 0, nt: 0, ntj: false };
      rows.push(r); st.push(r); return;
    }
    if (x.typ !== 'pos' || x.art === 'T') return;
    const g = gp(x), isNt = !!x.nt && x.nt_status !== 'abgelehnt';
    const r = { k: `l${lv.id}:${x.id}`, typ: 'pos', x, par: st.length ? st[st.length - 1].k : `l${lv.id}`, g: zaehlt(x) ? g : null, gRoh: g, nt: isNt && g ? g : 0, ntj: !!x.nt };
    rows.push(r);
    st.forEach((t) => { if (zaehlt(x) && g) t.g += g; if (r.nt) t.nt += r.nt; if (x.nt) t.ntj = true; });
  });
  return rows;
}
function vAuftraege() {

}

  const tr = e.target.closest('tr[data-tr]'); if (!tr) return;
  const m = /^l(\d+)(?::(.+))?$/.exec(tr.dataset.tr);
  if (!m) { if (tr.dataset.tr.startsWith('p')) treeCar('-' + tr.dataset.tr); return; }
  if (!m[2]) { treeCar(tr.dataset.tr); }
  await flush(); if (!L || L.id !== +m[1]) await openLv(+m[1]);
  if (m[2]) {
    tab = 'lv'; LS.set('tab', tab); OPEN.add(m[2]); render();
    const i = items().findIndex((x) => x.id === m[2]); const r = document.querySelector(`tr[data-i="${i}"]`);
    if (r) { r.scrollIntoView({ block: 'center' }); r.classList.add('flash'); setTimeout(() => r.classList.remove('flash'), 1600); }
  }
});

/* ---------- Übersicht Projekt (Kostenkontrolle) ---------- */
function vUebersicht() {
  if (!LIST.length) return '<div class="card empty">Noch keine Leistungsverzeichnisse in diesem Projekt.</div>';
  const S = { s: 0, a: 0, au: 0, nt: 0, ab: 0 };
  const rows = LIST.filter((x) => !x.archived).map((x) => {
    const auf = x.auftrag + x.nachtraege; S.s += x.schaetzung; S.a += x.min_angebot; S.au += x.auftrag; S.nt += x.nachtraege; S.ab += x.abgerechnet;
    return `<tr data-ue="${x.id}"><td>${esc(x.nr)}</td><td><b>${esc(x.name)}</b><br><span class="hint">${esc([x.gewerk, x.auftragnehmer].filter(Boolean).join(' · '))}</span></td><td>${esc(STATUS.find((s) => s[0] === x.status)[1])}</td>
      <td class="r">${x.schaetzung ? eur0(x.schaetzung) : '–'}</td><td class="r">${x.min_angebot ? eur0(x.min_angebot) : '–'}${x.n_angebote ? `<br><span class="hint">${x.n_angebote} Angebote</span>` : ''}</td>
      <td class="r">${x.auftrag ? eur0(x.auftrag) : '–'}</td><td class="r">${x.nachtraege ? eur0(x.nachtraege) : '–'}</td><td class="r">${x.abgerechnet ? eur0(x.abgerechnet) : '–'}</td>
      <td class="r">${auf ? eur0(auf - x.abgerechnet) : '–'}</td><td class="r" style="${auf && x.schaetzung && auf > x.schaetzung * 1.05 ? 'color:var(--red);font-weight:600' : ''}">${auf && x.schaetzung ? (auf >= x.schaetzung ? '+' : '') + Math.round((auf / x.schaetzung - 1) * 100) + ' %' : ''}</td></tr>`;
  }).join('');
  const ges = S.au + S.nt;
  return `<p class="hint" style="margin:0 0 .6rem">Alle Vergabeeinheiten des Projekts: Schätzung im LV, bestes Angebot, Auftrag und beauftragte Nachträge, anerkannte Abrechnung. Klick öffnet das LV.</p>
    <div class="tblw"><table class="lv ue"><thead><tr><th>Nr.</th><th>LV</th><th>Stand</th><th class="r">Schätzung</th><th class="r">bestes Angebot</th><th class="r">Auftrag</th><th class="r">Nachträge</th><th class="r">abgerechnet</th><th class="r">noch offen</th><th class="r">Abw. zur Schätzung</th></tr></thead>
      <tbody>${rows}</tbody><tfoot><tr><td></td><td><b>Summe netto</b></td><td></td><td class="r"><b>${eur0(S.s)}</b></td><td class="r">${eur0(S.a)}</td><td class="r"><b>${eur0(S.au)}</b></td><td class="r">${eur0(S.nt)}</td><td class="r"><b>${eur0(S.ab)}</b></td><td class="r">${eur0(ges - S.ab)}</td>
      <td class="r">${ges && S.s ? (ges >= S.s ? '+' : '') + Math.round((ges / S.s - 1) * 100) + ' %' : ''}</td></tr></tfoot></table></div>`;
}

          ${x.nachtraege || x.nt_angemeldet ? `<div class="mk-r"><span>Nachträge</span>${eur0(x.nachtraege)}${x.nt_angemeldet ? ` <small style="color:#e07b3a">+ ${eur0(x.nt_angemeldet)} angemeldet</small>` : ''}</div>` : ''}
          ${ges ? `<div class="mk-r"><span>Leistungsstand · abgerechnet</span>${eur0(x.leistung)} · ${eur0(x.abgerechnet)}</div>
          <div class="mk-b"><u style="width:${pct(x.leistung, ges)}%"></u><i style="width:${pct(x.abgerechnet, ges)}%"></i></div>` : ''}</button>`; }).join('')}`;
  }
  const preisVon = (x) => (vergeben() ? (L.vergabe.preise || {})[x.id] : x.ep_s);
  function vLvM() {
    if (!L) return '<p style="padding:1rem;color:var(--mute)">Kein LV gewählt.</p>';
    const I = items(), K = L.calc, ges = K.auftrag + K.nachtraege.beauftragt;
    let h = `<div class="mv-k"><div><small>${vergeben() ? 'Auftrag' : 'Schätzung'}</small><b>${eur0(vergeben() ? K.auftrag : K.schaetzung)}</b>${L.vergabe.bieter ? `<span class="sub"> · ${esc(L.vergabe.bieter)}</span>` : ''}</div>
      <div><small>Nachträge beauftragt</small><b>${eur0(K.nachtraege.beauftragt)}</b>${K.nachtraege.angemeldet ? `<span class="sub"> · ${eur0(K.nachtraege.angemeldet)} angem.</span>` : ''}</div>
      <div><small>Leistungsstand</small><b>${eur0(K.leistung)}</b><span class="sub"> · ${pct(K.leistung, ges)} %</span></div><div><small>abgerechnet</small><b>${eur0(K.abgerechnet)}</b></div></div>`;
    let offen = false, sum = 0, tit = null;
    const fl = () => { if (tit) h += `</div>`; };
    I.forEach((x) => {
      if (x.typ === 'titel') {
        fl(); const lv = x.lvl || 1; let s2 = 0;
        for (let j = I.indexOf(x) + 1; j < I.length && !(I[j].typ === 'titel' && (I[j].lvl || 1) <= lv); j++) { const y = I[j]; const ep = preisVon(y); if (y.typ === 'pos' && zaehlt(y) && ep != null) s2 += (y.menge || 0) * ep; }
        offen = !st.auf.has(x.id); tit = x;
        h += `<section class="mg"><h3 data-mt="${esc(x.id)}" style="padding-left:${(lv - 1) * .8}rem">${offen ? '▾' : '▸'} ${esc(x.oz)} ${esc(x.kurz)}<span class="mg-s">${s2 ? eur0(s2) : ''}</span></h3><div${offen ? '' : ' hidden'}>`;
        return;
      }
      if (x.art === 'T') { h += `<div class="mp grau"><div class="t" style="font-style:italic">${esc(x.kurz)}</div>${x.lang ? `<div class="lt">${esc(x.lang)}</div>` : ''}</div>`; return; }
      const ep = preisVon(x), gp = ep != null && zaehlt(x) ? (x.menge || 0) * ep : null; sum += gp || 0;
      h += `<div class="mp${ohneGB(x) || x.entf ? ' grau' : ''}" data-mp="${esc(x.id)}"><div class="o">${esc(x.oz)}${x.nt ? ` · <b style="color:#e07b3a">${esc(x.nt)} ${esc(x.nt_status || '')}</b>` : ''}${ohneGB(x) ? ' · ohne GB' : ''}${x.entf ? ' · entfällt' : ''}</div>
        <div class="t">${esc(x.kurz)}</div><div class="z"><span>${nf(x.menge)} ${esc(x.einheit || '')}${ep != null ? ' × ' + nf2(ep) + ' €' : ''}</span><b>${gp != null ? eur(gp) : ''}</b></div>
        ${st.lang === x.id && x.lang ? `<div class="lt">${esc(x.lang)}</div>` : ''}</div>`;
    });
    fl();
    return h + `<p class="mv-f" style="margin-top:.8rem">Summe netto <b>${eur(sum)}</b></p>`;
  }
  function vNt() {
    if (!L) return '';
    const N = items().filter((x) => x.nt); if (!N.length) return '<p style="padding:1rem;color:var(--mute)">Keine Nachträge in diesem LV.</p>';
    const VP = L.vergabe.preise || {};
    return N.map((x) => { const ep = VP[x.id], gp = ep != null ? (x.menge || 0) * ep : null, s = x.nt_status || 'angemeldet';
      return `<div class="mk" style="--gw:${s === 'beauftragt' ? '#2f9e5a' : s === 'abgelehnt' ? '#9e9e9e' : '#e07b3a'}"><div class="mk-h"><b>${esc(x.nt)} · ${esc(x.kurz)}</b><span class="mk-tag ${s === 'beauftragt' ? 'ok' : s === 'angemeldet' ? 'w' : ''}">${esc(s)}</span></div>
        <div class="mk-r"><span>${nf(x.menge)} ${esc(x.einheit || '')}${ep != null ? ' × ' + nf2(ep) + ' €' : ''}</span>${gp != null ? eur(gp) : '–'}</div>${x.nt_grund ? `<div class="mk-z">${esc(x.nt_grund)}</div>` : ''}</div>`; }).join('');
  }
  function vRe() {
    if (!L) return '';
    if (!L.rechnungen.length) return '<p style="padding:1rem;color:var(--mute)">Noch keine Rechnungen zu diesem LV.</p>';
    const RC = Object.fromEntries(L.calc.rechnungen.map((r) => [r.id, r]));
    return [...L.rechnungen].reverse().map((r) => { const c = RC[r.id] || {}, g = r.status === 'geprueft';
      return `<div class="mk" style="--gw:${g ? '#2f9e5a' : '#e0a030'}"><div class="mk-h"><b>${r.nr}. ${r.art === 'schluss' ? 'Schlussrechnung' : 'Abschlagsrechnung'}</b><span class="mk-tag ${g ? 'ok' : 'w'}">${g ? 'geprüft' : 'in Prüfung'}</span></div>
        <div class="mk-z">${[r.re_nr ? 'Nr. ' + esc(r.re_nr) : '', r.datum ? de(r.datum) : '', r.eingang ? 'Eingang ' + de(r.eingang) : ''].filter(Boolean).join(' · ')}</div>
        ${r.gefordert ? `<div class="mk-r"><span>gefordert (kumuliert)</span>${eur(r.gefordert)}</div>` : ''}
        <div class="mk-r"><span>anerkannt (kumuliert)</span>${eur(c.anerkannt)}</div><div class="mk-r"><span>Zahlbetrag netto · brutto</span><b>${eur(c.zahlung)} · ${eur(c.brutto)}</b></div></div>`; }).join('');
  }
  function zeichnen() {
    const lvSel = LIST.length ? `<select id="mLv" aria-label="Leistungsverzeichnis">${LIST.filter((x) => !x.archived || (L && x.id === L.id)).map((x) => `<option value="${x.id}"${L && x.id === L.id ? ' selected' : ''}>${esc(x.nr)} · ${esc(x.name)}</option>`).join('')}</select>` : '';
    const M = [['auftraege', 'Aufträge'], ['lv', 'LV'], ['nt', 'Nachträge'], ['re', 'Rechnungen']];
    box.innerHTML = `<div class="mv-top"><div class="mv-q"><input type="search" id="mQ" placeholder="🔍 Suchen – Text, OZ, Firma …" value="${esc(st.q)}" autocomplete="off" enterkeyhint="search"><label><input type="checkbox" id="mQa"${st.alle ? ' checked' : ''}> alle Projekte</label></div>${st.modus === 'auftraege' ? '' : lvSel}<div class="mv-seg">${M.map(([k, l]) => `<button data-mm="${k}" class="${k === st.modus ? 'on' : ''}">${l}</button>`).join('')}</div></div>
      <div class="mv-b">${st.q.length > 1 ? '<p style="color:var(--mute)">Suche …</p>' : st.modus === 'lv' ? vLvM() : st.modus === 'nt' ? vNt() : st.modus === 're' ? vRe() : vAuf()}
      <p class="mv-f">Nur Ansicht – bearbeiten am Computer. <button data-mdesk>Desktop-Ansicht</button></p></div>`;
    if (st.q.trim().length > 1) suchen();
  }
  async function suchen() {   // Volltextsuche wie am Computer (api/suche) – Ergebnisse statt der Liste
    const q = st.q.trim(), b = box.querySelector('.mv-b'); if (!b) return;
    if (q.length < 2) { zeichnen(); return; }
    const my = ++st.tok;
    try {
      const r = await api('api/suche?q=' + encodeURIComponent(q) + (st.alle || !pid ? '' : '&pid=' + pid)); if (my !== st.tok) return;
      st.R = r.treffer.filter((t) => t.art !== 'tuer');
      let h = '', grp = '';
      st.R.forEach((t, k) => {
        const g = [st.alle ? t.projekt : '', t.lv].filter(Boolean).join(' › '); if (g !== grp) { grp = g; h += `<div class="mv-g">${esc(g)}</div>`; }
        h += `<button class="mv-r" data-mr="${k}"><div class="o">${VQIC[t.art] || '▪'} ${esc(t.oz || (t.art === 'angebot' ? 'Bieter' : t.art === 'rechnung' ? 'Rechnung' : t.art === 'aufmass' ? 'Aufmaß' : ''))}${t.nt ? ' · ' + esc(t.nt) : ''}</div><div class="t">${vqMarkieren(t.titel, q)}</div>${t.text ? `<div class="s">${vqMarkieren(t.text, q)}</div>` : ''}</button>`;
      });
      b.innerHTML = h || `<p style="color:var(--mute);padding:.5rem 0">Nichts gefunden zu „${esc(q)}“${st.alle ? '' : ' in diesem Projekt – Häkchen „alle Projekte“ setzen'}.</p>`;
    } catch (er) { toast(er.message, true); }
  }
  async function gehe(t) {
    st.q = ''; document.activeElement && document.activeElement.blur && document.activeElement.blur();
    if (t.pid && t.pid !== pid) { pid = t.pid; LS.set('pid', pid); if (window.BPHead) BPHead.projektSetzen(pid); LIST = await api('api/lv?project_id=' + pid); }
    st.modus = t.art === 'rechnung' ? 're' : 'lv'; LS.set('mModus', st.modus); st.auf.clear(); st.lang = t.pos_id || null;
    if (t.lv_id) await openLv(t.lv_id);
    zeichnen();
    setTimeout(() => { const el = t.pos_id && box.querySelector(`[data-mp="${CSS.escape(t.pos_id)}"]`); if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('blink'); } else scrollTo(0, 0); }, 60);
  }
  box.addEventListener('input', (e) => { if (e.target.id === 'mQ') { st.q = e.target.value; clearTimeout(st.T); st.T = setTimeout(suchen, 300); } });
  box.addEventListener('change', async (e) => { if (e.target.id === 'mQa') { st.alle = e.target.checked; LS.set('vqAlle', st.alle); suchen(); return; } if (e.target.id === 'mLv') { await openLv(+e.target.value); } });
  box.addEventListener('click', async (e) => {
    const mr = e.target.closest('[data-mr]'); if (mr) { gehe(st.R[+mr.dataset.mr]); return; }
    const m = e.target.closest('[data-mm]'); if (m) { st.q = ''; st.modus = m.dataset.mm; LS.set('mModus', st.modus); zeichnen(); scrollTo(0, 0); return; }
    const k = e.target.closest('[data-mlv]'); if (k) { st.modus = 'lv'; LS.set('mModus', 'lv'); await openLv(+k.dataset.mlv); scrollTo(0, 0); return; }
    const t = e.target.closest('[data-mt]'); if (t) { const id = t.dataset.mt; if (st.auf.has(id)) st.auf.delete(id); else st.auf.add(id); zeichnen(); return; }
    const p = e.target.closest('[data-mp]'); if (p) { st.lang = st.lang === p.dataset.mp ? null : p.dataset.mp; zeichnen(); return; }
    if (e.target.closest('[data-mdesk]')) { try { localStorage.setItem(LSK, '1'); } catch { /* egal */ } location.reload(); }
  });
  return { zeichnen };
})();
window.bpMobilAn = () => { try { localStorage.removeItem('ava.mobilAus'); } catch { /* egal */ } location.reload(); };
