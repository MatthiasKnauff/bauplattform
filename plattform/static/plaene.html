<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#84827c">
<title>Pläne & Dateien</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="bp/bp.css">
<link rel="stylesheet" href="static/plaene-alle.css">
<style>
/* Aufbau wie die übrigen Apps: links die Navigation (bpNav mit Heftzwecke, darunter der Ordnerbaum bei „Alle Dateien“), rechts der Inhalt.
   Die Kopfzeile (Ordner, Neu einlesen) bleibt stehen, nur der Inhalt rollt. „Alle Dateien“ nutzt die ganze Breite und hat rechts Details. */
html,body{height:100%}
body{display:flex;flex-direction:column;margin:0;background:var(--bg)}
main.pl-app{flex:1;min-height:0;display:flex}
main.pl-app>.bp-nav{width:250px;flex:none;min-height:0;overflow:auto}
main.pl-app .pane{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;padding:.45rem .6rem 0}
.pl-work{flex:1;min-height:0;display:flex}.pl-work[hidden]{display:none!important}
.pl-work>.pl-v{flex:1;min-height:0;overflow:auto;padding:0 .3rem 6rem}
#view>*{max-width:1240px}
#workA.sr-split{display:grid;align-items:stretch;padding-bottom:.45rem}#workA>.sr-r{height:auto;min-height:0}
#tabs{display:none}
@media (max-width:760px){main.pl-app{flex-direction:column}main.pl-app>.bp-nav,main.pl-app>.bp-nav-griff{display:none}main.pl-app .pane{padding:.3rem .3rem 0}
  #tabs{display:flex;flex:1 1 100%!important;overflow-x:auto;scrollbar-width:none}.tabrow>.mu{display:none}.al-l{position:static!important}}
.top{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:0 0 .8rem}
.top .fill{flex:1}
.top select{min-width:16rem;max-width:100%}
.ord{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--mute)}
/* Reiter und Ordner-Knöpfe in einer Zeile */
.tabrow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;background:var(--tabs);border-bottom:1px solid var(--line);border-radius:calc(10px*var(--rk,1)) calc(10px*var(--rk,1)) 0 0;margin:0 -.2rem 1rem;padding-right:.6rem}
.tabrow .tabs{margin:0;border-bottom:0;background:transparent;flex:1;min-width:0}
.ord code{background:var(--card);border:1px solid var(--line);border-radius:calc(6px*var(--rk,1));padding:.1rem .4rem;color:var(--ink);word-break:break-all}
.tabs{margin:0 -.2rem 1rem;border-radius:calc(10px*var(--rk,1)) calc(10px*var(--rk,1)) 0 0}
.tab small{margin-left:.35rem;font-size:.75rem;border-radius:calc(999px*var(--rkp,1));padding:.05rem .45rem;background:var(--hov);color:var(--mute)}
.flt{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.7rem}
.flt input[type=search]{flex:1;min-width:12rem}
.pl{width:100%;border-collapse:collapse}
.pl th{text-align:left;font-size:.78rem;color:var(--mute);font-weight:600;padding:.45rem .5rem;border-bottom:1px solid var(--line);white-space:nowrap}
.pl td{padding:.5rem;border-bottom:1px solid var(--line);vertical-align:top}
.pl tr.alt td{background:rgba(127,127,127,.06);font-size:.9rem}
.pl tr.alt td:first-child{}
.pl .nr{white-space:nowrap;font-variant-numeric:tabular-nums}
.pl .ti b{font-weight:600}.pl td.ti{max-width:0;width:99%;overflow-wrap:anywhere}   /* Titel gibt zuerst nach – kein waagerechter Scrollbalken */
.pl .mu{color:var(--mute);font-size:.8rem}
.idx{display:inline-block;min-width:1.7rem;text-align:center;border-radius:calc(6px*var(--rk,1));padding:.05rem .35rem;font-weight:700;border:1px solid var(--y);color:var(--y)}
.idx.o{border-color:var(--line);color:var(--mute);font-weight:500}
.gw select,.gw input{max-width:11rem;font-size:.85rem;padding:.25rem .35rem}
.gw small{display:block;color:var(--mute);font-size:.72rem;margin-top:.15rem}
.gw.leer select{border-color:var(--y)}
.sent{font-size:.78rem;color:var(--ok)}
.ex{background:none;border:0;color:var(--mute);cursor:pointer;font:inherit;padding:0 .2rem}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card2);border-top:1px solid var(--line);padding:.65rem 1rem calc(.65rem + env(safe-area-inset-bottom));display:flex;gap:.7rem;align-items:center;justify-content:center;flex-wrap:wrap;box-shadow:var(--sh0,0 -6px 20px rgba(0,0,0,.18))}
.bar[hidden]{display:none}
.vd{display:grid;gap:.55rem}
.vd h4{margin:.2rem 0 .3rem}
.emp{display:grid;gap:.2rem;max-height:15rem;overflow:auto;border:1px solid var(--line);border-radius:calc(8px*var(--rk,1));padding:.4rem .6rem}
.emp label{display:flex;gap:.5rem;align-items:baseline}
.emp small{color:var(--mute)}
.vd textarea{width:100%;min-height:8rem;height:9.5rem;font:inherit;resize:vertical}
.vd .pl-l{max-height:4.6rem;overflow:auto}
.vd .opt label{display:flex;gap:.45rem;align-items:center;margin:.12rem 0}
.pa-o{display:flex;flex-wrap:wrap;gap:.35rem .9rem;align-items:center}.pa-o label{display:flex;gap:.35rem;align-items:center;white-space:nowrap}.pa-o input[type=number]{width:4rem}
.modal.wide{width:min(980px,96vw);max-width:none}
@media (min-width:900px){.modal.wide .vd{grid-template-columns:1fr 1fr;column-gap:1.6rem}.modal.wide .vd>.full{grid-column:1/-1}.modal.wide .vd textarea{min-height:8rem}.modal.wide .emp{max-height:12rem}}
.vd input[type=text],.vd input[type=email]{width:100%}
.opt{display:grid;gap:.25rem}
.opt label{display:flex;gap:.5rem;align-items:baseline}
.opt label.dis{opacity:.5}
.warn{border:1px solid var(--y);border-radius:calc(8px*var(--rk,1));padding:.5rem .7rem;font-size:.9rem}
.so summary{cursor:pointer;color:var(--mute);margin:1.2rem 0 .4rem}
.so-h{cursor:pointer;user-select:none;white-space:nowrap}.so-h:hover{color:var(--ink)}
.baum{display:grid;gap:.15rem;max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:calc(8px*var(--rk,1));padding:.5rem .7rem}
.baum label{display:flex;gap:.45rem;align-items:baseline}.baum label span{min-width:0;overflow-wrap:anywhere}.baum label.off{opacity:.55}.baum small{color:var(--mute)}
.so li{margin:.15rem 0}
.vl td{font-size:.9rem}
.set textarea{width:100%;min-height:7rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
.set .g2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
/* Zuordnung wie beim CSV-Einlesen */
.zm{overflow-x:auto;margin:.5rem 0 0;border:1px solid var(--line);border-radius:calc(10px*var(--rk,1))}
.zm table{border-collapse:collapse;min-width:100%}
.zm td{padding:.35rem .45rem;border-right:1px solid var(--line);vertical-align:top;font-size:.85rem}
.zm td:last-child{border-right:0}
.zm .zs{font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:.95rem;background:var(--hov);border-radius:calc(6px*var(--rk,1));padding:.2rem .45rem;white-space:nowrap}
.zm select{font:inherit;font-size:.82rem;padding:.2rem;border-radius:calc(6px*var(--rk,1));border:1px solid var(--y);background:var(--inp);color:var(--ink);max-width:12rem}
.zm tr.zb td{color:#2f9e5a;font-weight:600;font-size:.82rem}
/* kleine Tabellen statt Textfelder */
.zt{width:100%;border-collapse:collapse;margin:.3rem 0 .3rem}
.zt th{font-size:.75rem;color:var(--mute);text-align:left;font-weight:600;padding:.15rem .3rem;border-bottom:1px solid var(--line)}
.zt td{padding:.1rem .15rem;border-bottom:1px solid var(--line)}
.zt input{width:100%;border:1px solid transparent;background:transparent;color:var(--ink);font:inherit;font-size:.88rem;padding:.25rem .35rem;border-radius:calc(5px*var(--rk,1))}
.zt input:focus{border-color:var(--y);background:var(--inp);outline:none}
.zt .zx{border:0;background:none;color:var(--mute);cursor:pointer;font-size:1rem;padding:0 .3rem}.zt .zx:hover{color:#d33}
@media (max-width:760px){.pl .hide-m{display:none}.set .g2{grid-template-columns:1fr}.top select{min-width:0;flex:1 1 100%;width:100%}.top .fill{display:none}.ord code{max-width:100%}.pl td,.pl th{padding:.45rem .3rem}.pl .nr b{font-size:.9rem}}
.mkd{display:inline-block;margin-left:.5rem;padding:0 .5rem;border-radius:calc(999px*var(--rkp,1));background:color-mix(in srgb,#ff5fb3 18%,transparent);color:#c2185b;font-size:.78rem;font-weight:600;white-space:nowrap}

/* Einfache Ansicht: nur der aktuelle Pläne und Dateien */
html[data-modus="einfach"] #tabs [data-tab="liste"],html[data-modus="einfach"] .bp-nav [data-tab="liste"]{display:none}
/* Dateien hereinziehen (plaene-ablage.js, abgelegt wird über bp/ablegen.js) */
.pl tr.pl-ziel td{background:color-mix(in srgb,var(--y) 14%,transparent)}
</style>
</head>
<body>
<main class="pl-app">
  <aside class="bp-nav" id="navL" aria-label="Pläne & Dateien"></aside>
  <section class="pane">
  <select id="proj" aria-label="Projekt" hidden></select>
  <div class="tabrow"><nav class="tabs" id="tabs"></nav><div class="ord" id="ord"></div><button class="btn sm" id="reBtn" title="Projektordner neu durchsuchen">⟳ Neu einlesen</button><span class="mu" style="font-size:.8rem" title="Dateien auf die Seite ziehen – auf eine Planzeile gezogen landen sie in deren Ordner">Dateien hierher ziehen zum Ablegen</span></div>
  <div class="pl-work" id="work"><div id="view" class="pl-v"><p class="mute">Lade …</p></div></div>
  <div class="pl-work" id="workA" hidden><div id="viewA" class="pl-v"></div></div>
  </section>
</main>
<div class="bar" id="bar" hidden></div>
<script src="bp/baukasten.js"></script>
<script>
const LS = { get(k, d) { try { const v = localStorage.getItem('pl.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('pl.' + k, JSON.stringify(v)); } catch { /* egal */ } } };
let NEUMIT = null;   // aus der Leiste „＋ Neu“ hierher gewechselt: Empfänger, Betreff, Text
let AN = new URLSearchParams((location.hash || '').slice(1).split('&').slice(1).join('&')).get('an') || '';   // aus „Adressen“: Firma als Empfänger vorwählen
let ME = null, CFG = null, PROJ = [], pid = LS.get('pid', null), tab = (location.hash || '').slice(1).split('&')[0] || 'plaene';
if (AN) { history.replaceState(null, '', '#plaene'); setTimeout(() => toast(`Pläne auswählen und „Versenden“ – „${AN}“ ist als Empfänger:in vorgewählt.`), 1500); }
let D = null, VL = null, busy = false, F = LS.get('filter', { q: '', gw: '', phase: '', alle: false }), SEL = new Set(), OPEN = new Set();
const de = (s) => { if (!s) return ''; const d = typeof s === 'number' ? new Date(s * 1000) : new Date(s); return isNaN(d) ? s : d.toLocaleDateString('de-DE'); };
const mb = (b) => (b >= 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB');
const fileUrl = (pfad, dl) => `api/datei?project_id=${pid}&pfad=${encodeURIComponent(pfad)}${dl ? '&dl=1' : ''}`;
const stKey = (p, st) => p.key + '#' + st.index;

const PL_IC = { plaene: '<path d="M4 5h16v14H4zM4 9h16M9 9v10"/>', liste: '<path d="M4 6h16M4 12h16M4 18h10"/><path d="M18 16l2 2 3-4"/>', alle: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>' };
function renderTabs() {
  const n = D ? D.plaene.length : 0, v = VL ? VL.length : 0;
  const a = typeof ALLE !== 'undefined' && ALLE && ALLE_PID === pid && ALLE.dateien ? ALLE.dateien.length : 0, pj = (PROJ || []).find((p) => p.id === pid);
  const baum = tab === 'alle' && typeof alleNavBaum === 'function' ? alleNavBaum() : '';
  bpNav($('#navL'), { kopf: { titel: 'Pläne & Dateien', klein: pj ? (pj.name.match(/^[A-Za-z]{1,4}\d{2,6}/) || [''])[0] : '' }, lage: true, attr: 'tab', aktiv: tab,
    gruppen: [{ titel: 'Ansicht', punkte: [{ id: 'plaene', text: 'Pläne', icon: PL_IC.plaene, farbe: 'var(--c-g)', zahl: n || '' }, { id: 'liste', text: 'Planversandliste', icon: PL_IC.liste, farbe: 'var(--c-b)', zahl: v || '' },
      { id: 'alle', text: 'Alle Dateien', icon: PL_IC.alle, farbe: 'var(--c-o)', zahl: a || '', unter: baum }] }] });   // Klick: der gemeinsame Handler [data-tab] unten
  bpNav.breite($('#navL'), { key: 'plaene' });
  $('#work').hidden = tab === 'alle'; $('#workA').hidden = tab !== 'alle';
  $('#tabs').innerHTML = [['plaene', 'Pläne', n], ['liste', 'Planversandliste', v], ['alle', 'Alle Dateien', typeof ALLE !== 'undefined' && ALLE && ALLE_PID === pid && ALLE.dateien ? ALLE.dateien.length : 0]].map(([k, l, c]) => `<button class="tab ${tab === k ? 'on' : ''}" data-tab="${k}">${l}${c ? `<small>${c}</small>` : ''}</button>`).join('');
}
function renderOrd() {
  if (!D || D.error) { $('#ord').innerHTML = ''; return; }
  const n = (D.aus || []).length;
  $('#ord').innerHTML = `<button class="btn sm" id="ordBaum" title="Projektordner ${esc(D.basis || '')} – durchsucht: ${n ? `alle Ordner außer ${n}` : 'alle Ordner'}">Ordner wählen …${n ? ` <small>(${n} aus)</small>` : ''}</button>
    ${D.stand ? `<span class="mu" title="${D.zwischengespeichert ? 'Aus dem Zwischenspeicher – nachts für alle laufenden Projekte eingelesen. „Neu einlesen“ durchsucht den Ordner jetzt.' : 'gerade eingelesen'}">· Stand ${esc(new Date(D.stand).toLocaleString('de-DE', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }))}</span>` : ''}
    ${D.abgebrochen ? '<span class="pill bad" title="Sehr viele Dateien – bitte unter „Ordner wählen“ große Ordner (z. B. Fotos) abwählen">Suche nicht vollständig</span>' : ''}`;
}
/* Verzeichnisbaum mit Häkchen: abgewählte Ordner (samt Unterordnern) werden nicht durchsucht */
function baumDialog() {
  const B = (D.baum || []).slice().sort((a, b) => a.pfad.localeCompare(b.pfad, 'de'));
  const aus = new Set(D.aus || []);
  const sum = (pf) => B.filter((x) => x.pfad === pf || x.pfad.startsWith(pf + '/')).reduce((s, x) => s + x.n, 0);
  const html = () => `<h3>Ordner durchsuchen</h3><p class="hint mu" style="margin:0 0 .6rem;font-size:.88rem">Häkchen = wird durchsucht (mit allen Unterordnern). Abgewählte Ordner werden übersprungen – z. B. Fotos, damit die Suche schneller ist. Die Zahl nennt die gefundenen PDF- und CAD-Dateien.</p>
    <div class="baum">${B.map((x) => { const t = x.pfad.split('/'), d = t.length - 1, off = t.some((_, i) => aus.has(t.slice(0, i + 1).join('/')));
      return `<label style="padding-left:${d * 1.2}rem" class="${off ? 'off' : ''}"><input type="checkbox" data-bp="${esc(x.pfad)}"${off ? '' : ' checked'}${t.slice(0, -1).some((_, i) => aus.has(t.slice(0, i + 1).join('/'))) ? ' disabled' : ''}> <span>📁 ${esc(t[d])} <small>${x.aus ? '· wird nicht durchsucht' : sum(x.pfad) ? '· ' + sum(x.pfad) + ' Dateien' : ''}</small></span></label>`; }).join('') || '<p class="mu">Keine Unterordner.</p>'}</div>
    <div class="acts" style="flex-wrap:wrap"><button class="btn sm" data-m="alle">Alle</button><button class="btn sm" data-m="keine">Keine</button><button class="btn sm" data-m="std" style="margin-right:auto" title="nur den Planordner (z. B. „A497 9. Pläne“) durchsuchen">Vorgabe</button><button class="btn" data-m="x">Abbrechen</button><button class="btn pri" data-m="ok">Übernehmen und neu durchsuchen</button></div>`;
  const bg = modalBox(html(), async (m, bg, close) => {
    if (m === 'x') { close(); return; }
    if (m === 'alle' || m === 'keine') { aus.clear(); if (m === 'keine') B.filter((x) => !x.pfad.includes('/')).forEach((x) => aus.add(x.pfad)); bg.querySelector('.modal').innerHTML = html(); return; }
    const neu = m === 'std' ? null : [...aus];
    try { await api('api/projekt/' + pid, 'PUT', { aus: neu }); close(); SEL.clear(); laden(); } catch (e) { toast(e.message, true); }
  });
  bg.querySelector('.modal').classList.add('wide');
  bg.addEventListener('change', (e) => { const pf = e.target.dataset.bp; if (pf == null) return; if (e.target.checked) aus.delete(pf); else { aus.add(pf); [...aus].forEach((a) => { if (a.startsWith(pf + '/')) aus.delete(a); }); } const st = bg.querySelector('.baum').scrollTop; bg.querySelector('.modal').innerHTML = html(); bg.querySelector('.baum').scrollTop = st; });
}
const frei = (f) => ({ key: f.key, frei: true, nr: '', kennung: '', titel: f.titel, phase: '', phase_name: f.ordner || '', planart_name: '', gewerk: f.gewerk, gewerk_quelle: f.gewerk_quelle,
  staende: [{ index: '', pdf: f, cad: f.cad || [], kopien: 0 }] });

function sichtbar() {
  if (!D) return [];
  const q = F.q.trim().toLowerCase();
  return D.plaene.concat(F.phase ? [] : D.frei || []).filter((p) => (!F.gw || (F.gw === '-' ? !p.gewerk : p.gewerk === F.gw)) && (!F.phase || p.phase === F.phase)
    && (!q || passt([p.nr, p.titel, p.kennung, p.gewerk, p.phase_name, p.planart_name, ...p.staende.map((s) => s.pdf && s.pdf.name)].join(' '), q)));
}
function render() {
  renderTabs(); renderOrd();
  if (tab === 'liste') return renderListe();
  if (tab === 'alle') return renderAlle();   // plaene-alle.js
  if (busy && !D) { $('#view').innerHTML = '<p class="mute">Projektordner wird durchsucht …</p>'; bar(); return; }
  if (!D) { $('#view').innerHTML = '<p class="mute">Bitte ein Projekt wählen.</p>'; bar(); return; }
  if (D.error) { $('#view').innerHTML = `<div class="card"><p>${esc(D.error)}</p></div>`; bar(); return; }
  const L = sichtbar(), phasen = [...new Set(D.plaene.map((p) => p.phase))].sort();
  const gwOpts = () => `<datalist id="gwList">${D.gewerke.map((g) => `<option value="${esc(g)}">`).join('')}</datalist>`;   // Vorschläge, eigene Eingabe möglich
  const row = (p, st, alt) => {
    const k = stKey(p, st), s = st.pdf, v = (s && s.versendet) || [];
    const last = v[v.length - 1];
    return `<tr class="${alt ? 'alt' : ''}" data-k="${esc(k)}">
      <td>${s ? `<input type="checkbox" data-sel="${esc(k)}"${SEL.has(k) ? ' checked' : ''} aria-label="Plan wählen">` : ''}</td>
      <td class="nr">${alt ? '' : p.frei ? '<span class="mu">ohne Nr.</span>' : `${p.kennung ? `<span class="pill">${esc(p.kennung)}</span> ` : ''}<b>${esc(p.nr)}</b>`}</td>
      <td>${p.frei ? '' : `<span class="idx ${st.index ? '' : 'o'}" title="${st.index ? 'Index ' + st.index : 'Ursprungsplan (ohne Index)'}">${st.index || '–'}</span>`}</td>
      <td class="ti">${alt ? `<span class="mu">älterer Stand</span>` : `<b>${esc(p.titel || '')}</b>${s && s.markiert ? ` <span class="mkd" title="${esc(s.markiert.n + ' Markierung' + (s.markiert.n === 1 ? '' : 'en') + ' · zuletzt ' + new Date(s.markiert.wann).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }) + ' · von ' + s.markiert.wer)}">📌 markiert · ${esc(de(s.markiert.wann))} · ${esc(s.markiert.wer)}</span>` : ''}<div class="mu">${p.frei ? '📁 ' + esc(p.phase_name || 'Projektordner') : esc([p.kennung_name, p.phase_name || ('Phase ' + p.phase), p.variante && p.variante !== '1' ? 'Variante/Typ ' + p.variante : '', [p.planart_name, p.geschoss].filter(Boolean).join(' ')].filter(Boolean).join(' · '))}</div>`}
        ${s ? `<div class="mu"><a href="${fileUrl(s.pfad)}" data-ansehen="pdf" data-name="${esc(s.name)}">${esc(s.name)}</a> · ${mb(s.groesse)} · ${de(s.mtime)}${st.kopien ? ` · ${st.kopien} weitere Kopie${st.kopien > 1 ? 'n' : ''}` : ''}</div>` : '<div class="mu">nur CAD-Datei</div>'}
        ${st.cad.length ? `<div class="mu">CAD: ${st.cad.map((c) => `<a href="${fileUrl(c.pfad, 1)}">${esc(c.ext.slice(1).toUpperCase())}</a>`).join(', ')}</div>` : ''}</td>
      <td class="gw hide-m ${alt ? '' : p.gewerk ? '' : 'leer'}">${alt ? '' : `<input data-gw="${esc(p.key)}" list="gwList" value="${esc(p.gewerk || '')}" placeholder="Gewerk wählen oder eintippen" aria-label="Gewerk" autocomplete="off"><small>${p.gewerk ? esc(p.gewerk_quelle === 'zugeordnet' ? 'von Hand zugeordnet' : 'erkannt: ' + p.gewerk_quelle) : 'nicht erkannt'}</small>`}</td>
      <td class="hide-m">${last ? `<div class="sent" title="${esc(v.map((x) => de(x.datum) + ' an ' + x.an).join('\n'))}">✓ ${de(last.datum)}<br>${esc(last.an)}${v.length > 1 ? ` (+${v.length - 1})` : ''}</div>` : '<span class="mu">noch nicht versendet</span>'}</td>
      <td>${!alt && p.staende.length > 1 ? `<button class="ex" data-ex="${esc(p.key)}" aria-expanded="${OPEN.has(p.key)}" title="ältere Stände">${OPEN.has(p.key) ? '▾' : '▸'} ${p.staende.length - 1}</button>` : ''}</td></tr>`;
  };
  const Lp = sortiert(L.filter((p) => !p.frei)), Lf = sortiert(L.filter((p) => p.frei));
  const rowsOf = (LL) => LL.map((p) => {

/* Sortieren per Klick auf die Spaltenköpfe (nochmal = umgekehrt); gilt für beide Listen */
let S = LS.get('sort', { k: 'nr', d: 1 });
const nrKey = (p) => (p.nr || '').split('.').map((x) => String(+x || 0).padStart(4, '0')).join('.');
function sortiert(L) {
  const top = (p) => p.staende.find((x) => x.pdf) || p.staende[0];
  const val = { nr: (p) => (p.frei ? '' : p.proj + nrKey(p) + p.kennung), index: (p) => top(p).index || '', titel: (p) => (p.titel || '').toLowerCase(),
    gewerk: (p) => (p.gewerk || '\uffff').toLowerCase(), datum: (p) => (top(p).pdf || {}).mtime || 0,
    versendet: (p) => { const v = (top(p).pdf || {}).versendet || []; return v.length ? v[v.length - 1].datum : ''; } }[S.k] || ((p) => nrKey(p));
  return L.slice().sort((a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * S.d || nrKey(a).localeCompare(nrKey(b)); });
}
function gewaehlt() {
  const out = [];
  if (!D) return out;
  for (const p of D.plaene.concat(D.frei || [])) for (const st of p.staende) if (SEL.has(stKey(p, st)) && st.pdf) out.push({ p, st });
  return out;
}

}

const ROLLEN = [['phase', 'Leistungsphase'], ['variante', 'Gebäudetyp / Variante'], ['planart', 'Planart'], ['lfd', 'Lfd. Nr. (bei Grundrissen Geschoss)'], ['egal', '– ohne Bedeutung –']];
function nameZerlegen(n) {   // wie planname.lies (vereinfacht): Projekt, Kennung, Nummernstellen, Index, Titel
  const st = String(n || '').replace(/\.(pdf|dwg|dxf|pln|ifc)$/i, '').trim();
  const m = /^([A-Za-z]\d{3}(?:\.\d+)*)[\s_-]+(?:(AA|ELT|FL|FK|AP|IP|NA|P\s*\([^)]*\)|P)[\s_-]+)?(\d+(?:[._]\d+){1,5})(?!\d)[._\s-]*(.*)$/i.exec(st);
  if (!m) return null;
  let rest = m[4] || '', idx = '';
  const mi = /(?:^|[\s_-])(?:INDEX|IDX)[\s_.-]*([A-Z])(?=$|[\s_.-])/i.exec(rest); if (mi) { idx = mi[1].toUpperCase(); rest = rest.slice(0, mi.index) + ' ' + rest.slice(mi.index + mi[0].length); }
  return { proj: m[1].toUpperCase(), kennung: (m[2] || '').toUpperCase(), teile: m[3].split(/[._]/), index: idx, titel: rest.replace(/_+/g, ' ').replace(/\s+/g, ' ').trim().replace(/^[-.]+|[-.]+$/g, '') };
}

  let bsp = bsp0;
  const tabelle = (k, k1, k2, breit) => `<table class="zt" data-zt="${k}"><thead><tr><th style="width:${breit || '5.5rem'}">${k1}</th><th>${k2}</th><th style="width:2rem"></th></tr></thead><tbody>
      ${W[k].map(([a, v], i) => `<tr><td><input data-zk="${k}" data-zi="${i}" data-zf="0" value="${esc(a)}"${dis}></td><td><input data-zk="${k}" data-zi="${i}" data-zf="1" value="${esc(v)}"${dis}></td><td>${dis ? '' : `<button type="button" class="zx" data-zdel="${k}" data-zi="${i}" title="Zeile löschen" aria-label="Zeile löschen">×</button>`}</td></tr>`).join('')}</tbody></table>
    ${dis ? '' : `<button type="button" class="btn sm" data-zadd="${k}">+ Zeile</button>`}`;
  const zuordnung = () => {
    const z = nameZerlegen(bsp);
    if (!z) return '<p class="mu" style="margin:.4rem 0">Dieser Name passt nicht zur Plannummerierung (Projekt, Nummer mit Punkten …). Solche PDFs erscheinen unter „Weitere PDFs“ und lassen sich trotzdem versenden.</p>';
    const bed = (rolle, v) => { const t = rolle === 'phase' ? W.phasen : rolle === 'planart' ? W.planarten : null; if (t) { const x = t.find(([a]) => a === v); return x ? x[1] : '?'; } if (rolle === 'lfd') { const pa = z.teile[W.stellen.indexOf('planart')]; const n = +v; return pa === '1' && n ? (n === 1 ? 'KG' : n === 2 ? 'EG' : `${n - 2}. OG`) : 'Nr. ' + v; } if (rolle === 'variante') return 'Typ ' + v; return ''; };
    const ke = z.kennung ? (W.kennungen.find(([a]) => a.toUpperCase() === z.kennung.split('(')[0].trim()) || [, '?'])[1] : '';
    const spalten = [['Projekt', z.proj, '<span class="mu">Projekt</span>', ''],
      ...(z.kennung ? [['Kennung', z.kennung, '<span class="mu">Kennung</span>', '→ ' + esc(ke)]] : []),
      ...z.teile.map((v, i) => [`${i + 1}. Stelle`, v, `<select data-stelle="${i}"${dis}>${ROLLEN.map(([k, l]) => `<option value="${k}"${(W.stellen[i] || 'egal') === k ? ' selected' : ''}>${l}</option>`).join('')}</select>`, esc(bed(W.stellen[i] || 'egal', v))]),
      ...(z.index ? [['Index', 'INDEX ' + z.index, '<span class="mu">Planstand</span>', 'neuester = höchster Buchstabe']] : []),
      ['Titel', z.titel || '–', '<span class="mu">Titel</span>', '']];
    return `<div class="zm"><table><tr>${spalten.map((x) => `<td><div class="zs">${esc(x[1])}</div></td>`).join('')}</tr><tr>${spalten.map((x) => `<td>${x[2]}</td>`).join('')}</tr><tr class="zb">${spalten.map((x) => `<td>${x[3]}</td>`).join('')}</tr></table></div>`;
  };
  const html = () => `<h3>Einstellungen – Pläne & Dateien</h3><div class="set vd">
    <div><b>So sind eure Plannamen aufgebaut</b><p class="mu" style="margin:.2rem 0 .5rem;font-size:.88rem">Wie beim Einlesen einer Excel-Datei: unter jede Stelle der Plannummer wählen, was sie bedeutet. Darunter steht, was die App daraus liest.</p>
      <label style="display:grid;gap:.2rem">Beispiel (Dateiname eines Plans – zum Ausprobieren änderbar)<input id="sBsp" value="${esc(bsp)}" autocomplete="off" style="width:100%"></label>
      <div id="sZu">${zuordnung()}</div></div>
    <div class="g2"><div><b>Leistungsphasen</b>${tabelle('phasen', 'Ziffer', 'Bedeutung')}</div><div><b>Planarten</b>${tabelle('planarten', 'Ziffer', 'Bedeutung')}</div></div>
    <div><b>Kennungen → Gewerk</b> <span class="mu" style="font-size:.85rem">(Buchstaben vor der Nummer, z. B. ELT)</span>${tabelle('kennungen', 'Kennung', 'Gewerk')}</div>
    <div><b>Stichwörter im Titel → Gewerk</b> <span class="mu" style="font-size:.85rem">(passt kein Stichwort, wählt man das Gewerk in der Liste – das wird gemerkt)</span>${tabelle('stichworte', 'Gewerk', 'Stichwörter (mit Komma)', '9rem')}</div>
    <label>E-Mail-Anhänge höchstens <input type="number" id="sMb" min="1" max="100" value="${W.max_mb}" style="width:5rem"${dis}> MB</label>
    <div><b>Plotauftrag – Vorgaben</b> <span class="mu" style="font-size:.85rem">(im Plotauftrag vorausgewählt, dort änderbar)</span>
      <div class="pa-o" style="margin-top:.3rem"><label><input type="radio" name="sFarbe" value="farbe"${W.plot.farbe !== 'sw' ? ' checked' : ''}${dis}> farbig</label><label><input type="radio" name="sFarbe" value="sw"${W.plot.farbe === 'sw' ? ' checked' : ''}${dis}> schwarz-weiß</label>
      <label><input type="checkbox" data-sp="foto"${W.plot.foto ? ' checked' : ''}${dis}> Fotodruck</label><label><input type="checkbox" data-sp="gefaltet"${W.plot.gefaltet ? ' checked' : ''}${dis}> gefaltet</label><label><input type="checkbox" data-sp="gelocht"${W.plot.gelocht ? ' checked' : ''}${dis}> gelocht</label>
      <label><input type="number" id="sSaetze" min="1" max="50" value="${W.plot.saetze}"${dis}> Sätze</label>
      <label><select id="sLief"${dis}>${[['abholen', 'wir holen ab'], ['baustelle', 'an die Baustelle liefern'], ['buero', 'ins Büro liefern']].map(([k, l]) => `<option value="${k}"${(W.plot.lieferung || 'abholen') === k ? ' selected' : ''}>${l}</option>`).join('')}</select></label></div></div></div>
    <div class="acts"><button type="button" class="btn" data-bph-verlauf="bp:plaene" style="margin-right:auto" title="Frühere Stände ansehen und wiederherstellen">🕘 Verlauf</button>${CFG.admin ? '<button class="btn" data-m="std">Vorgaben</button>' : ''}<button class="btn" data-m="x">${CFG.admin ? 'Abbrechen' : 'Schließen'}</button>${CFG.admin ? '<button class="btn pri" data-m="ok">OK</button>' : ''}</div>`;
  const box0 = boxIn(host)(html(), async (m, bg, close) => {
    if (m === 'x') { close(); return; }
    if (m === 'std') { const S = CFG.standard; Object.assign(W, { stellen: [...S.stellen], phasen: Object.entries(S.phasen), planarten: Object.entries(S.planarten), kennungen: Object.entries(S.kennungen), stichworte: Object.entries(S.stichworte), max_mb: S.max_mb }); neuZeichnen(bg); return; }
    if (m === 'ok') {
      const obj = (k) => Object.fromEntries(W[k].filter(([a, v]) => String(a).trim() && String(v).trim()).map(([a, v]) => [String(a).trim(), String(v).trim()]));
      try {
        CFG = await api('api/einstellungen', 'PUT', { stellen: W.stellen, phasen: obj('phasen'), planarten: obj('planarten'), kennungen: obj('kennungen'), stichworte: obj('stichworte'), max_mb: +$('#sMb', bg).value, plot: plotLesen(bg) });
        if (!host) close(); toast('Gespeichert.'); laden();
      } catch (e) { toast(e.message, true); }
    }
  });
  const root = host || (box0 && box0.nodeType ? box0 : [...document.querySelectorAll('.modal-bg')].pop()) || document;
  const plotLesen = (r) => { const q = (x) => r.querySelector(x); if (!q('#sSaetze')) return W.plot; return { farbe: (q('[name=sFarbe]:checked') || {}).value || 'farbe', foto: q('[data-sp=foto]').checked, gefaltet: q('[data-sp=gefaltet]').checked, gelocht: q('[data-sp=gelocht]').checked, saetze: +q('#sSaetze').value || 1, lieferung: q('#sLief').value }; };
  const neuZeichnen = (bg) => { const r = bg || root; const box = r.querySelector('.set'); if (!box) return; const y = box.scrollTop; const mb = r.querySelector('#sMb'); if (mb) W.max_mb = +mb.value; W.plot = plotLesen(r); box.outerHTML = html().split('<div class="acts">')[0].replace(/^<h3>[^<]*<\/h3>/, ''); r.querySelector('.set').scrollTop = y; };
  const zuNeu = () => { const z = root.querySelector('#sZu'); if (z) z.innerHTML = zuordnung(); };
  root.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'sBsp') { bsp = t.value; zuNeu(); return; }
    if (t.dataset.zk) { W[t.dataset.zk][+t.dataset.zi][+t.dataset.zf] = t.value; if (t.dataset.zk !== 'stichworte') zuNeu(); }
  });
  root.addEventListener('change', (e) => { const t = e.target; if (t.dataset.stelle != null) { while (W.stellen.length <= +t.dataset.stelle) W.stellen.push('egal'); W.stellen[+t.dataset.stelle] = t.value; zuNeu(); } });
  root.addEventListener('click', (e) => {
    const a = e.target.closest('[data-zadd]'); if (a) { W[a.dataset.zadd].push(['', '']); neuZeichnen(); const ins = root.querySelectorAll(`[data-zk="${a.dataset.zadd}"][data-zf="0"]`); if (ins.length) ins[ins.length - 1].focus(); return; }
    const d = e.target.closest('[data-zdel]'); if (d) { W[d.dataset.zdel].splice(+d.dataset.zi, 1); neuZeichnen(); zuNeu(); }
  });
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click', async (e) => {
  const t = e.target;
  const tb = t.closest('[data-tab]'); if (tb) { tab = tb.dataset.tab; history.replaceState(null, '', '#' + tab); render(); return; }
  const so = t.closest('[data-sort]'); if (so) { const k = so.dataset.sort; S = { k, d: S.k === k ? -S.d : (k === 'datum' || k === 'versendet' ? -1 : 1) }; LS.set('sort', S); render(); return; }
  const ex = t.closest('[data-ex]'); if (ex) { const k = ex.dataset.ex; OPEN.has(k) ? OPEN.delete(k) : OPEN.add(k); render(); return; }
  if (t.id === 'selNeu') { sichtbar().forEach((p) => { const st = p.staende.find((s) => s.pdf); if (st) SEL.add(stKey(p, st)); }); render(); return; }
  if (t.id === 'selNone') { SEL.clear(); render(); return; }
  if (t.id === 'vBtn') { versandDialog(); return; }
  if (t.id === 'pBtn') { plotDialog(); return; }
  if (t.id === 'reBtn') { if (tab === 'alle') alleLaden(true); else laden(true); return; }   // Ordner jetzt neu durchsuchen (sonst Zwischenspeicher vom selben Tag)
  if (t.id === 'ordBaum') { baumDialog(); return; }
  if (t.id === 'ordMerkAlt') { try { await api('api/projekt/' + pid, 'PUT', { ordner: D.ordner }); D.gemerkt = D.ordner; renderOrd(); toast('Planordner gemerkt.'); } catch (er) { toast(er.message, true); } }
});
document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.dataset.sel) { t.checked ? SEL.add(t.dataset.sel) : SEL.delete(t.dataset.sel); bar(); return; }
  if (t.dataset.gw) {
    const key = t.dataset.gw, v = t.value.trim();
    if (v && !D.gewerke.includes(v)) D.gewerke = [...D.gewerke, v].sort((a, b) => a.localeCompare(b, 'de'));
    try { await api('api/projekt/' + pid, 'PUT', { zuordnung: { [key]: v } }); const p = D.plaene.concat(D.frei || []).find((x) => x.key === key); if (p) { p.gewerk = v; p.gewerk_quelle = v ? 'zugeordnet' : ''; } render(); } catch (er) { toast(er.message, true); }
    return;
  }
  if (t.id === 'proj') { pid = +t.value || null; LS.set('pid', pid); BPHead.projektSetzen(pid); SEL.clear(); OPEN.clear(); VL = null; head(); laden(); return; }
  if (t.id === 'fgw' || t.id === 'fph' || t.id === 'falle') { F.gw = $('#fgw').value; F.phase = $('#fph').value; F.alle = $('#falle').checked; LS.set('filter', F); render(); }
});
let qT = null;
document.addEventListener('input', (e) => { if (e.target.id === 'q') { F.q = e.target.value; LS.set('filter', F); clearTimeout(qT); qT = setTimeout(() => { render(); const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 250); } });
function head() { /* Projekt steht in der Kopfleiste (BPHead) */ }
window.bpNachVerlauf = () => BPHead.einstellungen({ bereich: 'app' });

(async () => {
  ME = await api('api/me'); applyLook(ME);
  const PC = await api('api/platform');
  await header('Pläne & Dateien', ME, PC);
  BPHead.appEinstellungen([{ key: 'plannr', label: 'Plannummerierung & Gewerke', render: (h) => setDialog(h) }]);
  [PROJ, CFG] = await Promise.all([api('api/projekte'), api('api/einstellungen')]);
  const gp = BPHead.projektId(); if (gp && PROJ.some((p) => p.id === gp)) pid = gp;   // Projekt aus der zuletzt benutzten App
  else if (pid) BPHead.projektSetzen(pid);
  if (!PROJ.some((p) => p.id === pid)) pid = (PROJ.find((p) => p.mine && !p.archived) || PROJ.find((p) => !p.archived) || {}).id || null;
  const grp = (l, f) => { const x = PROJ.filter(f); return x.length ? `<optgroup label="${l}">${x.map((p) => `<option value="${p.id}"${p.id === pid ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</optgroup>` : ''; };
  $('#proj').innerHTML = (pid ? '' : '<option value="">– Projekt wählen –</option>') + grp('Meine Projekte', (p) => p.mine && !p.archived) + grp('Weitere Projekte', (p) => !p.mine && !p.archived) + grp('Archiv', (p) => p.archived);
  projektKnopf($('#proj'));
  if (!['plaene', 'liste', 'alle'].includes(tab)) tab = 'plaene';
  if (/(?:^#|&)neu=plaene/.test(location.hash)) {   // aus der Leiste „＋ Neu“: Empfänger mitgebracht – erst Pläne ankreuzen, dann „Versenden“
    NEUMIT = BPHead.neuUebergabe() || {}; if (NEUMIT.firma) AN = NEUMIT.firma; history.replaceState(null, '', '#plaene');
    setTimeout(() => toast('Pläne ankreuzen und dann „Versenden“ – ' + (NEUMIT.firma ? `„${NEUMIT.firma}“ ist als Empfänger:in vorgewählt.` : 'die Empfänger:innen wählst du im nächsten Schritt.')), 600);
  }
  head(); laden();
})().catch((e) => toast(e.message, true));
</script>
<script src="static/plaene-ablage.js"></script>
<script src="static/plaene-alle.js"></script>
