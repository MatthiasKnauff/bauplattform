<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#84827c">
<title>Baudaten</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="static/bp.css">
<style>
.wrap{max-width:1500px;padding-bottom:5rem}
.top{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:0 0 .7rem}
.top input[type=search]{flex:1 1 280px;min-width:0;font:inherit;padding:.5rem .8rem;border-radius:999px;border:1px solid var(--line);background:var(--inp);color:var(--ink)}
.top select,.fl select,.fl input{font:inherit;padding:.35rem .5rem;border-radius:8px;border:1px solid var(--line);background:var(--inp);color:var(--ink)}
.fl{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:0 0 .8rem;font-size:.9rem;color:var(--mute)}
.fl label{display:inline-flex;gap:.3rem;align-items:center}
.fl input.kg{width:5.5rem}
.info{font-size:.85rem;color:var(--mute);margin-left:auto}
.grid{display:grid;grid-template-columns:280px minmax(0,1fr) minmax(0,520px);gap:1rem;align-items:start}
.side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.4rem 0;position:sticky;top:60px;max-height:calc(100vh - 80px);overflow:auto}
.side h3{margin:.5rem .9rem .3rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600}
.si{display:flex;gap:.5rem;align-items:center;width:100%;text-align:left;border:0;background:none;color:inherit;font:inherit;padding:.38rem .9rem;cursor:pointer;border-left:3px solid transparent;font-size:.92rem}
.si:hover{background:var(--hov)}.si.on{background:var(--hov);border-left-color:var(--y)}
.si span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si i{font-style:normal;font-size:.75rem;color:var(--mute)}
.si.sub{padding-left:1.8rem;font-size:.86rem}
.si .nr{font-variant-numeric:tabular-nums;color:var(--mute);margin-right:.3rem}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:8.5rem minmax(0,1fr) 3.2rem 9.5rem;gap:.6rem;padding:.5rem .8rem;border-bottom:1px solid var(--line);cursor:pointer;align-items:baseline}
.row{grid-template-columns:7.6rem minmax(0,1fr) 3rem 8rem 1.6rem}.row .k b{overflow-wrap:anywhere;hyphens:auto}
.kb{width:1.6rem;height:1.6rem;border-radius:50%;border:1px solid var(--line);background:none;color:var(--mute);cursor:pointer;font-size:.85rem;line-height:1;padding:0;align-self:start}
.kb:hover{border-color:var(--y);color:var(--y)}.kb.on{background:var(--y);border-color:var(--y);color:#fff}
#korbN{display:inline-block;min-width:1.2rem;padding:0 .3rem;border-radius:9px;background:var(--hov);font-size:.78rem;text-align:center}
#korbBtn.voll #korbN{background:var(--y);color:#fff}
.row:hover{background:var(--hov)}.row.on{background:var(--hov);box-shadow:inset 3px 0 0 var(--y)}
.row .c{font-size:.78rem;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .k{min-width:0}.row .k b{font-weight:500}
.row .k small{display:block;color:var(--mute);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .e{color:var(--mute);font-size:.85rem}
.row .p{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .p small{display:block;color:var(--mute);font-size:.74rem}
.star{color:var(--y)}
.det{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem;position:sticky;top:60px;max-height:calc(100vh - 80px);overflow:auto}
.det h2{font-size:1.05rem;margin:.1rem 0 .4rem;line-height:1.35}
.det .mute{font-size:.85rem}
.det pre{white-space:pre-wrap;font:inherit;font-size:.92rem;line-height:1.45;margin:.5rem 0;background:var(--inp);padding:.6rem .7rem;border-radius:8px}
.det table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.4rem 0}
.det td{padding:.25rem .3rem;border-bottom:1px solid var(--line)}.det td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.preis{display:flex;gap:.5rem;margin:.6rem 0}
.preis div{flex:1;background:var(--inp);border-radius:10px;padding:.5rem .6rem;text-align:center}
.preis div b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums}
.preis div.m{outline:2px solid var(--y)}
.preis small{color:var(--mute);font-size:.75rem}
.acts{display:flex;gap:.4rem;flex-wrap:wrap;margin:.7rem 0}
.det h4{margin:1rem 0 .3rem;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.ed label{display:block;font-size:.82rem;color:var(--mute);margin:.5rem 0 .15rem}
.ed input,.ed textarea,.ed select{width:100%;box-sizing:border-box;font:inherit;padding:.4rem .5rem;border-radius:8px;border:1px solid var(--line);background:var(--inp);color:var(--ink)}
.ed textarea{min-height:8rem}
.ed .r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.4rem}
.leer{padding:2rem 1rem;text-align:center;color:var(--mute)}
.badge{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:0 .45rem;color:var(--mute);margin-right:.3rem}
.modal:has(.ed){width:min(640px,100%)}
.modal.ed-modal{width:min(720px,100%);padding:1.1rem 1.4rem 1rem}
.ed-modal h3{display:flex;align-items:baseline;gap:.6rem}
.ed-code{font-size:.8rem;font-weight:500;color:var(--mute);font-family:ui-monospace,Menlo,Consolas,monospace}
.ed section{border-top:1px solid var(--line);padding:.7rem 0 .4rem}
.ed section:first-child{border-top:0;padding-top:0}
.ed-h{font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-bottom:.15rem}
.ed-h small{text-transform:none;letter-spacing:0;font-weight:400;margin-left:.3rem}
.ed label small{color:var(--mute);font-weight:400;margin-left:.3rem;opacity:.85}
.ed input:focus,.ed textarea:focus,.ed select:focus{outline:2px solid var(--y);outline-offset:-1px;border-color:transparent}
.ed textarea{resize:vertical;line-height:1.45}
.ed .eur{position:relative}.ed .eur input{padding-right:1.6rem;text-align:right;font-variant-numeric:tabular-nums}
.ed .eur span{position:absolute;right:.55rem;top:50%;transform:translateY(-50%);color:var(--mute);font-size:.85rem;pointer-events:none}
.ed .ep .mid input{font-weight:600;border-color:var(--y)}
.ed-tip{margin:.35rem 0 0;font-size:.8rem;color:var(--mute)}
@media (max-width:560px){.ed .r3{grid-template-columns:1fr 1fr}.ed .r3>div:last-child:nth-child(3){grid-column:1/-1}.ed .ep{grid-template-columns:1fr 1fr 1fr}.ed .ep>div:last-child:nth-child(3){grid-column:auto}}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}.tbl td{padding:.2rem .3rem}.tbl input{width:100%;box-sizing:border-box}
@media (max-width:1200px){.grid{grid-template-columns:240px minmax(0,1fr)}.det{grid-column:1/-1;position:static;max-height:none}}
@media (max-width:760px){.grid{grid-template-columns:1fr}.side{position:static;max-height:260px}.row{grid-template-columns:minmax(0,1fr) 7.5rem 1.8rem}.row .c,.row .e{display:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <select id="kat" aria-label="Katalog"></select>
    <input type="search" id="q" placeholder="Suchen – z. B. „Kalksand 17,5“, „Fliesen 60x60“, „Wärmepumpe“ oder Code …" autocomplete="off">
    <button class="btn sm" id="neuBtn" title="Neue eigene Position anlegen">＋ Eigene Position</button>
    <button class="btn sm" id="korbBtn" title="Gesammelte Positionen – in Ausschreibung (Kopierquelle) und Baukosten übernehmen">Korb <span id="korbN">0</span></button>
    <button class="btn sm" id="csvBtn" title="Gefilterte Positionen für Excel speichern">⤓ Excel (CSV)</button>
    <button class="btn sm" id="setBtn" title="Baupreisindex, Regionalfaktor und Verrechnungslöhne">⚙ Preise</button>
    <button class="btn sm" id="impBtn" hidden title="Katalog importieren (z. B. Sirados als GAEB)">⤒ Import</button>
  </div>
  <div class="fl">
    <label>KG <input class="kg" id="kg" placeholder="z. B. 331" inputmode="numeric"></label>
    <label>Einheit <select id="einh"><option value="">alle</option></select></label>
    <label>Genauigkeit <select id="gen"><option value="">alle</option><option>A</option><option>B</option><option>C</option></select></label>
    <label><input type="checkbox" id="fav"> nur Favoriten</label>
    <span class="info" id="info"></span>
  </div>
  <div class="grid">
    <aside class="side" id="side" aria-label="Leistungsbereiche"></aside>
    <section><div class="list" id="list" aria-live="polite"></div><div id="mehr"></div></section>
    <aside class="det" id="det"><div class="leer">Position anklicken – Langtext, Preisspanne, Kalkulation und eigene Preise.</div></aside>
  </div>
</main>
<script src="static/bp.js"></script>
<script>
const LS = { get(k, d) { try { const v = localStorage.getItem('bd.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('bd.' + k, JSON.stringify(v)); } catch { /* egal */ } } };
const F = { katalog: LS.get('katalog', 'gk3'), lb: '', gruppe: '', q: '', kg: '', einheit: '', genauigkeit: '', fav: false };
let S = null, L = [], GES = 0, N = 100, SEL = null, GR = {}, tok = 0;
const eur = (v) => (v == null ? '–' : Number(v).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €');
const num = (v, d = 2) => (v == null ? '' : Number(v).toLocaleString('de-DE', { maximumFractionDigits: d }));
const GEN = { A: 'Standardleistung (−15 % / +20 %)', B: 'mit Produkt-/Mengeneinfluss (−22 % / +30 %)', C: 'stark produkt-/orts-/mengenabhängig (−32 % / +50 %)' };

function params(extra = {}) {
  const p = new URLSearchParams();
  for (const k of ['katalog', 'lb', 'gruppe', 'q', 'kg', 'einheit', 'genauigkeit']) if (F[k]) p.set(k, F[k]);
  if (F.fav) p.set('fav', '1');
  for (const [k, v] of Object.entries(extra)) p.set(k, v);
  return p.toString();
}
async function start() {
  api('api/baudaten/korb').then((r) => { KORB = new Set(r.map((x) => x.id)); korbZeigen(); }).catch(() => {});
  S = await api('api/start?katalog=' + encodeURIComponent(F.katalog));
  if (!S.kataloge.some((k) => k.key === F.katalog)) { F.katalog = 'gk3'; LS.set('katalog', 'gk3'); S = await api('api/start?katalog=gk3'); }
  const aus = new Set(LS.get('ausgeblendet', []));   // in den Einstellungen ausgeblendete Kataloge (je Browser)
  $('#kat').innerHTML = S.kataloge.filter((k) => !aus.has(k.key) || k.key === F.katalog).map((k) => `<option value="${esc(k.key)}"${k.key === F.katalog ? ' selected' : ''}>${esc(k.name)} (${k.n.toLocaleString('de-DE')})</option>`).join('');
  $('#einh').innerHTML = '<option value="">alle</option>' + S.einheiten.map((e) => `<option${e === F.einheit ? ' selected' : ''}>${esc(e)}</option>`).join('');
  $('#impBtn').hidden = !S.admin;
  seite(); laden();
}
/* Einstellungen → Kataloge: alle Kataloge anzeigen, ein-/ausblenden, hinzufügen (sirAdos *.ava, GAEB, LV), umbenennen, löschen */
const KAT_ART = { katalog: 'Bauplattform', eigen: 'eigene Positionen', import: 'GAEB / LV', avakatalog: 'sirAdos / Ausschreibung' };
function katalogeEinstellungen(host) {
  const aus = new Set(LS.get('ausgeblendet', []));
  const mb = (k) => k.art === 'import' || k.art === 'avakatalog';
  host.innerHTML = `<p class="bph-mu">Alle Kataloge der Baudaten. Ausgeblendete erscheinen nicht in der Auswahl oben (gilt für diesen Browser). sirAdos-Kataloge (*.ava) stehen auch in der Ausschreibung als Kopierquelle zur Verfügung.</p>
    ${S.kataloge.map((k) => `<div style="border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;margin:.45rem 0;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap">
      <label style="display:flex;gap:.4rem;align-items:center;margin:0" title="In der Katalogauswahl anzeigen"><input type="checkbox" data-kzeig="${esc(k.key)}"${aus.has(k.key) ? '' : ' checked'} style="width:auto"></label>
      <div style="flex:1;min-width:13rem"><b>${esc(k.name)}</b><br><span class="bph-mu" style="margin:0">${esc(KAT_ART[k.art] || k.art)} · ${k.n.toLocaleString('de-DE')} ${k.key === 'gk3e' ? 'Elemente' : 'Positionen'}${k.preisstand ? ' · Preisstand ' + esc(k.preisstand) : ''}${k.index_basis && k.key !== 'gk3' ? ' · Index ' + String(k.index_basis).replace('.', ',') : ''}${k.lizenz ? ' · ' + esc(k.lizenz) : ''}</span></div>
      ${S.admin && mb(k) ? `<button type="button" class="bph-btn" data-kren="${esc(k.key)}">Umbenennen</button><button type="button" class="bph-btn" data-kweg="${esc(k.key)}">Löschen</button>` : ''}</div>`).join('')}
    ${S.admin ? `<div class="bph-row" style="gap:.5rem;flex-wrap:wrap;margin-top:.7rem;align-items:center">
      <label class="bph-btn pri" style="cursor:pointer">＋ sirAdos-Katalog (*.ava) …<input type="file" id="kAva" accept=".ava,.mdb,.accdb" hidden></label>
      <button type="button" class="bph-btn" data-kgaeb>＋ GAEB-Datei oder LV …</button><span class="bph-mu" id="kMsg" style="margin:0"></span></div>
      <p class="bph-mu">sirAdos Positionen oder Elemente: dieselbe Datei noch einmal einlesen ersetzt den Katalog (neuer Preisstand). Die Kataloge bleiben nur in der Datenbank des Büros – bitte die Lizenz des Anbieters beachten.</p>` : '<p class="bph-mu">Kataloge hinzufügen und löschen kann die Verwaltung.</p>'}`;
  const neu = async () => { await start(); katalogeEinstellungen(host); };
  host.onchange = (e) => {
    const z = e.target.closest('[data-kzeig]'); if (!z) return;
    const a = new Set(LS.get('ausgeblendet', [])); if (z.checked) a.delete(z.dataset.kzeig); else a.add(z.dataset.kzeig); LS.set('ausgeblendet', [...a]); start();
  };
  host.onclick = async (e) => {
    const r = e.target.closest('[data-kren]'), w = e.target.closest('[data-kweg]');
    if (e.target.closest('[data-kgaeb]')) { importieren(); return; }
    const k = S.kataloge.find((x) => x.key === (r || w || {}).dataset?.[r ? 'kren' : 'kweg']); if (!k) return;
    const ava = k.art === 'avakatalog' ? k.key.replace(/^ava/, '') : null;
    try {
      if (r) {
        const n = await bpEingabe('Name des Katalogs', k.name); if (!n || !n.trim()) return;
        if (ava) await api(`../ava/api/katalog/${ava}`, 'PUT', { name: n.trim() }); else await api('api/katalog/' + encodeURIComponent(k.key), 'PUT', { name: n.trim() });
      } else {
        if (!(await bpFrage(`Katalog „${k.name}“ mit ${k.n.toLocaleString('de-DE')} Positionen löschen? Bereits übernommene Positionen in LVs und Baukosten bleiben.`))) return;
        if (ava) await api(`../ava/api/katalog/${ava}`, 'DELETE'); else await api('api/katalog/' + encodeURIComponent(k.key), 'DELETE');
        if (F.katalog === k.key) { F.katalog = 'gk3'; LS.set('katalog', 'gk3'); }
      }
      await neu(); toast(r ? 'Umbenannt' : 'Gelöscht');
    } catch (er) { toast(er.message, true); }
  };
  const inp = host.querySelector('#kAva');
  if (inp) inp.onchange = async () => {   // wie in der Ausschreibung: gepackt und in Teilen unter 1 MB an die Ausschreibung (gleiche Datenbank)
    const f = inp.files[0]; if (!f) return; const m = host.querySelector('#kMsg'); m.textContent = `Packe „${f.name}“ (${Math.round(f.size / 1048576)} MB) …`;
    try {
      const gz = new Uint8Array(await new Response(f.stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
      const T = 900 * 1024, n = Math.max(1, Math.ceil(gz.length / T)), id = [...crypto.getRandomValues(new Uint8Array(8))].map((b) => b.toString(16).padStart(2, '0')).join('');
      let j = null;
      for (let i = 0; i < n; i++) {
        m.textContent = i < n - 1 ? `Lade hoch … ${Math.round(i / n * 100)} %` : 'Lese den Katalog ein … (bis zu einer halben Minute)';
        const rr = await fetch(`../ava/api/katalog/teil?id=${id}&i=${i}&n=${n}&name=${encodeURIComponent(f.name)}`, { method: 'POST', body: gz.subarray(i * T, (i + 1) * T), headers: { 'Content-Type': 'application/octet-stream' }, credentials: 'same-origin' });
        const txt = await rr.text(); try { j = JSON.parse(txt); } catch { throw new Error(`Der Server hat den Teil ${i + 1} von ${n} abgelehnt (${rr.status}).`); }
        if (!rr.ok) throw new Error(j.error || 'Fehler ' + rr.status);
      }
      const x = (j.kataloge || []).find((y) => y.id === j.neu);
      toast(x ? `„${x.name}“ eingelesen: ${(x.n_pos || 0).toLocaleString('de-DE')} ${x.art === 'elemente' ? 'Elemente' : 'Positionen'}.` : 'Katalog eingelesen.');
      await neu();
    } catch (er) { m.textContent = er.message; }
  };
}
async function vorbemerkung(k) {
  let v; try { v = await api('api/vorbemerkungen?key=' + encodeURIComponent(k)); } catch (e) { toast(e.message, true); return; }
  const bg = modalBox(`<h3>Vorbemerkungen ${esc(/^\d/.test(v.key) ? v.key + ' ' : '')}${esc(v.titel)}</h3><pre style="white-space:pre-wrap;font:inherit;font-size:.92rem;max-height:62vh;overflow:auto">${esc(v.text)}</pre>
    <p class="mute" style="font-size:.82rem">Eigene, kompakte Texte – Angaben in [eckigen Klammern] je Projekt ergänzen. In der Ausschreibung: LV → Vorbemerkungen → „aus den Baudaten einfügen“.</p>
    <div style="display:flex;gap:.4rem;justify-content:flex-end"><button class="btn" data-m="copy">⧉ Kopieren</button><button class="btn pri" data-m="x">Schließen</button></div>`, async (m, bg, close) => {
    if (m === 'copy') { try { await navigator.clipboard.writeText(v.titel + '\n\n' + v.text); toast('Kopiert.'); } catch { toast('Kopieren nicht möglich.', true); } return; }
    close();
  });
  bg.querySelector('.modal').style.width = 'min(760px,100%)';
}
function seite() {
  const E = S.einstellungen, kat = S.kataloge.find((k) => k.key === F.katalog) || {};
  let h = `<h3>${esc(kat.name || '')}</h3><button type="button" class="si${!F.lb ? ' on' : ''}" data-lb=""><span>Alle Leistungsbereiche</span><i>${(kat.n || 0).toLocaleString('de-DE')}</i></button>`;
  for (const l of S.lbs) {
    h += `<button type="button" class="si${F.lb === l.nr ? ' on' : ''}" data-lb="${esc(l.nr)}"><span><span class="nr">${esc(l.nr)}</span>${esc(l.name || '')}</span><i>${l.n.toLocaleString('de-DE')}</i></button>`;
    if (F.lb === l.nr && F.katalog === 'gk3') h += `<button type="button" class="si sub" data-vb="${esc(l.nr)}" title="Kompakte Technische Vorbemerkungen zu diesem Leistungsbereich – in der Ausschreibung unter „Vorbemerkungen“ einfügbar"><span>📄 Vorbemerkungen</span><i></i></button>`;
    if (F.lb === l.nr && GR[l.nr]) h += GR[l.nr].map((g) => `<button type="button" class="si sub${F.gruppe === g.nr ? ' on' : ''}" data-gr="${esc(g.nr)}"><span>${esc(g.name || g.nr)}</span><i>${g.n}</i></button>`).join('');
  }
  h += `<h3>Preise</h3><p class="mute" style="margin:0 .9rem .6rem;font-size:.8rem">Index ${num(E.index_aktuell, 1)} (Basis ${num(E.index_basis, 1)}, 2021 = 100)<br>${esc(E.faktor_name)} × ${num(E.faktor, 3)}${kat.key !== 'gk3' ? `<br>Katalog: Stand ${esc(kat.preisstand || '–')}, ${kat.index_basis ? 'Index ' + num(kat.index_basis, 1) + (kat.index_auto ? ' (aus dem Preisstand)' : '') + ' → fortgeschrieben' : 'ohne Index – nur Faktor'}` : ''}${kat.lizenz ? '<br>' + esc(kat.lizenz) : ''}</p>`;
  $('#side').innerHTML = h;
}
async function laden() {
  const my = ++tok;
  try {
    const r = await api('api/suche?' + params({ n: N }));
    if (my !== tok) return; L = r.positionen; GES = r.gesamt; liste();
  } catch (e) { if (my === tok) $('#list').innerHTML = `<div class="leer">${esc(e.message)}</div>`; }
}
function liste() {
  $('#info').textContent = `${GES.toLocaleString('de-DE')} Position${GES === 1 ? '' : 'en'} · Preise netto, umgerechnet auf heute`;
  if (!L.length) { $('#list').innerHTML = `<div class="leer">${F.q || F.kg || F.einheit || F.fav ? 'Nichts gefunden – Suche oder Filter ändern.' : 'Dieser Katalog ist leer.'}</div>`; $('#mehr').innerHTML = ''; return; }
  $('#list').innerHTML = L.map((x) => `<div class="row${SEL && SEL.id === x.id ? ' on' : ''}" data-id="${x.id}">
    <span class="c">${esc(x.code)}</span>
    <span class="k"><b>${x.favorit ? '<span class="star">★</span> ' : ''}${esc(x.bez || x.kurz)}</b><small>${esc([x.gruppe_name || x.titel, x.kg ? 'KG ' + x.kg : ''].filter(Boolean).join(' · '))}</small></span>
    <span class="e">${esc(x.einheit)}</span>

  const imp = S.kataloge.filter((k) => k.art === 'import'), ava = S.kataloge.filter((k) => k.art === 'avakatalog');
  modalBox(`<h3>Katalog importieren</h3><div class="ed">
    <p class="mute" style="font-size:.85rem"><b>sirAdos-Kataloge (*.ava, Positionen und Elemente)</b> werden wie bisher in „Ausschreibung &amp; Abrechnung“ unter ⚙ → Positionskatalog eingelesen und erscheinen hier automatisch als eigene Kataloge. Hier zusätzlich: weitere Kataloge als GAEB DA XML (X81–X86) oder ein vorhandenes LV übernehmen. Die Daten bleiben in der Datenbank des Büros; bitte die Lizenz des Anbieters beachten.</p>
    <label>Name des Katalogs</label><input id="iN" placeholder="z. B. Sirados Neubau 2026" list="iKat"><datalist id="iKat">${imp.map((k) => `<option value="${esc(k.name)}">`).join('')}</datalist>
    <label>GAEB-Datei</label><input type="file" id="iD" accept=".x81,.x82,.x83,.x84,.x85,.x86,.xml,.X81,.X83,.X84">
    <label>… oder LV aus der Ausschreibung</label><select id="iL"><option value="">–</option>${lvs.map((l) => `<option value="${l.id}">${esc([l.projekt, l.nr, l.name].filter(Boolean).join(' · '))}</option>`).join('')}</select>
    <div class="r3"><div><label>Preisstand (JJJJ-MM)</label><input id="iP" placeholder="2026-01"></div><div><label>Index zum Preisstand</label><input id="iI" placeholder="z. B. 135,8"></div><div><label>Lizenzhinweis</label><input id="iZ" placeholder="z. B. Sirados, 3 Plätze"></div></div>
    <label><input type="checkbox" id="iR" checked style="width:auto"> vorhandenen Katalog gleichen Namens ersetzen</label>
    ${imp.length ? `<label>Importierte Kataloge</label><table class="tbl">${imp.map((k) => `<tr><td>${esc(k.name)} · ${k.n.toLocaleString('de-DE')} Pos.${k.preisstand ? ' · ' + esc(k.preisstand) : ''}</td><td style="width:5rem"><button class="btn sm" data-m="del:${esc(k.key)}">Löschen</button></td></tr>`).join('')}</table>` : ''}
    ${ava.length ? `<label>Kataloge der Ausschreibung – Index zum Preisstand (für die Umrechnung auf heute; leer = aus dem Preisstand)</label><table class="tbl">${ava.map((k) => `<tr><td>${esc(k.name)} · ${k.n.toLocaleString('de-DE')} Pos.${k.preisstand ? ' · Stand ' + esc(k.preisstand) : ''}</td><td style="width:6.5rem"><input data-avaidx="${esc(k.key)}" value="${k.index_auto ? '' : (k.index_basis ?? '')}" placeholder="${k.index_basis ? String(k.index_basis).replace('.', ',') : '–'}"></td></tr>`).join('')}</table>` : ''}
  </div><div class="acts" style="justify-content:flex-end"><button class="btn" data-m="x">Schließen</button><button class="btn pri" data-m="ok">Einlesen / Übernehmen</button></div>`, async (m, bg, close, btn) => {
    if (m === 'x') return close();
    if (m.startsWith('del:')) { if (!(await bpFrage('Katalog mit allen Positionen löschen?'))) return; try { await api('api/katalog/' + encodeURIComponent(m.slice(4)), 'DELETE'); close(); start(); toast('Gelöscht'); } catch (e) { toast(e.message, true); } return; }
    const name = bg.querySelector('#iN').value.trim(), f = bg.querySelector('#iD').files[0], lv = bg.querySelector('#iL').value;
    const idx = [...bg.querySelectorAll('[data-avaidx]')].filter((i) => i.value.trim() !== (i.defaultValue || '').trim());
    if (idx.length && !name && !f && !lv) {   // nur die Indexwerte der Ausschreibungs-Kataloge geändert
      try { for (const i of idx) await api('api/katalog/' + encodeURIComponent(i.dataset.avaidx), 'PUT', { index_basis: i.value.trim() ? +i.value.trim().replace(',', '.') : null }); close(); await start(); toast('Index übernommen'); } catch (e) { toast(e.message, true); }
      return;
    }
    if (!name) return toast('Bitte einen Namen angeben.', true);
    if (!f && !lv) return toast('Bitte eine GAEB-Datei oder ein LV wählen.', true);
    const z = (v) => String(v).trim().replace(',', '.');
    const meta = { name, preisstand: bg.querySelector('#iP').value.trim(), index_basis: z(bg.querySelector('#iI').value), lizenz: bg.querySelector('#iZ').value.trim(), ersetzen: bg.querySelector('#iR').checked ? '1' : '0' };
    btn.disabled = true; btn.textContent = 'Liest ein …';
    try {
      let r;
      if (f) {
        const fd = new FormData(); fd.append('datei', f); for (const [k, v] of Object.entries(meta)) fd.append(k, v);
        const res = await fetch('api/import', { method: 'POST', body: fd }); r = await res.json().catch(() => ({})); if (!res.ok) throw new Error(r.error || res.statusText);
      } else r = await api('api/import', 'POST', { ...meta, lv_id: +lv });
      close(); F.katalog = r.key; LS.set('katalog', r.key); F.lb = ''; F.gruppe = ''; await start(); toast(r.hinweis);
    } catch (e) { btn.disabled = false; btn.textContent = 'Einlesen'; toast(e.message, true); }
  });
}

document.addEventListener('click', async (e) => {
  const t = e.target;
  const vb = t.closest('[data-vb]'); if (vb) { vorbemerkung(vb.dataset.vb); return; }
  const lb = t.closest('[data-lb]'); if (lb) { F.lb = lb.dataset.lb; F.gruppe = ''; N = 100; if (F.lb && !GR[F.lb]) { try { GR[F.lb] = await api(`api/gruppen?katalog=${encodeURIComponent(F.katalog)}&lb=${encodeURIComponent(F.lb)}`); } catch { GR[F.lb] = []; } } seite(); laden(); return; }
  const gr = t.closest('[data-gr]'); if (gr) { F.gruppe = F.gruppe === gr.dataset.gr ? '' : gr.dataset.gr; N = 100; seite(); laden(); return; }
  const kb = t.closest('[data-korb]'); if (kb) { const id = +kb.dataset.korb; korbAendern(KORB.has(id) ? { weg: [id] } : { dazu: [id] }); return; }
  if (t.closest('[data-korbd]') && SEL) { korbAendern(KORB.has(SEL.id) ? { weg: [SEL.id] } : { dazu: [SEL.id] }); return; }
  if (t.closest('#korbBtn')) { korbDialog(); return; }
  const row = t.closest('.row[data-id]'); if (row) { zeigen(+row.dataset.id); return; }
  if (t.closest('[data-mehr]')) { N += 200; laden(); return; }
  if (t.closest('#csvBtn')) { location.href = 'api/export.csv?' + params(); return; }
  if (t.closest('#setBtn')) { einstellungen(); return; }
  if (t.closest('#impBtn')) { importieren(); return; }
  if (t.closest('#neuBtn')) { try { SEL = await api('api/position', 'POST', {}); detail(); bearbeiten(); start(); } catch (er) { toast(er.message, true); } return; }
  if (!SEL) return;
  if (t.closest('[data-copy]')) {
    const s = `${SEL.kurz}\n\n${SEL.lang_voll || ''}\n\nEinheit: ${SEL.einheit}${SEL.ep_mittel_akt != null ? ` · EP ca. ${eur(SEL.ep_mittel_akt)} netto` : ''}`;
    try { await navigator.clipboard.writeText(s); toast('In die Zwischenablage kopiert'); } catch { toast('Kopieren nicht möglich', true); } return;
  }
  if (t.closest('[data-fav]')) { SEL = await api('api/position/' + SEL.id, 'PUT', { favorit: !SEL.favorit }); detail(); laden(); return; }
  if (t.closest('[data-aktiv]')) {
    const id = SEL.id, alt = !!SEL.aktiv, nm = SEL.kurz;
    SEL = await api('api/position/' + id, 'PUT', { aktiv: !alt }); detail(); laden();
    rueckgaengig(`„${nm}“ ${alt ? 'ausgeblendet' : 'wieder eingeblendet'}`, async () => { const r = await api('api/position/' + id, 'PUT', { aktiv: alt }); if (SEL && SEL.id === id) { SEL = r; detail(); } laden(); });
    return;
  }
  if (t.closest('[data-eigen]')) { try { SEL = await api('api/position', 'POST', { von: SEL.id }); toast('Als eigene Position angelegt (Katalog „Eigene Positionen“)'); detail(); bearbeiten(); start(); } catch (er) { toast(er.message, true); } return; }
  if (t.closest('[data-edit]')) { bearbeiten(); return; }
  if (t.closest('[data-del]')) { if (!(await bpFrage('Eigene Position löschen?'))) return; await api('api/position/' + SEL.id, 'DELETE'); SEL = null; $('#det').innerHTML = '<div class="leer">Gelöscht.</div>'; laden(); start(); return; }
  if (t.closest('[data-pneu]')) {
    const ep = +String($('#pEp').value).trim().replace(/\./g, '').replace(',', '.');
    if (!ep) return toast('Bitte einen Einheitspreis eingeben.', true);
    const firma = $('#pFi').value.trim(), b = { ep, firma, project_id: (window.BPHead && BPHead.projekt && BPHead.projekt.id) || null };
    if (firma && FIRMEN && !FIRMEN.some((f) => f.name.toLowerCase() === firma.toLowerCase())) {   // unbekannte Firma → in den Adressen anlegen?
      const gw = await firmaNeuFragen(firma); if (gw === null) return;
      if (gw !== false) { b.neue_firma = true; b.gewerk = gw; }
    }
    try { SEL = await api(`api/position/${SEL.id}/preis`, 'POST', b); if (b.neue_firma) { FIRMEN = null; toast(`„${firma}“ in den Adressen angelegt`); } detail(); } catch (er) { toast(er.message, true); } return;
  }
  const pw = t.closest('[data-pweg]'); if (pw) {
    const id = SEL.id, p = (SEL.preise || []).find((x) => x.id === +pw.dataset.pweg);   // alten Eintrag merken
    try { SEL = await api('api/preis/' + pw.dataset.pweg, 'DELETE'); detail(); } catch (er) { toast(er.message, true); return; }
    if (p) rueckgaengig(`Preis ${eur(p.ep)}${p.firma ? ' (' + p.firma + ')' : ''} gelöscht`, async () => {
      const r = await api(`api/position/${id}/preis`, 'POST', { ep: p.ep, datum: p.datum, firma: p.firma, menge: p.menge, notiz: p.notiz, project_id: p.project_id });
      if (SEL && SEL.id === id) { SEL = r; detail(); }
    });
  }
});
$('#kat').addEventListener('change', (e) => { F.katalog = e.target.value; LS.set('katalog', F.katalog); F.lb = ''; F.gruppe = ''; GR = {}; N = 100; start(); });
for (const [id, k] of [['einh', 'einheit'], ['gen', 'genauigkeit']]) $('#' + id).addEventListener('change', (e) => { F[k] = e.target.value; N = 100; laden(); });
$('#fav').addEventListener('change', (e) => { F.fav = e.target.checked; laden(); });
let qT = 0;
for (const [id, k] of [['q', 'q'], ['kg', 'kg']]) $('#' + id).addEventListener('input', (e) => { clearTimeout(qT); qT = setTimeout(() => { F[k] = e.target.value.trim(); N = 100; laden(); }, 300); });

(async () => {
  const ME = await api('api/me'); applyLook(ME);
  const PC = await api('api/platform');
  await header('Baudaten', ME, PC);
  await start();
  if (window.BPHead && BPHead.appEinstellungen) BPHead.appEinstellungen([
    { key: 'kataloge', label: 'Kataloge', render: (h) => katalogeEinstellungen(h) },
    { key: 'preise', label: 'Preise, Index & Löhne', text: 'Baupreisindex, Regionalfaktor und Verrechnungslöhne', open: () => einstellungen() }]);
})().catch((e) => toast(e.message, true));
</script>
</body>
