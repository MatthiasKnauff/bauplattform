<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#84827c">
<title>Verwaltung – Bauplattform</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="static/bp.css">
<style>
.bar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.9rem}
.bar .fill{flex:1}
.bar input[type=search]{min-width:220px}
td .acts{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:flex-end}
td.r{text-align:right}
tr.off td{opacity:.55}
tr.off td:last-child{opacity:1}
.appchk{display:flex;gap:.8rem;flex-wrap:wrap}
.appchk label{display:flex;gap:.35rem;align-items:center;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.8rem}
.kv{display:flex;justify-content:space-between;gap:1rem;padding:.35rem 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600;text-align:right}
.kv small{text-align:right;white-space:nowrap}
.svc{display:flex;align-items:center;gap:.2rem}
.dot{flex:none}
.svc small{color:var(--mute)}
.note{background:var(--hov);border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem;color:var(--mute);margin-top:1rem;font-size:.92rem}
.pc{display:flex;flex-wrap:wrap;gap:.3rem}
.pc .pill{cursor:default}
.pc .pill.no{border-style:dashed}
.pn small{display:block;color:var(--mute);font-size:.82rem}
.lk{display:flex;flex-direction:column;gap:.4rem;margin:.4rem 0}
.lk a,.lk button{justify-content:flex-start}
.dl{display:flex;flex-direction:column;gap:.5rem;margin:.6rem 0}
.dl label{display:flex;gap:.6rem;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;cursor:pointer}
.dl label small{display:block;color:var(--mute)}
.st{margin-bottom:1rem}
.st h2{margin:0 0 .3rem}
.st>p.mute{margin:0 0 .9rem;font-size:.9rem}
.st-row{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.45rem 0}
.st-row>span{min-width:220px;font-weight:500}
.sw{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.sw button,.sw label{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:0 0 0 1px var(--line);position:relative;overflow:hidden;cursor:pointer}
.sw .on{border-color:var(--ink)}
.sw label{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.st-k{border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem;margin-top:.7rem}
.st-kh{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.st-kh .pill{margin-left:auto}.st-sw{flex:none}.st-sw button{padding:.25rem .8rem}
.st-off{background:color-mix(in srgb,var(--line) 25%,transparent)}.st-off>:not(.st-kh){opacity:.45}.st-off .st-kh b{opacity:.6}
.st-g{display:grid;grid-template-columns:1.4fr 1fr;gap:.6rem 1rem;margin-top:.6rem}
.st-g label{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem;color:var(--mute)}
.st-g input,.st-g select{color:var(--ink);font-size:.95rem}
.st-a{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.6rem}
.st-r{font-size:.85rem}
@media (max-width:640px){.st-g{grid-template-columns:1fr}.st-row>span{min-width:0}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--card)}
.seg button{border-radius:999px;padding:.35rem .9rem;color:var(--mute);font-size:.9rem;white-space:nowrap}
.seg button.on{background:var(--y);color:var(--on);font-weight:600}
.plist{display:flex;flex-direction:column;gap:.5rem}
.prow{display:grid;grid-template-columns:minmax(220px,1.3fr) minmax(200px,1.5fr) auto;gap:.6rem 1rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem}
.prow:hover{border-color:color-mix(in srgb,var(--y) 45%,var(--line))}
.prow.arch{opacity:.7}
.pmain b{font-size:1rem}
.pmain small{display:block;color:var(--mute);font-size:.84rem;margin-top:.1rem}
.pmain small.who{font-size:.78rem}
.papps{display:flex;flex-wrap:wrap;gap:.35rem}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:.15rem .6rem;font-size:.8rem;color:var(--ink);background:var(--hov);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.bt{border-color:color-mix(in srgb,var(--ok) 60%,var(--line))}
.chip.no{border-style:dashed;border-color:var(--red);color:var(--red);background:transparent;cursor:pointer}
.pact{display:flex;gap:.4rem;justify-content:flex-end}
.btn.ic{padding:.3rem .6rem;font-size:1.05rem;line-height:1}
.pmenu{position:fixed;z-index:95;background:var(--card2);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;flex-direction:column;padding:.25rem 0;min-width:220px}
.pmenu button{text-align:left;color:var(--ink);padding:.6rem 1rem;border-radius:0}
.pmenu button:hover{background:var(--hov)}
.pmenu .dn{color:var(--red)}
.pf-h{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.9rem;flex-wrap:wrap}
.pf{display:grid;grid-template-columns:140px 1fr;gap:.55rem .8rem}
.pf label{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem;color:var(--mute)}
.pf label.w{grid-column:1/-1}
.mtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.6rem;margin-bottom:1rem}
.mtile{display:grid;grid-template-columns:40px minmax(0,1fr);grid-template-rows:auto auto;column-gap:.7rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.6rem .75rem;color:var(--ink);text-decoration:none;transition:border-color .15s,transform .15s}
.mtile:hover{border-color:var(--y);transform:translateY(-1px)}
.mtile .ic{grid-row:1/3;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--hov);color:var(--y)}
.mtile .ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mtile b{font-size:1rem;line-height:1.2}
.mtile .d{color:var(--mute);font-size:.8rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtile.ok .d{color:#2f9e5a}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.5rem;margin:.2rem 0 .8rem}
.ptile{display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.55rem .75rem;color:var(--ink);font:inherit;cursor:pointer}
.ptile span{color:var(--mute);font-size:.8rem}
.ptile.on{border-color:var(--y);box-shadow:inset 0 0 0 1px var(--y)}
.ptile.on b::after{content:' ✓';color:var(--y)}
details.hilfe{margin-top:.7rem;font-size:.85rem;color:var(--mute)}
details.hilfe summary{cursor:pointer;color:var(--ink);font-weight:600}
details.hilfe p{margin:.4rem 0 0}
.sf{display:grid;grid-template-columns:1fr 1fr;gap:.6rem 1rem}
.sf label{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem;color:var(--mute)}
.sf label.w{grid-column:1/-1}
.sf input,.sf select{color:var(--ink);font-size:.95rem}
@media (max-width:640px){.sf{grid-template-columns:1fr}}
.pf input{color:var(--ink);font-size:1rem}
.pf-sec{margin:1rem 0 .4rem;font-weight:600;font-size:.92rem}
.pf-sec .mute{font-weight:400;font-size:.82rem}
.pf-users{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.3rem .8rem;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem}
.pf-users label{display:flex;gap:.45rem;align-items:center;font-size:.92rem}
.pf-users label.off{opacity:.55}
.pf-users small{color:var(--mute);font-size:.72rem;white-space:nowrap}
@media (max-width:820px){.prow{grid-template-columns:1fr}.pact{justify-content:flex-start}}
@media (max-width:760px){.hide-s{display:none}}
/* eingebettet im Einstellungsfenster (⚙ → Büro): nur die Einstellungen, ohne Kopfleiste, Reiter und Unternavigation */
html.embed .bph,html.embed #tabs,html.embed .stnav{display:none!important}
html.embed .wrap{padding:.6rem .2rem 2rem;max-width:none}
html.embed body{background:transparent}
</style>
</head>
<body>
<nav class="tabs" id="tabs"></nav>
<main class="wrap" id="main"></main>
<script src="static/bp.js"></script>
<script>
// Büro-Einstellungen: jetzt unter ⚙ → Büro in jeder App (hier eingebettet über ?einbetten=1); die Adressen #einstellungen… gelten weiter
const EMBED = new URLSearchParams(location.search).has('einbetten');
if (EMBED) document.documentElement.classList.add('embed');
const TABS = [['projekte', 'Projekte'], ['users', 'Benutzer & Rechte'], ['sessions', 'Angemeldet'], ['system', 'System']];
let tab = (location.hash || (EMBED ? '#einstellungen' : '#projekte')).slice(1), me = null, data = {};
if (tab.startsWith('einstellungen-')) { data.stab = tab.slice(14); tab = 'einstellungen'; }
if (tab === 'status' || tab === 'audit') { data.sys = tab === 'audit' ? 'protokoll' : 'health'; tab = 'system'; }   // alte Lesezeichen
const SYS = [['health', 'Server-Status'], ['protokoll', 'Protokoll']];
const sysNav = () => `<div class="bar" style="margin-bottom:1.2rem">${SYS.map(([k, l]) => `<button class="btn sm ${k === (data.sys || 'health') ? 'pri' : ''}" data-a="sys" data-sys="${k}">${l}</button>`).join('')}</div>`;
const ago = (t) => { if (!t) return '–'; const s = Date.now() / 1000 - t; return s < 90 ? 'gerade eben' : s < 3600 ? `vor ${Math.round(s / 60)} Min.` : s < 86400 ? `vor ${Math.round(s / 3600)} Std.` : new Date(t * 1000).toLocaleDateString('de-DE'); };
function renderTabs() {
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab ${k === tab ? 'on' : ''}" data-tab="${k}">${l}</button>`).join('')
    + `<span style="flex:1"></span><button class="tab" data-buero title="Firma & Logo, Ablage, Mailserver, KI, Datensicherung, E-Mail-Vorlagen">⚙ Büro-Einstellungen</button>`;
}
addEventListener('hashchange', () => {   // ⚙ → Büro → … in der Verwaltung selbst: nur die Ansicht wechseln
  const h = location.hash.slice(1); if (!h) return;
  if (h.startsWith('einstellungen')) { tab = 'einstellungen'; data.stab = h.slice(14) || 'allgemein'; } else if (TABS.some((t) => t[0] === h)) tab = h; else return;
  if (window.BPHead && BPHead.einstellungenSchliessen) BPHead.einstellungenSchliessen();
  renderTabs(); load();
});
$('#tabs').onclick = (e) => { if (e.target.closest('[data-buero]')) { BPHead.einstellungen({ bereich: 'buero' }); return; } const b = e.target.closest('[data-tab]'); if (!b) return; tab = b.dataset.tab; history.replaceState(null, '', '#' + tab); renderTabs(); load(); };

async function load() {
  const m = $('#main');
  try {
    if (tab === 'projekte') { data.p = await api('api/projects'); renderProjects(); }
    else if (tab === 'users') { data.u = await api('api/users'); renderUsers(); }
    else if (tab === 'sessions') { data.s = await api('api/sessions'); renderSessions(); }
    else if (tab === 'einstellungen') { await loadSettings(); }
    else if ((data.sys || 'health') === 'health') { m.innerHTML = sysNav() + '<p class="mute">Prüfe die Dienste …</p>'; data.st = await api('api/status'); renderStatus(); }
    else { data.a = await api('api/audit?cat=' + (data.cat || '')); renderAudit(); }
  } catch (e) { m.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}


/* ---------- Projekte über alle Apps ---------- */
const appOf = (k) => (data.conf.apps || []).find((a) => a.key === k);
const linkTo = (k, frag) => { const a = appOf(k); return a ? appUrl(a) + '/' + frag : '#'; };
function renderProjects(q = data.pq || '', f = data.pf || '') {
  data.pq = q; data.pf = f;
  const all = data.p, noBt = all.filter((p) => !p.bt).length, nArch = all.filter((p) => p.archived).length;
  const list = all.filter((p) => (!q || (p.name + ' ' + p.client + ' ' + p.address + ' ' + p.plans.map((x) => x.name).join(' ') + ' ' + p.bks.map((x) => x.name).join(' ')).toLowerCase().includes(q.toLowerCase()))
    && (f !== 'nobt' || !p.bt) && (f === 'arch' ? p.archived : f === 'alle' || !p.archived));
  $('#main').innerHTML = `<div class="bar"><h1 style="margin:0">Projekte</h1><span class="fill"></span><button class="btn pri" data-a="pnew">+ Projekt anlegen</button></div>
    <div class="bar"><input type="search" id="pq" placeholder="Projekt, Bauherr, Plan suchen …" value="${esc(q)}" style="flex:1 1 260px">
      <div class="seg">${[['', 'Aktiv'], ['nobt', 'Ohne Bautagebuch' + (noBt ? ' · ' + noBt : '')], ['arch', 'Archiv' + (nArch ? ' · ' + nArch : '')], ['alle', 'Alle']].map(([k, l]) => `<button class="${k === f ? 'on' : ''}" data-a="pf" data-f="${k}">${l}</button>`).join('')}</div></div>
    <div class="plist">${list.map((p) => `<div class="prow${p.archived ? ' arch' : ''}" data-key="${p.key}">
      <div class="pmain"><b>${esc(p.name)}</b>${p.archived ? ' <span class="pill">archiviert</span>' : ''}
        ${p.client || p.address ? `<small>${esc([p.client, p.address].filter(Boolean).join(' · '))}</small>` : ''}
        ${p.bt ? `<small class="who">${p.leaders && p.leaders.length ? 'Sichtbar für: ' + esc(p.leader_names.join(', ')) : 'Sichtbar für alle mit Bautagebuch'}</small>` : ''}</div>
      <div class="papps">${p.bt ? `<span class="chip bt" title="Tagesberichte im Bautagebuch">Bautagebuch · ${p.bt.reports}</span>` : '<button class="chip no" data-a="mkbt" title="Für dieses Projekt gibt es noch kein Bautagebuch">kein Bautagebuch – anlegen?</button>'}
        ${p.plans.map((x) => `<span class="chip" title="Bauzeitenplan">Plan · ${esc(x.name)}</span>`).join('')}${p.bks.map((x) => `<span class="chip" title="Baukosten">Kosten · ${esc(x.name)}</span>`).join('')}</div>
      <div class="pact"><button class="btn sm" data-a="popen">Öffnen</button>${p.bt ? '<button class="btn sm" data-a="pedit">Bearbeiten</button>' : ''}<button class="btn sm ic" data-a="pmore" aria-label="Weitere Aktionen" title="Weitere Aktionen">⋯</button></div>
    </div>`).join('') || '<div class="card mute" style="text-align:center;padding:2rem">Keine Projekte.</div>'}</div>
    <div class="note">Ein Projekt fasst zusammen, was in den Apps dazugehört: Bautagebuch, verknüpfte Bauzeitenpläne und Kostenermittlungen. Projekte werden im Bautagebuch angelegt und gelten für alle Apps.</div>`;
  const inp = $('#pq'); inp.oninput = () => { const pos = inp.selectionStart; renderProjects(inp.value, f); const n = $('#pq'); n.focus(); n.setSelectionRange(pos, pos); };
}
async function projForm(p) {
  if (!data.lead) { try { data.lead = await api('api/leaders'); } catch { data.lead = []; } }
  const isNew = !p, L = new Set(p ? p.leaders : []);
  const bg = modalBox(`<div class="pf-h"><h3 style="margin:0">${isNew ? 'Projekt anlegen' : esc(p.name)}</h3>${isNew ? '' : `<span class="mute" style="font-size:.85rem">${p.bt.reports} Tagesberichte · ${p.bt.images} Fotos</span>`}</div>
    <div class="pf">
      <label class="w">Bauvorhaben<input id="fName" value="${esc(p ? p.name : '')}" data-bp-projekt autocomplete="off" placeholder="Projektnummer und Name, z. B. A541 Schürmannstr. 4, Bottrop"></label>
      <label class="w">Bauherrschaft<input id="fClient" value="${esc(p ? p.client : '')}" autocomplete="off"></label>
      <label class="w">Straße und Hausnummer<input id="fStreet" value="${esc(p ? p.street : '')}" autocomplete="off"></label>
      <label>PLZ<input id="fZip" value="${esc(p ? p.zip : '')}" inputmode="numeric" autocomplete="off"></label>
      <label>Ort<input id="fCity" value="${esc(p ? p.city : '')}" autocomplete="off"></label>
      <label class="w">Projektordner auf dem Server <span style="font-size:.78rem">(leer = automatisch über das Kürzel)</span><input id="fFolder" value="${esc(p ? p.folder || '' : '')}" autocomplete="off"></label>
    </div>
    <div class="pf-sec">Sichtbar für <span class="mute">– niemand angekreuzt = alle mit Zugang zum Bautagebuch</span></div>
    <div class="pf-users">${data.lead.map((u) => `<label class="${u.active ? '' : 'off'}" title="${u.bt ? '' : 'Hat keinen Zugang zum Bautagebuch'}"><input type="checkbox" data-u="${u.id}"${L.has(u.id) ? ' checked' : ''}>${esc(u.name)}${u.admin ? ' <small>Admin</small>' : ''}${u.bt ? '' : ' <small>ohne Bautagebuch</small>'}</label>`).join('') || '<span class="mute">Keine Benutzer.</span>'}</div>
    ${isNew ? '<p class="mute" style="font-size:.85rem;margin:.6rem 0 0">Ohne Adresse ermittelt das Bautagebuch sie wie gewohnt aus dem Projektnamen.</p>' : ''}
    <div class="acts" style="justify-content:space-between">${isNew ? '<span></span>' : `<div style="display:flex;gap:.5rem;flex-wrap:wrap"><button class="btn sm" data-m="arch">${p.archived ? 'Aus dem Archiv holen' : 'Archivieren'}</button><button class="btn sm danger" data-m="del">Löschen …</button></div>`}
      <div style="display:flex;gap:.5rem"><button class="btn" data-m="x">Abbrechen</button><button class="btn pri" data-m="ok">${isNew ? 'Anlegen' : 'Speichern'}</button></div></div>`,
  async (m, bgx, close, btn) => {
    if (m === 'x') { close(); return; }
    if (m === 'del') { close(); delDlg(p); return; }
    if (m === 'arch') {
      try { await api('api/projects/' + p.bt.id, 'PUT', { archived: !p.archived }); close(); toast(p.archived ? 'Aus dem Archiv geholt.' : 'Archiviert – in allen Apps unter „Archiv“.'); load(); } catch (e) { toast(e.message, true); }
      return;
    }
    if (m !== 'ok') return;
    const body = { name: bgx.querySelector('#fName').value, client: bgx.querySelector('#fClient').value, street: bgx.querySelector('#fStreet').value,
      zip: bgx.querySelector('#fZip').value, city: bgx.querySelector('#fCity').value, folder: bgx.querySelector('#fFolder').value, leaders: [...bgx.querySelectorAll('[data-u]:checked')].map((x) => +x.dataset.u) };
    if (!body.name.trim()) { toast('Bitte einen Namen eingeben.', true); bgx.querySelector('#fName').focus(); return; }
    btn.disabled = true;
    try {
      if (isNew) { const r = await api('api/projects/neu', 'POST', body); toast(r.auto_address ? 'Projekt angelegt – Adresse aus dem Namen ermittelt, bitte prüfen.' : 'Projekt angelegt.'); }
      else { await api('api/projects/' + p.bt.id, 'PUT', body); toast('Gespeichert.'); }
      close(); load();
    } catch (e) { btn.disabled = false; toast(e.message, true); }
  });
  bg.querySelector('.modal').style.width = 'min(640px, 100%)';
  bg.querySelector('#fName').focus();
}
function moreMenu(p, anchor) {
  document.querySelectorAll('.pmenu').forEach((x) => x.remove());
  const m = document.createElement('div'); m.className = 'pmenu';
  m.innerHTML = (p.bt ? `<button data-pm="arch">${p.archived ? 'Aus dem Archiv holen' : 'Archivieren'}</button>` : '<button data-pm="mkbt">Bautagebuch-Projekt anlegen …</button>')
    + '<button data-pm="del" class="dn">Löschen …</button>';
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect();
  Object.assign(m.style, { top: r.bottom + 4 + 'px', left: Math.max(8, r.right - m.offsetWidth) + 'px' });
  m.onclick = async (e) => {
    const b = e.target.closest('[data-pm]'); if (!b) return; m.remove();
    if (b.dataset.pm === 'del') delDlg(p);
    else if (b.dataset.pm === 'mkbt') mkBt(p);
    else { try { await api('api/projects/' + p.bt.id, 'PUT', { archived: !p.archived }); toast(p.archived ? 'Aus dem Archiv geholt.' : 'Archiviert.'); load(); } catch (er) { toast(er.message, true); } }
  };
  setTimeout(() => document.addEventListener('click', function off(ev) { if (!m.contains(ev.target)) { m.remove(); document.removeEventListener('click', off); } }), 0);
}
const projOf = (el) => data.p.find((p) => p.key === el.closest('[data-key]').dataset.key);
function mkBt(p, then) {
  let fT = 0;
  const bg = modalBox(`<h3>Bautagebuch-Projekt anlegen</h3><p class="mute" style="margin-top:0">„${esc(p.name)}“ hat noch kein Projekt im Bautagebuch. Anlegen und ${p.plans.length + p.bks.length > 1 ? 'Plan und Kostenermittlung' : 'es'} damit verknüpfen?</p>
    <div class="row"><label for="btName">Projektname im Bautagebuch</label><input id="btName" value="${esc(p.name)}" autocomplete="off"></div>
    <div id="btSug"></div>
    <div class="acts"><button class="btn" data-m="x">Nein, später</button><button class="btn pri" data-m="ok">Anlegen und verknüpfen</button></div>`,
  async (m, bgx, close, btn) => {
    if (m === 'sug') { bgx.querySelector('#btName').value = btn.dataset.name; bgx.querySelectorAll('[data-m="sug"]').forEach((x) => x.classList.toggle('pri', x === btn)); return; }
    if (m !== 'ok') { close(); return; }

    <div class="tbl"><table><thead><tr><th>Name</th><th class="hide-s">E-Mail</th><th>Apps</th><th class="hide-s">Zuletzt aktiv</th><th></th></tr></thead><tbody>
    ${list.map(u => `<tr class="${u.active ? '' : 'off'}" data-id="${u.id}">
      <td><b>${esc(u.full || u.name)}</b>${u.full && u.full !== u.name ? ` <small class="mute">· ${esc(u.name)}</small>` : ''} ${u.is_admin ? '<span class="pill y">Admin</span>' : ''} ${u.active ? '' : '<span class="pill bad">gesperrt</span>'} ${u.must_change ? '<span class="pill" title="Muss beim nächsten Anmelden ein eigenes Kennwort vergeben">Startkennwort</span>' : ''}</td>
      <td class="hide-s">${esc(u.email) || '<span class="mute">–</span>'}</td>
      <td>${u.is_admin ? '<span class="mute">alle</span>' : apps.map(a => `<span class="pill ${u.apps.includes(a.key) ? 'ok' : ''}">${u.apps.includes(a.key) ? '' : '<s>'}${esc(a.name)}${u.apps.includes(a.key) ? '' : '</s>'}</span>`).join(' ')}</td>
      <td class="hide-s">${ago(u.last_seen)}${u.sessions ? ` <span class="mute">· ${u.sessions} Sitzung${u.sessions > 1 ? 'en' : ''}</span>` : ''}</td>
      <td class="r"><div class="acts"><button class="btn sm" data-a="edit">Bearbeiten</button></div></td></tr>`).join('') || '<tr><td colspan="5" class="mute">Keine Treffer.</td></tr>'}
    </tbody></table></div>
    <div class="note">Die Benutzer sind dieselben wie im Bautagebuch. Ein Konto mit Häkchen bei einer App kann sie nach der Anmeldung auf der Startseite ohne erneute Anmeldung öffnen. Administratoren dürfen immer alle Apps nutzen. Gesperrte Konten werden sofort überall abgemeldet.</div>`;
  $('#q').oninput = (e) => { data.q = e.target.value; const pos = e.target.selectionStart; renderUsers(data.q); $('#q').focus(); $('#q').setSelectionRange(pos, pos); };
}
function userForm(u) {
  const { apps } = data.u, isNew = !u;
  u = u || { name: '', vorname: '', nachname: '', email: '', is_admin: false, active: true, apps: apps.map(a => a.key) };
  const self = me && u.id === me.id;
  modalBox(`<h3>${isNew ? 'Benutzer anlegen' : esc(u.full || u.name)}</h3>
    <div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:.6rem"><label>Vorname<input id="fV" value="${esc(u.vorname || '')}" autocomplete="off"></label><label>Nachname<input id="fNN" value="${esc(u.nachname || '')}" autocomplete="off"></label></div>
    <div class="row"><label for="fN">Anmeldename (kurz, z. B. „Knauff“ – erscheint auch im Bautagebuch-PDF)</label><input id="fN" value="${esc(u.name)}" ${!isNew && u.name.toLowerCase() === 'admin' ? 'disabled' : ''}></div>
    <div class="row"><label for="fE">E-Mail (für „Kennwort vergessen“ und Erinnerungen)</label><input id="fE" type="email" value="${esc(u.email)}"></div>
    <div class="row"><label>Apps</label><div class="appchk">${apps.map(a => `<label><input type="checkbox" data-app="${a.key}" ${u.apps.includes(a.key) ? 'checked' : ''}> ${esc(a.name)}</label>`).join('')}</div></div>
    <label class="chk"><input type="checkbox" id="fA" ${u.is_admin ? 'checked' : ''} ${self ? 'disabled' : ''}> Administrator (alle Apps, Verwaltung, Einstellungen des Bautagebuchs)</label>
    ${isNew ? '' : `<label class="chk"><input type="checkbox" id="fX" ${u.active ? '' : 'checked'} ${self ? 'disabled' : ''}> Konto gesperrt</label>`}
    <div class="err" id="fErr"></div>
    <div class="acts">
      ${isNew ? '' : `<button class="btn sm" data-m="pw" style="margin-right:auto">Kennwort zurücksetzen</button>${u.sessions ? '<button class="btn sm" data-m="out">Überall abmelden</button>' : ''}${self || u.name.toLowerCase() === 'admin' ? '' : '<button class="btn sm danger" data-m="del">Löschen</button>'}`}
      <button class="btn" data-m="x">Abbrechen</button><button class="btn pri" data-m="ok">${isNew ? 'Anlegen' : 'Speichern'}</button></div>`,
  async (m, bg, close, btn) => {
    const err = (e) => { bg.querySelector('#fErr').textContent = e.message || e; };
    const body = () => ({ vorname: bg.querySelector('#fV').value, nachname: bg.querySelector('#fNN').value, name: bg.querySelector('#fN').value, email: bg.querySelector('#fE').value, is_admin: bg.querySelector('#fA').checked,
      apps: [...bg.querySelectorAll('[data-app]')].filter(x => x.checked).map(x => x.dataset.app), ...(isNew ? {} : { active: !bg.querySelector('#fX').checked }) });
    try {
      if (m === 'x') close();
      else if (m === 'ok') {
        if (isNew) { const r = await api('api/users', 'POST', body()); close(); showPw(body().name, r.password, true); }
        else { await api('api/users/' + u.id, 'PUT', body()); close(); toast('Gespeichert.'); }
        load();
      } else if (m === 'pw') {
        if (!btn.dataset.sure) { btn.dataset.sure = 1; btn.textContent = 'Wirklich zurücksetzen?'; return; }
        const r = await api(`api/users/${u.id}/password`, 'POST'); close(); showPw(u.name, r.password, false); load();
      } else if (m === 'out') { await api(`api/users/${u.id}/logout`, 'POST'); close(); toast(`${u.name} ist überall abgemeldet.`); load(); }
      else if (m === 'del') {
        if (!btn.dataset.sure) { btn.dataset.sure = 1; btn.textContent = 'Wirklich löschen?'; return; }
        await api('api/users/' + u.id, 'DELETE'); close(); toast(`${u.name} gelöscht.`); load();
      }
    } catch (e) { err(e); }
  });
}
function showPw(name, pw, isNew) {
  modalBox(`<h3>${isNew ? 'Benutzer angelegt' : 'Kennwort zurückgesetzt'}</h3>
    <p>Startkennwort für <b>${esc(name)}</b> – wird nur jetzt angezeigt. ${esc(name)} vergibt beim ersten Anmelden ein eigenes Kennwort.</p>
    <div class="secret">${esc(pw)}</div>
    <div class="acts"><button class="btn" data-m="copy">Kopieren</button><button class="btn pri" data-m="x">Fertig</button></div>`,
  async (m, bg, close) => { if (m === 'copy') { try { await navigator.clipboard.writeText(pw); toast('Kopiert.'); } catch { toast('Bitte markieren und kopieren.', true); } } else close(); });
}
$('#main').addEventListener('click', (e) => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  if (b.dataset.a === 'new') userForm(null);
  else if (b.dataset.a === 'edit') userForm(data.u.users.find(u => u.id === +b.closest('tr').dataset.id));
  else if (b.dataset.a === 'end') api('api/sessions/' + b.dataset.id, 'DELETE').then(() => { toast('Sitzung beendet.'); load(); }).catch(e => toast(e.message, true));
  else if (b.dataset.a === 'cat') { data.cat = b.dataset.cat; load(); }
  else if (b.dataset.a === 'reload') load();
  else if (b.dataset.a === 'sys') { data.sys = b.dataset.sys; load(); }
  else if (b.dataset.a === 'pf') renderProjects(data.pq, b.dataset.f);
  else if (b.dataset.a === 'popen') openDlg(projOf(b));
  else if (b.dataset.a === 'pdel') delDlg(projOf(b));
  else if (b.dataset.a === 'pnew') { if (window.BPHead && BPHead.projektBearbeiten) BPHead.projektBearbeiten(null, { onSaved: () => load() }); else projForm(null); }
  else if (b.dataset.a === 'pedit') { const p = projOf(b); if (window.BPHead && BPHead.projektBearbeiten) BPHead.projektBearbeiten(p.bt.id, { onSaved: () => load(), onDelete: () => delDlg(p) }); else projForm(p); }
  else if (b.dataset.a === 'pmore') moreMenu(projOf(b), b);
  else if (b.dataset.a === 'mkbt') mkBt(projOf(b));
});

/* ---------- Sitzungen ---------- */
function renderSessions() {
  const APPN = { bautagebuch: 'Bautagebuch', portal: 'Startseite', gantt: 'Bauzeitenplan', adressen: 'Adressen', baukosten: 'Baukosten' };
  $('#main').innerHTML = `<h1>Angemeldet</h1>
    <div class="tbl"><table><thead><tr><th>Benutzer</th><th>Gerät</th><th class="hide-s">Angemeldet über</th><th>Zuletzt aktiv</th><th class="hide-s">Adresse</th><th></th></tr></thead><tbody>
    ${data.s.map(s => `<tr><td><b>${esc(s.name)}</b>${s.mine ? ' <span class="pill y">dieses Gerät</span>' : ''}</td><td>${esc(s.agent)}</td><td class="hide-s">${esc(APPN[s.app] || s.app || '–')}</td>
      <td>${ago(s.seen)}</td><td class="hide-s">${esc(s.ip)}</td><td class="r">${s.mine ? '' : `<button class="btn sm" data-a="end" data-id="${s.id}">Beenden</button>`}</td></tr>`).join('') || '<tr><td colspan="6" class="mute">Niemand angemeldet.</td></tr>'}
    </tbody></table></div>
    <div class="note">Eine Anmeldung gilt 30 Tage ab der letzten Nutzung und für alle Apps. „Beenden“ meldet das Gerät in allen Apps ab.</div>`;
}

/* ---------- System: Server-Status ---------- */
function renderStatus() {
  const s = data.st;
  $('#main').innerHTML = `${sysNav()}<div class="bar"><h1 style="margin:0">Server-Status</h1><span class="fill"></span><button class="btn sm" data-a="reload">Aktualisieren</button></div>
    <div class="grid">
      <div class="card"><h2 style="margin-top:0">Dienste</h2>${s.services.map(x => `<div class="kv"><span class="svc"><span class="dot ${x.ok ? '' : 'bad'}"></span>${esc(x.name)}</span><small>${x.ok ? (x.version ? 'v' + esc(x.version) + ' · ' : '') + x.ms + ' ms' : esc(x.error || 'nicht erreichbar')}</small></div>`).join('')}</div>
      <div class="card"><h2 style="margin-top:0">Datenbank</h2>
        <div class="kv"><span>PostgreSQL</span><b>${esc(s.db.server)}</b></div><div class="kv"><span>Schema-Version</span><b>${s.db.schema}</b></div><div class="kv"><span>Größe</span><b>${esc(s.db.size)}</b></div></div>
      <div class="card"><h2 style="margin-top:0">Inhalt</h2>${Object.entries(s.counts).map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><b>${v}</b></div>`).join('')}</div>
    </div>
    ${s.gantt_init ? `<div class="note">Bauzeitenplan eingerichtet am ${esc(new Date(s.gantt_init.at).toLocaleString('de-DE'))}: ${s.gantt_init.imported} Pläne aus der bisherigen Gantt-App übernommen${s.gantt_init.samples ? `, ${s.gantt_init.samples} Beispielpläne angelegt` : ''}.</div>` : ''}
    <div class="note">Plattform-Version ${esc(s.version)} · Stand ${esc(new Date(s.time).toLocaleString('de-DE'))}. Sicherungen der Datenbank verwaltest du unter Einstellungen → Datensicherung; vor jedem Update legt das Update-Skript zusätzlich eine Sicherung an.</div>`;
}

/* ---------- Protokoll ---------- */
function renderAudit() {
  const c = data.cat || '';
  $('#main').innerHTML = `${sysNav()}<h1>Protokoll</h1>
    <div class="bar">${[['', 'Alles'], ['konto', 'Anmeldungen'], ['verwaltung', 'Verwaltung']].map(([k, l]) => `<button class="btn sm ${k === c ? 'pri' : ''}" data-a="cat" data-cat="${k}">${l}</button>`).join('')}</div>
    <div class="tbl"><table><thead><tr><th>Zeit</th><th>Benutzer</th><th>Aktion</th><th class="hide-s">Details</th></tr></thead><tbody>
    ${data.a.map(r => `<tr><td style="white-space:nowrap">${esc(r.ts.slice(0, 16).replace(/^(\d+)-(\d+)-(\d+)/, '$3.$2.$1'))}</td><td>${esc(r.user_name)}</td><td>${esc(r.action)}</td><td class="hide-s mute">${esc([r.project, r.detail].filter(Boolean).join(' · '))}</td></tr>`).join('') || '<tr><td colspan="4" class="mute">Keine Einträge.</td></tr>'}
    </tbody></table></div>
    <div class="note">Die letzten 300 Einträge. Das vollständige Protokoll mit Filtern nach Projekt steht im Bautagebuch im Reiter „Protokoll“.</div>`;
}

(async () => {
  me = await api('api/me'); applyLook(me);
  const conf = await api('api/platform'); data.conf = conf;
  await header('Verwaltung', me, conf);
  renderTabs(); load();
})().catch(e => toast(e.message, true));
window.bpNachVerlauf = () => (location.hash.startsWith('#einstellungen') ? loadSettings().catch((er) => toast(er.message, true)) : location.reload());
</script>
</body>
</html>
