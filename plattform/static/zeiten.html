<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#84827c">
<title>Zeiten</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="static/bp.css">
<style>
.wrap{max-width:1240px;padding-bottom:5rem}
.top{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:0 0 .8rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:calc(999px*var(--rkp,1));padding:3px;gap:2px;background:var(--card)}
.seg button{border:0;background:none;cursor:pointer;font:inherit;border-radius:calc(999px*var(--rkp,1));padding:.35rem .9rem;color:var(--mute);font-size:.9rem;white-space:nowrap}
.seg button.on{background:var(--y);color:var(--on);font-weight:600}
.dnav{display:inline-flex;align-items:center;gap:.3rem}
.dnav input{font:inherit;padding:.35rem .5rem;border:1px solid var(--line);border-radius:calc(8px*var(--rk,1));background:var(--inp);color:var(--ink)}
.dnav .ib{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:calc(8px*var(--rk,1));width:34px;height:34px;cursor:pointer;font-size:1rem}
.fill{flex:1}
.kz{display:flex;flex-wrap:wrap;gap:.45rem;margin:0 0 .8rem}
.k{background:var(--card);border:1px solid var(--line);border-radius:calc(10px*var(--rk,1));padding:.4rem .7rem;min-width:6.5rem}
.k small{display:block;color:var(--mute);font-size:.78rem}
.k b{font-size:1.1rem;font-variant-numeric:tabular-nums}
.k input,.k select{font:inherit;font-size:1.1rem;font-weight:600;border:1px solid transparent;border-radius:calc(6px*var(--rk,1));background:transparent;color:var(--ink);padding:0 .15rem;width:5.2rem}
.k input:hover,.k select:hover{border-color:var(--line)}.k input:focus,.k select:focus{border-color:var(--y);outline:0;background:var(--inp)}
.k .vs{color:var(--mute);font-weight:400}
.k.plus b{color:var(--ok)}.k.minus b{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:calc(12px*var(--rk,1));padding:.8rem 1rem;margin:0 0 .8rem}
.card{min-width:0;overflow-x:auto}.zwei>*{min-width:0}   /* breite Tabellen rollen in ihrer Karte, nie die ganze Seite */
@media (max-width:700px){table.t th,table.t td{padding:.3rem .3rem}.card{padding:.7rem .7rem}}
.tl{position:relative;height:58px;margin:1.3rem 0 .4rem;border-radius:calc(8px*var(--rk,1));background:var(--hov)}
.tl .h{position:absolute;top:-1.15rem;font-size:.72rem;color:var(--mute);transform:translateX(-50%)}
.tl .hl{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.tl .b{position:absolute;top:4px;height:50px;border-radius:calc(7px*var(--rk,1));padding:3px 6px;font-size:.74rem;line-height:1.2;overflow:hidden;box-sizing:border-box;cursor:pointer;border:1.5px solid;color:var(--ink)}
.tl .b.v{border-style:dashed}
.q-puls{border-color:#4a7fb5!important;background:color-mix(in srgb,#4a7fb5 16%,var(--card))}
.q-vorort{border-color:#2f9e5a!important;background:color-mix(in srgb,#2f9e5a 16%,var(--card))}
.q-fahrt{border-color:#e0a030!important;background:color-mix(in srgb,#e0a030 16%,var(--card))}
.q-hand,.q-stoppuhr{border-color:#8a6fd1!important;background:color-mix(in srgb,#8a6fd1 14%,var(--card))}
.tl .now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--y)}
.leg{display:flex;gap:1rem;flex-wrap:wrap;font-size:.78rem;color:var(--mute);margin-top:.4rem}
.leg i{display:inline-block;width:14px;height:10px;border-radius:calc(3px*var(--rk,1));border:1.5px solid;margin-right:.3rem;vertical-align:-1px}
.zl{display:flex;flex-direction:column;gap:0}
.zr{display:grid;grid-template-columns:11.5rem minmax(10rem,1.3fr) minmax(10rem,1.2fr) 8.5rem 4rem 4.8rem;gap:.5rem;align-items:center;padding:.4rem .2rem;border-top:1px solid var(--line)}
.zr:first-child{border-top:0}
.zr.kopf{color:var(--mute);font-size:.8rem;padding-top:0}
.zr.v{background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--y) 4%,transparent) 8px 16px)}
.zr.blink{outline:2px solid var(--y);outline-offset:-2px;border-radius:calc(8px*var(--rk,1))}
.zr input,.zr select{font:inherit;font-size:.92rem;padding:.25rem .35rem;border:1px solid var(--line);border-radius:calc(7px*var(--rk,1));background:var(--inp);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
.zr .zz{display:flex;gap:.25rem;align-items:center}.zr .zz input{width:4.6rem;text-align:center}
.zr .r{text-align:right;font-variant-numeric:tabular-nums}
.zr .akt{display:flex;gap:.25rem;justify-content:flex-end}
.ib2{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:calc(8px*var(--rk,1));min-width:34px;height:32px;cursor:pointer;font:inherit}
.ib2.ok{border-color:var(--ok);color:var(--ok)}.ib2.no{color:var(--mute)}.ib2:hover{background:var(--hov)}
.q{display:inline-block;font-size:.76rem;border-radius:calc(999px*var(--rkp,1));padding:.05rem .5rem;border:1px solid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.q.q-puls{color:#3b6fa8}.q.q-vorort{color:#23804a}.q.q-fahrt{color:#a8701a}.q.q-hand,.q.q-stoppuhr{color:#6d55b8}
.leer{color:var(--mute);padding:.6rem .2rem}
.akts{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.7rem}
.lauf{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;border:1px solid var(--y);border-radius:calc(10px*var(--rk,1));padding:.45rem .7rem;background:color-mix(in srgb,var(--y) 7%,var(--card))}
.lauf b{font-variant-numeric:tabular-nums}
.lauf select{font:inherit;padding:.25rem .35rem;border:1px solid var(--line);border-radius:calc(7px*var(--rk,1));background:var(--inp);color:var(--ink);max-width:16rem}
.ok-band{display:flex;gap:.6rem;align-items:center;border:1px solid var(--ok);color:var(--ok);border-radius:calc(10px*var(--rk,1));padding:.5rem .8rem;margin:0 0 .8rem;font-weight:600}
.ok-band .fill{flex:1}
.ws{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.4rem}
.ws button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:calc(10px*var(--rk,1));padding:.4rem .2rem;cursor:pointer;font:inherit;text-align:center;line-height:1.25}
.ws button small{display:block;color:var(--mute);font-size:.75rem}
.ws button.on{outline:2px solid var(--y)}.ws button.bes{border-color:var(--ok)}.ws button.off{border-color:var(--red)}.ws button.we{opacity:.6}
.ws button b{font-variant-numeric:tabular-nums}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th{text-align:left;font-weight:500;color:var(--mute);border-bottom:1px solid var(--line);padding:.35rem .45rem;white-space:nowrap}
table.t td{border-bottom:1px solid var(--line);padding:.35rem .45rem;font-variant-numeric:tabular-nums}
table.t td.r,table.t th.r{text-align:right}
table.t tr.klick{cursor:pointer}table.t tr.klick:hover td{background:var(--hov)}
table.t input,table.t select{font:inherit;padding:.2rem .35rem;border:1px solid var(--line);border-radius:calc(6px*var(--rk,1));background:var(--inp);color:var(--ink);width:5.5rem}
.bar{height:9px;border-radius:calc(5px*var(--rk,1));background:var(--hov);position:relative;overflow:hidden;min-width:80px}.bar i{position:absolute;inset:0 auto 0 0;background:#4a7fb5;border-radius:calc(5px*var(--rk,1))}.bar.ueber i{background:var(--red)}
.kal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.35rem}
.kal .wt{font-size:.78rem;color:var(--mute);text-align:center}
.kal button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:calc(9px*var(--rk,1));min-height:4.2rem;padding:.3rem;cursor:pointer;font:inherit;text-align:left;display:flex;flex-direction:column;gap:.1rem}
.kal button small{font-size:.74rem;color:var(--mute)}
.kal button.bes{border-color:var(--ok)}.kal button.off{border-color:var(--red)}.kal button.we{opacity:.55}.kal button.abw{background:color-mix(in srgb,#2f9e5a 12%,var(--card))}
.kal button.heute{outline:2px solid var(--y)}
.kal .x{visibility:hidden}
.frm{display:flex;gap:.5rem;align-items:flex-end;flex-wrap:wrap}
.frm label{display:flex;flex-direction:column;gap:.2rem;font-size:.82rem;color:var(--mute)}
.frm input,.frm select{font:inherit;padding:.35rem .5rem;border:1px solid var(--line);border-radius:calc(8px*var(--rk,1));background:var(--inp);color:var(--ink)}
.tage{display:inline-flex;gap:2px}.tage button{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:calc(6px*var(--rk,1));width:2.2rem;padding:0;height:1.7rem;cursor:pointer;font-size:.78rem}.tage button.on{background:var(--y);color:var(--on);border-color:var(--y)}
.zwei{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:.8rem;align-items:start}
.hinw{font-size:.86rem;color:var(--mute);line-height:1.45}
h3{margin:.1rem 0 .6rem;font-size:1.02rem}
/* Einfach: wenige, große Bedienelemente – Tag und Monat, Vorschläge als Karten */
html[data-modus="einfach"] .profi{display:none!important}
html[data-modus="einfach"] .zr,.handy .zr{grid-template-columns:1fr auto;grid-template-areas:"z akt" "p p" "a a";border:1px solid var(--line);border-radius:calc(12px*var(--rk,1));padding:.6rem .7rem;margin:0 0 .5rem}
html[data-modus="einfach"] .zr.kopf,.handy .zr.kopf{display:none}
html[data-modus="einfach"] .zr .zz,.handy .zr .zz{grid-area:z}
html[data-modus="einfach"] .zr .pp,.handy .zr .pp{grid-area:p}
html[data-modus="einfach"] .zr .aa,.handy .zr .aa{grid-area:a}
html[data-modus="einfach"] .zr .akt,.handy .zr .akt{grid-area:akt}
html[data-modus="einfach"] body:not(.handy) .zr{grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) auto;grid-template-areas:"z p a akt"}
html[data-modus="einfach"] .zr .qq,html[data-modus="einfach"] .zr .dd,.handy .zr .qq,.handy .zr .dd{display:none}
html[data-modus="einfach"] .ib2,.handy .ib2{min-width:44px;height:42px;font-size:1.05rem}
html[data-modus="einfach"] .zr input,html[data-modus="einfach"] .zr select,.handy .zr input,.handy .zr select{font-size:1rem;padding:.45rem .5rem}
html[data-modus="einfach"] .btn,.handy .akts .btn{padding:.7rem 1.1rem;font-size:1rem}
html[data-modus="einfach"] .k b{font-size:1.25rem}
@media (max-width:760px){.zwei{grid-template-columns:1fr}.tlk{display:none}.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.dnav{width:100%;justify-content:center}.k{min-width:calc(50% - .5rem);box-sizing:border-box}.ws{grid-template-columns:repeat(7,minmax(2.4rem,1fr));overflow-x:auto}.kal button{min-height:3.4rem}.kal button small{display:none}.kal button small.abw-n{display:block}}
.q-unterwegs{border-color:#e0a030!important;background:color-mix(in srgb,#e0a030 34%,var(--card))}.q.q-unterwegs{color:#a8701a}
.fahrt-k{display:flex;flex-direction:column;gap:.5rem;border:1px solid var(--line);border-radius:calc(12px*var(--rk,1));padding:.8rem;background:var(--card);margin:0 0 .8rem;max-width:30rem}
.fahrt-k.lauf-f{border-color:#e0a030;background:color-mix(in srgb,#e0a030 10%,var(--card))}
.fahrt-k .fz{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.fahrt-k .btn.gross{font-size:1.1rem;padding:.8rem 1rem;font-weight:700}
.fahrt-k select{font:inherit;padding:.5rem;border:1px solid var(--line);border-radius:calc(8px*var(--rk,1));background:var(--inp);color:var(--ink);width:100%}
.seg3{display:flex;gap:.25rem;background:var(--inp);border-radius:calc(10px*var(--rk,1));padding:.2rem}.seg3 button{flex:1;border:0;background:none;color:var(--ink);font:inherit;padding:.55rem .3rem;border-radius:calc(8px*var(--rk,1));cursor:pointer}.seg3 button.on{background:var(--y);color:var(--on,#111);font-weight:700}
.fahrt-k .mute{color:var(--mute);font-size:.85rem}
.schnell{display:flex;gap:.5rem;margin:0 0 .8rem;flex-wrap:wrap}@media (max-width:760px){.schnell .btn{flex:1;padding:.75rem;font-size:1.05rem;font-weight:700}}
</style>
</head>
<body>
<main class="wrap" id="app">
  <div class="top">
    <div class="seg" id="tabs" role="tablist" aria-label="Ansicht"></div>
    <span class="fill"></span>
    <div class="dnav" id="dnav"></div>
  </div>
  <div id="view"><p class="mute">Lade …</p></div>
</main>
<script src="static/bp.js"></script>
<script src="bp/undo.js"></script>
<script>
const LS = { get(k, d) { try { const v = localStorage.getItem('zeit.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('zeit.' + k, JSON.stringify(v)); } catch { /* egal */ } } };
let ME = null, G = null, D = null, W = null, M = null, A = null, K = null, PSEL = null, FSEL = null, ANGEK = null, tab = LS.get('tab', 'tag'), tag = '', monat = '';
const einfach = () => document.documentElement.dataset.modus === 'einfach';
const handy = () => innerWidth <= 760;
const h2m = (s) => { const m = /^(\d{1,2}):(\d{2})/.exec(s || ''); return m ? +m[1] * 60 + +m[2] : null; };
const m2h = (m) => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
const std = (m) => { const n = Math.round(m || 0), s = n < 0 ? '−' : ''; const a = Math.abs(n); return `${s}${Math.floor(a / 60)}:${String(a % 60).padStart(2, '0')}`; };
const hmNorm = (v) => { const t = String(v || '').trim().replace(/[.,h ]/g, ':'); if (!t) return ''; let h, m; if (t.includes(':')) [h, m] = t.split(':'); else if (t.length <= 2) [h, m] = [t, '0']; else [h, m] = [t.slice(0, -2), t.slice(-2)];
  h = +h; m = +(m || 0); return Number.isFinite(h) && Number.isFinite(m) && h >= 0 && h <= 24 && m >= 0 && m < 60 ? m2h(h * 60 + m) : null; };   // „930“, „9.30“, „9“ → 09:30 / 09:00
const dauer = (v, b) => Math.max(0, (h2m(b) || 0) - (h2m(v) || 0));
const WT = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const wtag = (t) => (new Date(t + 'T12:00').getDay() + 6) % 7;
const dlang = (t) => new Date(t + 'T12:00').toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: '2-digit', year: 'numeric' });
const dkurz = (t) => new Date(t + 'T12:00').toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
const plus = (t, n) => { const d = new Date(t + 'T12:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const PJN = () => Object.fromEntries((G.projekte || []).map((p) => [p.id, p.name]));
const ARTN = () => Object.fromEntries(G.arten);
const QN = { puls: 'aus der Plattform', vorort: 'vor Ort', fahrt: 'Fahrt (geschätzt)', hand: 'von Hand', stoppuhr: 'Stoppuhr', unterwegs: 'Fahrt (erfasst)' };
const FR = { hin: 'zur Baustelle', zurueck: 'zurück ins Büro', andere: 'Fahrt' };
const fj = (v) => { try { return v ? JSON.parse(v) : null; } catch { return null; } };
const artKurz = (a) => (/^lph(\d)$/.exec(a || '') ? 'LPh ' + a.slice(3) : (ARTN()[a] || a || ''));

/* ---------------- Kopf: Reiter und Datum ---------------- */
function reiter() {
  const T = [['tag', 'Mein Tag'], ['woche', 'Woche', 1], ['monat', 'Monat & Urlaub']].concat(G.admin ? [['auswertung', 'Auswertung', 1], ['einst', 'Einstellungen', 1]] : []);
  if (einfach() && !['tag', 'monat'].includes(tab)) tab = 'tag';
  $('#tabs').innerHTML = T.map(([k, l, p]) => `<button type="button" data-tab="${k}" class="${tab === k ? 'on' : ''}${p ? ' profi' : ''}" role="tab" aria-selected="${tab === k}">${l}</button>`).join('');
  const zeigDatum = tab === 'tag' || tab === 'woche';
  $('#dnav').innerHTML = zeigDatum ? `<button type="button" class="ib" data-dn="-1" title="Tag zurück" aria-label="Tag zurück">‹</button><input type="date" id="dIn" value="${tag}" max="${G.heute}" aria-label="Datum"><button type="button" class="ib" data-dn="1" title="Tag vor" aria-label="Tag vor"${tag >= G.heute ? ' disabled' : ''}>›</button>${tag !== G.heute ? '<button type="button" class="btn sm" data-dn="0">Heute</button>' : ''}`
    : tab === 'monat' ? `<button type="button" class="ib" data-mn="-1" aria-label="Monat zurück">‹</button><b style="min-width:9rem;text-align:center">${new Date(monat + '-15').toLocaleDateString('de-DE', { month: 'long', year: 'numeric' })}</b><button type="button" class="ib" data-mn="1" aria-label="Monat vor">›</button>` : '';
}
async function laden() {
  reiter();
  try {
    if (tab === 'tag') { [D, W] = await Promise.all([api('api/tag?d=' + tag), api('api/woche?d=' + tag)]); }
    else if (tab === 'woche') W = await api('api/woche?d=' + tag);
    else if (tab === 'monat') M = await api('api/monat?m=' + monat);
    else if (tab === 'auswertung') { [A, K] = await Promise.all([api('api/auswertung'), api('api/konten')]); }
    else if (tab === 'einst') K = await api('api/konten');
  } catch (e) { toast(e.message, true); }
  zeichne();
}
function zeichne() {
  document.body.classList.toggle('handy', handy());
  const v = $('#view');
  if (tab === 'tag') v.innerHTML = vTag();
  else if (tab === 'woche') v.innerHTML = vWoche();
  else if (tab === 'monat') v.innerHTML = vMonat();
  else if (tab === 'auswertung') v.innerHTML = vAuswertung();
  else v.innerHTML = vEinst();
}

/* ---------------- Mein Tag ---------------- */
function kopfZahlen(d) {
  const k = d.konto || {}, fest = !!d.bestaetigt;
  const sal = k.saldo || 0;
  return `<div class="kz">
    <div class="k"><small>Kommen${d.kommen_fest ? '' : ' (Vorschlag)'}</small><input type="text" inputmode="numeric" maxlength="5" placeholder="hh:mm" class="hm" data-tf="kommen" value="${d.kommen}"${fest ? ' disabled' : ''} aria-label="Kommen"></div>
    <div class="k"><small>Gehen${d.gehen_fest ? '' : ' (Vorschlag)'}</small><input type="text" inputmode="numeric" maxlength="5" placeholder="hh:mm" class="hm" data-tf="gehen" value="${d.gehen}"${fest ? ' disabled' : ''} aria-label="Gehen"></div>
    <div class="k"><small>Pause (Min.)${d.pause_fest ? '' : ' – automatisch'}</small><input type="number" min="0" step="5" data-tf="pause" value="${d.pause}"${fest ? ' disabled' : ''} aria-label="Pause in Minuten"></div>
    <div class="k"><small>Arbeitszeit</small><b>${std(d.arbeit)} h</b></div>
    <div class="k profi"><small>Soll${d.feiertag ? ' · ' + esc(d.feiertag) : ''}</small><b>${std(d.soll)} h</b></div>
    <div class="k profi"><small>davon Projekten zugeordnet</small><b>${std(d.projekt + d.vorschlaege.filter((x) => x.project_id).reduce((a, x) => a + dauer(x.von, x.bis), 0))} h</b></div>
    <div class="k ${sal >= 0 ? 'plus' : 'minus'}"><small>Saldo</small><b>${sal >= 0 ? '+' : ''}${std(sal)} h</b></div>
    <div class="k profi"><small>Urlaub übrig</small><b>${String(k.urlaub_rest ?? '–').replace('.', ',')} T</b></div>
    <div class="k"><small>Abwesenheit</small><select data-tf="abw"${fest ? ' disabled' : ''} aria-label="Abwesenheit"><option value="">– da –</option>${Object.entries(G.abw).map(([a, n]) => `<option value="${a}"${d.abw === a ? ' selected' : ''}>${n}</option>`).join('')}</select></div>
  </div>`;
}
function zeitstrahl(d) {
  const L = [...d.eintraege.map((e) => ({ ...e, fest: 1 })), ...d.vorschlaege.map((v, i) => ({ ...v, vi: i }))];
  const ms = L.flatMap((x) => [h2m(x.von), h2m(x.bis)]).filter((x) => x != null);
  const a = Math.min(7 * 60, ...ms.map((m) => Math.floor(m / 60) * 60)), b = Math.max(18 * 60, ...ms.map((m) => Math.ceil(m / 60) * 60));
  const p = (m) => ((m - a) / (b - a) * 100).toFixed(2) + '%';
  let h = '';
  for (let s = a; s <= b; s += 60) h += `<span class="h" style="left:${p(s)}">${s / 60}</span><span class="hl" style="left:${p(s)}"></span>`;
  const pj = PJN();

  return `<div class="card"><h3>Stundensatz des Büros</h3><div class="frm"><label>€ je Stunde (wenn bei der Person nichts steht)<input id="bSatz" value="${K.buero_satz != null ? String(K.buero_satz).replace('.', ',') : ''}" inputmode="decimal" style="width:8rem"></label><button type="button" class="btn sm pri" data-bs="1">Speichern</button></div></div>
  <div class="card"><h3>Mitarbeiter:innen</h3><div style="overflow-x:auto"><table class="t"><thead><tr><th>Name</th><th class="r">Soll h/Woche</th><th>Arbeitstage</th><th class="r">Urlaub T/Jahr</th><th class="r">Stundensatz €</th><th class="r">Saldo zu Beginn h</th><th>erfassen ab</th><th>nicht erfassen</th></tr></thead><tbody>
  ${K.konten.concat([]).map((x) => { const p = x.person; return `<tr data-pu="${x.user_id}"><td>${esc(x.name)}</td><td class="r"><input data-pf="soll_woche" value="${String(p.soll_woche).replace('.', ',')}" inputmode="decimal" style="width:4.5rem;text-align:right"></td>
    <td><span class="tage">${WT.map((w, i) => `<button type="button" data-ptag="${i}" class="${p.tage.includes(String(i)) ? 'on' : ''}">${w}</button>`).join('')}</span></td>
    <td class="r"><input data-pf="urlaub" value="${String(p.urlaub).replace('.', ',')}" inputmode="decimal" style="width:4rem;text-align:right"></td><td class="r"><input data-pf="satz" value="${p.satz != null ? String(p.satz).replace('.', ',') : ''}" placeholder="Büro" inputmode="decimal" style="width:5rem;text-align:right"></td>
    <td class="r"><input data-pf="saldo_start" value="${String(p.saldo_start).replace('.', ',')}" inputmode="decimal" style="width:4.5rem;text-align:right"></td><td><input type="date" data-pf="ab" value="${p.ab || ''}" style="width:auto"></td><td><input type="checkbox" data-pf="aus"${p.aus ? ' checked' : ''} style="width:auto" title="z. B. Inhaber oder Aushilfe ohne Zeiterfassung"></td></tr>`; }).join('')}
  </tbody></table></div><p class="hinw">Änderungen werden sofort gespeichert. Wer „nicht erfassen“ hat, bekommt keine Erinnerung und erscheint nicht in den Konten.</p></div>`;
}

/* ---------------- Ereignisse ---------------- */
document.addEventListener('click', async (e) => {
  const t = e.target;
  const tb = t.closest('[data-tab]'); if (tb) { tab = tb.dataset.tab; LS.set('tab', tab); laden(); return; }
  const dn = t.closest('[data-dn]'); if (dn) { const n = +dn.dataset.dn; tag = n ? plus(tag, n) : G.heute; if (tag > G.heute) tag = G.heute; NEU = null; laden(); return; }
  const mn = t.closest('[data-mn]'); if (mn) { const d = new Date(monat + '-15'); d.setMonth(d.getMonth() + +mn.dataset.mn); monat = d.toISOString().slice(0, 7); laden(); return; }
  const geh = t.closest('[data-geh]'); if (geh) { tag = geh.dataset.geh > G.heute ? G.heute : geh.dataset.geh; tab = 'tag'; LS.set('tab', tab); NEU = null; laden(); return; }
  const za = t.closest('[data-za]'); if (za) { zeileAktion(za.closest('.zr'), za.dataset.za); return; }
  const spr = t.closest('[data-spr]'); if (spr) { const k = spr.dataset.spr, z = document.querySelector(k[0] === 'e' ? `.zr[data-e="${k.slice(1)}"]` : `.zr[data-v="${k.slice(1)}"]`); if (z) { z.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); z.classList.add('blink'); setTimeout(() => z.classList.remove('blink'), 1400); } return; }
  const ta = t.closest('[data-ta]');
  if (ta) {
    const a = ta.dataset.ta;
    if (a === 'neu') { const n = new Date(), m = Math.floor((n.getHours() * 60 + n.getMinutes()) / 15) * 15; NEU = { von: tag === G.heute ? m2h(Math.max(0, m - 60)) : '09:00', bis: tag === G.heute ? m2h(m) : '10:00', project_id: (window.BPHead && BPHead.projekt && BPHead.projekt.id) || '', art: 'buero' }; zeichne(); const f = document.querySelector('.zr[data-n] [data-zf="project_id"]'); if (f) f.focus(); return; }
    try {
      if (a === 'ok') { D = await api('api/tag/bestaetigen', 'POST', { d: tag }); W = await api('api/woche?d=' + tag); zeichne(); toast('Tag bestätigt.'); }
      if (a === 'auf') { D = await api('api/tag/oeffnen', 'POST', { d: tag }); zeichne(); }
    } catch (er) { toast(er.message, true); }
    return;
  }
  const fr = t.closest('[data-fr]'); if (fr && FSEL) { FSEL.pid = $('#fP') ? $('#fP').value : FSEL.pid; FSEL.richtung = fr.dataset.fr; zeichne(); return; }
  const lf = t.closest('[data-lauf]');
  if (lf) {
    const a = lf.dataset.lauf;
    try {
      if (a === 'fwahl') { FSEL = fahrtVorschlag(); ANGEK = null; zeichne(); return; }
      if (a === 'fabbr') { FSEL = null; zeichne(); return; }
      if (a === 'fertig') { ANGEK = null; zeichne(); return; }
      if (a === 'ein') { lf.disabled = true; const pidF = $('#fP').value, ort = await standort();
        const r = await api('api/lauf', 'POST', { project_id: pidF, fahrt: { richtung: FSEL.richtung, ort } }); G.lauf = r.lauf; FSEL = null; zeichne(); toast('Gute Fahrt – Aussteigen nicht vergessen.'); return; }
      if (a === 'aus') { lf.disabled = true; const ort = await standort(); const r = await api('api/lauf?speichern=1', 'DELETE', { ort }); G.lauf = null; ANGEK = r.fertig; await laden(); return; }
      if (a === 'vorort') { const r = await api('api/lauf', 'POST', { project_id: ANGEK.project_id || '', art: 'lph8' }); G.lauf = r.lauf; ANGEK = null; zeichne(); toast('Vor Ort läuft.'); return; }
      if (a === 'wahl') { PSEL = { pid: (window.BPHead && BPHead.projekt && BPHead.projekt.id) || '', art: 'buero' }; zeichne(); return; }
      if (a === 'abbr') { PSEL = null; zeichne(); return; }
      if (a === 'start') { const r = await api('api/lauf', 'POST', { project_id: $('#lP').value, art: $('#lA').value }); G.lauf = r.lauf; PSEL = null; zeichne(); return; }
      if (a === 'stop' || a === 'weg') { await api('api/lauf' + (a === 'stop' ? '?speichern=1' : ''), 'DELETE'); G.lauf = null; await laden(); if (a === 'stop') toast('Zeit eingetragen.'); return; }
    } catch (er) { toast(er.message, true); }
    return;
  }
  const ab = t.closest('[data-ab]');
  if (ab) { try { const r = await api('api/abwesenheit', 'PUT', { von: $('#abV').value, bis: $('#abB').value, art: ab.dataset.ab === 'weg' ? '' : $('#abA').value }); toast(ab.dataset.ab === 'weg' ? 'Abwesenheit entfernt.' : `${r.tage} Arbeitstag${r.tage === 1 ? '' : 'e'} eingetragen.`); laden(); } catch (er) { toast(er.message, true); } return; }
  const ap = t.closest('[data-ap]'); if (ap) { APID = +ap.dataset.ap; zeichne(); return; }
  const ps = t.closest('[data-ps]');
  if (ps) { const soll = {}; document.querySelectorAll('[data-psoll]').forEach((i) => { soll[i.dataset.psoll] = i.value; });
    try { await api('api/projekt/' + ps.dataset.ps, 'PUT', { honorar: $('#pHon').value, fahrt: $('#pFahrt').value, soll }); A = await api('api/auswertung'); zeichne(); toast('Gespeichert.'); } catch (er) { toast(er.message, true); } return; }
  const ex = t.closest('[data-ex]'); if (ex) { location.href = 'api/export.csv?m=' + encodeURIComponent($('#exM').value); return; }
  const bs = t.closest('[data-bs]'); if (bs) { try { await api('api/buero_satz', 'PUT', { satz: $('#bSatz').value }); toast('Gespeichert.'); } catch (er) { toast(er.message, true); } return; }
  const pt = t.closest('[data-ptag]');
  if (pt) { pt.classList.toggle('on'); const tr = pt.closest('[data-pu]'); const tage = [...tr.querySelectorAll('[data-ptag].on')].map((b) => b.dataset.ptag).join('');
    try { await api('api/person/' + tr.dataset.pu, 'PUT', { tage }); } catch (er) { toast(er.message, true); } }
});
document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.id === 'dIn' && t.value) { tag = t.value > G.heute ? G.heute : t.value; NEU = null; laden(); return; }
  const tf = t.closest('[data-tf]');
  if (tf) { const k = tf.dataset.tf; let v = tf.value; if (k === 'pause') v = v === '' ? null : +v; if (tf.classList.contains('hm')) { v = hmNorm(v); if (v === null) { toast('Bitte eine Uhrzeit eingeben, z. B. 7:45 oder 745.', true); return; } }
    try { D = await api('api/tag', 'PUT', { d: tag, [k]: v }); zeichne(); } catch (er) { toast(er.message, true); } return; }
  const zf = t.closest('[data-zf]');
  if (zf) { const z = zf.closest('.zr'); if (z.dataset.n) return; if (zf.dataset.zf === 'project_id' && z.dataset.v != null) { /* Projekt gewählt: Tätigkeit bleibt */ } zeileAktion(z, 'save'); return; }
  const pf = t.closest('[data-pf]');
  if (pf) { const tr = pf.closest('[data-pu]'); try { await api('api/person/' + tr.dataset.pu, 'PUT', { [pf.dataset.pf]: pf.type === 'checkbox' ? pf.checked : pf.value }); } catch (er) { toast(er.message, true); } }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.closest('.zr[data-n]')) { e.preventDefault(); zeileAktion(e.target.closest('.zr'), 'neu'); } });
addEventListener('resize', () => { const h = handy(); if (h !== document.body.classList.contains('handy')) zeichne(); });
setInterval(() => { if (tab === 'tag' && tag === G.heute && document.visibilityState === 'visible' && !document.activeElement.closest('.zr,.k,.lauf,.fahrt-k')) laden(); }, 5 * 60000);   // heute: Vorschläge wachsen mit

(async () => {
  ME = await api('api/me'); applyLook(ME);
  const PC = await api('api/platform');
  await header('Zeiten', ME, PC);
  if (window.BPHead && BPHead.ready) await BPHead.ready.catch(() => {});
  G = await api('api/grund');
  tag = /^#\d{4}-\d{2}-\d{2}$/.test(location.hash) ? location.hash.slice(1) : G.heute; monat = tag.slice(0, 7);
  if (!G.admin && ['auswertung', 'einst'].includes(tab)) tab = 'tag';
  laden();
})().catch((e) => toast(e.message, true));
</script>
